# 平台能力表（卡 E45 / T-AG496）
#
# 用途：`tools/pool_accounts.py` 读这张表决定「这个平台能不能探、怎么探、探哪个端点」。
# 铁律：
#   * 这里**只放端点、流程、坑与来源**，绝不放任何凭据、cookie、token；
#   * `source` 必须写清「哪份参考实现、哪个文件」，或「本机实测」；
#   * 未真机验证过的平台把 `verified = false`，探测结论只能是 `uncertain`/`not-supported`，
#     不许伪造 `claimed`（那是 E48 的事）。
#
# 凭据来自环境变量，名字写在各段 `token_env`（多个用 / 分隔，取第一个非空的）。
# 账本只存「位置指针」，不存明文 —— 见 复盘/卡/卡E45-账号账本与只读探测.md §4。
#
# 各段 `chat_urls`（卡 E94）：这个平台**可以直接转发 chat 补全请求**的端点清单，
# 只放端点，不放凭据（凭据仍走 `token_env` / `token_file`）。
#   * 空数组 `[]` = **没登记**这个平台的 chat 端点，**不是**「不支持」——
#     网关遇到空表一律 403 并点名「这个平台没登记 chat 端点」，绝不退化成
#     「拿 base_urls 随便试一个」；
#   * 表里这些平台大多是 IDE / 面板的凭据，没有公开的 chat 补全入口，所以现在**全是空的**；
#   * 填之前必须真机验证过（`verified = true` 且写明 `source`），
#     否则填了也仍算 `verified = false`，网关不认。

[meta]
schema = 1
updated_at = "2026-11-09"
note = "端点与坑来自 gates/diag/repos/ref/ 的五个参考仓存档；本机只有 codearts / codebuddy 有真号。"

# ---------------------------------------------------------------- codearts（华为云码道）

[platform.codearts]
label = "华为云 CodeArts（码道）"
supported = "both"
auth_kind = "sdk-hmac-sha256"
# probe 取值：http（2 参 GET，看 amount_path）/ manual（没有只读额度入口）/
# codearts-credits（卡 E97：SDK-HMAC-SHA256 签名读一次 statistics/plugin，只从
# usageTotalPackageCredit 那一条算已用百分比与余额；AK/SK 按 token_env 的名字后缀
# 分角色；绝不求和 basic/ondemand/bonus —— 真机上至少有一类与 total 同值）
probe = "codearts-credits"
verified = true
base_urls = ["https://snap-access.cn-north-4.myhuaweicloud.com"]
chat_urls = []  # 空 = 没登记，不是不支持（见文件头）
token_env = "CODEARTS_CLI_AK/CODEARTS_CLI_SK/TF_CODEARTS_AK/TF_CODEARTS_SK"
source = "github:anye-99/dsh-codearts-auth/src/codearts-credits.ts:20-60"
local_archive = "gates/diag/repos/ref/dsh-codearts-auth/src_codearts-credits.ts"
claim_flow = [
  "GET  {base}/snap-manager/v1/statistics/plugin  —— 先判 package.is_credit_package，Token 计费账户不在活动内",
  "GET  {base}/v1/ops/delivery?channel=IDE  —— 活动列表，取 claimable 的 campaignId",
  "POST {base}/v1/ops/claim {campaignId, channel:'IDE'}",
  "若响应 id !== null：POST {base}/v1/ops/confirm {campaignId}  —— 漏了积分停在「待确认」不入账",
]
quota_flow = "积分余额来自活动列表与 statistics/plugin；单位 credits"
pitfalls = [
  "portal BFF 走浏览器 Cookie：无会话时带不带 AK/SK 都返回 IAM 跳转 HTML（HTTP 200），故必须走 snap-access",
  "幂等靠活动列表的 claimable/status 预检（服务端业务码与客户端 idempotencyKey 都不适用）",
]

# ---------------------------------------------------------------- workbuddy（腾讯）

[platform.workbuddy]
label = "腾讯 WorkBuddy"
supported = "both"
auth_kind = "bearer"
probe = "http"
verified = false
base_urls = ["https://copilot.tencent.com"]
chat_urls = []  # 空 = 没登记，不是不支持（见文件头）
probe_url = "{base}/v2/billing/meter/get-user-resource"
unit = "点"
token_env = "TF_WORKBUDDY_TOKEN"
source = "github:a1141171521/dsh-multi-agent-gateway/lib/adapters/buddy.js:79-80,1031,1081"
local_archive = "gates/diag/repos/ref/dsh-multi-agent-gateway/lib_adapters_buddy.js"
claim_flow = [
  "POST {base}/v2/billing/meter/checkin-activity-status  —— 状态（实测是 POST，body {}）",
  "POST {base}/v2/billing/meter/daily-checkin            —— 领取",
]
quota_flow = "GET {base}/v2/billing/meter/get-user-resource"
pitfalls = [
  "状态接口 404 ⇒ 判 not-supported（上游没这能力，不是故障）",
  "/v2/billing/meter/checkin-status 是占位路径，别当能力",
  "每次调用都必须带 User-Agent: WorkBuddy/5.5.6 —— 网关认不出 UA 会回 code 10085（请求不合法），状态与领取都一样",
  "重复领取的幂等判据是响应体 code=10001（不是 HTTP 状态码，实测是 400 + 该码）",
  "业务码在顶层 code，载荷在 data；状态字段是 active / today_checked_in / today_credit（下划线）",
]


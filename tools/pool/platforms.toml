  "timezone_id 是必填 query：放请求头无效、缺了报 invalid timezone_id、非法时区名也报错",
  "业务码在 base_resp.status_code，且 invalid timezone_id 也是 HTTP 200 ⇒ 只看 HTTP 状态会误判成功",
  "points 是总数、bonus_points 是其中「额外」部分，不得相加（会虚高一倍）",
  "「今日已领」判据是 is_today && status === 3，不能用「没有 Claimable」反推",
]


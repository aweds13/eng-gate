# ---------------------------------------------------------------- meoo（阿里秒悟，本机实测 2026-11-08）

[platform.meoo]
label = "秒悟 Meoo（阿里，本机个人版免费层）"
supported = "quota"
auth_kind = "file"
probe = "http"
verified = true
base_urls = ["https://meoo.com"]
chat_urls = []  # 空 = 没登记，不是不支持（见文件头）
probe_url = "{base}/open/v1/cli-compat/account/points"
amount_path = "data.account.availableBalance"
token_env = ""
token_file = "~/.meoo/credentials.json"
token_key = "accessToken"
unit = "积分"
source = "local:npm:@aliyun-meoo/cli/dist/commands/account.js:83"
claim_flow = []
quota_flow = "GET {base}/open/v1/cli-compat/account/points（Authorization 头带 OAuth 令牌，读自 ~/.meoo/credentials.json 的 accessToken）⇒ data.account.availableBalance；另有 /account/entitlement 给 planCode 与 benefits"
pitfalls = [
  "额度真值是 data.account.availableBalance，不是 totalGranted - totalConsumed，更不是 totalGranted（后者把已用掉的也算成「还有」；本机实测 56958 / 61000 / 42）",
  "CLI 的 OAuth 令牌只能打 /open/ 开头的接口：别的路径被 CLI 自己的 apiClient 拒成 OPENAPI_ROUTE_REQUIRED「业务 Access Token 不能调用内部接口」",
  "accessTokenExpiresAt 是毫秒时间戳；过期就 401，本仓**不实现 refresh**（刷一次会把 CLI 自己那份 refresh token 轮换掉，见卡 A335），过期只能人重跑 meoo login",
  "上游**没有签到接口**（全量 grep 无 check-in 子命令）；daily_login 那 2000 积分是登录即赠，不是可领动作",
]


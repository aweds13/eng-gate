# ---------------------------------------------------------------- minimax

[platform.minimax]
label = "MiniMax Code"
supported = "both"
auth_kind = "bearer"
probe = "http"
verified = false
base_urls = ["https://api.minimax.chat"]
chat_urls = []  # 空 = 没登记，不是不支持（见文件头）
probe_url = "{base}/minimax-cloud/api/v1/credit/details"
unit = "积分"
token_env = "TF_MINIMAX_TOKEN"
source = "github:anye-99/dsh-codearts-auth/src/minimax-credits.ts:1-40"
local_archive = "gates/diag/repos/ref/dsh-codearts-auth/src_minimax-credits.ts"
claim_flow = [
  "GET  {host}/minimax-cloud/api/v1/signin/status?timezone_id=<IANA>",
  "POST {host}/minimax-cloud/api/v1/signin/claim?timezone_id=<IANA>   —— body {}",
]
quota_flow = "GET {host}/minimax-cloud/api/v1/credit/details"

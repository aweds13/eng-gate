# 模型注册表 —— 一层统一，按池分流（卡 166 · T-G266）
#
# ★★ 唯一可写的"跨池统一层"（只有用户能改）。每个池各有自己的真源：
#   · CodeBuddy 池的真源 = 本文件里的 [[model]] 条目（pool = "codebuddy"）
#   · 码道池的真源 = infra/pool/models.whitelist.toml（本文件 [pool.codearts] 引用它、不复制）
#
# ★★ 第 4 条纪律（卡 A353 · T-AG566）：**禁用表与注册表同目录**，文件名
#   `model-disabled.toml`（默认就落在本文件旁边），路径由环境变量 `TF_POOL_DISABLED` 覆盖。
#   · 禁用 = **另一个维度的拒绝**，与"批准"不是一回事：「在注册表里」不等于"没被禁"；
#     所以禁用条目**不许**写进本文件的 `[[model]]`（混在一张表里会让"批准但禁用"不可表达）。
#   · 「读不到 ≠ 没禁用」：文件不存在 ⇒ 没禁用；文件存在但坏了/读不懂 ⇒ **不知道 ⇒ 全禁**
#     （判据在 `tools/pool/model_registry.py::load_disabled`）。
#   · **不许**把禁用表挂到 `gates/diag/`：那是**运行状态**（跑出来的、可清），
#     禁用表是**配置**（由人改、随仓走）—— 性质不同，混在一起会让"清空 diag"顺手清掉配置。
#
# ★ 不许再有第二份可写名单（"多份真源"是本仓老坑）：
#   wb_dispatch.py 的 MODEL_WHITELIST 常量已删，改成 PEP 562 现读本文件。
#
# 每条 [[model]] 声明：
#   alias   逻辑名（工人/主控用的名字，--model 给它）
#   pool    池名（codebuddy / codearts）
#   id      该池内的真实 id（codebuddy 用裸名；codearts 用 provider/model 形式）
#   default 是否该池默认（布尔；每池至多一条 default = true）
#   note    备注
#
# ★ 卡 E143（F86 ①）：还可以写两个**可选**窗口字段 —— 不写就是「不知道」：
#   context_window  上下文窗口（token）；**留空 = 不知道**，/v1/models 里发 null
#   max_output      回复上限（token）；**留空 = 不知道**，网关按 model_registry.UNKNOWN_MAX_OUTPUT 发
#   两者的解析判据在 tools/pool/model_registry.py::_window_field：
#   缺席 ⇒ None（不知道）/ 0 ⇒ 合法读数（一点都装不下）/ 负数 / true / "64k" / 1.5 ⇒ 注册表坏、点名第几条。
#   ★ **不许**为了某个模型在本文件里抄一份那个上限值冒充「已知」（那是把「不知道」伪装成「知道」）：
#     未知上限只有一处字面量，住 tools/pool/model_registry.py 的 UNKNOWN_MAX_OUTPUT。
#
# 顺序 = 429 轮换序（只对 CodeBuddy 池有意义；码道池不参与轮换）。

# ---------------------------------------------------------------- CodeBuddy 池（今天在用的）
# id 是裸名；顺序 = 429 轮换序（① 默认 → ② ① 被限流时的替补）
# ★ 卡 166 判据 ⑥：本段与卡 166 之前的 MODEL_WHITELIST 逐字相同（行为不变）。
# ★ 卡 E143：这两个模型真实的窗口 / 回复上限**今天没有可信来源**（仓里零命中，
#   仓外 CLI --help 也没有这两项）⇒ context_window / max_output 两条**都留空 = 不知道**。
#   要填必须给可核出处（厂商文档链接 + 日期）并写进该条的 note —— 别凭印象填。
[[model]]
alias   = "deepseek-v4.1-flash"
pool    = "codebuddy"
id      = "deepseek-v4.1-flash"
default = true
note    = "默认；429 轮换链第 1 项"

[[model]]
alias   = "glm-5.3-flash"
pool    = "codebuddy"
id      = "glm-5.3-flash"
default = false
note    = "429 轮换链第 2 项（① 被限流时的替补）"

# ---------------------------------------------------------------- 码道池（华为码道 CLI）
# 引用 infra/pool/models.whitelist.toml（边界：不动它的既有条目语义）。
# 那份文件的 [[approved]] 条目（provider/model 形式）= 码道池的真实 id；alias = id。
# default = 那份文件里某个 model（此处声明哪条是该池默认）。
# ★ 卡 166：本池的适配器只留接口 + 响亮拒绝（真实调用另立卡）。
[pool.codearts]
source  = "models.whitelist.toml"
default = "huaweicloud-maas/GLM-5.2"

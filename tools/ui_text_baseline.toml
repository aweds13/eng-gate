# 注释里原文引用界面文案的地方不算；这条修过一次，见该工具的文件头）。
# 口径：`docs/specification/conventions.md` 的「界面文案」；
# 界面上删掉的"怎么用/为什么"搬到了 `docs/user-guide.md`。


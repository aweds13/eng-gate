# 界面文案的「已知欠账」登记表（T-G57）
#
# 规矩与 `tools/contrast_baseline.toml` / `tools/style_baseline.toml` 相同，跟台账 `[exceptions]`
# 一个精神：**逐条留痕、修一条删一条，不许静默豁免**。
#
#   - `[known]`：汉字 **≥30** 的片段，一条都不许（太长基本就是"把复盘写进产品"）。
#     这一档**目标为空**；现在这 19 条是 T-G49 第一轮剩下的，正由 **T-G57** 逐条清掉。
#     ★ 清掉或改写一句却**忘了删这一行** → 门会 FAIL（"登记项对不上现状"）—— 忘不掉。
#   - `[ratchet].count`：汉字 **≥20** 的片段总条数**上限**，**只许往下调**（修完一条就调小）。
#
# 键的格式：`"<汉字数> :: <原文>"`（原文要与 `python -X utf8 tools/ui_text_scan.py --min 30` 报的
# 一模一样；改一个标点就算"对不上现状"→ FAIL，防"改写成另一个句子绕过登记"）。
# 尺子会**先剥注释**再数（注释里原文引用界面文案的地方不算）。
# 口径：`docs/specification/conventions.md` 的「界面文案」。


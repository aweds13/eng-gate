# 风格一致性体检的「已知欠账」登记表（T-G29）
#
# 规则与对比度门（`tools/contrast_baseline.toml`）相同，跟台账 `[exceptions]` 一个精神：
# **逐条留痕、修一条删一条，不许静默豁免**。登记了不算通过，只是"不许再变坏"：
#   - **没登记过**的问题 → 门禁 FAIL（新破例必须写明理由才能进这张表）
#   - 登记过的**变差了** → FAIL
#   - 登记过的**已经好了** → 提示"删掉这一行"
#
# 这张表量的是"**体系里有没有破例**"（一致性），**不是"好不好看"** —— 后者要眼睛，工具判不了。
# 但它是"融洽"的必要条件：一个界面里同一件事有 7 种圆角、4 份同形状徽标、
# 没有任何 hover/focus 回应，那它一定不融洽。
#
# ★ 表里的条目就是视觉重构那几步的工单（对照 `复盘/视觉重构素材清单-T-G24.md` §8）。

[known]

# ---------- 互动态：整张样式表里一条都没有（最要紧的两条）----------
"interaction:hover" = { why = "全表 `:hover` 规则数 = 0。界面没有「手放上去」的回应 —— 这是「每个元素各过各的」最大的来源，也正是用户点的『Raycast 的交互反馈』要补的那一层。修法：给可交互类统一加 hover 底（`--accent-weak` / `--surface-2`），workbench 的原话是 hover on rows/nav → `--panel-2` fill" }
"interaction:focus-visible" = { why = "全表 `:focus-visible` 规则数 = 0。键盘用户**看不见焦点**（WCAG 2.4.7 要求可见焦点）—— 而用户正好提了「键盘优先做成附加功能」，所以这条是那个附加功能的**前置条件**，不是可选项。修法：一条全局 `:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }`（workbench：focus-visible on everything）" }

# ---------- 一次性值：只出现一次＝没进体系 ----------
"literal:border-radius:50%" = { why = "`.swatch` 的圆形色块。这是**形状语义**（画一个圆），不是圆角档位 —— 可以保留，但更好的做法是给它一个语义令牌（如 `--r-circle`），免得「圆角 7 档」里混进一个不是圆角的东西" }
"literal:gap:2px" = { why = "`.rail nav` 的 2px 落在最小档 `--sp-1: 4px` **之下** —— 要么并进 4px，要么承认需要一档更细的节奏（4px 网格允许 2px 作为半档，但那要写成令牌）" }
"literal:line-height:1.5" = { why = "全文**唯一**一处行高（`.rail-summary`）。正是 T-G24 §5-3 说的『行距靠默认』：字号有 9 档、行高只有 1 档。修法：步 2 建 `--lh-*`（标题紧凑 / 正文舒适）" }
"literal:margin-bottom:2px" = { why = "`.card.panel-card .title` 的 2px，同上：网格外的一次性值" }
"literal:padding:3px 0" = { why = "`.fact` 的 `3px 0`，同上：网格外的一次性值" }

# ---------- 同形状重复：一个原子抄了 N 份 ----------
"shape:.badge:color" = { why = "`.badge.done` / `.doing` / `.hard` / `.todo` **四个变体是同一个形状**（`background` + `color`），只有令牌不同 —— 一个原子抄了 4 份，正是 workbench 说的『令牌层开始烂的方式』。而且这四个里最糟的三个就是对比度那 3 条（完成徽标 1.96:1）。修法：抽成一个原语 + 一张状态映射表（状态色由**底**承担、字用正文色）—— **一次同时解决一致性与对比度两件事**" }

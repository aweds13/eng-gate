# 风格一致性体检的「已知欠账」登记表（T-G29）
#
# 规则与对比度门（`tools/contrast_baseline.toml`）相同，跟台账 `[exceptions]` 一个精神：
# **逐条留痕、修一条删一条，不许静默豁免**。登记了不算通过，只是"不许再变坏"：
#   - **没登记过**的问题 → 门禁 FAIL（新破例必须写明理由才能进这张表）
#   - 登记过的**变差了** → FAIL
#   - 登记过的**已经好了** → 提示"删掉这一行"
#
# 这张表量的是"**体系里有没有破例**"（一致性），**不是"好不好看"** —— 后者要眼睛，工具判不了。
# 但它是"融洽"的必要条件：一个界面里同一件事有 7 种圆角、4 份同形状徽标、
# 没有任何 hover/focus 回应，那它一定不融洽。
#
# ★ 表里的条目就是视觉重构那几步的工单（对照 `复盘/视觉重构素材清单-T-G24.md` §8）。


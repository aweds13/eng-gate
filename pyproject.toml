[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeflow"
version = "0.1.0"
description = "本地优先的个人时间与学习投入管理工具（My Day / 债务记账 / 专注 / 复习）"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.optional-dependencies]
# 桌面窗口壳（AC-11 / SR-NF1）：只想在浏览器 / 手机上用的人**不必**装它 ——
# 无窗口入口 `timeflow-web` 不需要它；要桌面窗口再 `pip install -e ".[pc]"`。
pc = [
    "pywebview",
]
dev = [
    "pytest",
    "pytest-cov",
    # 并行跑测试（T-G7）：每个用例都起真 app + 真库，串行是门禁唯一的瓶颈。
    # 没装也能跑（`scripts/run_gates.py` 会退回串行并**如实说明**，不谎报）。
    "pytest-xdist",
    "mypy",
    "ruff",
    # 属性测试（卡 E51 / E37）：`tests/test_properties.py` 的 @given；没装 = 那个文件收不了。
    "hypothesis",
]

# 变异体检（卡 E51 / E37）：**周期性体检**，不进必跑门（太慢）。
# 没装 ⇒ `tools/mutate_report.py` fail closed（明确报「引擎不在」），绝不静默跳过。
mutation = [
    "cosmic-ray>=8",
]

[project.scripts]
timeflow = "timeflow.app.main:main"
# 无窗口入口：只起本地服务、不开桌面窗口（不需要 pywebview）。
timeflow-web = "timeflow.app.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 覆盖率门槛写进配置（2026-09-18 审计 GAP-NF-08：以前只写在文档与手敲命令里，换个人跑就绕过去了）
addopts = "-q -m \"not acceptance\" --cov=timeflow --cov-fail-under=70"
markers = ["acceptance: 可执行验收层（默认排除；显式 -m acceptance 运行）"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_errors = true

# 桌面窗口壳是**可选**依赖（`optional-dependencies[pc]`），且 `src/timeflow/app/main.py`
# 已经用 `try: import webview` 兜住「没装就退回浏览器」。门禁跑在没装它的机器上
# （云门禁机、只想用浏览器的人）不该因此判红 —— 卡 E49：这是「可选依赖被判成硬依赖」。
[[tool.mypy.overrides]]
module = ["webview"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","SIM","TCH"]

[tool.coverage.run]
source = ["timeflow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeflow"
version = "0.1.0"
description = "本地优先的个人时间与学习投入管理工具（My Day / 债务记账 / 专注 / 复习）"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pywebview",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
timeflow = "timeflow.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","SIM","TCH"]

[tool.coverage.run]
source = ["timeflow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeflow"
version = "0.1.0"
description = "本地优先的个人时间与学习投入管理工具（My Day / 债务记账 / 专注 / 复习）"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pywebview",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # 并行跑测试（T-G7）：每个用例都起真 app + 真库，串行是门禁唯一的瓶颈。
    # 没装也能跑（`scripts/run_gates.py` 会退回串行并**如实说明**，不谎报）。
    "pytest-xdist",
    "mypy",
    "ruff",
]

[project.scripts]
timeflow = "timeflow.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 覆盖率门槛写进配置（2026-09-18 审计 GAP-NF-08：以前只写在文档与手敲命令里，换个人跑就绕过去了）
addopts = "-q -m \"not acceptance\" --cov=timeflow --cov-fail-under=70"
markers = ["acceptance: 可执行验收层（默认排除；显式 -m acceptance 运行）"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","SIM","TCH"]

[tool.coverage.run]
source = ["timeflow"]

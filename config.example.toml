# timeflow 配置模板 → 复制为 config.toml（本地使用，勿入库）

[database]
# SQLite 数据文件路径（相对项目根或绝对路径均可）
path = "data/timeflow.db"

[app]
# 主题强调色（可自定义，像键盘灯光）
accent_color = "#3b82f6"
# 亮/暗主题：light / dark
theme = "light"

[focus]
# 专注白名单默认：阻止非白名单（默认 true）
block_by_default = true
# 勿扰时段（24h，空则全天）
do_not_disturb = ["22:00-07:00"]

[ledger]
# B 系统：周结算；债务轻度/中度/重度阈值（天）
debt_mild = 3
debt_medium = 7

[academic]
# GPA 制式：按你的学校切换（4.0 制 / 5.0 制）。默认 4.0。
gpa_scale = "4.0"

[tasks]
# 「完成 N 天后进档案」（N11）：完成的任务满 N 天自动收进档案（默认视图不再显示，档案里仍能翻到）。
# 0 = 完成当天就收走。这里是**默认值**：在设置页「任务」里改过的以本机数据库里的为准。
archive_after_days = 3

[review]
# 复习形式词表（SR-NF7 / T-G1）：形式只是标签，你可以自己加（id 用小写英文，标签随你写）。
# 这里是**默认值**：在设置页「可配置词表」里改过的以本机数据库里的为准。至少要留一项。
forms = { cloze = "挖空", qa = "问答卡", exam = "真题" }

[insights]
# 时间热力图的维度（SR-NF7 / T-G2）：改的是「用哪些维度看、排第几、叫什么」。
# 可用的 id 见 docs/EXTENDING.md —— **要算一个全新的维度仍需改核心代码**（词表变不出新算法）。
heatmap_dimensions = { focus_minutes = "专注", manual_minutes = "手动投入", review_count = "复习", output_count = "产出", debt_count = "债务（欠多少）" }

[export]
# 沉淀型 markdown（任务完成记录 / 备忘 / 产出）写到哪（SR-F8 / T-G4）。
# 每天一个文件（如 2026-09-21.md）；相对路径相对**项目根**，也可写绝对路径。
# ⚠ 红线 SR-F8.2：**别指到 Obsidian 的笔记目录** —— 这里只写"独立共享目录"。
#   导出目录一旦落在下面的 Vault 根目录里，保存与导出都会被拒绝（红线在程序里拦着）。
# 这里是默认值：在设置页「导出（Markdown）」里改过的以本机数据库为准。
dir = "export"

# Obsidian 跳转（SR-F8.2 / T-G5）：填了就能用 obsidian:// 一键打开引用句柄（复习卡 / 备忘）。
# vault = Obsidian 里的**库名**（不是文件夹名，是启动时显示的那个名字）；留空 = 关掉跳转。
# vault_dir = 库的根目录，可留空；填了才能把"绝对路径"句柄换算成库内位置，
#             也只有填了才校验得了"这个句柄在不在库里"。**本软件只读跳转，不往里写任何东西。**
vault = ""
vault_dir = ""

[ai]
# AI 接口（SR-F7.3 / T-G6）：**默认关**。打开后本机程序可以调 `/api/ai/*`——
#   只读任务、建任务与步骤（= 回报进展）、**勾它自己建的**；你建的一律 400 拒绝，改/删没有接口。
# 口径（2026-09-21 定案乙案）：判据是「动的是不是你亲手写的东西」；AI 的动作在事实里记 source=ai。
# 这里是默认值：在设置页「AI 接口」里打开/关闭过的以本机数据库为准。
enabled = false

[net]
# 局域网访问（SR-NF17 / G 批 · T-G10b = 跨端场景 ②）：**默认 false**（口径同 N16「默认收严、用户再放宽」）。
# 开 = 服务绑到 0.0.0.0，于是**同一个 WiFi 下的手机**能打开它；同时装上配对码那道门
#（非本机设备要带 X-Timeflow-Pair 才能读数据；配对码只在这台电脑的设置页显示）。
# ⚠️ 代价：同一 WiFi 下的其他设备也可能扫到这个地址 —— 配对码防的是「随手连一下」，
#    **不是加密、也不挡同 WiFi 抓包**；只在同一个 WiFi 里管用，不涉及公网。
# 临时开一次也可以：python tools/serve.py --lan（不改本文件）。
# 注意：这是**启动期**开关 —— 改完要重启服务才生效（绑哪个地址是进程起来时定的）。
allow_lan = false
# 配对码：留空 = 由程序生成一个 6 位数字并记在本机库里（重启不变，可在设置页换一个）。
pairing_code = ""

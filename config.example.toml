# timeflow 配置模板 → 复制为 config.toml（本地使用，勿入库）

[database]
# SQLite 数据文件路径（相对项目根或绝对路径均可）
path = "data/timeflow.db"

[app]
# 主题强调色（可自定义，像键盘灯光）
accent_color = "#3b82f6"
# 亮/暗主题：light / dark
theme = "light"

[focus]
# 专注白名单默认：阻止非白名单（默认 true）
block_by_default = true
# 勿扰时段（24h，空则全天）
do_not_disturb = ["22:00-07:00"]

[ledger]
# B 系统：周结算；债务轻度/中度/重度阈值（天）
debt_mild = 3
debt_medium = 7

[academic]
# GPA 制式：按你的学校切换（4.0 制 / 5.0 制）。默认 4.0。
gpa_scale = "4.0"

[tasks]
# 「完成 N 天后进档案」（N11）：完成的任务满 N 天自动收进档案（默认视图不再显示，档案里仍能翻到）。
# 0 = 完成当天就收走。这里是**默认值**：在设置页「任务」里改过的以本机数据库里的为准。
archive_after_days = 3

[review]
# 复习形式词表（SR-NF7 / T-G1）：形式只是标签，你可以自己加（id 用小写英文，标签随你写）。
# 这里是**默认值**：在设置页「可配置词表」里改过的以本机数据库里的为准。至少要留一项。
forms = { cloze = "挖空", qa = "问答卡", exam = "真题" }

[insights]
# 时间热力图的维度（SR-NF7 / T-G2）：改的是「用哪些维度看、排第几、叫什么」。
# 可用的 id 见 docs/EXTENDING.md —— **要算一个全新的维度仍需改核心代码**（词表变不出新算法）。
heatmap_dimensions = { focus_minutes = "专注", manual_minutes = "手动投入", review_count = "复习", output_count = "产出", debt_count = "债务（欠多少）" }

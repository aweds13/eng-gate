<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/app.css">
<title>timeflow</title>
</head>
<body>
<header>
  <h1>timeflow <span class="accent">·</span> <span id="summary" class="hint"></span></h1>
  <nav>
    <button data-view="today" class="active">今日</button>
    <button data-view="tasks">全部任务</button>
    <button data-view="focus">专注</button>
    <button data-view="stats">统计</button>
    <button data-view="habit">习惯</button>
    <button data-view="academic">学业</button>
    <button data-view="review">复习</button>
    <button data-view="memo">备忘录</button>
    <button id="refresh" class="ghost">刷新</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<nav class="bottom-nav">
  <button data-view="today" class="active"><span class="ic">📅</span>今日</button>
  <button data-view="tasks"><span class="ic">🗂️</span>任务</button>
  <button data-view="focus"><span class="ic">⏱️</span>专注</button>
  <button data-view="habit"><span class="ic">🔥</span>习惯</button>
  <button data-view="stats"><span class="ic">📈</span>统计</button>
  <button data-view="setting"><span class="ic">⚙️</span>设置</button>
</nav>
<script>
/* 应用外壳：视图路由 + 顶部摘要 + 通用反馈（R2 会把调度收敛到这里） */
let current='today';
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let detail='';try{detail=(await r.json()).detail||''}catch(e){}
    toast(detail?`操作未完成：${detail}`:'操作未完成，请稍后再试');throw new Error(`${r.status} ${path}`)}
  return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function el(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=esc(msg);t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function toastAction(msg,label,fn){
  const t=document.getElementById('toast');
  t.innerHTML=`${esc(msg)} <button class="ghost" style="margin-left:8px;padding:4px 10px" id="toastAct">${esc(label)}</button>`;
  const btn=document.getElementById('toastAct');if(btn)btn.onclick=fn;
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),6000);
}
function view(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));render(name)}
document.querySelectorAll('nav button[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.querySelectorAll('.bottom-nav button[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.getElementById('refresh').onclick=()=>view(current);

async function render(name){
  current=name;
  clearInterval(focusTimer);focusTimer=null;
  const m=document.getElementById('main');
  const cfg=await api('/api/config');
  document.documentElement.style.setProperty('--accent',cfg.accent_color);
  if(name==='today')return renderToday(m);
  if(name==='tasks')return renderTasks(m);
  if(name==='focus')return renderFocus(m);
  if(name==='stats')return renderStats(m);
  if(name==='habit')return renderHabit(m);
  if(name==='academic')return renderAcademic(m);
  if(name==='review')return renderReview(m);
  if(name==='memo')return renderMemo(m);
  if(name==='setting')return renderSetting(m);
}

function taskCard(t,isOverdue){
  const isDone=t.status==='完成';
  const asg=(t.assignments||[]);
  const asgMeta=asg.map(a=>`<span class="badge">${esc(a.assignee)} · ${TEAM_STATUS[a.status]||a.status}</span>`).join('');
  const asgButtons=asg.map(a=>TEAM_NEXT[a.status]?`<button class="ghost" onclick="teamStatus('${a.id}','${TEAM_NEXT[a.status][0]}')">${TEAM_NEXT[a.status][1]}</button>`:'').join('');
  return `<div class="card ${isDone?'done':''} ${isOverdue?'overdue':''}">
    <button class="check ${isDone?'on':''}" title="${isDone?'撤销完成':'标记完成'}" onclick="toggleDone('${t.id}',${isDone})"></button>
    <div style="flex:1"><div class="title">${esc(t.title)}</div>
    <div class="meta">${t.due_date||''} ${t.group_name?`<span class="badge">${esc(t.group_name)}</span>`:''} ${(t.groups||[]).map(g=>`<span class="badge">${esc(g)}</span>`).join('')}${asgMeta}${isDone?'<span class="badge">已完成</span>':''}</div></div>
    <div class="row">
      ${isDone?'':`<button class="ghost" onclick="startFocusFor('${t.id}')">专注</button>`}
      ${isOverdue?`<button class="ghost" onclick="pushToTomorrow('${t.id}')">推到明天</button>
        <button class="ghost" onclick="cancelTask('${t.id}')">取消</button>`:''}
      ${asgButtons}
      ${isDone?`<button class="ghost" onclick="undoDone('${t.id}')">撤销完成</button>`
              :`<button class="ghost" onclick="toggleMyDay('${t.id}',true)">${t.is_myday?'移出 My Day':'加入 My Day'}</button>`}
      <button class="ghost" onclick="assignTask('${t.id}')">分配</button>
      <button class="ghost" onclick="showFacts('${t.id}')">记录</button>
      <button class="ghost" onclick="removeTask('${t.id}')">删除</button>
    </div></div>`;
}
// 团队分配的四种状态与「下一步」动作（SR-F7.2：进展回报）
const TEAM_STATUS={assigned:'已分配',in_progress:'进行中',done:'已完成',blocked:'受阻'};
const TEAM_NEXT={assigned:['in_progress','开始'],in_progress:['done','完成'],blocked:['in_progress','恢复']};
async function assignTask(id){
  const assignee=prompt('分配给谁？（名字或昵称）');
  if(assignee===null)return;
  if(!assignee.trim()){toast('执行者不能为空');return}
  await api('/api/team/assign',{method:'POST',body:JSON.stringify({task_id:id,assignee:assignee.trim()})});
  toast(`已分配给 ${assignee.trim()}（团队任务不计个人投入）`);view(current);
}
async function teamStatus(assignmentId,status){
  await api(`/api/team/assign/${assignmentId}`,{method:'PATCH',body:JSON.stringify({status})});
  toast(`进展已记为「${TEAM_STATUS[status]||status}」`);view(current);
}
async function toggleDone(id,isDone){
  await api(`/api/tasks/${id}/${isDone?'uncomplete':'complete'}`,{method:'POST'});
  toast(isDone?'已撤销完成，投入账同步回退':'已完成 · 记入事实与账本');
  view(current);
}
async function undoDone(id){await toggleDone(id,true)}
async function toggleMyDay(id,toMyDay){
  await api(`/api/tasks/${id}/myday`,{method:'POST'});
  toast(toMyDay?'已加入 My Day':'已移出 My Day');view(current);
}
async function removeTask(id){
  const t=await api(`/api/tasks/${id}`);
  if(!confirm(`删除「${t.title}」？可在提示条里撤销。`))return;
  await api(`/api/tasks/${id}`,{method:'DELETE'});
  toastAction('已删除，可撤销',"撤销",async()=>{await api(`/api/tasks/${id}/restore`,{method:'POST'});toast('已恢复');view(current)});
  view(current);
}
async function restoreTask(id){
  await api(`/api/tasks/${id}/restore`,{method:'POST'});toast('已恢复');view(current);
}
async function showFacts(id){
  const facts=await api(`/api/tasks/${id}/facts`);
  if(!facts.length){toast('还没有完成记录');return}
  toast(facts.map(f=>`${f.kind==='task.completed'?'完成':f.kind==='task.uncompleted'?'撤销':f.kind==='task.deleted'?'删除':f.kind==='task.restored'?'恢复':f.kind==='task.repeat.generated'?'生成下一次':'记录'} ${String(f.occurred_at).slice(5,16)}`).join(' · '));
}
// LF-2 逾期处理：推到明天 / 取消（其余处置由编辑入口承担）
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
async function pushToTomorrow(id){
  await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({due_date:tomorrow()})});
  toast('已推到明天，债务随之重算');view(current);
}
async function cancelTask(id){
  if(!confirm('取消这个任务？取消后不再计入债务。'))return;
  await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({status:'取消'})});
  toast('已取消');view(current);
}
async function addTask(){
  const titleEl=document.getElementById('newTitle');
  const title=(titleEl.value||'').trim();if(!title)return;
  const due=document.getElementById('newDue').value||null;
  const myday=document.getElementById('newMyDay').checked;
  await api('/api/tasks',{method:'POST',body:JSON.stringify({title,due_date:due,is_myday:myday})});
  titleEl.value='';document.getElementById('newDue').value='';titleEl.focus();
  toast(myday?'已加入今天':'已记入任务（未进 My Day）');view(current);
}

// ---- 全部任务（OP-2：未进 My Day 的任务也要看得见）----
async function renderTasks(m){
  const all=await api('/api/tasks');
  const notMyDay=all.filter(t=>!t.is_myday&&t.status!=='完成');
  const done=all.filter(t=>t.status==='完成');
  m.innerHTML=`<div class="new">
      <input id="allTitle" placeholder="新任务（默认不进今天）" onkeydown="if(event.key==='Enter')addTaskHere()">
      <input id="allDue" type="date" title="截止日（可选）">
      <button onclick="addTaskHere()">添加</button></div>
    <div class="section-title">全部任务（${all.length}）</div>
    ${all.map(t=>taskCard(t)).join('')||'<div class="empty">还没有任务</div>'}
    <div class="sub">未进今天的任务 ${notMyDay.length} 项 · 已完成 ${done.length} 项；删除的任务在「今日 · 回收站」里可恢复。</div>`;
}
async function addTaskHere(){
  const titleEl=document.getElementById('allTitle');
  const title=(titleEl.value||'').trim();if(!title)return;
  const due=document.getElementById('allDue').value||null;
  await api('/api/tasks',{method:'POST',body:JSON.stringify({title,due_date:due,is_myday:false})});
  titleEl.value='';document.getElementById('allDue').value='';titleEl.focus();
  toast('已加入全部任务（未进今天）');view(current);
}

// ---- 更细可视化（SR-F2.7 / SR-F4.2）：后端出数据，这里只出图形 ----
function lineChart(points,valueOf,height){
  const pts=points.map(valueOf);
  if(!pts.length)return '<div class="empty">暂无数据</div>';
  const w=600,h=height||120,max=Math.max(1,...pts);
  const step=pts.length>1?w/(pts.length-1):0;
  const xy=pts.map((v,i)=>[i*step,h-(v/max)*(h-14)-4]);
  const line=xy.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`0,${h} ${line} ${w},${h}`;
  const marks=xy.map((p,i)=>pts[i]>0?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--accent)"/>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    <polygon points="${area}" fill="var(--accent)" opacity="0.10"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${marks}</svg>`;
}
function barList(rows){
  const max=Math.max(1,...rows.map(r=>r.value));
  return rows.map(r=>`<div style="margin-bottom:8px">
    <div class="sub" style="display:flex;justify-content:space-between">
      <span>${esc(r.label)}</span><span>${r.display}</span></div>
    <div class="bar-track" style="height:10px">
      <div class="bar-fill" style="width:${(r.value/max*100).toFixed(1)}%"></div></div>
  </div>`).join('');
}
// 习惯日历热力图：53 周 × 7 天（周一在上），只画到本周，未来格子留白
function heatmap(logs){
  const done=new Set(logs||[]);
  const today=new Date();today.setHours(0,0,0,0);
  const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
  const cols=53,cell=11,gap=2;
  let cells='';
  for(let c=0;c<cols;c++){
    for(let r=0;r<7;r++){
      const d=new Date(monday);d.setDate(monday.getDate()-(cols-1-c)*7+r);
      if(d>today)continue;
      const iso=d.toISOString().slice(0,10);
      const on=done.has(iso);
      cells+=`<rect x="${c*(cell+gap)}" y="${r*(cell+gap)}" width="${cell}" height="${cell}" rx="2.5"
        fill="${on?'var(--accent)':'var(--surface-2)'}" opacity="${on?1:0.9}"><title>${iso}${on?' 已打卡':''}</title></rect>`;
    }
  }
  const w=cols*(cell+gap),h=7*(cell+gap);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${cells}</svg>
    <div class="sub" style="margin-top:6px">近一年打卡（列=周，行=周一→周日）</div>`;
}
// ---- SR-NF3 其余形态：进度环 / 复习进度条 / GPA 多维 ----
// 今日完成度进度环：已完成 ÷（已完成 + 仍在待办）
function ring(done,pending){
  const total=done+pending;
  const ratio=total?done/total:0;
  const r=30,c=2*Math.PI*r,on=c*ratio;
  const label=total?`${done}/${total}`:'—';
  return `<svg viewBox="0 0 80 80" style="width:80px;height:80px;flex:none">
    <circle class="ring-track" cx="40" cy="40" r="${r}" fill="none" stroke-width="9"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${(c-on).toFixed(1)}"
      transform="rotate(-90 40 40)"/>
    <text class="ring-text" x="40" y="44" text-anchor="middle" font-size="15" font-weight="700">${label}</text>
  </svg>`;
}
function todayCard(done,pending){
  const note=pending?`还有 ${pending} 项在手`:'今天的清单是空的';
  return `<div class="card"><div style="display:flex;align-items:center;gap:14px">
    ${ring(done,pending)}
    <div><div class="title">今日完成度</div><div class="meta">已完成 ${done} 项 · ${note}</div>
    <div class="sub">只统计今天的清单与今天完成的，不翻旧账。</div></div></div></div>`;
}
// 复习进度条：今天该复习的里面，已完成多少张
function progressBar(done,total,label){
  const ratio=total?done/total:0;
  return `<div style="margin-top:8px">
    <div class="sub" style="display:flex;justify-content:space-between"><span>${esc(label)}</span><span>${done}/${total}</span></div>
    <div class="bar-track" style="height:8px;margin-top:4px">
      <div class="bar-fill" style="width:${(ratio*100).toFixed(1)}%"></div></div></div>`;
}
// 学业多维（雷达）：把不同量纲各自归一到本图最大值，只用于看"是否均衡"，不跨人比较
function radar(axes){
  const n=axes.length;if(!n)return '';
  const cx=110,cy=100,R=72;
  const pt=(i,ratio)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*ratio,cy+Math.sin(a)*R*ratio]};
  const rings=[0.33,0.66,1].map(k=>{
    const p=Array.from({length:n},(_,i)=>pt(i,k).map(v=>v.toFixed(1)).join(',')).join(' ');
    return `<polygon class="axis-line" points="${p}" fill="none" stroke-width="1"/>`;
  }).join('');
  const spokes=Array.from({length:n},(_,i)=>{
    const [x,y]=pt(i,1);return `<line class="axis-line" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="1"/>`;
  }).join('');
  const poly=axes.map((a,i)=>pt(i,Math.min(1,a.ratio)).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=axes.map((a,i)=>{const [x,y]=pt(i,Math.min(1,a.ratio));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`}).join('');
  const labels=axes.map((a,i)=>{const [x,y]=pt(i,1.22);return `<text class="axis-label" x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="10">${esc(a.label)}</text>`}).join('');
  return `<svg viewBox="0 0 220 200" style="width:100%;max-width:260px;height:auto">
    ${rings}${spokes}<polygon points="${poly}" fill="var(--accent)" opacity="0.18" stroke="var(--accent)" stroke-width="2"/>${dots}${labels}</svg>`;
}
function gpaRadar(g4,g5,courses,grades){
  const credits=(g4.credits||0);
  const scores=grades.map(x=>Number(x.score)||0).filter(x=>x>0);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const gradedCourses=new Set(grades.map(x=>x.course_id).filter(Boolean)).size;
  const axes=[
    {label:'GPA(4.0制)',value:g4.gpa,ratio:(g4.gpa||0)/4},
    {label:'GPA(5.0制)',value:g5.gpa,ratio:(g5.gpa||0)/5},
    {label:'平均分',value:Math.round(avg*10)/10,ratio:avg/100},
    {label:'学分',value:credits,ratio:Math.min(1,credits/(credits||1))},
    {label:'课程覆盖',value:`${gradedCourses}/${courses}`,ratio:courses?gradedCourses/courses:0},
  ];
  return `<div class="card" style="display:block">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div>${radar(axes)}</div>
      <div style="flex:1;min-width:150px">
        ${barList(axes.map(a=>({label:a.label,value:a.ratio,display:String(a.value)})))}
      </div></div>
    <div class="sub">各轴各自归一到本图最大值，只看「是否均衡」，不用于跨人比较；成绩录得越多，覆盖越满。</div></div>`;
}

function renderStats(m){
  return api('/api/insights/daily?days=30').then(daily=>{
    const days=daily.length;
    const focusTotal=Math.round(daily.reduce((a,d)=>a+d.focus_minutes,0));
    const activeDays=daily.filter(d=>d.focus_minutes>0).length;
    const debtNow=days?daily[days-1].debt_count:0;
    const peak=Math.max(0,...daily.map(d=>d.focus_minutes));
    return api('/api/insights/groups?days=30').then(groups=>api('/api/insights/heatmap?days=371').then(cells=>{
      hmCells=cells;
      return api('/api/summary/weekly').then(week=>{
      const curve=`<div class="card" style="display:block">
        <div class="meta">近 ${days} 天专注走势（分钟）· 合计 ${focusTotal} 分钟 · 有投入 ${activeDays} 天 · 单日最高 ${Math.round(peak)}</div>
        <div style="margin-top:10px">${lineChart(daily,d=>d.focus_minutes)}</div>
        <div class="sub" style="display:flex;justify-content:space-between"><span>${daily.length?daily[0].date.slice(5):''}</span><span>今天</span></div></div>`;
      const dist=groups.length?barList(groups.map(g=>({
        label:g.group,value:g.focus_hours,display:`${g.focus_hours}h · ${g.task_count} 个任务`}))):'<div class="empty">这段时间还没有绑定任务的专注</div>';
      m.innerHTML=curve+`<div class="section-title">投入分布（按任务分组 · 近 ${days} 天）</div>
        <div class="card" style="display:block">${dist}
        <div class="sub">任务可属多个分组，各组之和可能大于总投入；未绑定任务的专注不计入分组。当前债务 ${debtNow} 项。</div></div>
      <div class="section-title">本周投入</div>${weekCard(week)}
      <div class="section-title">时间热力图（近一年）</div>
        <div class="card" style="display:block">
          <div class="row" id="hmRow">${hmButtons('focus')}</div>
          <div id="hmBox" style="margin-top:10px">${valueHeatmap(cells,'focus')}</div>
          <div class="sub" id="hmNote">${hmNote(cells,'focus')}</div></div>`;
      });
    }));
  });
}
let hmCells=null;
function fmtDay(v,metric){
  if(metric==='debt_count')return v>0?`欠 ${v} 项`:'不欠';
  if(metric==='review_count')return `${v} 张`;
  if(metric==='output_count')return `${v} 条`;
  return `${v} 分钟`;
}
const HM_METRICS=[
  ['focus','专注','focus_minutes'],['manual','手动投入','manual_minutes'],
  ['review','复习','review_count'],['output','产出','output_count'],
  ['debt','债务（欠多少）','debt_count']];
function hmButtons(active){
  return HM_METRICS.map(([k,label])=>
    `<button class="${k===active?'':'ghost'}" onclick="setHeatmap('${k}')">${label}</button>`).join('');
}
function hmNote(cells,metric){
  const label=(HM_METRICS.find(x=>x[0]===metric)||[])[1]||'';
  const isCount=metric==='review_count'||metric==='output_count'||metric==='debt_count';
  return `${label} · 颜色越深=${isCount?'当天越多':'当天投入越多'}；空=没有记录（不是失败，只是那天没记）。`;
}
// 时间热力图：53 周 × 7 天（列=周、行=周一→周日），颜色深浅表示当天数值
function valueHeatmap(cells,metric){
  const map=new Map(cells.map(c=>[c.date,c]));
  const today=new Date();const todayIso=new Date(today.getTime()-today.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
  const cols=53,cell=11,gap=2;
  const values=cells.map(c=>Number(c[metric])||0);
  const max=Math.max(1,...values);
  let rects='';
  for(let c=0;c<cols;c++){
    for(let r=0;r<7;r++){
      const d=new Date(monday);d.setDate(monday.getDate()-(cols-1-c)*7+r);
      const iso=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      if(iso>todayIso)continue;
      const v=map.has(iso)?Number(map.get(iso)[metric])||0:0;
      const on=v>0;
      const ratio=on?0.25+0.75*(v/max):0;
      rects+=`<rect x="${c*(cell+gap)}" y="${r*(cell+gap)}" width="${cell}" height="${cell}" rx="2.5"
        fill="${on?'var(--accent)':'var(--surface-2)'}" opacity="${on?ratio.toFixed(2):0.9}"><title>${iso}${on?' · '+fmtDay(v,metric):''}</title></rect>`;
    }
  }
  const w=cols*(cell+gap),h=7*(cell+gap);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${rects}</svg>`;
}

  if(!row||!box||!hmCells)return;
  row.innerHTML=hmButtons(metric);

}

function weekCard(w){
  const max=Math.max(1,...w.days.map(d=>d.focus_minutes));
  const bars=w.days.map(d=>{
    const h=Math.round(6+d.focus_minutes/max*34);           // 6~40px，0 也留一条底线
    const label=Number(d.date.slice(8,10));
    const bg=d.focus_minutes>0?'var(--accent)':'var(--line)';
    return `<div title="${d.date} ${d.focus_minutes} 分钟" style="flex:1;text-align:center">
      <div style="height:${h}px;background:${bg};border-radius:4px 4px 0 0"></div>
      <div class="sub" style="margin-top:4px">${label}</div></div>`;
  }).join('');
  const nums=[`专注 ${w.focus_hours}h`];
  if(w.manual_hours)nums.push(`手动 ${w.manual_hours}h`);
  if(w.review_count)nums.push(`复习 ${w.review_count} 张`);
  if(w.output_count)nums.push(`产出 ${w.output_count} 条`);
  if(w.debt_count)nums.push(`债务 ${w.debt_count} 项`);
  return `<div class="card" style="display:block">
    <div class="meta">本周 ${w.start} ~ ${w.end} · ${nums.join(' · ')}</div>
    <div style="display:flex;gap:6px;align-items:flex-end;margin-top:12px">${bars}</div>
    <div class="sub" style="margin-top:8px">${esc(w.steady_note)}</div></div>`;
}

  const parts=[`债务 ${s.debt_count} 项`,`投入 ${s.invest_hours}h`];
  if(s.manual_hours)parts.push(`手动投入 ${s.manual_hours}h`);
  if(s.review_count)parts.push(`复习 ${s.review_count} 张`);
  if(s.output_count)parts.push(`产出 ${s.output_count} 条`);
  return parts.join(' · ');
}

let focusTimer=null;
function fmt(sec){const s=Math.max(0,Math.floor(sec));const h=Math.floor(s/3600),mm=String(Math.floor(s%3600/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return h?`${h}:${mm}:${ss}`:`${mm}:${ss}`}
async function renderFocus(m){
  const [today,active,cfg]=await Promise.all([api('/api/focus/today'),api('/api/focus/active'),api('/api/config')]);
  clearInterval(focusTimer);focusTimer=null;
  if(active){
    const started=new Date(String(active.started_at).replace(' ','T')).getTime();
    m.innerHTML=`<div class="card"><div>
      <div class="timer" id="clock">--:--</div>
      <div class="meta">${active.kind==='tomato'?'番茄钟':'普通计时'} · 进行中${active.task_id?' · 已绑定任务':''}</div>
      <div class="sub" id="focusTask"></div></div></div>
    <div class="new"><button onclick="finishFocus('finished')">结束（计入投入）</button>
      <button class="ghost" onclick="finishFocus('interrupted')">记中断</button>
      <button class="ghost" onclick="finishFocus('abandoned')">放弃（不入账）</button></div>`;
    const tick=()=>{const e=document.getElementById('clock');if(e)e.textContent=fmt((Date.now()-started)/1000)};
    tick();focusTimer=setInterval(tick,1000);
    if(active.task_id){api(`/api/tasks/${active.task_id}`).then(t=>{const e=document.getElementById('focusTask');if(e)e.textContent=`归属任务：${t.title}`}).catch(()=>{})}
    return;
  }
  const tasks=await api('/api/mydays');
  const week=await api('/api/summary/weekly');
  m.innerHTML=`<div class="card"><div><div class="big">${today.focus_minutes}</div><div class="meta">今日专注分钟（只算正常结束）</div></div></div>
  <div class="new">
    <select id="focusTaskSel"><option value="">不绑定任务</option>${tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select>
    <button onclick="startFocus('tomato')">番茄钟 ${cfg.pomodoro_minutes||25} 分</button>
    <button class="ghost" onclick="startFocus('plain')">普通计时</button></div>
  <div class="section-title">本周投入</div>
  ${weekCard(week)}`;
}
async function startFocus(kind){
  const sel=document.getElementById('focusTaskSel');
  const body={kind};if(sel&&sel.value)body.task_id=sel.value;
  await api('/api/focus/start',{method:'POST',body:JSON.stringify(body)});
  toast('开始专注，计时进行中');view('focus');
}
async function startFocusFor(taskId){
  await api('/api/focus/start',{method:'POST',body:JSON.stringify({kind:'plain',task_id:taskId})});
  toast('已从任务开始专注');view('focus');
}
async function finishFocus(status){
  const active=await api('/api/focus/active');if(!active)return;
  const seconds=Math.max(0,Math.round((Date.now()-new Date(String(active.started_at).replace(' ','T')).getTime())/1000));
  await api(`/api/focus/${active.id}/finish`,{method:'POST',body:JSON.stringify({duration_sec:seconds,status})});
  toast(status==='finished'?'已结束，投入与当日反馈已更新':status==='abandoned'?'已放弃，不计入投入':'已记中断');
  view('focus');
}

  if(!confirm('删除这条备忘录？关联的任务会保留。'))return;
  await api(`/api/memos/${id}`,{method:'DELETE'});toast('已删除');view(current);
}
async function addInvest(){
  const minutes=parseFloat(document.getElementById('inMinutes').value||'0');
  if(isNaN(minutes)||minutes<0){toast('分钟数不合法');return}
  const body={value:Math.round(minutes*60),  // 存储口径=秒
    kind:document.getElementById('inKind').value,
    note:document.getElementById('inNote').value.trim()||null};
  await api('/api/ledger/invest',{method:'POST',body:JSON.stringify(body)});
  toast(`已记 ${minutes} 分钟手动投入（与专注分开统计）`);view(current);
}
async function retractInvest(entryId){
  await api(`/api/ledger/invest/${entryId}`,{method:'DELETE'});toast('已撤销该笔投入');view(current);
}
async function addOutput(){
  const body={value:parseFloat(document.getElementById('outValue').value||'1'),
    kind:document.getElementById('outKind').value,
    note:document.getElementById('outNote').value.trim()||null};
  if(isNaN(body.value))return;
  await api('/api/ledger/output',{method:'POST',body:JSON.stringify(body)});
  toast('已记一笔产出（与投入分开展示）');view(current);
}
async function retractOutput(entryId){
  await api(`/api/ledger/output/${entryId}`,{method:'DELETE'});toast('已撤销该笔产出');view(current);
}

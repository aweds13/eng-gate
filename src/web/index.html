<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="/manifest.json">
<title>timeflow</title>
<style>
:root{--accent:#3b82f6;--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",PingFang SC,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
.accent{color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
nav button.active{background:var(--accent);color:#fff}
main{max-width:820px;margin:0 auto;padding:0 24px 90px}
.section-title{font-size:13px;color:var(--muted);margin:20px 0 10px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px}
.card .title{flex:1}
.card .meta{color:var(--muted);font-size:12px}
.card.overdue{border-left:3px solid var(--danger)}
.card.done .title{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border:2px solid var(--accent);border-radius:50%;cursor:pointer;flex:none;background:transparent}
.check.on{background:var(--accent)}
button{border:none;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--muted);border:1px solid #e2e8f0}
.new{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.new input{flex:1;min-width:120px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:30px;font-weight:700;color:var(--accent)}
.badge{display:inline-block;background:#f1f5f9;color:var(--muted);border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;resize:vertical}
.timer{font-size:44px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
select{padding:9px 10px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;background:#fff;color:var(--text)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.94}
@media(min-width:641px){.toast{bottom:24px}}
/* 桌面端隐藏底部 Tab */
.bottom-nav{display:none}
/* 移动端（A 档）：隐藏顶部 nav，显示底部 Tab + 单列 */
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  header>nav{display:none}
  main{padding:0 14px 90px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid #e2e8f0;z-index:10;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px 4px;font-size:12px;border-radius:0}
  .bottom-nav button.active{color:var(--accent);font-weight:700}
  .bottom-nav button .ic{display:block;font-size:18px}
}
</style>
</head>
<body>
<header>
  <h1>timeflow <span class="accent">·</span> <span id="summary" style="color:var(--muted);font-size:13px"></span></h1>
  <nav>
    <button data-view="today" class="active">今日</button>
    <button data-view="tasks">全部任务</button>
    <button data-view="focus">专注</button>
    <button data-view="habit">习惯</button>
    <button data-view="academic">学业</button>
    <button data-view="review">复习</button>
    <button data-view="memo">备忘录</button>
    <button id="refresh" class="ghost">刷新</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<nav class="bottom-nav">
  <button data-view="today" class="active"><span class="ic">📅</span>今日</button>
  <button data-view="tasks"><span class="ic">🗂️</span>任务</button>
  <button data-view="focus"><span class="ic">⏱️</span>专注</button>
  <button data-view="habit"><span class="ic">🔥</span>习惯</button>
  <button data-view="setting"><span class="ic">⚙️</span>设置</button>
</nav>
<script>
let accent='#3b82f6';
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){let detail='';try{detail=(await r.json()).detail||''}catch(e){}
    toast(detail?`操作未完成：${detail}`:'操作未完成，请稍后再试');throw new Error(`${r.status} ${path}`)}
  return r.json()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function el(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=esc(msg);t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function toastAction(msg,label,fn){
  const t=document.getElementById('toast');
  t.innerHTML=`${esc(msg)} <button class="ghost" style="margin-left:8px;padding:4px 10px;color:#fff;border-color:#475569" id="toastAct">${esc(label)}</button>`;
  const btn=document.getElementById('toastAct');if(btn)btn.onclick=fn;
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),6000);
}
function view(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));render(name)}
document.querySelectorAll('nav button[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.querySelectorAll('.bottom-nav button[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.getElementById('refresh').onclick=()=>view(current);
let current='today';

async function render(name){
  current=name;
  clearInterval(focusTimer);focusTimer=null;
  const m=document.getElementById('main');
  const cfg=await api('/api/config');accent=cfg.accent_color;document.documentElement.style.setProperty('--accent',accent);
  if(name==='today')return renderToday(m);
  if(name==='tasks')return renderTasks(m);
  if(name==='focus')return renderFocus(m);
  if(name==='habit')return renderHabit(m);
  if(name==='academic')return renderAcademic(m);
  if(name==='review')return renderReview(m);
  if(name==='memo')return renderMemo(m);
  if(name==='setting')return renderSetting(m);
}

function taskCard(t,isOverdue){
  const isDone=t.status==='完成';
  return `<div class="card ${isDone?'done':''} ${isOverdue?'overdue':''}">
    <button class="check ${isDone?'on':''}" title="${isDone?'撤销完成':'标记完成'}" onclick="toggleDone('${t.id}',${isDone})"></button>
    <div style="flex:1"><div class="title">${esc(t.title)}</div>
    <div class="meta">${t.due_date||''} ${t.group_name?`<span class="badge">${esc(t.group_name)}</span>`:''} ${(t.groups||[]).map(g=>`<span class="badge">${esc(g)}</span>`).join('')}${isDone?'<span class="badge">已完成</span>':''}</div></div>
    <div class="row">
      ${isDone?'':`<button class="ghost" onclick="startFocusFor('${t.id}')">专注</button>`}
      ${isOverdue?`<button class="ghost" onclick="pushToTomorrow('${t.id}')">推到明天</button>
        <button class="ghost" onclick="cancelTask('${t.id}')">取消</button>`:''}
      ${isDone?`<button class="ghost" onclick="undoDone('${t.id}')">撤销完成</button>`
              :`<button class="ghost" onclick="toggleMyDay('${t.id}',true)">${t.is_myday?'移出 My Day':'加入 My Day'}</button>`}
      <button class="ghost" onclick="showFacts('${t.id}')">记录</button>
      <button class="ghost" onclick="removeTask('${t.id}')">删除</button>
    </div></div>`;
}
async function toggleDone(id,isDone){
  await api(`/api/tasks/${id}/${isDone?'uncomplete':'complete'}`,{method:'POST'});
  toast(isDone?'已撤销完成，投入账同步回退':'已完成 · 记入事实与账本');
  view(current);
}
async function undoDone(id){await toggleDone(id,true)}
async function toggleMyDay(id,toMyDay){
  await api(`/api/tasks/${id}/myday`,{method:'POST'});
  toast(toMyDay?'已加入 My Day':'已移出 My Day');view(current);
}
async function removeTask(id){
  const t=await api(`/api/tasks/${id}`);
  if(!confirm(`删除「${t.title}」？可在提示条里撤销。`))return;
  await api(`/api/tasks/${id}`,{method:'DELETE'});
  toastAction('已删除，可撤销',"撤销",async()=>{await api(`/api/tasks/${id}/restore`,{method:'POST'});toast('已恢复');view(current)});
  view(current);
}
async function restoreTask(id){
  await api(`/api/tasks/${id}/restore`,{method:'POST'});toast('已恢复');view(current);
}
async function showFacts(id){
  const facts=await api(`/api/tasks/${id}/facts`);
  if(!facts.length){toast('还没有完成记录');return}
  toast(facts.map(f=>`${f.kind==='task.completed'?'完成':f.kind==='task.uncompleted'?'撤销':f.kind==='task.deleted'?'删除':f.kind==='task.restored'?'恢复':f.kind==='task.repeat.generated'?'生成下一次':'记录'} ${String(f.occurred_at).slice(5,16)}`).join(' · '));
}
// LF-2 逾期处理：推到明天 / 取消（其余处置由编辑入口承担）
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
async function pushToTomorrow(id){
  await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({due_date:tomorrow()})});
  toast('已推到明天，债务随之重算');view(current);
}
async function cancelTask(id){
  if(!confirm('取消这个任务？取消后不再计入债务。'))return;
  await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({status:'取消'})});
  toast('已取消');view(current);
}
async function addTask(){
  const titleEl=document.getElementById('newTitle');
  const title=(titleEl.value||'').trim();if(!title)return;
  const due=document.getElementById('newDue').value||null;
  const myday=document.getElementById('newMyDay').checked;
  await api('/api/tasks',{method:'POST',body:JSON.stringify({title,due_date:due,is_myday:myday})});
  titleEl.value='';document.getElementById('newDue').value='';titleEl.focus();
  toast(myday?'已加入今天':'已记入任务（未进 My Day）');view(current);
}

// ---- 全部任务（OP-2：未进 My Day 的任务也要看得见）----
async function renderTasks(m){
  const all=await api('/api/tasks');
  const notMyDay=all.filter(t=>!t.is_myday&&t.status!=='完成');
  const done=all.filter(t=>t.status==='完成');
  m.innerHTML=`<div class="new">
      <input id="allTitle" placeholder="新任务（默认不进今天）" onkeydown="if(event.key==='Enter')addTaskHere()">
      <input id="allDue" type="date" title="截止日（可选）">
      <button onclick="addTaskHere()">添加</button></div>
    <div class="section-title">全部任务（${all.length}）</div>
    ${all.map(t=>taskCard(t)).join('')||'<div class="empty">还没有任务</div>'}
    <div class="sub">未进今天的任务 ${notMyDay.length} 项 · 已完成 ${done.length} 项；删除的任务在「今日 · 回收站」里可恢复。</div>`;
}
async function addTaskHere(){
  const titleEl=document.getElementById('allTitle');
  const title=(titleEl.value||'').trim();if(!title)return;
  const due=document.getElementById('allDue').value||null;
  await api('/api/tasks',{method:'POST',body:JSON.stringify({title,due_date:due,is_myday:false})});
  titleEl.value='';document.getElementById('allDue').value='';titleEl.focus();
  toast('已加入全部任务（未进今天）');view(current);
}

// 周结算（OP-15）：逐日柱状走势 + 温和一句；无数据时给空态
function weekCard(w){
  const max=Math.max(1,...w.days.map(d=>d.focus_minutes));
  const bars=w.days.map(d=>{
    const h=Math.round(6+d.focus_minutes/max*34);           // 6~40px，0 也留一条底线
    const label=Number(d.date.slice(8,10));
    const bg=d.focus_minutes>0?'var(--accent)':'#e2e8f0';
    return `<div title="${d.date} ${d.focus_minutes} 分钟" style="flex:1;text-align:center">
      <div style="height:${h}px;background:${bg};border-radius:4px 4px 0 0"></div>
      <div class="sub" style="margin-top:4px">${label}</div></div>`;
  }).join('');
  const nums=[`专注 ${w.focus_hours}h`];
  if(w.manual_hours)nums.push(`手动 ${w.manual_hours}h`);
  if(w.review_count)nums.push(`复习 ${w.review_count} 张`);
  if(w.output_count)nums.push(`产出 ${w.output_count} 条`);
  if(w.debt_count)nums.push(`债务 ${w.debt_count} 项`);
  return `<div class="card" style="display:block">
    <div class="meta">本周 ${w.start} ~ ${w.end} · ${nums.join(' · ')}</div>
    <div style="display:flex;gap:6px;align-items:flex-end;margin-top:12px">${bars}</div>
    <div class="sub" style="margin-top:8px">${esc(w.steady_note)}</div></div>`;
}

  const parts=[`债务 ${s.debt_count} 项`,`投入 ${s.invest_hours}h`];
  if(s.manual_hours)parts.push(`手动投入 ${s.manual_hours}h`);
  if(s.review_count)parts.push(`复习 ${s.review_count} 张`);
  if(s.output_count)parts.push(`产出 ${s.output_count} 条`);
  return parts.join(' · ');
}
async function renderToday(m){
  const [mydays,overdue,summary,due,deleted]=await Promise.all([
    api('/api/mydays'),api('/api/overdue'),api('/api/summary'),api('/api/review/due'),api('/api/tasks/deleted')]);
  el('summary',summaryLine(summary));
  const debt=summary.debt_count?`<div class="sub">逾期共 ${summary.debt_count} 项（轻≤3天 / 中≤7天 / 重>7天）：${(summary.debt_items||[]).map(d=>`${esc(d.title)}(${d.degree}·${d.overdue_days}天)`).join('、')}</div>`:'';
  const trash=deleted.length?`<div class="section-title">回收站（软删除，可恢复）</div>
    ${deleted.map(t=>`<div class="card"><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="meta">已删</div></div>
    <button class="ghost" onclick="restoreTask('${t.id}')">恢复</button></div>`).join('')}`:'';
  m.innerHTML=`<div class="new">
    <input id="newTitle" placeholder="今天要做什么？回车添加…" onkeydown="if(event.key==='Enter')addTask()">
    <input id="newDue" type="date" title="截止日（可选）">
    <label class="sub" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="newMyDay" checked>加入今天</label>
    <button onclick="addTask()">添加</button></div>
  <div class="section-title">逾期（债务）</div><div id="ov">${overdue.map(t=>taskCard(t,true)).join('')||'<div class="empty">没有逾期，很好</div>'}</div>
  <div class="section-title">今天（My Day）</div>${mydays.map(t=>taskCard(t)).join('')||'<div class="empty">今天还没有任务，挑一件加进来吧</div>'}
  ${due.length?`<div class="section-title">今天该复习（${due.length}）</div>${due.map(r=>reviewCard(r)).join('')}`:''}
  ${trash}
  ${debt}`;
}

// ---- 专注：计时态可见、结束即联动（OP-3 / OP-4）----
let focusTimer=null;
function fmt(sec){const s=Math.max(0,Math.floor(sec));const h=Math.floor(s/3600),mm=String(Math.floor(s%3600/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return h?`${h}:${mm}:${ss}`:`${mm}:${ss}`}
async function renderFocus(m){
  const [today,active,cfg]=await Promise.all([api('/api/focus/today'),api('/api/focus/active'),api('/api/config')]);
  clearInterval(focusTimer);focusTimer=null;
  if(active){
    const started=new Date(String(active.started_at).replace(' ','T')).getTime();
    m.innerHTML=`<div class="card"><div>
      <div class="timer" id="clock">--:--</div>
      <div class="meta">${active.kind==='tomato'?'番茄钟':'普通计时'} · 进行中${active.task_id?' · 已绑定任务':''}</div>
      <div class="sub" id="focusTask"></div></div></div>
    <div class="new"><button onclick="finishFocus('finished')">结束（计入投入）</button>
      <button class="ghost" onclick="finishFocus('interrupted')">记中断</button>
      <button class="ghost" onclick="finishFocus('abandoned')">放弃（不入账）</button></div>`;
    const tick=()=>{const e=document.getElementById('clock');if(e)e.textContent=fmt((Date.now()-started)/1000)};
    tick();focusTimer=setInterval(tick,1000);
    if(active.task_id){api(`/api/tasks/${active.task_id}`).then(t=>{const e=document.getElementById('focusTask');if(e)e.textContent=`归属任务：${t.title}`}).catch(()=>{})}
    return;
  }
  const tasks=await api('/api/mydays');
  const week=await api('/api/summary/weekly');
  m.innerHTML=`<div class="card"><div><div class="big">${today.focus_minutes}</div><div class="meta">今日专注分钟（只算正常结束）</div></div></div>
  <div class="new">
    <select id="focusTaskSel"><option value="">不绑定任务</option>${tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select>
    <button onclick="startFocus('tomato')">番茄钟 ${cfg.pomodoro_minutes||25} 分</button>
    <button class="ghost" onclick="startFocus('plain')">普通计时</button></div>
  <div class="section-title">本周投入</div>
  ${weekCard(week)}`;
}
async function startFocus(kind){
  const sel=document.getElementById('focusTaskSel');
  const body={kind};if(sel&&sel.value)body.task_id=sel.value;
  await api('/api/focus/start',{method:'POST',body:JSON.stringify(body)});
  toast('开始专注，计时进行中');view('focus');
}
async function startFocusFor(taskId){
  await api('/api/focus/start',{method:'POST',body:JSON.stringify({kind:'plain',task_id:taskId})});
  toast('已从任务开始专注');view('focus');
}
async function finishFocus(status){
  const active=await api('/api/focus/active');if(!active)return;
  const seconds=Math.max(0,Math.round((Date.now()-new Date(String(active.started_at).replace(' ','T')).getTime())/1000));
  await api(`/api/focus/${active.id}/finish`,{method:'POST',body:JSON.stringify({duration_sec:seconds,status})});
  toast(status==='finished'?'已结束，投入与当日反馈已更新':status==='abandoned'?'已放弃，不计入投入':'已记中断');
  view('focus');
}

async function renderHabit(m){
  const sc=(await api('/api/selfcheck'));
  const habitId=sessionStorage.getItem('habitId');
  let habit=null;if(habitId)habit=await api(`/api/habits/${habitId}`);
  const fb=await api('/api/feedback');
  m.innerHTML=`<div class="card"><div class="meta">本周专注 ${sc.week_focus_minutes} 分钟 · 本周习惯打卡 ${sc.week_habit_done} 次 · 债务 ${sc.debt_count} 项${fb?` · 今日专注 ${fb.focus_minutes} 分钟`:''}</div></div>
  <div class="new"><input id="habitName" placeholder="新建习惯，如：早睡"><button onclick="addHabit()">新建</button></div>
  ${habit?`<div class="card"><div class="title">连续 ${habit.streak} 天</div><button onclick="toggleHabit('${sessionStorage.getItem('habitId')}')">打卡</button></div>`:'<div class="empty">先新建一个习惯</div>'}
  <div class="section-title">每日反馈（计划 vs 执行）</div>
  <textarea class="textarea" id="fbPlan" placeholder="计划：">${esc(fb&&fb.plan_note||'')}</textarea><br>
  <textarea class="textarea" id="fbGap" placeholder="差距/复盘：">${esc(fb&&fb.gap_note||'')}</textarea><br>
  <button onclick="saveFeedback()">保存反馈</button>`;
}
async function addHabit(){const name=document.getElementById('habitName').value.trim();if(!name)return;
  const h=await api('/api/habits',{method:'POST',body:JSON.stringify({name})});
  sessionStorage.setItem('habitId',h.id);view(current)}
async function toggleHabit(id){await api(`/api/habits/${id}/toggle`,{method:'POST'});view(current)}
async function saveFeedback(){await api('/api/feedback',{method:'POST',body:JSON.stringify({plan_note:document.getElementById('fbPlan').value,gap_note:document.getElementById('fbGap').value})});
  toast('反馈已保存（专注分钟由事实层自动计）');view(current)}

async function renderAcademic(m){
  const gpa=await api('/api/gpa');const gpa5=await api('/api/gpa?scale=5.0');
  const courses=await api('/api/courses');
  m.innerHTML=`<div class="grid">
   <div class="card"><div class="big">${gpa.gpa}</div><div class="meta">GPA（4.0制，${gpa.credits}学分）</div></div>
   <div class="card"><div class="big">${gpa5.gpa}</div><div class="meta">GPA（5.0制）</div></div></div>
  <div class="new"><input id="cName" placeholder="新建课程，如：高数"><button onclick="addCourse()">新建课程</button></div>
  ${courses.map(c=>`<div class="card"><div class="title">${esc(c.name)}</div><div class="meta">${c.credits}学分 ${c.teacher||''}</div></div>`).join('')||'<div class="empty">暂无课程</div>'}
  <div class="section-title">录入成绩</div>
  <div class="new"><input id="gScore" type="number" placeholder="成绩" style="width:80px"><input id="gCredits" type="number" placeholder="学分" value="2" style="width:80px"><button onclick="addGrade()">录入</button></div>`;
}
async function addCourse(){const name=document.getElementById('cName').value.trim();if(!name)return;
  await api('/api/courses',{method:'POST',body:JSON.stringify({name})});view(current)}
async function addGrade(){const score=parseFloat(document.getElementById('gScore').value);const credits=parseFloat(document.getElementById('gCredits').value);
  if(isNaN(score))return;await api('/api/grades',{method:'POST',body:JSON.stringify({score,credits})});view(current)}

function reviewCard(r){
  return `<div class="card"><div style="flex:1"><div class="title">${esc(r.title)}</div>
    <div class="meta">${r.reps}次 · ${r.interval_days}天${r.source==='external'?'<span class="badge">外部</span>':''}</div></div>
    <div class="row"><button onclick="review('${r.id}','remember')">记得</button>
    <button class="ghost" onclick="review('${r.id}','fuzzy')">模糊</button>
    <button class="ghost" onclick="review('${r.id}','forgot')">忘了</button>
    <button class="ghost" onclick="undoReview('${r.id}')">撤销上次</button></div></div>`;
}
async function undoReview(id){
  await api(`/api/review/${id}/undo`,{method:'POST'});
  toast('已撤销当日最近一次复习（间隔与账目一并回退）');view(current);
}
async function renderReview(m){
  const [due,summary]=await Promise.all([api('/api/review/due'),api('/api/summary')]);
  m.innerHTML=`<div class="card"><div class="meta">今日已复习 ${summary.review_count} 张 · 复习完成计投入（维持），不折算时间</div></div>
  <div class="new"><input id="rvTitle" placeholder="新建复习卡内容"><button onclick="addReview()">新建</button></div>
  <div class="section-title">到期复习（${due.length}）</div>
  ${due.map(r=>reviewCard(r)).join('')||'<div class="empty">没有到期复习，轻松一下</div>'}`;
}
async function addReview(){const title=document.getElementById('rvTitle').value.trim();if(!title)return;
  await api('/api/review/items',{method:'POST',body:JSON.stringify({title})});view(current)}
async function review(id,fb){await api(`/api/review/${id}/review`,{method:'POST',body:JSON.stringify({feedback:fb})});
  toast('复习已记录，下次到期已由 FSRS 排好');view(current)}

async function renderMemo(m){
  const [memos,outputs,invests]=await Promise.all([
    api('/api/memos'),api('/api/ledger/outputs'),api('/api/ledger/invests')]);
  m.innerHTML=`<div class="new"><input id="memoTxt" placeholder="随手记一条…"><button onclick="addMemo()">记录</button></div>
  ${memos.map(x=>`<div class="card"><div class="title">${esc(x.text)}</div><div class="meta">${x.created_at||''} ${x.ref_handle?`<span class="badge">${esc(x.ref_handle)}</span>`:''}</div></div>`).join('')||'<div class="empty">暂无备忘录</div>'}
  <div class="section-title">今日手动投入（独立于专注投入）</div>
  <div class="new">
    <select id="inKind"><option value="focus">专注补记</option><option value="habit">习惯</option><option value="other">其它</option></select>
    <input id="inMinutes" type="number" min="0" step="5" value="25" style="width:90px" title="分钟">
    <span class="sub">分钟</span>
    <input id="inNote" placeholder="备注，如：番茄补记">
    <button onclick="addInvest()">记一笔投入</button></div>
  ${invests.map(i=>`<div class="card ${i.retracted?'done':''}"><div style="flex:1"><div class="title">${esc(i.note||i.kind)} · ${i.minutes} 分钟</div>
    <div class="meta">${i.kind}${i.retracted?' · 已撤销':''}</div></div>
    ${i.retracted?'':`<button class="ghost" onclick="retractInvest('${i.entry_id}')">撤销</button>`}</div>`).join('')||'<div class="empty">今天还没有手动投入</div>'}
  <div class="section-title">今日产出（独立于投入轴）</div>
  <div class="new">
    <select id="outKind"><option value="asset">知识资产</option><option value="kpi">学校 KPI</option></select>
    <input id="outValue" type="number" step="0.5" value="1" style="width:90px" title="数量">
    <input id="outNote" placeholder="备注，如：数学笔记#3">
    <button onclick="addOutput()">记一笔产出</button></div>
  ${outputs.map(o=>`<div class="card ${o.retracted?'done':''}"><div style="flex:1"><div class="title">${esc(o.note||o.kind)} ×${o.value}</div>
    <div class="meta">${o.kind==='kpi'?'学校 KPI':'知识资产'}${o.retracted?' · 已撤销':''}</div></div>
    ${o.retracted?'':`<button class="ghost" onclick="retractOutput('${o.entry_id}')">撤销</button>`}</div>`).join('')||'<div class="empty">今天还没有产出记录</div>'}`;
}
async function addMemo(){const text=document.getElementById('memoTxt').value.trim();if(!text)return;
  await api('/api/memos',{method:'POST',body:JSON.stringify({text})});view(current)}
async function addInvest(){
  const minutes=parseFloat(document.getElementById('inMinutes').value||'0');
  if(isNaN(minutes)||minutes<0){toast('分钟数不合法');return}
  const body={value:Math.round(minutes*60),  // 存储口径=秒
    kind:document.getElementById('inKind').value,
    note:document.getElementById('inNote').value.trim()||null};
  await api('/api/ledger/invest',{method:'POST',body:JSON.stringify(body)});
  toast(`已记 ${minutes} 分钟手动投入（与专注分开统计）`);view(current);
}
async function retractInvest(entryId){
  await api(`/api/ledger/invest/${entryId}`,{method:'DELETE'});toast('已撤销该笔投入');view(current);
}
async function addOutput(){
  const body={value:parseFloat(document.getElementById('outValue').value||'1'),
    kind:document.getElementById('outKind').value,
    note:document.getElementById('outNote').value.trim()||null};
  if(isNaN(body.value))return;
  await api('/api/ledger/output',{method:'POST',body:JSON.stringify(body)});
  toast('已记一笔产出（与投入分开展示）');view(current);
}
async function retractOutput(entryId){
  await api(`/api/ledger/output/${entryId}`,{method:'DELETE'});toast('已撤销该笔产出');view(current);
}

// 移动端「设置」页：GPA 制式切换 + 学业/复习/备忘录入口（简版合并）
async function renderSetting(m){
  const cfg=await api('/api/config');
  m.innerHTML=`<div class="section-title">GPA 制式</div>
  <div class="grid">
    <div class="card"><div class="title">当前 ${cfg.gpa_scale==='4.0'?'4.0 制':'5.0 制'}</div>
      <button class="ghost" onclick="setGpa('4.0')">切到 4.0</button>
      <button class="ghost" onclick="setGpa('5.0')">切到 5.0</button></div></div>
  <div class="section-title">深度功能（桌面端更完整）</div>
  <div class="card"><div class="title">全部任务 / 学业 / 复习 / 备忘录</div>
    <button onclick="view('tasks')">全部</button>
    <button class="ghost" onclick="view('academic')">学业</button>
    <button class="ghost" onclick="view('review')">复习</button>
    <button class="ghost" onclick="view('memo')">备忘录</button></div>
  <div class="card"><div class="meta">提示：复杂统计、课程建档、债务重规划等留桌面端。移动端 A 档为简版，离线看缓存页，改动同步需联网。</div></div>`;
}
async function setGpa(scale){view(current);alert('GPA 制式通过本地 config.toml 的 [academic] gpa_scale 持久设置（改 "4.0" 或 "5.0"）。API 临时查看：/api/gpa?scale=5.0');}

// PWA：注册 service worker（仅 secure context，如 https 或 localhost）
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}

// 首屏渲染（此前只在点击导航时才渲染，页面会一直空白）
view('today');
</script>
</body>
</html>

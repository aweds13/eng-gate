/* ---------- 设置页分层（T-G63，「不要那么多按钮」的另一半）----------
 * 用户 2026-09-25：「你过多地堆积各种按钮」。设置页是"想起来才进来"的一页，
 * 原来 17 节全摊开：实测 91 个可见按钮 / 7099px 高（手机 9603px）。
 * 三条口径：
 *  ① **折叠是"目录"不是"藏起来"**：每节都留一行，标题 + **当前值**都在
 *     （"用的时候要看到的东西"里，当前值就是那一个）；
 *  ② 展开/收起是**真按钮**（Tab 可达 + `aria-expanded` + `aria-controls`）——
 *     "收起来"不等于"键盘到不了"（workbench：每个主要动作都要键盘可达）；
 *  ③ **就地切 DOM**：那一页要 15 个请求，折一下不该等网络。
 * 实现在渲染之后一次性整理（而不是改 17 处模板）：一处规则所有节都吃到，后端加新节也不必再想一遍。
 */
function toggleSettingSection(id, btn){
  const body=document.getElementById(`body-${id}`); if(!body)return;
  const open=body.hidden;                        // 现在是收着的 → 展开
  body.hidden=!open; setOpen[id]=open;
  if(btn){btn.textContent=open?'收起':'展开';btn.setAttribute('aria-expanded',open?'true':'false')}
  const sum=document.getElementById(`sum-${id}`); if(sum)sum.hidden=open;  // 展开后摘要让位给控件
}
/** 常用区那排链接要能**叫开**它指向的那一节（它现在是折着的）。只开不收：连点两节都开着是合理的。 */
function openSettingSection(id){
  const body=document.getElementById(`body-${id}`);
  if(body&&body.hidden)toggleSettingSection(id, document.querySelector(`[data-action="set-fold"][data-sec="${id}"]`));
}
/** 一节的「现状」摘要：**优先取那一节里"当前选中"的那个按钮**（分段控件本身就是答案），
 *  否则取第一句 title/meta/sub。截到 12 字 —— 它是"扫一眼"用的，不是解释句。 */
function sectionSummary(id, body){
  const custom=setSummary[id];
  if(custom!==undefined)return custom;
  const on=[...body.querySelectorAll('button')].find(b=>!b.className.includes('ghost'));
  const node=body.querySelector('.title, .meta, .sub, .hint');
  const raw=(on?on.textContent:(node?node.textContent:'')||'').replace(/\s+/g,' ').trim();
  if(!raw)return '';
  return raw.length>12?raw.slice(0,12)+'…':raw;
}
function foldSettingSections(root){
  // 边界：**任何**小节标题都是边界（不管有没有 id）—— 否则"数据与同步"这种没有 id 的标题
  // 会被上一节（提醒）连着它的卡片一起吞进折叠体里，于是它下面的每一节都是点不到的隐藏元素。
  const BOUNDARY='.section-title, .settings-sub';
  // 能折的（有 id + 位置正确）：
  //   · 直接挂在视图根下的 `set-*` 小节标题；
  //   · 设置在**带 id 的卡片**里的子节（`#set-sync` 那一坨：跨端同步 / 冲突日志 / 离线 / 局域网 / 备份）。
  // 刻意不折的：卡片内没有 id 的子行（外观里的「强调色」、导出里的「Obsidian」、提醒里的「全部提醒」）
  //   —— 它们跟着自己那一节一起开，少一层嵌套少一次点击。
  const foldable=(h)=>{
    if(!/^set-/.test(h.id||''))return false;
    const p=h.parentElement;
    if(!p||p===root)return true;
    return Boolean(p.classList&&p.classList.contains('card')&&/^set-/.test(p.id||''));
  };
  for(const h of [...root.querySelectorAll('.section-title[id^="set-"], .settings-sub[id^="set-"]')]){
    if(!foldable(h))continue;
    const sibs=[]; let n=h.nextElementSibling;
    while(n&&!(n.matches&&n.matches(BOUNDARY))){sibs.push(n);n=n.nextElementSibling}
    if(!sibs.length)continue;                    // 空节不动它（凭空多一个"展开"按钮更怪）
    const body=document.createElement('div');
    body.className='set-body'; body.id=`body-${h.id}`;
    h.after(body); sibs.forEach(s=>body.appendChild(s));
    const open=!!setOpen[h.id]; body.hidden=!open;
    const text=sectionSummary(h.id, body);
    const sum=document.createElement('div');
    sum.className='sub set-sum'; sum.id=`sum-${h.id}`;
    sum.textContent=text?`现状：${text}`:'';
    sum.hidden=open||!text;
    const btn=document.createElement('button');
    btn.className='ghost set-toggle'; btn.dataset.action='set-fold'; btn.dataset.sec=h.id;
    btn.setAttribute('aria-expanded', open?'true':'false'); btn.setAttribute('aria-controls', `body-${h.id}`);
    btn.textContent=open?'收起':'展开';
    h.appendChild(btn); h.classList.add('set-head');
    h.after(sum);
  }
}

function shadowLine(sh){

  toast(copied?'示例命令已复制（把 127.0.0.1:8000 换成你实际的端口）':'复制不了，请手动选中那段命令');
}
/* 「AI 报告进展」的撤销（N46 / OP-32；G 批 · T-G21）：**只撤最近一条**，连点两下一层层往回撤。
   撤销不是"删掉那条事实"，而是往事实层再追加一条 `task.progress.retracted` 指回它
   —— 与「改判」同款（留痕）。所以这个按钮**不会**改动任务本身，也不会让记录里的原话消失。 */
async function retractProgress(id){
  const r=await api(`/api/tasks/${id}/progress/retract`,{method:'POST'});
  view(current);
  toast(`已撤销这一条报告${r&&r.note?`：${r.note}`:''}`);
}
/* 学校通知的合作接口（SR-F10.1 / G 批 · T-G14）：**默认关**；开关与措辞全在后端
   `core/notify.py` 一处（界面只显示开关、字段表、自述与收件箱，不复述规则）。
   为什么默认关：N16「默认收严、用户再放宽」——这条口子外面是**别人写的脚本**。
   收件箱里的东西**不会自动变成任务**：转任务要在这里点一下（人始终在环里）。 */
let noticeItems=[];
function noticeCard(n){
  const bits=[n.source];
  if(n.at)bits.push(`通知时间 ${n.at}`);
  if(n.due_date)bits.push(`截止 ${n.due_date}`);
  if(n.external_id)bits.push(`对方编号 ${n.external_id}`);
  bits.push(n.status_label);
  const extra=Object.keys(n.extra||{}).length;
  return `<div class="card">
    <div class="card-body"><div class="title">${esc(n.title)}</div>
      <div class="meta">${esc(bits.join(' · '))}${extra?` · 另有 ${extra} 个额外字段`:''}${n.task_id?` · 已转任务 ${esc(String(n.task_id).slice(0,6))}…`:''}</div>
      ${n.summary?`<div class="sub">${esc(n.summary)}</div>`:''}</div>
    <div class="row">
      ${n.status==='converted'?'':`<button data-action="notice-to-task" data-id="${n.id}" data-myday="0">转成任务</button>
      <button class="ghost" data-action="notice-to-task" data-id="${n.id}" data-myday="1">转成任务（加入今天）</button>`}
      ${n.url?`<button class="ghost" data-action="attach-open" data-target="${esc(n.url)}">打开原文</button>`:''}
      ${n.status==='converted'?''
        :(n.status==='ignored'
          ?`<button class="ghost" data-action="notice-ignore" data-id="${n.id}" data-ignored="0">改回待看</button>`
          :`<button class="ghost" data-action="notice-ignore" data-id="${n.id}" data-ignored="1">忽略</button>`)}
    </div></div>`;
}

}

/* 跨端同步（SR-F9.2 / G 批 · T-G8，场景 ③）：**走文件**。
   后端把包写在库目录旁边（与备份同一个地方），所以这里只显示路径 + 复制；
   导入要先**预览**（dry_run 一个字节都不写），再让你确认 —— 覆盖是有的，所以不能点了就干。
   T-G8b（用户定「覆盖，可以选择是否删除」）：删不删由**那颗勾选框**当场决定（默认不删），
   预览与真导入都把同一个 `apply_deletions` 传下去 —— 于是"预览说会删几行"与"真删几行"是同一个数。 */
function syncSummary(t){
  // 注意：这段文字是给 **toast / confirmAsk**（纯文本，会被转义）看的 —— 所以只用普通字，
  // 不能写 `**加粗**` 也不能写 `<b>`（前者会显示成星号，后者会显示成标签）。
  return `新增 ${t.inserted||0} · 覆盖 ${t.updated||0} · 保留本地 ${t.kept||0}`
    + (t.deleted?` · 删除 ${t.deleted||0} 行`:'')
    + (t.kept_after_delete?` · 本地改过没删 ${t.kept_after_delete||0}`:'')
    + (t.tombstoned?` · 按墓碑跳过 ${t.tombstoned||0}`:'')
    + (t.tombstone_added?` · 记下远程墓碑 ${t.tombstone_added||0}`:'');
}
async function exportSyncPack(){
  try{
    const r=await api('/api/sync/export',{method:'POST',body:JSON.stringify({})});
    const copied=await copyText(r.path);
    toast(`同步包已写出（${r.rows} 行，${sizeLabel(r.bytes)}）：${String(r.path).split(/[\\/]/).pop()}`
      + (copied?'（完整路径已复制）':''));
    view(current);
  }catch(e){/* api() 已经弹过后端原话 */}
}
async function previewSyncPack(){
  const path=((document.getElementById('syncPath')||{}).value||'').trim();
  if(!path){toast('先把要导入的包路径粘进来');return}
  try{
    const r=await api('/api/sync/import',
      {method:'POST',body:JSON.stringify({path,dry_run:true,apply_deletions:syncApplyDeletions()})});
    toast(`预览：${syncSummary(r.totals)}${r.conflict_count?` · 冲突/覆盖 ${r.conflict_count} 条`:''}（还没动库）`);
  }catch(e){/* api() 已经弹过后端原话 */}
}
async function importSyncPack(){
  const path=((document.getElementById('syncPath')||{}).value||'').trim();
  if(!path){toast('先把要导入的包路径粘进来');return}
  const applyDel=syncApplyDeletions();
  try{
    const pre=await api('/api/sync/import',
      {method:'POST',body:JSON.stringify({path,dry_run:true,apply_deletions:applyDel})});
    const ok=await confirmAsk(
      `把这份包合进来？来自设备 ${pre.from_device}（导出于 ${String(pre.pack_created_at).replace('T',' ')}）\n`
      + `${syncSummary(pre.totals)}`
      + (applyDel&&(pre.totals.deleted||0)
          ? `\n\n⚠️ 你勾了「同时应用删除」：**会删掉本机 ${pre.totals.deleted} 行**（不可撤销）`
          : '')
      + (pre.conflict_count?`\n其中 ${pre.conflict_count} 条两边都改过/不一致，会逐条记进冲突日志`:''),
      applyDel&&(pre.totals.deleted||0)?'导入并删除':'导入同步包');
    if(!ok)return;
    const r=await api('/api/sync/import',
      {method:'POST',body:JSON.stringify({path,apply_deletions:applyDel})});
    toast(`已导入：${syncSummary(r.totals)}`);
    view(current);
  }catch(e){/* api() 已经弹过后端原话 */}
}
/** 勾选框读值（T-G8b）：**默认不删**；这个选择每次都看得见，不做成"记住了的隐藏设置"。 */
function syncApplyDeletions(){
  const box=document.getElementById('syncDel');
  return !!(box&&box.checked);
}
/** 勾选框变化：把提示改成人话（勾上时要说清"这会删东西、不可撤销"）。 */
function syncDelHint(){
  const box=document.getElementById('syncDel');
  const hint=document.getElementById('syncDelHint');
  if(!hint)return;
  hint.innerHTML=box&&box.checked
    ? '这次导入会把对方删过的行也在本机删掉（<b>不可撤销</b>；你本地改过的那种仍然不删）'
    : '（默认不删：只记墓碑，保留你本地的行）';
}
// ---- 附件打开方式设置（T-B4）：模式与白名单存服务端 ----
async function setAttachMode(mode){
  await api('/api/settings/attach',{method:'PUT',body:JSON.stringify({mode})});
  toast('打开方式已更新');view(current);
}
async function addWhitelist(){
  const el=document.getElementById('wlExt');
  const ext=(el&&el.value||'').trim();
  if(!ext){toast('先填一个扩展名，如 .pdf');return}
  const cur=await api('/api/settings/attach');
  // 后端会拒绝可执行/脚本类（400 的 detail 由 api() 直接提示），这里不做本地白名单校验
  await api('/api/settings/attach',{method:'PUT',
    body:JSON.stringify({whitelist:[...(cur.whitelist||[]),ext]})});
  toast(`已加入白名单：${ext}（这类文件点开就直接打开）`);view(current);
}
async function removeWhitelist(ext){
  const cur=await api('/api/settings/attach');
  await api('/api/settings/attach',{method:'PUT',
    body:JSON.stringify({whitelist:(cur.whitelist||[]).filter(x=>x!==ext)})});
  toast('已移出白名单');view(current);
}
// 到点通知开关（T-B5 后半，方案 B′）：开启 = 注册 Windows 计划任务（可逆），关闭 = 删除它
async function setRemindNotify(on){
  await api('/api/settings/reminder',{method:'PUT',body:JSON.stringify({enabled:on})});
  toast(on?'已开启到点通知（应用关掉也会响）':'已关闭到点通知（计划任务已删除）');

// 停止响铃（T-B5c）：闹钟式会一直响到被关掉 —— 给了 ✕ 之外的第二条路：在应用里点一下
async function stopRinging(){
  const r=await api('/api/reminders/stop',{method:'POST'});
  toast(r.ok?'已停止响铃（通知也清掉了）':`停不下来：${r.detail}`);
  view(current);
}
// 提醒方式（用户反馈"普通通知效果很差"后加）：闹钟式 = 留在屏幕上 + 循环响铃；温和 = 几秒消失
async function setRemindStyle(style){
  await api('/api/settings/reminder',{method:'PUT',body:JSON.stringify({style})});
  toast(style==='alarm'?'已切到闹钟式提醒（会留在屏幕上，需手动关掉）':'已切到温和通知（几秒后消失）');
  view(current);
}
/* 「完成 N 天后进档案」的 N（F 批 · T-F2）：写进后端设置（`app_settings`，本机生效）。
   非法值由后端拒绝并把原话弹出来（`api()` 已经负责提示），这里只管把空值/非数字先挡下来。 */
async function setArchiveDays(){
  const el=document.getElementById('archiveDays');
  const raw=((el&&el.value)||'').trim();
  if(!/^\d+$/.test(raw)){toast('填一个 0~365 的整数（0 = 完成当天就收走）');return}
  try{
    const r=await api('/api/settings/archive',{method:'PUT',body:JSON.stringify({after_days:Number(raw)})});
    toast(`已设为「完成 ${r.after_days} 天后进档案」`);view(current);
  }catch(e){/* api() 已经弹过后端原话（上限 365 天） */}
}
// GPA 制式切换：只改查看口径（写死配置是后端职责），立即重渲染
async function setGpa(scale){
  gpaScale=scale==='5.0'?'5.0':'4.0';
  toast(`已切到 ${gpaScale} 制`);
  view(current);
}
/* ---------- 主题（R4 接通）----------
 * 三选：亮色 / 暗色 / 跟随系统。结果写成 <html data-theme="dark|light">，令牌在 app.css 里已备好。
 * 强调色单独存（见 applyAccent 的 tf_accent），此处只管明暗。
 */
const THEME_KEY='tf_theme';
function systemDark(){
  try{return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){return false}
}
function applyTheme(){
  const dark=themeChoice==='dark'||(themeChoice==='system'&&systemDark());
  document.documentElement.dataset.theme=dark?'dark':'light';
}
function setTheme(choice){
  themeChoice=['light','dark','system'].includes(choice)?choice:'system';
  try{localStorage.setItem(THEME_KEY,themeChoice)}catch(e){}
  applyTheme();
  toast(`主题已切到「${{light:'亮色',dark:'暗色',system:'跟随系统'}[themeChoice]}」`);
  view(current);
}
// 强调色：页面上给常用几个；空 = 回到 config.toml 的默认值（与 applyAccent 同一套写入）
// 色值一律从 app.css 的令牌区读（R1 约定：颜色只住在 CSS 里，脚本不许写死色值）
let accentChoice=null;          // 本机所选强调色（null = 用配置默认）
function accentPalette(){
  const cs=getComputedStyle(document.documentElement);
  return [1,2,3,4,5,6].map(i=>cs.getPropertyValue(`--accent-${i}`).trim()).filter(Boolean);
}
function sameColor(a,b){
  if(!a||!b)return false;
  const hex=s=>String(s).trim().toLowerCase();
  return hex(a)===hex(b);
}
function setAccent(color){
  if(!color){
    accentChoice=null;
    try{localStorage.removeItem('tf_accent')}catch(e){}
    api('/api/config').then(c=>{applyAccent(c.accent_color);view(current)}).catch(()=>view(current));
    toast('已恢复默认强调色');
    return;
  }
  accentChoice=color;applyAccent(color);
  try{localStorage.setItem('tf_accent',color)}catch(e){}
  toast('强调色已更新（记在本机）');
  view(current);
}
function initTheme(){
  try{
    const saved=localStorage.getItem(THEME_KEY);
    if(saved)themeChoice=saved;
    accentChoice=localStorage.getItem('tf_accent');
  }catch(e){}
  applyTheme();
  try{
    const mq=window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener)mq.addEventListener('change',()=>{if(themeChoice==='system')applyTheme()});
  }catch(e){}
}
initTheme();

/* ---------- 右栏可折叠（SR-NF4 / GAP-NF-03）----------
 * 宽屏用户可以把右栏收起，换更宽的中列；选择记在本机（localStorage），刷新后保持。
 * 窄屏右栏本来是堆叠的，收起同样有效（`.shell.rail-off .sidebar` 直接 display:none）。
 * 入口两处：左栏按钮 + 设置页「外观」区 —— 手机端左栏 nav 是隐藏的，只放那里等于进不去。 */
const RAIL_KEY='tf_rail';
let railOff=false;
function applyRail(){
  const shell=document.querySelector('.shell');
  if(shell)shell.classList.toggle('rail-off',railOff);
  const b=document.getElementById('railToggle');
  if(b)b.textContent=railOff?'展开右栏':'收起右栏';
}
function toggleRail(){
  railOff=!railOff;
  try{localStorage.setItem(RAIL_KEY,railOff?'off':'on')}catch(e){}
  applyRail();
  toast(railOff?'已收起右栏（中列更宽）':'已展开右栏');
}

/* ---------- 新手引导（SR-NF2 / GAP-NF-02）----------
 * 需求：打开就要知道"先干什么"（建任务 → 开专注 → 记反馈），但**不许拦路** ——
 * 所以它不是遮罩弹窗，而是今日页顶部一张卡片：可一键关掉、之后不再出现，设置页留「再看一遍」。
 * 状态只存本机；没读到设置时按"看过"处理（避免任何情况下突然多出一块东西）。 */
const GUIDE_KEY='tf_guide';
let guideDone=true;
function guideSeen(){try{return localStorage.getItem(GUIDE_KEY)==='done'}catch(e){return true}}
function guideCard(){
  if(guideDone)return '';
  return `<div class="card block" id="guideCard">
    <div class="title">第一次用，按这三步走就行</div>
    <div class="sub">① 在下面的输入框写下一件要做的事（回车即可）→ ② 点「专注」开始计时，正常结束时会计入今天的投入 →
      ③ 晚上在专注页跟一句「今天计划 vs 实际」。</div>
    <div class="row mt-3">
      <button data-action="guide-start">好，先写第一件事</button>
      <button class="ghost" data-action="guide-done">知道了，不再显示</button>
    </div></div>`;
}
function guideFinish(){guideDone=true;try{localStorage.setItem(GUIDE_KEY,'done')}catch(e){}}
function guideStart(){
  guideFinish();view('today');
  const i=document.getElementById('newTitle');if(i)i.focus();
}
function guideReplay(){
  guideDone=false;try{localStorage.removeItem(GUIDE_KEY)}catch(e){}
  toast('新手引导已重新打开');view('today');
}
try{railOff=localStorage.getItem(RAIL_KEY)==='off';guideDone=guideSeen()}catch(e){}
applyRail();

// PWA：注册 service worker（仅 secure context，如 https 或 localhost）
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}

/* 离线/在线的切换（SR-NF17 / 场景 ①）：断网那一刻起，记的东西存进手机队列；
   回到网络时说清楚「还有几条没同步」——**不会自动上传**（走文件，或等 ② 同一 WiFi 直连）。 */
window.addEventListener('offline',()=>{
  markDown();paintOfflineBar();
  toast('断网了：现在记的东西会先存在手机上，回电脑后导出同步包导入');
});
window.addEventListener('online',()=>{
  // 标记翻过来时 `markUp` 自己会重画一遍；只有"我们没失败过请求、只是浏览器说断网了"
  // 那种（`navigator.onLine` 那半带来的离线）标记没翻，才需要在这里把停着的那一页叫回来。
  const flipped=markUp();
  paintOfflineBar();
  if(!flipped&&current==='offline')view('offline');
});

// 首屏渲染（此前只在点击导航时才渲染，页面会一直空白）。
// 离线时直接进「离线记」：今日页要联网才有数据，断网打开它只会是一串报错 —— 那一页才是有用的那一页。
paintOfflineBar();
view(offlineNow()?'offline':'today');

// 跨端"实时启动"（T-G20 / SR-F3.4）：每 10 秒问一次"别处有没有在计时"，变了才重画右栏。
// 放在首屏渲染之后 —— 先让用户看到界面，再开始这个只读轮询。
startFocusPoll();

// 底栏图标（T-G54）：那 7 个槽位是**静态壳**，填不了模板串 ——
// 于是在启动时一次性把图标塞进去（图标表只有一份，模板里不留 SVG 副本）。
document.querySelectorAll('.bottom-nav button[data-view] .ic').forEach((slot) => {
  const btn = slot.closest('button');
  slot.innerHTML = icon(btn ? btn.dataset.view : '');
});
</script>

# 门自证台账（卡：门自证矩阵）—— 每道门「会咬」的证据在哪
#
# 为什么要有这份台账：立仓原则是「一道从不红的门，等于没有门」。门绿只说明进程退 0，
# 不说明它**看得见**问题。所以要为每道门指一条**反向用例**：故意造坏输入 ⇒ 断言门会红。
# 光有「跑一遍应该绿」不算 —— 那种用例在门坏掉时会跟着一起绿，证明不了门会咬。
#
# 字段（一行一道门，全部必填）：
#   name        门名。必须与真实门表（gates/defs/*.py 经 scripts/run_gates.py 装配出的
#               build_jobs）里的名字逐字一致；台账里多一个 / 少一个都会红。
#   reverse_case 反向用例的 nodeid：`tests/<文件>::<用例名>`，也认
#               `scripts/<自测脚本>::<用例名>`（自定义自测脚本不是 pytest 用例）。
#               或写 `none` —— 表示这道门目前**没有**反向用例。
#   why_no_case 两用，都不许写空话：
#               ① `reverse_case = "none"` 时**必须写**，说清为什么造不出反向用例
#                  （例如「要真服务/真浏览器」）。这时留空 ⇒ 红。
#               ② 有反向用例、但门里还有**没盖住的层**时，把那一层写成盲区
#                  （例如真机采集、真浏览器行为流）。这是诚实清单，不是免责声明。
#   since       这一行是哪天核过的（ISO 日期）。判据会跟着门表变，日期是复核锚点。
#
# 判据在 tests/test_gate_selfproof.py（这份台账自己也有反向用例：把 reverse_case 改到
# 一个不存在的 nodeid ⇒ 钉子必须红）。只读矩阵在 gates/diag/_gate_selfproof_audit.py。


# 门自证台账 —— product 档 11 道（卡：门自证矩阵 · product 分组）
#
# 姊妹文件：`gates/gate-selfproof.toml`（全 22 道门的主台账）。这一份是 **product 档 11 道**的
# 细粒度版：主台账只记「反向用例的 nodeid 在哪」，这一份多记两样让它能被**手工复核**的东西：
#
#   · `probe`    —— 一段**可复现的造错命令或脚本片段**（不是「看代码就知道会红」）；
#   · `evidence` —— 一条**真读数**（退出码 + 失败断言原文），2026-10-27 实测落盘。
#
# 为什么要有这一份：主台账的 `reverse_case` 指向 pytest 用例，但 product 档里
# `lf1_live` / `web_live` / `render` / `ui_flow` 这四道门要**真起 uvicorn / 真开 Edge**，
# 在 pytest 里起不了，只能人工跑一遍留痕。留痕如果不写清「退出码几 / 它到底说了什么」，
# 下一个人复核时就没法判断这条证据是不是真读数，还是从别处抄来的。
#
# 字段（一道门一条，全部必填；判据在 `tests/test_gate_selfproof_product.py`）：
#   door        门名。必须与 `scripts/run_gates.py` 的 `GATE_PROFILES['product']` 逐字一致；
#               多一个 / 少一个 / 写错一个，钉子都红。
#   kind        怎么造反向案例 —— 一句说清**注入面**（换根 / 换模块常量 / 改合成输入 /
#               让产品行为出错）。这道门的输入从哪来，决定它能不能被自证。
#   probe       可复现的造错命令或脚本片段。能一行命令跑完的就写命令；要造数据的写脚本名。
#   expect      期望的结果，写**退出码 / 断言值**，不写「会失败」这种话。
#   verified_at 哪天实测的（ISO 日期）。判据会跟着门表变，日期是复核锚点。
#   evidence    一条**真实读数**：退出码 + 失败断言原文。必须是能 grep 到的字符串。
#   residue     诚实交代盲区：这道门里有没有**反向用例没盖住的那一层**。
#               没有盲区写 `none` —— 但写 `none` 之前先想清楚「真跑那一层了吗」。
#
# 一条门要算「会咬」，两个条件缺一不可：
#   ① 造错时必须退非零（不只是「会跑」）；
#   ② 必须**点名**造的那个错（报出具体是哪条、哪个值），而不是笼统说"失败"。
# 只有 ① 的是「会跑」；只有 ② 而没有 ① 的是「会说话但不拦」。


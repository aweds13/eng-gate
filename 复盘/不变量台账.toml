judge = "-"
nail = "-"
status = "missing"
note = "★ 本仓内无判据、无钉子 ⇒ 老实标 missing（不编一个假路径）。真判据在号池目录、★ 在本仓之外：infra/pool/codebuddy_accounts.py（save 默认拒覆盖已存在的账号快照）、infra/pool/models.whitelist.toml（只有用户能改）、infra/pool/rotate_credentials.py（凭据轮换）。wb_invariants.py 只核仓库内路径，核不到号池 ⇒ 这半需要另立工具或人工对账。"

[[invariant]]
id = "INV-10"
claim = "假绿家族：ff 合流失败时不许打印『合流完成』（否则日志像成功、主树却没有这笔）"
judge = "tools/pool/landing.py::main"
nail = "-"
status = "partial"
note = "判据在：tools/pool/landing.py::main 第⑦步先比 rev-parse，只在真成功时才打印『ff 合流完成』；失败时打 stdout + stderr 并退 2（2026-10-02 修：原来 check=False + or 兜底 ⇒ git fatal 也照打）。但 tests/test_wb_land.py 明说『不覆盖 ⑦ 之后（ff 合流 / rebase 自动解决）』⇒ 无反例钉子，故标 partial。"


[[invariant]]
id = "INV-14"
claim = "假绿家族：门数≠17 冒充全量门禁（wb_verify 查、wb_review 不查）"
judge = "tools/wb_verify.py::check_gates"
nail = "-"
status = "missing"
note = "★ 卡 140 自己发现的后门：tools/wb_verify.py::check_gates 有 EXPECT_GATES=17 这条判据（门数 != 17 ⇒ 报 FAIL），但复核链必跑的 tools/wb_review.py::check_gate_evidence **不查门数**（只查各门 exit_code=0、ok、rev）⇒ 门数 != 17 时复核仍可过。台账这半没关：判据只在一屏核实器里、复核器里缺 ⇒ 标 missing。"

[[invariant]]
id = "INV-15"
claim = "假绿家族：共享文档片段『单向缺失』查不出来（--check 只查片段没进汇总）"
judge = "tools/sync_docs.py::run"
nail = "tests/test_docs_fragments.py::test_check_is_green_after_merge_and_points_at_hand_edit"

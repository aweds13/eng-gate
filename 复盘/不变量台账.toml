judge = "tools/pool/task.py::_maybe_advance"
nail = "tests/test_pool_task.py::test_nail"
status = "covered"
note = "nail 是参数化的 33 条反例钉子（其中含『名单都投过了、但有一张不通过 ⇒ 仍然不放行』与『重投成功申请 ⇒ 集齐当场放行』）。逐卡域越界 / 名单外 / 没证据 / 过期，都被拒在 tools/pool/task.py::cmd_claim。边界：放行后停在 awaiting-commit，绝不自动提交。"


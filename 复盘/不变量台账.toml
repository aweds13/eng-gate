note = "白名单常量 tools/wb_dispatch.py::MODEL_WHITELIST（deepseek-v4.1-flash / glm-5.3-flash）；允许集 = 名单常量 ∪ 开关文件里打开的，但 429 轮换链只走名单。--resume / --retry / --detach 全过这道闸；拒单必须零副作用（不起进程、不建 log、不改树）。"


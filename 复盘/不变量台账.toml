claim = "提交信息末尾四行 trailer 必须齐（Task 恰好一个），且 Gates: 不许谎称门禁绿"
judge = "tools/wb_review.py::check_gates_trailer_truth"
nail = "tests/test_wb_review.py::test_gates_trailer_truth_forged_green_is_refused"

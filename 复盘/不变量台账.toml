# 不变量台账（卡 144 · T-G243）
#
# 病：需求与架构文档不缺，缺的是「这套系统的安全主张有几条 → 每条由哪段代码判 →
#     反例钉子在哪 → 现在覆盖到没覆盖」。于是每加一个能力，安全主张就多一条，而没人知道它还没被判。
# ★ 立的规矩：新能力没进这张表，就不算做完。
#
# 字段（[[invariant]] 一条一块，一行一条）：
#   id     台账条号（INV-nn）
#   claim  一句人话：什么不许发生
#   judge  判据在哪：`<仓库相对路径>` 或 `<路径>::<符号>`。若判据是一句命令，
#          命令写在 note 里、judge 仍指向命令所在脚本的路径（wb_invariants.py 只核路径，不真跑）。
#   nail   反例钉子：`tests/<文件>::<用例名>`（★ 卡 159 起也认 `scripts/<自测脚本>::<用例名>`）；
#          没有钉子就写 `-`，并把 status 标 missing / partial。
#   status `covered`（判据 + 钉子都在）/ `partial`（有判据、缺一半）/ `missing`（本仓内无判据）
#   note   诚实说明边界
#
# ★ 机器核：`python -X utf8 tools/wb_invariants.py --check` —— 逐条核 judge 路径与 nail 用例名真的存在。
#   status 为 missing / partial 的条目，judge / nail 可以写 `-`（状态不是错误）。
# ★ 中文正文用「」，不写 ASCII 双引号（TOML 基本串里会解析不了）。

[[invariant]]
id = "INV-01"
claim = "全量门禁没跑过、或有门没过时，这一笔不许提交"
judge = "tools/pool/landing.py::main"
nail = "tests/test_wb_review.py::test_gate_evidence_catches_a_stale_run"
status = "covered"
note = "两处：收口链 tools/pool/landing.py::main 第④步门禁红了就 release 并退出（绝不带着红门禁提交）；复核侧 tools/wb_review.py::check_gate_evidence 要求 gates/last.json 的 ok==true 且 rev==这一笔的父提交。边界（如实写）：工人绕过收口链、自己 git commit 时，机器拦在复核/审计侧（事后咬），不是 pre-commit 硬拦。"


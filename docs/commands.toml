# 命令表（T-G31）—— 「四个面集中到一个点」里的那个点
#
# ## 这张表是什么
#
# 用户 2026-09-23 说：「最好就是 4 个面集中到一个点，然后调用同一个点的东西，可以吗？」
# 本项目的**业务点**早就有了（`src/timeflow/core/` + `api/app.py` 那道边界），缺的是**一层元数据**：
# 每个操作叫什么、改不改数据、可不可逆、对应哪条路由、界面上哪个入口、AI 能不能碰。
# 有了它，四个面全部变成**投影**，不用各写一遍：
#
#       界面按钮 / ⌘K 面板 / CLI / AI·MCP   ←   都读这张表
#
# ## 它凭什么不会变成「第二份手抄」
#
# 因为三个字段有**已有的真源**，`scripts/check_commands.py` 会机器核对：
#   · `title`  ↔ `docs/contracts/**` 的 `## OP-n 标题`（每条 OP 必须有行，行不许有契约里没有的）
#   · `routes` ↔ `src/timeflow/api/app.py` 的 `@app.<method>("/path")`（**必须真的存在**）
#   · `ui`     ↔ `src/web/index.html` 的 `ACTIONS` / `VIEWS`（**必须真的注册过**）
# 只有 `kind` / `ai` 是判断，而它们直接对应已经定过的口径（AI 那条 = 用户选的方案 3）。
#
# ## 字段
#   title      契约里的正名（机器核对；同号有「基础篇 + 领域篇」两节时取不带（扩展）的那个）
#   routes     实现这条操作的路由，写成 "METHOD /path"（机器核对）
#   ui         界面入口，写成 "data-action=<名>" 或 "view=<名>"（机器核对）；**空数组是合法的**
#   kind       write（改数据）| read（只读）| derive（纯计算）
#   reversible 契约里 `可逆` 那条的原话（判断"要不要二次确认"就靠它）
#   ai         AI 接口能做什么：read | create | none（列表；一条操作可以既只读又新增）
#   note       这条为什么这么填（尤其是"没有路由/没有入口"这类判断）
#
# ## 「洞」是进度，不是错误
#
# 有些行 `routes` 或 `ui` 是空的 —— 那是**如实记录**（这条操作没有 HTTP 路由、或界面里没有入口）。
# 检查器会把它们数出来：**那个数字下降就是这张表在长**。跟两道审美门的登记表一个思路。

[commands."OP-1"]

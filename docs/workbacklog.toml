# 并发工作 backlog —— 规划者 P 的排班表（台账号 T-G99）
#
# 用途：给定一批卡与并发上限，工具 `tools/wb_plan.py` 算出「谁和谁能同时跑」并拒绝冲突组合。
#   子命令：check（只校验）/ plan（排批）/ worktrees（建树命令）/ dispatch（派活命令）。
# 口径与架构（角色 / 时序 / 冲突域怎么定）见 `复盘/并发架构-T-G99.md`。
#
# ★ 字段口径：
#   tree    —— "" = 主树（同一批最多一张卡用主树）；其余是 worktree 路径，如 .wt/dash。
#   files   —— 这一张卡的**冲突域**：它会改的文件（含新建）。同批两卡相交 = 冲突。
#             含 `docs/traceability.toml` 等受保护共享文件 = 直接拒单（作者一律不许碰）。
#   depends —— 依赖的卡号；同层才并行。
#   risk    —— low | mid | high（high 才派对抗性复核）。
#   status  —— pending | running | done | failed。
#
# 口吻：这份文件是**全量登记**——已落地的卡留在表里、status 转 done/failed（check 跳过它们；历史在 git 里）。

#
# ★ 2026-09-26 收敛（T-G118）：这份文件是**待派队列** ——
#   **已完成的卡要移出**（历史在 git 里）。原因：`wb_plan.py check` 目前**忽略 `status`**，
#   把 backlog 当"全部已排班" → 已完成的卡会与待派卡报「同一文件两个写者」（实测 007↔024、009↔022）。
#   ★ 2026-09-26 已修（T-G119）：`check` 现在**跳过 `status = done`/`failed`**，
#     并且**同域卡只要 `depends` 有路径就允许共存**（会被排到不同批）——所以队列里可以
#     同时有「同域串行」的卡（例：024 → 029 都改 `tools/wb_dispatch.py`）。
[base]
reviewed = "38522420"        # 已复核的基点提交（没登记过就不许建树）

# `tools/pool/` 的模块清单 —— **职责与命令壳的唯一真源**（卡 F11 · T-AG559）
#
# 为什么有它：项目书 `docs/subsystems/pool/README.md` §1 那张表原先手抄，21 个模块
# 一个都没提，行数也停在 7143（实测 13817）。手抄的失败模式不是「抄错一个字」，是
# **必然过期** —— 它记的是文件系统的事实（模块个数、行数、命令壳是谁），却由人维护。
# 所以：**行数与模块名单由 `scripts/gen_pool_readme.py` 现算**，这里只留机器算不出来的
# 那两列（职责 / 命令壳）。
#
# 三个键（一个都不能少，多一个也不行）：
#   name = "guards.py"   相对 `tools/pool/` 的文件名（py 与 toml 都算，40 条）
#   duty = "……"          它**管什么** —— 不许写成模块名的同义重复（`guards.py` 写「守卫」
#                        就是没写：读者据此判断该不该改它，写同义词等于没给判据）
#   cli  = "……"          命令壳（本包一律薄壳：只解析参数 + 打印）；**没有命令壳写 "无"**，
#                        不许留空（留空看不出是「没有」还是「忘了填」）
#
# 判据在生成器里（不在这里）：
#   · `tools/pool/` 里有、本清单没有 ⇒ 退 1 并点名那个文件（不许静默跳过 —— 漏一个模块
#     读者就以为它不存在）；
#   · 本清单里有、`tools/pool/` 里没有 ⇒ 同样退 1 并点名（清单本身成了死指针）；
#   · `duty` 为空串 ⇒ 退 1（空职责等于没写）。
#   · 条目顺序不参与渲染：表按文件名排（`__init__.py` 在前），改顺序不影响产物。
#
# ★ 本文件**只描述，不放判据**：判据一律在 `tools/pool/**` 的 docstring 与库里。

[[module]]
name = "__init__.py"
duty = "包说明与模块地图；只解释分工，不放判据"
cli = "无"

[[module]]
name = "account_id.py"
duty = "人给的名字 ↔ 账本稳定 id 的唯一映射（纯函数：吃 rows，不读文件不读环境）"
cli = "无（被 `wb_dispatch` 调）"

[[module]]
name = "accounts_scope.py"
duty = "调用方名册 → 可见号的收窄：只删候选、从不加（空名单 = 不收窄）"
cli = "无（被 `pool.guards`、`pool_mcp` 调）"

[[module]]
name = "callers.py"
duty = "调用方名册的只读解析：谁能花哪个号的哪些模型；撤人改成 `off = true`，不删行"
cli = "无（被 `wb_dispatch` 调）"

[[module]]
name = "checkin.py"
duty = "五个平台的签到**写动作唯一住所**：六态结论码 + 幂等 + 华为云 `SDK-HMAC-SHA256` 签名（`apply=False` 只探不领）；读侧只加一个纯函数 `codearts_package_used()` —— 只认 `usageTotalPackageCredit` 那一条算已用百分比与余额，绝不把 basic/ondemand/bonus 相加"
cli = "无（被 `pool_accounts.py` 调：`checkin` 走签到写动作、`probe` 的 codearts 分支走额度读数）"

[[module]]
name = "failclosed.py"
duty = "判不出来时拒还是放：`NotServing`（遮蔽器不在就不发）与 `NotLimited`（限额拿不到就不发）两条语义"
cli = "无"

[[module]]
name = "gateway.py"
duty = "号池网关（同协议直通）：`classify` 七值失败分类（只看状态码与结构化字段，不解析文案）、`route_once` 干跑式选号/沉底/RPM/收窄/换号与 `wb-route.jsonl` 留痕、四条回环 HTTP 面（Bearer + Origin 白名单 + 32 MiB 上限）——不翻译协议、不攒流；不知道额度的座由 `route.tier(None)=UNKNOWN_TIER` 排到最后（不是抛错退原序）"
cli = "`python -X utf8 tools/pool/gateway.py [--host 127.0.0.1] [--port 8766] [--routing order]`（要 `TF_POOL_GATEWAY_TOKEN`；`--routing` 是**唯一**选号入口：默认 `order`，空串 = `smart`（magpie 默认值），别名见 `pool.route.ROUTING_ALIASES`；名字认不出 ⇒ 退 2、一个端口都不绑）"

[[module]]
name = "guards.py"
duty = "树 / 冲突域 / 门禁锁 / 日志 / 项目五条守卫，**纯函数**（吃已读好的数据回 `list[str]`，不写文件不 print）"
cli = "无（被 `wb_dispatch`、`wb_registry` 调）"

[[module]]
name = "holds.py"
duty = "整窗用量的下限 + 五因估算（magpie `window_holds` 移植）：`bounds` / `holds_bounds` / `estimate`"
cli = "无"

[[module]]
name = "jobs.py"
duty = "作业日志状态分桶（在跑 / 已判决 / 断了 + 历史尝试 / 已被取代 / 台账已完结 / 非派活，卡 E116；台账读不到 ⇒ 判不了，卡 E132 —— 这一源不可判、不是结束） + 归属卡解析 `card_of_log` + 在飞三源 `in_flight` + 产物定位；只读、无副作用"
cli = "`wb_status.py`、`pool_mcp` 的 `job_list` / `job_status`"

[[module]]
name = "landing.py"
duty = "落地链八步（⓪ 回退 → ⑧ 复核落盘）：迁树 / 文书 / 门禁 / 封存 / 提交 / 合流，一笔提交的编排全在这里"
cli = "`wb_land.py`"

[[module]]
name = "lanes.py"
duty = "读 `lanes.toml`：一个号同时最多几张卡（数据面；判据在 `guards.lane_guard`）"
cli = "无（被 `pool.registry` 调）"

[[module]]
name = "lastgood.py"
duty = "写盘纪律：原子替换 + `.bak` 落后一次 + fail-closed 读；`read_strict` 从不读 `.bak`（撤过的凭据不许复活）"
cli = "无（被 `pool.registry`、`pool.task`、`pool.queue`、`pool_accounts`、`gate_pool` 调）"

[[module]]
name = "lease.py"
duty = "码道派活那条路并进**同一本**租约账的命令行（不并账，守卫就瞎一半）"
cli = "本文件即入口"

[[module]]
name = "ledger_spend.py"
duty = "按账号累计花费的账（`pool-spend.jsonl`，一行一次派活）；**不内置价目表**，`cost` 由调用方给；没有价的行由写侧标 `priced=False`，`unpriced()` 数它们（提问，不是估算）"
cli = "无（被 `pool.limits_check` / `limits_policy` 调）"

[[module]]
name = "pricing.py"
duty = "定价算术（十进制位移 / 严格大于分档 / 整单按档 / 1 小时缓存写 2×）；**零价目表**，`Price` 一律由调用方构造；`unpriced_calls()` 与账本的 `unpriced()` 仍是两份读数，互不调用"
cli = "无（纯函数；今天零生产调用方）"

[[module]]
name = "limits.py"
duty = "限额策略的读法与「表读不出 = 拒」那条 `NotLimited`（magpie `ErrUnlimited` 移植）"
cli = "无（被 `wb_dispatch` 调）"

[[module]]
name = "limits_check.py"
duty = "派活**之前**的预算授权：这个号这个窗口还有余量吗 + `Retry-After`（`budget.Reserve` 移植）；按钱那一条遇到**没有价**的行就说「判不了」并拒，不许拿 cost=0.0 当还有余量"
cli = "无"

[[module]]
name = "limits_policy.py"
duty = "限额策略的窗口与 `Limit` 形状（magpie `access/limit.go` 移植）；与 `--input-budget` 熔断的语义差写在文件头"
cli = "无"

[[module]]
name = "locks.py"
duty = "门禁锁的只读封装：`status_argv` / `parse_entries`（拿/放/续租仍归 `gates/diag/gate_lock.py`）"
cli = "无（被 `pool_mcp` 调）"

[[module]]
name = "model_registry.py"
duty = "一层模型注册表、按池分流：`resolve_model` / `effective_allowed_for`（裸名 vs `provider/model` 两套 id 体系）+ 禁用表 `assert_not_disabled`（与注册表同目录的 `model-disabled.toml`；读不到≠没禁用）"
cli = "无（被 `wb_dispatch`、`wb_watch`、`pool.plan` 调；禁用判据被 `wb_dispatch` 派活主闸、`gateway._model_block`、`pool_mcp` 干跑面三处调）"

[[module]]
name = "models.py"
duty = "号池模型的只读读取：号池批准集 ∩ 号池快照（★ 不是派活允许集）；另给批准集逐条按池的派活真判决（可派 / 未接 / 跨池串用 / 未授权 + 今天的可派别名），判序照抄派活主闸、现算不写死；读快照（带 `at`），不联网、不写快照；过期时由 `probe_command` / `probe_hint` 现算出「怎么让它变新」的那条命令（脚本不在就明说没有，不给假命令），读面三处都调它不各自拼句"
cli = "`wb_state.py`、`pool_mcp`"

[[module]]
name = "no_window.py"
duty = "起子进程「不弹窗」的 `CREATE_NO_WINDOW` 常量 —— 全仓唯一真源"
cli = "无（被十几个入口 import）"

[[module]]
name = "outcomes.py"
duty = "按**请求**而不是按轮算结局（magpie `Totals.count()` 移植）：`is_failed` / `is_outcome` / `request_of` / `count_requests`；只读账本，不改一个字节"
cli = "无（被 `wb_dispatch` 的 `append_usage_line` / `usage_summary` 调）"

[[module]]
name = "plan.py"
duty = "队列解析 + 文件级冲突域 + 拓扑分层 + 同层贪心排批（`wb_plan.py` 的逻辑层，拒绝会冲突的组合）"
cli = "`wb_plan.py`、`wb_batch.py`"

[[module]]
name = "projects.py"
duty = "项目索引（`infra/pool/projects.toml`）只读 + 三条硬判据：root 存在 / 两项目不撞 root / 树在白名单内"
cli = "`wb_project.py`"

[[module]]
name = "queue.py"
duty = "落地合并队列：单写者段排队 + 投机预检（`gates/diag/merge-queue.json`）；投机结果**不许复用**"
cli = "无（被 `pool.landing` 调）"

[[module]]
name = "quota_history.py"
duty = "额度历史曲线：留点 / 回血检测（`new_cycle`）/ 去抖 / 剪枝（magpie `quota_history.go` 移植）"
cli = "无（被 `pool_accounts.py` 调）"

[[module]]
name = "registry.py"
duty = "租约账：`reserve` / `release` / `list_reservations` / `is_dead`，落在**主树** `gates/diag/pool-registry.json`"
cli = "`wb_registry.py`、`wb_dispatch`"

[[module]]
name = "review.py"
duty = "白名单越界 / 实际改动 vs 权威域（`outside_allow` / `changed_paths` / `outside_domain`）—— 全仓唯一实现"
cli = "无（被 `wb_dispatch`、`wb_impact`、`wb_batch` 调）"

[[module]]
name = "route.py"
duty = "Smart 路由：给「哪个号先上」排序（`tier` / `smart_order` / `apply_order`）+ `parse_routing` 名称归一（大小写/空白/别名，空串 = `smart`，认不出抛 `RouteError`），只标准库 + 只读"
cli = "无 CLI（被 `pool.gateway` 调 `apply_strategy` 选号、`parse_routing` 归一 `--routing`；被 `pool.plan` 调 `reset_for`/`seconds_left`、被 `pool.sticky` 取 `USED_SHARE`）"

[[module]]
name = "route_log.py"
duty = "路由回放的**唯一写入处**：一行一轮记「谁被试过、谁真答了」，值只来自调用方传进来的事实（不读 usage 账重算）；`status` 四值闭集"
cli = "无（被 `pool.trae_dispatch.finish` 调；`route_path` / `read_routes` 供读面）"

[[module]]
name = "rpm.py"
duty = "每号每分钟派活**趟数**闸（`decide`）；防不了 vendor 侧 RPM 429（那个归 `pool_quota.py` 的四态）"
cli = "无（被 `wb_dispatch` 调）"

[[module]]
name = "sink.py"
duty = "429 且「还有配额」的候选沉底到次序末尾（`sink` / `unsink` / `unsink_all` / `sunk_at`，进程内状态）"
cli = "无"

[[module]]
name = "snapshot.py"
duty = "零风险快照：`git stash create` 造 commit 再挂 `refs/snapshots/*`（完全不动工作区；不挂 ref 会被 gc）"
cli = "无（被 `pool.landing` 调）"

[[module]]
name = "speed.py"
duty = "输出速度的判据（**不是怎么算速度，是什么情况不许报**）：窗口不可测 / 末端爆发 / 推理比答案快 `THINK_PACE` 倍 / Codex 太短，一律回 `(0, 0)`"
cli = "无（今天**零调用**：pool 不产 `ttft` / `first_text` / `flow`，接线只能接假数）"

[[module]]
name = "stage_card.py"
duty = "三段文书片段生成器：台账条目 + changelog + 交接 CHECKPOINT（只写片段，汇总归 `sync_docs`）；test: 证据指针写盘前先归一形态（剥 tests/ 前缀）并按 audit 同一口径核文件与用例在不在（不在 ⇒ 退 4 点名）"
cli = "`wb_stage_card.py`"

[[module]]
name = "sticky.py"
duty = "卡粘性：同一张卡第二次派活别换号（`STICK_KEEP_S` / `note` / `pick`），省重发上下文的 token"
cli = "无（被 `wb_dispatch` 调）"

[[module]]
name = "task.py"
duty = "任务栅栏：批预声明 → 每张卡交成送申请 → 集齐才收口；含自旋锁与逐卡域检查"
cli = "`wb_task.py`、`auto_land.py`"

[[module]]
name = "trae_dispatch.py"
duty = "面板道（CDP 驱动 Trae）进账：一次跑落成租约 + 日志 + 判决；**刻意不接进派活**"
cli = "本文件即入口；`wb_watch.py`"

[[module]]
name = "usage_ingest.py"
duty = "外部用量上报：整批校验 + `rid` 幂等 + 上报行不计入限额（不经过派活器的调用也要进账）"
cli = "无"

[[module]]
name = "lanes.toml"
duty = "每账号并发闸的数据：稳定 id → 同时最多几张卡（随仓走、由人改，改完不用重启）"
cli = "无（被 `pool.lanes` 读）"

[[module]]
name = "mcp_http.py"
duty = "MCP 的 Streamable HTTP 传输：Origin / Bearer / 版本头 / 上限 / 202-405 都在这一层；判据只在传进来的 handle 上跑，不重写方法分发"
cli = "无（被 tools/pool_mcp.py 调）"

[[module]]
name = "model-registry.toml"
duty = "跨池统一层：CodeBuddy 池的真源 + 码道池的引用（只引用不复制，不许有第二份可写名单）"
cli = "无（被 `pool.model_registry` 读）"

[[module]]
name = "platforms.toml"
duty = "平台能力表：九个平台的端点 / 凭据形态 / 结论码 / 出处；**零凭据**，未验证的标 `verified = false`；`probe` 三个取值 http / manual / codearts-credits（后一个是签名读一次 statistics/plugin 的真读）"
cli = "无（被 `pool_accounts.py` 读）"

[[module]]
name = "rpm.toml"
duty = "每分钟派活闸的数据：稳定 id → 每分最多几趟（0 = 关闸，越界报 `RpmError` 不静默当 0）"
cli = "无（被 `pool.rpm` 读）"

[[module]]
name = "quota_line.py"
duty = "一行说完「现在能不能派」：问不到就打空行、星号只给最新且紧贴名字、至少 1 小时不带秒；纯函数零 IO"
cli = "被 `pool_quota.py line` 调"

[[module]]
name = "cleared.py"
duty = "清空用量的标记（`gates/diag/usage-cleared.json`）：清空**永不写进账**，只换读法；判不出就显出全部"
cli = "`pool.cleared main`（子命令 list / add）"

[[module]]
name = "ledger.py"
duty = "台账唯一的写入口：一把不看端口段的 gates/diag/ledger.lock 把「读字节 → 切块 → 查重 → 尾部追加 → 原子写（os.replace 带重试）→ 提交」包成短事务；只许尾部追加，已有块的字节一个不碰；提交那一笔顺手叫 gen_pool_readme.py 重算队列卡数（没生成器/README 本来就脏/生成器失败 ⇒ 只提交台账并点名）"
cli = "无（被 wb_card.py 与 pool.landing 的翻账路径调）"

[[module]]
name = "dispatch_shim.py"
duty = "面板点「派活」的那一层中间壳：按卡号查规格（绝不让客户端传路径）、写死 argv 真跑一次派活器、往 `gates/diag/pool-actions.log` 追加一行痕；本壳不复制任何判据（卡号 / 域 / 树 / 干跑全在真派活器那边）"
cli = "`python -X utf8 tools/pool/dispatch_shim.py --card <卡号> [--tree .wt/<卡>] [--dry-run]`"

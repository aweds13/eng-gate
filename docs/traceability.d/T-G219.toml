gaps = "**来路（两笔欠账，都记在案）**：① 卡 119（`T-G217`）把 scratch 原型整份搬进 `tools/pool/task.py` 之后，`ruff` **头一次报 17 个 `E501`**（scratch 从来没被 lint 过；`E501` 按**显示宽度**算，中文一字 = 2 列）——当时为了不把「搬家」这张卡搞成「重排」卡，主控加了**一条文件级显式豁免**（`# ruff: noqa: E501` + 四行理由），并**明确记下**「拆行的纯美化另开一张卡」。**本笔就是那张卡。** ② `复盘/架构审议-外包与门禁.md` **§九**还写着「**工具在 scratch 里（gitignore）⇒ 进不了提交**」—— 而卡 119 已经把它搬进 git 了 ⇒ **文档与事实不符**。**做法**：① `tools/pool/task.py`：删掉顶部那 5 行豁免块；把长行逐条拆到 ≤100 显示宽（`ruff --ignore-noqa` 实测 18 条 `E501`，其中 1 条落在**被删的豁免块**里 ⇒ 真正要拆 **17 条**：11 / 14 / 45 / 46 / 311 / 328 / 351 / 476 / 492 / 501 / 549 / 557 / 663 / 679 / 692 / 904 / 1031）。`f-string` 用**隐式拼接**（相邻字面量）且**不切进 `{}` 里面**；docstring / 注释直接换行；第 501 行是**纯表达式**（不是字符串），只在既有 `join(` 括号内换行 —— **没新增括号、没动判据**。② §九 改写成**事实**：权威副本 `tools/pool/task.py`（模块 `pool.task`）+ 壳 `tools/wb_task.py` +`tests/test_pool_task.py`（35 条钉子）；scratch 那份已换成**转发壳**（旧调用点不断）；收口入口**已认批**（`_integrate.py` 的 `--batch`），且卡 118（`T-G216`）给它加了 **`atexit` 还锁**。**验收（工人自报，主控逐条独立复核过）**：① `ruff check tools tests` = **All checks passed!**，且 `grep -n noqa tools/pool/task.py` **零命中**（rc=1）；② `python -X utf8 tools/wb_task.py --selftest`= **33/33 条钉子通过**；③ `pytest tests/test_pool_task.py --no-cov` = **35 passed**；④ ★ **拆行前后 `--selftest` 逐字对照**：两份输出归一化随机临时目录名后 **diff 为空**。**★ 老实说（边界与偏差）**：① 工人报**卡里那句话与实测不符** —— 卡 §2 说 §九 有句「收口入口还不认批」，而 `git log -S` 全历史 **0 命中**（该条一直是「批次支持已加」）⇒ 按卡的**指向**把该条更新成现状，并把这处「卡 vs 实测」的偏差**留痕**（工人可纠正主控口径，但必须写明卡里原话 vs 实测）。② 第 557 行 `render_draft` 那一行**超出「只动换行」的字面**：多了一对括号、把三引号 `f-string`拆成两段**相邻字面量**。原因是**实测**用 `> ` 续行会让生成的骨架**多 3 字节**（1535→1538），`--selftest` 的 diff **非空**；改成相邻字面量拼接后**输出逐字节不变** —— 这是「输出不变 + 行 ≤100 + diff 为空」三者同时成立的**唯一**写法（拆行不许改行为，所以只能用这种）。③ `T-G217` 的台账叙述里**引用了那句已被删除的豁免**（`tools/pin_check.py` 报「叙述 3 处」）——**历史记录不改**（那句在当时为真），本笔在自己这条里说明；★ 且 `pin_check` **不是门禁的一道门**（`scripts/run_gates.py` 里没有它）⇒ 不影响本笔判据。④ 收口工具 `_integrate.py` **不在卡树**（未跟踪 scratch）⇒ 工人**无法逐行核对** `--batch` / `atexit`，文档那两句只依据卡规格 + `05d0d01` 的提交信息（**如实写**）。**★ 本笔另含补账**：`docs/workbacklog.toml` —— 卡 121（`T-G218`）标 `done` 并登记卡 122，卡规格随本笔进 git（T-G213 起的规矩：队列要自洽）。"


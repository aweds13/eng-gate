gaps = "1. searcher 是**判据层**、没有接线：六个纯函数不读盘不读钟不出网，真正去问模型的那一句由调用方注入 —— 也就是说今天生产路径上仍没有 searcher，「搜了没找到 / 压根没搜 / 报错」这三件事在线上还分不开。指针 tools/pool/searcher.py2. `rank` 是照 magpie 抄的十行静态表，取值没有本仓的实测支撑（哪个 provider 更好用、谁在什么条件下该让位）—— 表是读数不是结论。指针 tools/pool/searcher.py3. 「同协议直通」意味着 searcher 只产出「这一轮问谁、问几个」，它不负责把答案拼进请求；拼装面刻意留空，避免造第二份协议翻译。指针 tools/pool/searcher.py"


[entries."T-G209"]
id = "T-G209"
title = "开工切片的两处误报：停工样板话 + 现状段看错树"
group = "OPS"
status = "done"
evidence = [
  "file:tools/wb_brief.py",
  "file:tests/test_wb_brief.py",
  "file:复盘/口径坑.md",
  "file:复盘/门禁改进清单.md",
]
gaps = "**来路**：`tools/wb_brief.py` 生成的**开工切片**有两处**误报**，2026-10-02 **三个工人各自独立**报了同一件事（卡 108 / 109 / 110），每张卡白花一轮解释：① 切片 §四 印着「卡里没找到白名单小节 → **停工报主控**」，而本套卡的规格本来就是「**逐文件点名范围 + 禁区**」 ⇒ 工人读完判定「不该停工」，还得**专门写一条解释**；② 切片的「现状」段给的是**主仓**的工作区状态（「被跟踪改动 1 个 + 外来未跟踪 4 个」），而工人 `cd` 进的是**卡树**（干净）⇒ 工人报「文档和实际不符」。**做法**：① `section_whitelist()` —— 先把「白名单」「禁区」两节都当**范围小节**；若都没有，再看规格里有没有**逐一点名的文件 / 路径**（正则）；**两个都没有**才印那句停工话（正例：卡 112 自己的规格印出「范围以规格里逐一点名的文件 / 路径为准」；反例：既无小节又无点名 ⇒ 仍印停工话）；② `section_state(cwd=「」)` —— 给了 `--cwd` 就**两棵树都印、各自标名**（`- 卡树 <路径>：HEAD… · 分支…` + `- 卡树 工作区：…` + `- 主仓 <路径>：…` + `- 主仓 工作区：…`，末尾「台账分布（主仓）」），`_git()` 加 `where=` 参数；**不给 `--cwd` ⇒ 逐字不变**（用 `git show HEAD:tools/wb_brief.py` 取旧版、同一输入各生成一份做 diff：**段函数 diff 为空**、整份切片（卡 008）**逐字一致**（3761 字节）、卡 112 那份的 diff **只落在 §四**）。**验收（工人自报，主控逐条核）**：① 四条判据都有**正例 + 反例**（停工话 出现/不出现；两棵树行 都有/都没有）；② 新增 `tests/test_wb_brief.py`（**5 用例**，桩 `_git` / `_first_line` / `_checkpoint_blocks`，**一个字节都不写进真 `gates/diag/`**）；③ 全量 `pytest -n 4` → **1780 passed**（= 基线 **1775** + 本卡 5），覆盖率 **93.71%**（门 70%）；`tests/test_wb_dispatch.py` **133 passed**；`ruff check src tests scripts tools examples harness` → `All checks passed!`；④ 覆盖的 5 张卡切片字节 **3490~3892 ≤ 6144**。**★ 主控补修（两处，都带钉子）**：① ★ 工人如实报的**既有缺陷**：切片有「**6144 字节硬上限**」，而 `_truncate()` 只从限额里扣 **12** 字节，后缀 `…(已截断)` 其实是 **14** 字节 ⇒ 截断后最多**超 2**；调用点截断完还补一个 `\\n`（再 +1）⇒ 全量 126 张卡里最长那份 = **6146**（超上限 2，改动前后同值）。**已修**：按**后缀真实字节数**扣 + 调用点用 `上限 - 1`（把那个 `\\n` 也算进预算），并补 **2 条钉子**（后缀字节数 = 14 且任何输入都不超；调用点预算含尾换行）—— 实测 `limit=6144` 时截断结果 **6143** ≤ 6144、`limit=40` 时 **38**；本卡切片测试 7 passed（工人 5 + 主控 2）。② ★ 主控**自己在补账时踩到并当场改掉**：本仓 `core.autocrlf=true` ⇒ `checkout` 会把 `复盘/门禁改进清单.md` 从 LF 变回 **CRLF**（卡 110 那个工人**警告过**这件事，这回被实测证实）⇒ 回填脚本改成「**行尾跟着文件当下走**」；真正的不变量是「**diff 只有那几行**」，不是某个绝对行尾。**★ 本笔另含两处补账（同一提交）**：① **回填 T-G205 / T-G206 / T-G208 的 9 个片段** —— B 方案「每笔落一个片段」对那三笔是**空的**（集成时 `--allow` 漏带，见口径坑 30；`sync_docs.py --check` **抓不到这种单向缺失**），内容早已在共享文档里 ⇒ 补进库**不改变汇总**（自验：汇总器空跑「无待汇总片段」、三个共享文档 sha256 **前 = 后**（`44284819099878b3` / `7cdf3a6efbb46ca2` / `9bbeb8243362b5cd`）、`--check` 从 `changelog.d=1` 变成 **`changelog.d=5, traceability.d=5, 交接.d=5`**）；② `复盘/口径坑.md` 追加 **29**（反引号里**裸的** `.md` 也算一条路径 —— 卡 110 第一次门禁就是被它弄红的）/ **30**（片段必须进提交）/ **31**（`taskkill` 输出是系统区域编码 —— 证据乱码），`复盘/门禁改进清单.md` 追加待做 **⑨ 门禁没有一条「封存树 vs 提交树」的对比**（今天这个片段缺陷就是从这道缝漏过去的）。 ③ ★ 主控在开并行集成前核对「内容有没有丢」时，**当场发现 B+A 的一个真实副作用**：两笔都往 `docs/changelog.md` 的**文件头**插节，`git` 的 ort 合并对「同一锚点新增的块」**不报冲突、直接拼接** ⇒ **后提交那笔的日期排到了上面**（实测：changelog 第 1 行是 `T-G207`（10-01）、第 16 行才是 `T-G208`（10-02）；台账尾部 `T-G206, T-G208, T-G207`）。**内容一条没丢**（339 条台账、四个台账号都在、`tomllib` 可读），坏的只是**次序**；而 `sync_docs.py --check` **不查次序** ⇒ 这条缝没人守。已记成 `复盘/口径坑.md` **第 32 条**（并给出两条出路：composer 按日期插入 / 门禁加一条日期非升序判据）。"


gaps = "**来路（收尾批，四条）**：外部审查 GLM-5.3 剩下的 **2.7**（两份模型白名单**已经漂了**）与 **三.2**（`Gates:` trailer **真伪无机器判据**：`audit_progress` 只查「在不在」），加上本轮自己暴露的**两处文档口径**（卡规格模板**漏了「交成送申请」这一步** —— 本批有两张卡的申请是主控收工后补发一条消息让工人补交的；**边界没写进文档**：「模型闸门是**派活器级**的」主控在会话里认过却没落纸）与**一处真缺陷**（真仓 `docs/changelog.md` 有一处**历史倒置**，坑 32 的残留）。**做法（收批 `B-FIX4`，3 张卡跨三层；卡树这次**都建在**上一批落地之后的 HEAD `bd711a0` 上）**：① **卡 132**（运维层）两份白名单的**对账判据**：`tools/pool/models.py` 新增**纯函数**`compare_rosters(local_names, pool_models)`（**不读文件、不联网、不 print**，与 `pool/guards.py` 同风格；两份名单**由调用方传进来** —— ★ 不许在 `models.py` 里 import `wb_dispatch`，那是 CLI 层，反过来会分层倒置），返回**人话问题列表**：只在一边有的、以及 ★ **两边 id 体系不同**（裸名 vs `provider/model`）这一条**必须点名并给结论**（「要合并得先定一套 id 口径」）；`tools/wb_state.py` 那条「一条命令看全局」的面板**加一行**并排显示 + 对账结果（漂了 `⚠`、一致 `✓`）。★ **只报告、绝不自动改名单**（白名单只有用户能改；池里新增模型只报告不自动启用）。② **卡 133**（门禁层）`Gates:` trailer 的**真伪判据**（**复核侧**，不动 `audit_progress` 的「存在性」那半 ——分工写进注释）：把提交信息的 `Gates:` 行与 `gates/last.json` 的 `ok`/`rev` 对账 ——(a) `ok=true` 且 `rev` = **本提交的父提交** ⇒ trailer 必须声称跑过全量门禁，否则**拒**；(b) `ok=false` 或 `rev` 对不上 ⇒ trailer **不许**声称「全量门禁绿 + seal」，否则**拒**（这就是「伪造门禁结论」的机器版）；(c) ★ **`--no-gate` / `--commit-only` 形态**：trailer 写「没跑门禁」/「复用已绿的那一趟」 ⇒ **放行，但必须如实标注**「这一笔**没有**本轮门禁结论」，`--json` 里给字段 —— **不许**混成「门禁绿」。报错要点名 trailer 原文 + `last.json` 读数。③ **卡 134**（文档层）两处口径：卡规格模板补一节「**交成送申请**」（交给谁 · 成功必须带证据 ·域要与声明的 `paths` 一致（域外会被当场拒并点名）· 失败要投 `failed`（它会挡住收口）· 交完只回那一行 ·以及**为什么要写进卡里**：不写，工人收工后就没机会交）；`复盘/外包工具-需求与架构.md` §5 边界**新增一条**「**模型闸门是派活器级的，不是 CLI 级的** —— 白名单只拦 `--model`，绕过派活器直接起 CLI 就没有闸（本轮外部审查卡自己就是这么跑起来的）；要真封死得在 CLI 那侧做，**本版没做**」，并把 §5 第 3 条（两个白名单）由「会漂」**升级**成「**已经漂了**」（点出 id 体系都不同；注明对账判据在同批的卡 132）。**主控在收口时自己做的第三件（受保护文件，作者不许碰）**：真仓 `docs/changelog.md` 的**历史倒置换位** ——把 `## 2026-10-01` 那一节移到所有 `## 2026-10-02` 之后（★ **稳定排序**：**同一天内的相对次序逐字未变**，脚本里逐日断言过；节的内容集合逐字未变，也断言过）。**验收（主控在当前主树上跑的收口前体检；全量门禁与审计见 trailer 与提交之后的 audit 段）**：`pytest tests/test_pool_models.py tests/test_wb_review.py tests/test_docs_fragments.py --no-cov` = **46 passed** ·`ruff check tools tests` = **All checks passed!** · `tools/sync_docs.py --check` **不再有「次序错」的 `[WARN]`**（换位前一直有）· `tests/test_docs_fragments.py` **8 passed**（换位没打穿既有断言）。**★ 老实说（偏差与自咬）**：① ★★ **我写卡 134 时把受保护共享文件 `docs/changelog.md` 写进了它的域** ⇒ **被两道新守卫当场拒**：栅栏 `register` 报「卡 M-3 的域 'docs/changelog.md' 覆盖了受保护共享文件」，队列 `check` 报「卡 134：files 含受保护共享文件 `docs/changelog.md`（作者一律不许碰）」——★ 这是**卡 128（`T-G226`）新加的 `PROTECTED_FILES` 判据第一次在生产里咬人**（同一晚它还咬了「域不在队列里」那条：派卡 128 时被拒，因为队列没登记它的冲突域）。**守卫在干活，而挨咬的是我的卡。**② ★ **我自己写搬移脚本时犯了两个错**：第一版**忘了写盘**（跑完 `--check` 还在报 WARN 才发现 —— 幸好脚本是「验后即写 + 断言内容集合不变」，没造成损坏）；第二版**没做稳定排序**（会把**同一天内**的先后搅乱 ——changelog 同日的次序是历史信息，**不许搅**）。**如实记**：这类「重排共享文档」的脚本必须**① 先验② 再写③ 事后复检**，三步缺一不可。★ **第三错**：第一版还把整份文件写成了**纯 LF**，而本仓的汇总文档要求**纯 CRLF** ⇒ `_stage_card.py` 的 `assert lf == 0` 当场红（它替我挡在门禁前面）。⇒ 重排共享文档的脚本必须**① 先验② 再写③ 事后复检（含行尾与内容集合）**，缺一不可。③ **台账号口径**：本批三张卡在队列里统一归到一个台账号 **`T-G229`**（一笔提交只有一个号 —— 同 `B-ARCH1` 的口径，另两个预排号没有独立台账条目），`Refs:` 指向它们的前置（`T-G228` / `T-G226`）。④ 本笔仍是**按文件复制**收口（三棵树 → 主树），不是分支合并。**★ 本笔另含**：`docs/workbacklog.toml` 把卡 128/130/131 标 `done`、登记 132/133/134（并把三张卡的 `task`统一到 `T-G229`）；三张卡的规格随本笔进 git。"


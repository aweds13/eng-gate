gaps = "① ★ 组件表补上**工作台页**：`board` = `python -X utf8 tools/wb_dash.py`（端口 8787，白名单 `python.exe`）—— 之前 `start-all.cmd` 起完，工作台那一行点开还是空的 ✗（实测 `8787: closed`）。指针：`tools/stack.py`。② ★ 修掉「**判活太快**」：`start` 改成**发起后有上限地等端口/进程**（注入式 `wait_seconds`，默认 20s、每 0.5s 探一次）；等不到就报原话「发起了，但 N 秒内端口 (…) 还没起来 —— 没活起来」+ 日志路径，**不许**把它写成成功。指针：`tools/stack.py`。③ ★ 修掉 `trae` 那条链上的 `timeout` 被抢：启动改成 `cmd.exe /c …` 并给子进程**只含 `%SYSTEMROOT%\\System32` 的 PATH**（Windows 的 `timeout.exe` 仍在、MSYS 的 GNU `timeout` 不在）—— ★ **桌面那份 cmd 一个字没动**，修的是「我们怎么调它」。指针：`tools/stack.py`。"


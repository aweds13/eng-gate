gaps = "本笔落卡 179（**框架 MVP** —— 这套管线第一次变成能运行的东西）。★ 诚实缺口五条：1. ★★ **独立验证只到「测试能过 + 泛用性钉子为 0」这一层**：我**没有**逐条复核它的 8 条命令、退出码表、schema 字段是否与设计书一字不差。★ 那 55 条测试**是它自己写的** —— 自测能过 ≠ 判据对。⇒ **「框架能跑」的更强证据在卡 181**（独立仓 + 它跑自己的门）。2. ★★ **本仓的门扫不到 `framework/`**（`scripts/run_gates.py` 的 ruff / mypy / pytest 目标只有 `src/ tests/ scripts/ tools/ examples/ harness/`）。⇒ 本笔的门禁**只能证明「它没把既有的门弄红」**，**证明不了框架自身的质量**。这是**已知缺口**（已在卡 179 规格与卡 181 里写明）。3. ★★ **它的成送申请被「域守卫」当场拒了**（真现场）：预声明域（`_B-FRAMEWORK.toml` 的 `paths`）是派活前**按设计书猜的 12~21 条**，而实际交付 **54 个文件**（含 `templates/minimal/**` 与 `examples/minimal-notes/**` 两棵完整子树）⇒ 域对不上。**主控的修法**：按卡树实测回填 54 条（脚本 `gates/diag/_gen179.py`）→ `register --force` → **回填申请**（工人的申请没交成）。★ **教训（要立卡或写进卡表）**：**预声明域要么按「目录」写、要么在派活前照设计书逐条抄全** —— 猜个大概就会在收工那一刻被自己的守卫拦住。4. **5 个后端模块是「薄壳」不是成品**：`ledger.py` / `invariants.py` / `claim.py` / `land.py` / `trace.py` 按主控裁的范围只做了最小可实现（能 import、没实现就明确报错、有钉子）。⇒ 「台账求值 / 不变式核查 / 申报栅栏 / 集成发布 / 封存」这五件**还没真做**。5. ★ **6 件工具迁移不在本笔**（设计书 §追加 A.2 把它划进了阶段一，主控**不照单全收**）：那要动 **375 条**台账路径证据，另立卡。"


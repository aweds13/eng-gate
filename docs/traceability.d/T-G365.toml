gaps = "① ★ **逃生门**：订 `ctx.sidebarRight.mounted`（类型是 `ObservableSnapshot<SessionId|undefined>`，`service.d.ts:148`）记住**最后在屏的 sessionId** ⇒ 开页时优先 `openTabIn(lastSessionId, 「browser」, { params: { url } })`（它对未 adopted 会话**静默无操作**，`client.js:6416-6421`），拿不到 sessionId 才退回 `openTab`，并**保留 catch 与「没起 + 怎么起」的文案**（`openTab` 在无屏会话时会抛，`client.js:6744-6752`）。指针：`tools/dsh_panel.py`。② ★ **兼容字段写成真正被强制的那个**：清单补 `peerDependencies[「@deepseek-ai/dsh」]` —— 依据 app-boot 那个包里的兼容检查（`:286-304`，前缀过滤在 `:294`）**只强制**名为 `@deepseek-ai/dsh` 或 `@deepseek-ai/dsh-` 开头的 semver 范围（我们运行时是 `0.2.0-rc.2`）；`engines.dsh` **不被强制** ✗，不当强制字段写。指针：`tools/dsh_panel.py`。③ ★ **包内图标 + 右栏页签**：产出 `icon.svg`（**相对路径**引用、远小于 256 KiB、不引绝对路径/URL）并在清单写 `icon`；右栏页签走官方面 —— `ctx.get(「sidebarRightTabs」)`（`ctx.get()` 是官方用法，sidebar 那个包的 client 半 `:447`）+ keyed 座 `sidebar.right.pane.tab`（key = 类型 id，`client.js:5579`/`:9154`），且**探到服务才注册**（没有就不注册、不假装）。指针：`tools/dsh_panel.py`。"


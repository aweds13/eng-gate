id = "T-G281"
title = "把 framework/ 提升成独立仓并自带门禁：五道门全绿 + doctor 五道全有牙"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/框架-独立仓提升.md",
]
gaps = "本笔落卡 181（把 `framework/` 提升成独立仓，并让它作为一个新项目参与这套管线）。★ 诚实缺口七条。① ★★ **本卡的交付物主要落在本仓之外** —— 独立仓在 `D:/repo\\program\\framework`（与 `engineering` 平级），它有自己的 git 与提交（`a0aa304` → **`247c699`**）。⇒ **收口链管不到它**：本笔能落的**只有本仓这一份文书**（`复盘/框架-独立仓提升.md`，**428 行**）。★ 所以「独立仓那边到底提交了什么」**只有那份文书 + 一个仓外提交号**作凭据（★ 人要看就得去那个仓看）。② ★ **管线参与那一半只做到「查清缺什么」**：`infra/pool/projects.toml` **不许动**（卡规格的禁区原文写着不许动 `infra/`）⇒ 工人把「登记 framework 还需要什么」写进文书：该仓**缺 `tools/` / `harness.toml`**。⇒ 「注册成一个项目 + 真派一次活」这条**没做**，如实记。③ ★★ **第一轮白烧了 644 秒**：第一轮工人**照规格正确停手**了 —— 规格第 23 行写着「★ **先看它是否已存在**：存在就停手回报，不许覆盖」，而那个位置**确实已存在**（是**同一张卡的上一轮**被换窗口杀掉后留下的）。⇒ 主控追加了一节「**那是自己人留下的，接着干**」+ 四处作业面澄清，第二轮才做完。★ 教训：**「存在就停手」这种守卫要写明「什么算别人的东西」**，否则续做轮会被自己的守卫拦住。④ ★ **`genericity` 门原本是红的，红在「注释里」**：`gates.d/genericity.toml` 第 1 行注释里出现了 `timeflow` 一词，而检测器扫**所有文本文件（含注释）**。★ 工人**做对了**：**清掉那个词**、**没有**把判据放宽成「注释豁免」（那等于把门关掉）。⇒ 现在 `grep timeflow` = **0**。⑤ **泛用性证据的第一手复核（主控自己跑的，不是自报）**：在独立仓里`python cli/main.py gate` ⇒ **五道门全 pass（绿）、退出码 0**（`cli` / `genericity` / `schema` / `template` / `verdict`，各 0.8~5.4s）；`python cli/main.py doctor` ⇒ **「金丝雀自检：5 道门，全部有牙」**（每道门的反例钉子都**断言成立**）。★ 这条比「门是绿的」硬 —— 它证明判据**不是空转**。⑥ ★ **「泛用性」只证到两步**：① `grep` 口径（无项目专有词）② 它自己的门能跑。★ 但**它脱胎于本仓**（就地取材）—— 「**换一个真 harness / 换一个真项目**能不能用」**本笔证不了**。⑦ ★★ **文书里那句「行号在 HEAD 同样有效」这类自称要当心**（与卡 189 那份报告同一个坑）：本笔的 428 行文书里引用的是**仓外那个仓**的路径与提交号，**仓外的行号在任何时候都可能变**（本笔之后它就又变过一次）⇒ 引用只应锚在**提交号**上，不要锚行号。"


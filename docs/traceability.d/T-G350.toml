id = "T-G350"
title = "收口器做成确定的程序：tools/auto_land.py（零 LLM，四态明确）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/auto_land.py",
  "file:tests/test_auto_land.py",
]
gaps = "① ★ **这张卡的来由是用户的两个追问**：「这个收口器是什么形式」「为什么没自动执行」—— 当场那个收口器是**一段自然语言提示词**（每 5 分钟投一次、由一个 agent 回合读懂再动）✗。本笔把它换成纯程序。指针：`tools/auto_land.py`。② ★ **四态都做成「确定的」**：该落就落；**内存紧 / 门禁红 / 混着用户决策项 ⇒ 什么都不做 + 非零退出 + 点名**（★ 不许用 `TF_GATE_MIN_FREE_GB=0` 这类逃生门绕内存闸 ✗）。指针：`tests/test_auto_land.py`。③ ★ **两条反向判据**：内存紧与门禁红时，**落函数被调用 0 次**（先红后绿）—— 钉的是「它真看得见这两种态」，不是「顺便退了个非零码」。指针：`tools/auto_land.py`。"


gaps = "**来路（用户第二件事 + 外部审查点名 + 今晚的四条口答）**：- 用户原话（意译）：*有时候我**同一个对话框**里会运行**不同的项目** ⇒ 需要把**记忆层**弄好：有一个好的方式，**去不干扰，然后又能外包**。*- 外部审查 GLM-5.3 §四 把它列成「与需求不符」：`infra/pool/projects.toml` **自己写着**「已写未接线」。- ★ 用户 2026-10-02 晚的**四条口答**（本笔照它做）：① **暂时就 timeflow 一个**（架子做对、留好新增位置）；② 力度选 **中档**（硬档**不做**）；③ 切换用 **显式一句**（按 cwd 自动判**不做**）；④ `memory` 列表**本卡不动**（用户要等他把「软件工程管理」那个 Skill 纳入之后再定）。**做法（七件，都在 `tools/`）**：① 新增 **`tools/pool/projects.py`**：读 `infra/pool/projects.toml`（`TF_PROJECTS_TOML` 可覆盖；找不到 ⇒ **报错不猜**），并校验索引本身 —— **三条硬判据**：`root` 必须**真实存在** · **两个项目不许同一个 root** · `tree_prefixes` **非空**（空的树前缀 = 哪儿都能派 = 没有守卫）；报错一律**点名**。② **`guards.project_guard(tree_rel, project=None)`**（与同模块另三条同一风格：吃数据、回 `list[str]`）：**没登记过的项目 ⇒ 拒**（存在性即授权）· `tree` 不落在该项目 `tree_prefixes` 里 ⇒ 拒并**点名允许哪些前缀** ·不给 `project` ⇒ 用 `find_by_tree` **反查**，反查不到 ⇒ 拒（「这棵树不属于任何已登记项目」）；★ **主树（`tree_rel == 「」`）= 项目根本身 ⇒ 放行**（越界的定义是「落在树前缀之外」，不是「不是主树」）。③ **租约带 `project`**（`pool/registry.py` 占树时定下来）+ `wb_registry.py` 打印带上它。④ **`wb_dispatch.py`** 前置检查**接上 `project_guard`**（放在**既有树/域/锁守卫之后**）；`--project` 可显式给，不给就反查；★ **没放宽任何既有前置**（内存 / 登录 / 白名单 / 日志 / 树 / 域 / 锁 / `--already-reserved` 一字未动）。⑤ 新增 **`tools/wb_project.py`**：`use <项目>` / `show` / `memory` —— `use` 写`<主工作树>/gates/diag/current-project.json`（**带窗口 id**，**窗口级**）；`show` 没选/没登记 ⇒ **说清并退非 0**；`memory` **照索引**打印该项目的最小记忆入口（**别的项目一份都不读** —— 这就是「避免脏 token」的正解）。⑥ **收批栅栏带 `project`**（`pool/task.py`）：反查得到就写，拿不到就留空并**在 `history` 里记一行**说清为什么；★ **不改任何放行判据**。⑦ 新增 `tests/test_pool_projects.py` + 既有三份测试各补几针（索引坏 / 别的项目的树 / 未登记项目 / 正常树 /**「码道」必须被拒**（索引里只有注释 ⇒ **不许猜路径**）/ 租约里真的写了 `project` / `wb_project memory` 与索引逐字一致）。**验收（工人自验 + 主控复核；全量门禁与审计见 trailer 与提交之后的 audit 段）**：六个受影响测试文件（`test_pool_projects` / `test_pool_guards` / `test_pool_registry` / `test_pool_task` /`test_wb_dispatch` / `test_mem_guard`）**全绿**（139 passed）· `ruff check tools tests` = **All checks passed!**。**★ 老实说（裁定、接缝、以及又一次同一个坑）**：① ★ **工人报「2 条既有测试转红」，我裁定：守卫拒得对、错在夹具** —— 那两条把 `--cwd` 指到**仓外临时目录**，新守卫按「这棵树属于哪个已登记项目」反查 ⇒ **正确地**拒。⇒ 主控给 `sandbox` 夹具补了**沙箱项目索引**（照 `TF_POOL_REGISTRY` 同款把索引也隔离到沙箱）。★ 补的时候踩到一处**非显然**的语义：**「主树」那条反查用的是 `projects.tree_root()`（从模块位置推出来的真实仓库根），不受 `wb.ROOT` monkeypatch 影响**⇒ 只登记「沙箱临时目录」不够，还得有一条 `root` 是**真实仓库根的祖先**的登记 —— 这一条**写进夹具注释**了。② ★★ **本笔又咬到「卡树基点过期」那个坑（卡 135 正是要治它）**：卡 120 的树建在 `ce222db`（**卡 138 落地之前**），而 138 改了 `tools/wb_dispatch.py`（加开关支持）⇒ 拷回来**把开关功能覆盖掉了**（`SwitchFileError` 消失、**3 条开关测试转红**）。⇒ 按老办法把卡 120 的 diff 用 **`git apply -3`** 重新落到**当前**的 `wb_dispatch.py` 上；**一处冲突**（`--model` 的帮助文本 vs 新增 `--project`）⇒ **两边都留**。★ **同一个坑今晚咬了两次**（卡 130 那次 + 这次）⇒ 卡 135 那条「基点过期」的机器判据**优先级该往前提**。③ ★ **我写卡时的第三个同类漏项**：**没把 `tests/test_wb_dispatch.py` 写进白名单** —— 而「改前置检查」必然连带它的若干条用例（今晚第三次：卡 121 漏清单文件、卡 125 漏夹具文件、卡 120 漏这条）。⇒ 该做成一条**写卡规矩**：「**改了哪个文件的前置/清单/工具表，就要把钉住它的测试一起写进域**」。④ **硬档（一个窗口一活跃项目）不做** · **按 cwd 自动判不做** · **`memory` 列表本卡不动**（用户要等 Skill 纳入后再定）。⑤ **MCP 写面的 `pool_dispatch` 干跑没接 project 守卫**（`tools/pool_mcp.py` 不在白名单）：真派活走`--already-reserved`（守卫段本就跳过），另有 `registry.reserve` 会写 `project`；★ **如实记**，该另开小卡。⑥ 本笔**不改**「收口只有主控」的分工；★ 另：**这是 `tools/wb_land.py` 的第一次真机收口**（转发壳 → 新工具），而它**第一次就把我拦住了**（我只写了代码、忘了写 `_text_TG232.md` ⇒ 它 3 秒就停手，**没白跑 12 分钟门禁**）。**★ 本笔另含**：`docs/workbacklog.toml` 把卡 120 标 `done`；卡 140/141 的规格随本笔进 git。"


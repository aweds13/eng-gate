gaps = "本笔落卡 189（独立检查实验：拿 `T-G249` 真跑一次，不同族模型 · 只读审计）。★ 诚实缺口六条。① ★★ **报告里那句「行号在 HEAD 同样有效」现在已经过期**：它写的是「已核对这四个文件自 `1005569` 到**当前 HEAD（`41eae72`）**零改动」。★ 但**今晚之后就变了** —— 提交 `7ff3b9f`（卡 160 那一笔）改了 `tools/wb_dispatch.py`（新增 `STARTUP_GRACE_SECONDS` 一段 + 内存闸默认值 4.0→2.0）与 `tests/test_wb_dispatch.py` ⇒ **这两份文件里，`41eae72` 之后的行号整体下移**。⇒ ★ **报告里所有 `1005569:路径:行` 的指针仍然有效，但只对 `1005569` 有效**（报告自己写了复现办法：`git show 1005569:路径 | sed -n '行p'`）；**拿它在 HEAD 上对号会错位**。★ 本笔**不改报告正文**（审计报告的读数不该被后手改），把这条写进这里备查。② ★ **这是审计、不是闸**：按本仓 §25.1，对抗复核**在提交之后、异步、不挡收口** ⇒ 它发现的问题**开跟进卡**，不是章。本笔的产出就是那份报告本身；发现的 5 条已由**卡 190**（`T-G290`，本晚已注册并派出）承接。③ ★ **第一次真跑是失败的，真因是措辞**：第一版从**码道池**（`huaweicloud-maas/GLM-5.2`）派出 ⇒ **服务端拒答**（`InferHub.ModelArts.81011.403`「抱歉，我无法提供关于您提问内容的建议…」），37 秒就死、jsonl 7 分钟没长。⇒ 改**工程语言** + 换 CodeBuddy 侧 `glm-5.3-flash`（相对实现者 `deepseek-v4.1-flash` **不同族**）重派 ⇒ 成功。★ 细节留档在 `gates/diag/_HOLD.md`（含「`exit_code: 0` 会骗人」那条）。④ ★★ **「不同族」这件事本身是这条流水线的第一次真跑**：`tools/wb_advcard.py`（卡 143 的产物：对抗开场白 + 指针索引生成器）**建了却零接线**，本卡是它第一次被真用。⇒ **它现在仍然没有自动化接线**（还是主控手工把它接到派活上）。⑤ ★ **报告的全部输入是「一次真跑」**：7 条发现里 4 条是「看着查过了其实没查」这一类 —— 这个比例本身**样本量为 1**，不能当成「我们系统的假绿率」。★ 如实记。⑥ ★ **报告引用的 `gates/diag/batch/1005569.advcard.md` 在 gitignore 目录里**（`gates/diag/*`）⇒ 它不随树分发，别处看不到那份开场白原文；报告里对它的引用只能作为**当时的现场**读。"


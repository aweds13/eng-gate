gaps = "1. 「账号别名与 seat 合并不适用」这条结论的证据是**否定式**的：grep 零命中 + 路径表恰好四键，能证明今天没有这套东西，但证明不了「以后也不该有」—— 哪天有人真要做账号合并，这张卡的钉子只会红，不会告诉他该怎么判。指针 tests/test_pool_no_seat_merge.py2. 判据只读仓外账本的一份快照（5 个账号、全部没有 window 段）；账本形状一变（加了 window）这条就红，但红色说的是「账本变了」而不是「合并该做了」。指针 tools/pool_accounts.py3. 这一张卡的产品码零改动，是**纯钉子卡**：它不减少任何风险，只把「没有合并」这件事变成会被测出来的事实。指针 tests/test_pool_no_seat_merge.py"


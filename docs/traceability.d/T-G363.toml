gaps = "① ★ 三行改成**快捷入口**：默认**开真实页面**（`ctx.sidebarRight.openTab(「browser」, { params: { url } })`），目标页分别是 `tools/wb_dash.py` 的 `127.0.0.1:8787` / `tools/serve.py` 的 `127.0.0.1:8520` / 禅道 `127.0.0.1/zentao/`；**座位 key 一个没改**（改名会毁掉已落地的判据与左栏约定）。指针：`tools/dsh_panel.py`。② ★ 目标页**没起**时面板必须显式写「没起 + 怎么起」（工作台 `tools/wb_dash.py`；timeflow `tools/stack.py start timeflow`；禅道点 ZenPanel），**不许白屏、不许假装打开了**；`openTab` 失败（无会话在屏 / Web 形态不注册浏览器页）也一律 **catch 住如实报错**。指针：`tools/dsh_panel.py`。③ ★ 图标改成**内联 SVG**（16px、`currentColor`），并配**反例判据**：源码里再出现 `▦` 这类文字符号 ⇒ 判据必红。指针：`tests/test_dsh_panel.py`。④ ★ 包形态补成官方那种：生成物的清单文件里 清单里的 `dsh` 字段含 `bundle`（指向包内那份补丁层）与 `client` 两段，并**在包内产出一份补丁层文件**（与清单同目录，`dsh plugin add` 才会把它当 profile 层）。指针：`tools/dsh_panel.py`。"


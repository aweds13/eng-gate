gaps = "① ★ 主控先跑 `ruff` ⇒ **3 个超长行**（工人自报「报一条」，实际三条）—— 已修。★ **码道没有门禁那一步**，这类事全靠主控接手时补。② ★ **「先红后绿」是自报，我只验了一条**：对 **F1 模型那一半**做了受控突变检验（拿掉 `--model` 透传 ⇒ 那条钉子当场红、还原 ⇒ 绿）；其余 6 条的「先红」**没有逐条重做**。③ ★ **F2 只做到一半**：真 CLI 工人那一半（真号 + 真登录）**单测不可达** ⇒ 落地后主控真派一发去补这半的现场读数。④ ★ **判据修好 ≠ 额度回来**：两个 flash 桶仍 429 ⇒ 用它们派活**仍会被拒**，那是**真的不可用**（判定对象对了，红灯才有意义）。"


gaps = "- **`run_gates.py` 今天没有 `--only`**：`--help` 实测只有 `--profile/--profiles/--fast/--affected/--changed-from`，而 `--affected` 是按路径选门不是按门名 ⇒ 「只重跑红了那一道」这件事本卡才补，见 `scripts/run_gates.py` 的 `parse_args()`。\n- **19 道门的耗时是抽样值**：文档里每条耗时都要标来自哪份日志（`gates/last.json` / `gates/diag/*.log`），本卡不许写没出处的数字，见 `docs/subsystems/ci/测试流程.md`。\n- **夜间全量还没有排程**：`tools/wb_nightly.py` 是 E36 的设计，尚未落地；本卡只能在文档里把它写成「未落地」并指回 E36，见 `复盘/卡/卡E36-台账驱动选测.md`。\n- **「半趟不许当全量」需要工具判据**：`--only` 产生的 `last.json` 必须让 `wb_verify` 判红，这条与 A327 的 `profiles_run` 口径要并在一起看，见 `tools/wb_verify.py`。 ★ 2026-10-25 用户裁定：本卡并入 **E52**（落地链主干合一）—— 与 E42/E11 同改 `scripts/run_gates.py` / `tools/wb_land.py`。判据逐字保留在 `复盘/卡/卡E52-落地链主干合一.md`。"

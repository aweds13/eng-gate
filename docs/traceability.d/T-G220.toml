gaps = "**来路（用户 2026-10-02 两条要求，原话意译）**：① *「明确我们的那个需求，就是对这个外挂工具的整体架构设计和需求，然后呢，把你先发出来给我」*；② *「把检查这个外包工具基础设施的任务…分为两个部分：一个就是**给 deepseek V4.1 Flash**让它读相关的文档、**你踩过坑的那些文档**，输出**不要重新写浪费 Token**，而是输出**类似于索引或者是更好的总结机制**；然后把这些东西**再喂给 GLM5.3**（★ 我这次要求的是 GLM5.3 **不是 Flash**）…专门做这次的整个外包工具的**框架设计、代码实现之类的整体审查**」*（并说 *「你可以把它列到白名单，但是**我希望是一次性的调用**」*）。**小收尾在前**：卡 122（`T-G219`）已**单独一笔**落地（`c3e760f`：撤 `task.py` 的文件级 `E501` 豁免 + 拆 17 条中文长行 +架构审议 §九 更正），本笔不含它。**做法（四级，全部可复算）**：① **主控**写需求与架构定稿 `复盘/外包工具-需求与架构.md`（需求五条原始诉求→落地物 / 五角色 / 八条铁律 / 三层架构 / 组件清单 / 五条数据流 / 栅栏状态机 / 三号池 /接口契约 / 判据归口 / 诚实边界 / 未决 / **按需取读的索引**）；② **只读卡 123**（工人 = `deepseek-v4.1-flash`）产出`复盘/外包审查-索引.md` —— ★ **只要指针、不要原文**：90 行 / **49 条指针**（A 需求 8 · B 坑与攻击面 11 ·C 代码要害 15 · D 判据与测试 8 · E 真源数字 7）+ **审查者路线 8 条**（每条写「要判什么」）+ 已知边界 10 条；工人**逐条 `grep -n` 现核**并**自己改掉 1 处错指针**（把函数名当成了文件名）；③ **卡 124**（★ **GLM-5.3**，一次性）按索引的路线做**对抗性审查** → `复盘/外包工具-整体审查-GLM5.3.md`（103 行 / **12 条发现** /**5 条判据漏洞** / 只做三件事的排序建议），它读了 22 份文件（含 `tools/pool/task.py` 1115 行全文）、工具调用 40 次、0 报错，并**用只读探针实测复现**了其中一条（`advance` 能复活 `landed` / 抹掉 `timeout`）；④ **主控补 §8 逐条处置表**（认 / 不认 + 开卡 A~H）。**★ 收批机制第一次真跑（这是本笔另一件大事）**：任务 `B-ARCH1` 预声明 4 张卡（文档层 3 + 门禁层 1，跨层），各卡交**成送申请** —— ★ **最后两张是工人自己交的**（Flash 与 GLM-5.3 各自**在原会话窗口**跑 `wb_task.py claim`），**集齐 4/4 当场**由最后一名投递者把状态推过栅栏（`collecting → awaiting-commit`，**无轮询、无守候进程**），机器按**层**生成三段文书骨架。**白名单**：`glm-5.3` 以**一次性授权**接入 —— 新增`ONE_OFF_MODELS` / `ALLOWED_MODELS` 供**闸门**查，而 `MODEL_WHITELIST` 与 `next_whitelist_model()` 的**429 轮换链一个字没动**（加名字 ≠ 改轮换口径），并补一条钉子`test_one_off_model_is_allowed_but_stays_out_of_the_rotation` 把两者**钉开**（含反证）。**验收（主控逐条复核过）**：`ruff check tools/wb_dispatch.py tests/test_wb_dispatch.py` = **All checks passed!** ·`pytest tests/test_wb_dispatch.py` = **129 passed** · 全量门禁 **1848 passed**（seal 后提交）·`audit_progress` **通过 · 豁免 0** · 任务 `B-ARCH1` 4/4（`landed`）。**★ 老实说（边界与偏差，别把处置表当修好）**：① ★★ **坑 41 第二次咬人**：我登记了卡 122 的队列条目却**没在门禁之前** `git add` 卡规格 ⇒ `tests/test_card_specs_tracked.py` 门禁**红**、白跑 9 分钟；★ **该修的不是我的手，是工具** —— `_integrate.py` 花 9 分钟跑门禁**之前**应当先跑那条钉子（**fail fast**，已记进开卡 H）。② **GLM 报告 §六 的自我怀疑：结论不认、事实认** —— 它看的是卡树（base `ca64283`，那里`MODEL_WHITELIST` 没有 `glm-5.3`），于是推断「本卡走了不经闸门的路」；**真相**是**派活器读主树那份**，本笔已在主树加了一次性授权，闸门**是过了的**。★ 但它顺带指出的事实**成立**：白名单是**派活器级**的，**绕过派活器直接起 CLI 就没有闸** ⇒ 已写进 §5 边界（「一切入口都过闸」这句话此前**说大了**）。③ **卡 123 / 124 规格里写的 `T-G221` / `T-G222` 是预排号**：本批走收批、**一笔提交只有一个台账号** ⇒本笔是 `T-G220`，那两个号**没有**独立台账条目（已在 §8 里写明，免得后人 grep 不到）。④ **处置表 ≠ 修好**：12 条 + 5 条漏洞里**只有 2.4 真修了**（而且修在 **scratch** 工具 `gates/diag/_integrate.py` 里、**不进 git** ——收口工具进 git 时必须**连这个修正一起搬**，验证边界=只 `py_compile` + 读回，没真跑 `--no-gate`）；其余各条一律**只承认 + 开卡 + 排序**。⑤ **收批的 4 张卡里有 2 张的申请是「收工后补交」的**：卡规格当初**没写**「交成送申请」这一步，我是用「**在原会话窗口发一条新消息**」的姿势让它们补的（§20.3 的姿势）——★ 这是**卡规格模板的漏项**（以后写卡必须带「交申请」那一步），已记进开卡 H。**★ 本笔另含**：`infra` 仓（`f69ed38`，仓库外、无门禁）在 `pool/README.md` 里加了一行**指针**指向本仓的唯一权威副本 `复盘/外包工具-需求与架构.md`（★ 只指路、不复述，免生第二份真源）。"


gaps = "- 判据 1 说「新态字符串定为判不了」并让 jobs.py 末支分岔 —— 实现上 `_state_of_log` 的 `backlog_error` 也被做成 keyword-only（卡规格只写了 `scan_jobs` 的签名），因为它是同一条数据流的下一跳；两个函数都不传该参时一个字节不变。指针 `tools/pool/jobs.py`- 判据 3 要求正文不再出现 tools/wb_status.py 那串借来的命令：我删了 data 的 `command` / `exit_code` 两键、换成 `rendered_by`，但**没有**动 `read_log_lines` 与 `render_timeline` 的既有输出形状（正文主体逐字不变，只有首行那句来源改了）。指针 `tools/pool_mcp.py`- 判据 7 只允许给 tests/test_pool_mcp.py:365-390 补一份可读台账 fixture —— 我只加了 `_e116_backlog` 造的那份（至少一张卡），三条断言原文一个字没动；副作用是那条钉子的 `counts` 恒等式仍成立（判不了这一态只在台账读不到时出现）。指针 `tests/test_pool_mcp.py`"


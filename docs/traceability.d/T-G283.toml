gaps = "① ★ **本笔混了一笔「主控文档笔」**：符号级接线（`tools/pool/guards.py`）+ §17 增补（压缩文书口径）+ 两份卡规格追加。⇒ 一笔提交里两类东西，**审阅时要分清哪个是卡 183 的产物**。指针：`复盘/外包-卡表与规矩.md` §17。② ★ **判据工具与判据口径仍不同步**：§17 写了「文书 ≤60 行 / 每条 gap 带指针」，而**能咬它的工具（卡 164 的 `tools/card_doc_budget.py`）没接线**（它自己写明「接进 `stage_card._selfcheck` 是后续卡的事」）⇒ 本笔的文书是**人守纪律**写出来的，不是机器逼出来的。指针：卡 164 规格第 4 条。③ ★ **183 的索引是派生物**：`复盘/文档索引.toml` 由 `tools/wb_docmap.py` 生成，`--check` 当晚报 460 处差异（那是索引对当前文档树的正常读数）⇒ **它不是「手写数据」**，别照它手工改。指针：`tools/wb_docmap.py`。④ ★ **「安全批 / 危险批」只是方案**：本笔只交清单与判据，**没有搬动任何文档**（用户口径：大搬家不可逆，台账按路径钉死 271 条）。⇒ 真整理要另一张卡。指针：`复盘/文档重整方案.md`。"


gaps = "- **缺陷今天是「静默」不是「红」**：`input_hash()` 在 3.12 上把 `src/**` 展开成空集 ⇒ 门输入哈希恒为 `sha256(\"\")`，`skip_reused()` 会心安理得复用上一次的绿，见 `scripts/run_gates.py`。\n- **版本语义已被实测钉死**：本机 Python 3.14.6 的 `Path.glob('src/**')` 含文件，云机 3.12.8 只含目录 —— 见 `复盘/卡/卡E44-复用哈希随解释器版本变.md` 的复现表。\n- **假门依赖 PATH 上的 `sleep`**：裸 Windows（云机）造不出假门，4 条红；要改 `sys.executable -c`，见 `tests/test_run_gates_timeout.py`。\n- **本卡还没开工**：`.wt/E44` 未建、解释器版本线未钉进 `scripts/cloud/bootstrap.ps1`，见 `scripts/cloud/bootstrap.ps1`。"

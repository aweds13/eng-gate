gaps = "① ★★ **现象（机制自己制造的假账）**：`B-20261017`/`B-20261018`/`B-20261026` 三笔被标 landed ✗，而 225 的活**不在主仓** ✗；推栅栏的原话引的是 **236** 的提交号 ✗ ⇒ ⑨ 按「成员都交了申请」就盖章、**没核验产物真在那笔提交里**。指针：`tools/pool/landing.py`。② ★ **改法**：盖章前取 `[[member]].paths ∩ git show --name-only <sha>` ⇒ **空就拒盖章并点名** ✗；声明域为空 ⇒ 如实说「无法核验」、**不盖章**（宁缺勿假 ✓）。指针：`tools/pool/landing.py`。③ ★ **反向判据（本卡核心）**：一笔**不带**某成员产物的提交 ⇒ ⑨ **不许**把它标 landed（断言盖章函数被调用 **0 次** + 点名里有那个成员）；产物真在 ⇒ 照旧盖章（既有行为不变 ✓）。指针：`tests/test_wb_land.py`。"


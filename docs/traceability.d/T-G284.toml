gaps = "① ★★ **增量门禁的「省」是有条件的**：它只改「跑哪几道」，**不改任何门判据**；碰 `tools/**` / `scripts/**` / `gates/**` 的任意文件、空计划、每日首趟 ⇒ **强制全量**。⇒ 本笔**不许**被读成「门变松了」。指针：`tools/pool/landing.py` 的 `JUDGE_BODY_GLOBS`。② ★★ **本卡是「跨两个池 + 被额度掐断 + 换池续跑」的产物**：CodeBuddy 那轮跑 34 分钟后 429 停下（留了 WIP 提交 `38f630b`），码道接着补完方案文档与跑法字段。⇒ **它的证据链横跨两个池**，本笔只有「最后那段」的读数。指针：`gates/diag/_HOLD.md` 的额度一节。③ ★ **增量那条路的「如实披露」落在 trailer 字面**：全量分支的字面「全量门禁绿 + seal」**一字未动**（卡 133 的钉子钉着它），增量分支用**不同**字面（含「非全量」）⇒ 判据靠**字面**，不靠结构。指针：`tests/test_wb_land.py`。④ ★ **本卡的方案文档是我从收集树恢复的**：它的卡树在还原成工作区改动时被 `git clean` 误删过该文件，从 `.wt/sweep2` 拷回（同一份逐字节）。指针：`复盘/收口-增量门禁.md`。"


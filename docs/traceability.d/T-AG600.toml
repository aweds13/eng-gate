gaps = "- `tools/gate_pool.py:733-740` 的 `_gate_env()` **无条件**要 `TF_PROJECTS_TOML`（空就抛 `CloudUnreachable`），而只有 engineering 声明了这个键 —— 第二个仓走落地链派活时会被一条自己 profile 没要求的守卫挡死（本轮已实测，未修：属落地链，不在本卡域）。- 骨架 5 处裸 `$P_XXX`（历史写法）在 `--render` 产物里不被替换，但真跑靠 dump 循环赋值，行为无差；本轮已把 `scripts/cloud/run_gate.sh` 里这 5 处统一成 `${P_XXX}`（独立复核 D5），渲染产物仍不是「可直接执行的脚本」（引号嵌套 D6，见 `scripts/cloud/profile.py` 的 `_PSLOT`）。- 播种源目录 `gates/diag/seed-<卡>` 仍由人/上一趟留好，骨架不生成 —— 换仓时得自己造一份绿的，否则 2/5 退 4（行为正确，但接入方要知道；工程侧口径见 `docs/subsystems/ci/云门禁机.md` 的 §3.2 与 `scripts/cloud/run_gate.sh` 的 2/5 段）。"


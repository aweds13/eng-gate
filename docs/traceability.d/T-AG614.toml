gaps = "1. 「用户关掉了模型」与「这个号池批没批这个模型」仍靠两张表（禁用表与号池批准集），本卡只让三处入口都**问**前一张，没做任何一致性校验：两张表互相矛盾时（禁用表放行、批准集没有）verdict 由入口各自决定，没有一份「合并口径」。指针 `tools/pool/model_registry.py`2. 网关的 403 只覆盖 `_model_block` 这一层：`route_once` 里换号 / 收窄 / RPM 那些分支回的是 403 或 404，与本卡的禁用 403 混在同一条退出路径上，网关留痕（`tools/pool/route_log.py` 写的 `wb-route.jsonl`）只有一个 status 字段，事后分不出「被禁」还是「收窄掉」—— 要分得清得给留痕加一个 reason 维度。指针 `tools/pool/gateway.py`3. MCP 干跑面的禁用判据写在 `tool_pool_dispatch` 里，`pool_cancel` / `task_claim` 等另外四个写工具没问过禁用表；它们不派活（只取消/交成），但「三处入口共用一份判据」这句话在 MCP 面只对了一半。指针 `tools/pool_mcp.py`"


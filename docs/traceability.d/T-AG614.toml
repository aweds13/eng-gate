  "text:tools/wb_dispatch.py::assert_not_disabled(pool, args.model)",
  "test:test_pool_disabled_wiring.py::test_every_production_entry_asks_the_same_judge",
  "test:test_pool_disabled_wiring.py::test_gateway_forwards_the_status_code_not_a_fixed_404",
  "test:test_pool_disabled_wiring.py::test_gateway_keeps_the_four_old_blocks_at_404",
  "test:test_pool_disabled_wiring.py::test_docs_stop_claiming_zero_production_callers",
  "test:test_wb_dispatch.py::test_disabled_model_is_refused_with_zero_side_effects",
  "test:test_pool_gateway.py::test_disabled_model_is_403_not_404",

[entries."T-AG614"]
id = "T-AG614"
title = "禁用表接进三处派活入口：网关禁用回403、MCP干跑面先问、判据只有一份"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/wb_dispatch.py",
  "file:tools/pool/gateway.py",
  "file:tools/pool_mcp.py",
  "file:tools/pool/model_registry.py",
  "file:tests/test_pool_disabled_wiring.py",

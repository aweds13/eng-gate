gaps = "**来路**：GLM-5.3 的整体审查（`复盘/外包工具-整体审查-GLM5.3.md`）报了 12 条 + 5 条判据漏洞，主控在`复盘/外包工具-需求与架构.md` §8 逐条给了处置并排了 A~H 八张卡。**本笔是第一批**，治的是审查里「**接线与真源收敛**」那一类（它的排序建议第 1、2 条 + 两条轻的）。★ **只修，不喊口号** —— 每一条都配反例钉子。**做法（任务 `B-FIX1` 收批，3 张卡跨三层，各在自己的树里干，收口时主控按文件复制进主树）**：① **卡 125**（`.wt/dispguard`，运维层，治 **2.1** 与 **2.9**）：把 **2.1** 指出的缺口堵上 ——`wb_dispatch.py` 此前**全文 0 处** import guards/registry（外部审查用 `grep` 给出的硬证据），于是不变量 ①②③⑤ 在**唯一每天真的在跑的那条入口**上全部失效、且别的窗口看不见这个活。现在：前置检查接 `guards.tree_guard / domain_guard / lock_guard`（**域从队列真读、查不到就拒** ——不许猜空域）、`registry.read_lock_body()` 取锁原文、真派活前 `registry.reserve(...)`、**任何退出路径都还树**（`atexit` 兜底，照卡 118 给门禁锁那套）、**dry-run 不占树**、`--detach` 由**跑工人的那个脱离子进程**占/还；顺带把 `--max-turns` 的**帮助文本与常量同源**（原来写 150/60、常量是 240/80）。★ **这张卡当场咬出跨卡接缝**：(a) `pool_mcp` 先 `registry.reserve` 再调 `wb_dispatch --detach` ⇒ 父进程的 `tree_guard` 看见**MCP 自己那条租约**⇒ 拒派、MCP 回滚 ⇒ 新增 **`--already-reserved`**（**只**跳过守卫与占/还树，其余前置照走），`pool_mcp` 派活命令行带上它；(b) `tests/test_mem_guard.py` 的两条内存闸用例被新守卫**连坐**（沙箱没有队列）⇒ **修夹具喂输入**（写最小队列 +隔离登记 + 桩掉取锁），**判据一个字没松**。② **卡 126**（`.wt/docorder`，文档层，治 **2.8 / 老坑 32**）：`tools/sync_docs.py` 的 changelog 合并从「新片段一律**接在文件头**」改成**按日期插入** —— 新的在上、旧的在下；**同日插到已有同日节之下**（同日次序不被搅乱）；**只插入、绝不改写既有字节**。原因就是外部审查说的：并行落地时`resolve_derived_conflicts` 取基线版再 `sync_docs` 重汇总 ⇒ 老日期片段被插到新日期上面，**坑 32 从「人手工才撞」变成「每次并行都自动重演」**。另给 `--check` 加 changelog **次序判据**（倒置 ⇒ `[WARN]` 并**点名相邻两节**）。★ **不做成硬拒绝**：真仓 `docs/changelog.md` **本来就有一处历史倒置**（见下「老实说」），硬拒绝会打穿**白名单之外**的既有断言（`tests/test_docs_fragments.py::test_real_repo_is_in_sync_and_merge_is_noop`），属于「越权改别人的东西」。③ **卡 127**（`.wt/plancard`，门禁层，治 **2.2b / 2.11**）：队列检查器 `pool.plan.validate` 新增**禁通配**判据 ——`files` 里出现 `* ? [` 即拒并**点名卡号与条目**（理由：`files_intersect` 是**精确匹配**，写通配的卡与**任何**路径都不相交⇒ **静默绕过冲突域检查**）；`find_spec` 去掉 `*<号>*` 的乱兜、改成**边界精确**匹配 ⇒ 卡号 `12` **不再**命中`卡112-*.md` / `卡120-*.md`（外部审查标为「潜伏」的那条）。**验收（工人自验 + 主控逐条复核；本笔的收口门禁与审计读数见 trailer / 提交之后的 audit 段）**：- 卡 125：`pytest tests/test_wb_dispatch.py tests/test_mem_guard.py` = **152 passed** ·`pytest tests/test_pool_mcp.py tests/test_pool_mcp_write.py tests/test_pool_mcp_task.py` = **49 passed** ·`ruff check tools tests` = **All checks passed!** · ★ 新钉子的**两次真读数**（同一条「卡 999 占着主树」的活租约）：**不带**开关 ⇒ `树被占：（主树） 上已有活租约（卡 999…）` + `rc=2`；**带上** ⇒ `守卫已跳过（--already-reserved…）` + `rc=0` ·★ **突变检验**：把两处都改成无视 `--already-reserved` ⇒ 两条新钉子**当场红**，已还原（`md5` 一致）。- 卡 126：新钉子**先红后绿**（未改实现时 `5 failed, 5 passed`；改完 `10 passed`），其中钉子①正是坑 32 现场（`assert 36 < 0`：10-01 被插到 10-03 上面）· `sync_docs.py --check` 在**真仓** `exit=0` ·既有 `tests/test_docs_fragments.py` = **8 passed**（没被打穿）。- 卡 127：四条钉子（通配被拒并点名 / 全精确通过 / `12` 不命中 `112`·`120` / 存在的卡号仍精确找到）·真仓 `wb_plan.py validate` 与 `plan` **仍全绿**。**★ 老实说（偏差与没做的，别当全清了）**：① ★★ **M-1 的成送申请被栅栏拒过两次，两次都是主控的错**：第一次是**我把 M-1 的域写窄了**（没料到接线会连带 `pool_mcp` 与 `test_mem_guard`）⇒ 我**显式**改了预声明（`B-FIX1.toml` 里 M-1 的 `paths` 2→5 个文件）；第二次是我**改预声明时手滑**：在 TOML 的基本串里写了 ASCII 双引号 ⇒ `TOMLDecodeError`，claim 在**读预声明**那一步就崩。★ **那正是本仓 §8.1 早就记过的坑**（TOML 里写 ASCII 双引号 ⇒ 整份解析不了；中文正文一律用「」）—— **我明知故犯了一次**，已改。★ 两次都是**工人处置得对**：它**拒绝自己放宽自己的域**（说那正是审查 三.1 那条「自报清单」的洞），第二次它**只读定位**到坏在哪一行、**一行没动**。这两次偏差本身就证明域检查在咬。② **卡 126 报出一条真缺陷残留**：真仓 `docs/changelog.md` 第 13 节 `## 2026-10-01` 压在 `## 2026-10-02` 之上（**坑 32 的历史残留**）。本笔**只让它现形**（`--check` 打 `[WARN]` 并点名两节），**没修** —— 改共享文档正文属另一张卡（本批三张卡的域里都没有它）。③ **卡 127 的 `tools/wb_plan.py` 一行没改**（域里列了它，但 `find_spec` 的唯一调用点 `wb_brief.py:378` 是直接从`pool.plan` 导入 ⇒ 自动吃到新行为，**无谓改动不做**）。送申请里 `--files` 按**实际碰过的**报（两文件），如实记。④ **卡 125 的 `--detach` 占/还树**是**读代码得出的路径**，没在真机跑一次 `--detach --execute`（真跑要真工人）——`--already-reserved` 那条路径有 dry-run 读数与 unit 钉子，但**脱离进程真的还树**这一条**没验**。⑤ 本笔是**收批**：三张卡各在自己的树里干活，收口时由**主控按文件复制**进主树再一笔提交（本仓口径：**收口是按文件复制、不是分支合并**）。★ 因此提交里的 9 个文件**不是一棵树的 diff**，而是三棵树各自域内改动的并集 —— 这一点写在这里备查。**★ 本笔另含**：三张卡的规格（`复盘/卡/卡125…` 等）随本笔进 git。"


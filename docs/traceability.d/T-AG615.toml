gaps = "1. `pool` 参数还差最后一格：`registry.reserve(pool=…)` 与 `account_guard(pool=…)` 收的是 `arguments` 原值（空串就是空串），而模型闸收的是「空串⇒默认池」。今天两条路都等于默认池，但账本里「没点名」与「点名默认池」两种写法会并存 —— 要合并得给 `Registry.reserve` 定一条正规化口径。指针 `tools/pool_mcp.py`2. 拒单文案仍由 `wb_dispatch.model_rejected` 一份写死（含允许集与「默认拒绝」口径），MCP 只负责原样带回；也就是说**文案形状**没有钉子，只有「非空且点名模型」这一条。要让「拒单理由长什么样」也受保护，得把它提到一个共用常量里。指针 `tools/pool_mcp.py`3. `switch_open_models` / `effective_allowed_models` 读的是仓外开关文件（`TF_MODEL_SWITCHES` 指向的那份），坏 TOML 现在被接住并拒单，但**没有钉子**证明「坏文件时 CLI 与 MCP 都拒」—— 本卡只钉住 MCP 这一侧不崩。指针 `tests/test_pool_disabled_wiring.py` + `tools/pool/models.py`"


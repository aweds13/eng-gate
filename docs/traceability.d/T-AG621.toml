gaps = "1. probe_hint 里那句「探完四态未必变」是**人写的一句话**，不是从代码推的：哪天 record_probe_result 真的开始写额度状态文件，这句话会继续这么说而没有任何东西会红。指针 `tools/pool_quota.py`2. `can_dispatch=None` 只是把「不知道」说清楚，派活链**没有**任何地方读它（生产消费者仍只有 MCP payload 与 CLI 人话段）；分派侧仍走 wb_dispatch.quota_error 与 pool.route.reset_for，两张面的判词今天还没对齐 —— 属另一张卡。指针 `tools/pool_mcp.py`3. 三态那条命令是拼字符串拼出来的（PROBE_SCRIPT + probe），没有一处校验 `tools/pool_accounts.py` 真的还认 probe 子命令：子命令哪天改名，两处会同时漂而门禁不会红。指针 `tools/pool_quota.py`"


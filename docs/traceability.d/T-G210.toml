id = "T-G210"
title = "pool_cancel 的证据别是乱码：taskkill 输出按系统区域编码解"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool_mcp.py",
  "file:tests/test_pool_mcp_write.py",
]
gaps = "**来路**：卡 111（T-G208）把 MCP 写面（`pool_dispatch` / `pool_cancel`）接上之后，**它只做了桩验**（卡里也禁止未提交即派活）—— 主控补做了它没做的那半：**真机 cancel 演练**（`gates/diag/_drill_cancel.py`，**零花费**：靶子是主控自己起的 `python -c sleep` 与 `ping`）。**演练结果**：功能**全对** —— 真靶子（`python.exe`，pid 19788）→ 登记租约 → 补 pid → `pool_cancel` 核对映像名 → 真杀 → 写 `wb-999.cancel.txt` → 放租约（`killed:true / released:true`、`tasklist` 复查「没有匹配任务」、活租约清空）；**反例**（靶子映像名 `PING.EXE`）**拒绝动手** + 印出人工命令、靶子**还活着**、租约**没动**。**但写出来的「证据」是乱码**：`结果：taskkill /F /T /PID 19788 | �ɹ�: ����ֹ PID 19788 (���� PID 22396 �ӽ���)�Ľ��̡�`。**根因**：`tools/pool_mcp.py::_kill`（与 `_image_name`）把 `taskkill` 的输出按 **UTF-8** 解，而它吐的是**系统区域编码**（这台 cp936）—— **T-G96 已经踩过、`tools/wb_dispatch.py::kill_tree` 已经修过**的同一条坑，新代码重犯。★ 教训一句话：**证据文件本身读不出来，等于没留证据**。**做法（只动「解码」这一处，别处一字不改）**：新增模块级 `_console_encoding()`（`locale.getencoding()` → 没有该属性退 `locale.getpreferredencoding(False)` → 再退 `「utf-8」`），`_image_name()` 与 `_kill()` 两处 `encoding=「utf-8」` 改用它，`errors=「replace」` **保持不变**；注释里点明**为什么不能用 `getpreferredencoding(False)`**（本仓一律 `python -X utf8` ⇒ 它会回 `utf-8`，等于没修 —— T-G96 的原话）与**出处**（`wb_dispatch.py::kill_tree`）。**验收（工人自报，主控逐条核）**：① 两条钉子 —— **结构性**（桩住 `pool_mcp.subprocess.run`，断言 `_image_name` / `_kill` 传下去的 `encoding` **动态等于** `locale.getencoding()` = cp936、`errors` 仍是 `「replace」`）+ **行为性**（桩按调用方给的 encoding 解 cp936 字节 ⇒ `_kill` 回话**无 `\\ufffd`** 且含「成功/已终止」；坏字节 `b「\\xff\\xfe\\xff」` ⇒ 只 `replace`、**不许抛**）；② `pytest tests/test_pool_mcp_write.py tests/test_pool_mcp.py --no-cov` → **34 passed**；`ruff check src tests scripts tools examples harness` → `All checks passed!`；③ **红/绿机理对照**：同一句 cp936 字节 `utf-8 解 → �ɹ�: …`（与卡里贴的乱码**逐字一致**）、`cp936 解 → 成功: 已终止 …`（人话）；④ ★ **真机演练复跑**（工人复跑主控那支脚本）：`.cancel.txt` 那句已是**人话** —— `结果：taskkill /F /T /PID 33080 | 成功: 已终止 PID 33080 (属于 PID 40380 子进程)的进程。`，反例仍**拒绝动手**、靶子还活着、租约还在。**★ 工人如实报的三条（主控裁定）**：① `gates/diag/_drill_cancel.py` **不在卡树里**（它在主仓 `gates/diag/`、未跟踪），且**硬编码主仓 ROOT + `sys.path.insert(0, 主仓/tools)`** ⇒ 在卡树里直跑，测的是**主仓那份未修的** `pool_mcp`；工人用「先把工作树的 `pool_mcp` / `pool.registry` 预 import 进 `sys.modules`、再 `exec` 该脚本（**脚本一个字没动**）」的办法让演练命中本卡修复，并在输出首行自证 wrapper 生效（`_console_encoding() = cp936`）⇒ **主控接受**，并**当场**修掉**我脚本的缺陷**：`_drill_cancel.py` 现在支持 `--tree`（不给 = 主仓；给了就从那棵树 import 代码、把证据也落在那棵树的 `gates/diag/`）；② 演练把 `wb-999.cancel.txt` 落在**主仓** `gates/diag/`（gitignore scratch）⇒ **接受**；③ §6：`_drill_cancel.py` 自己「tasklist 复查」那行也是 `encoding=「utf-8」` 直读 ⇒ **仍乱码**（**主控 scratch = 我的活**，已记待修）；`pool_mcp.py` 的 `_run` / `_spawn_worker` 同样 utf-8 直读，但它们消费的是 `wb_dispatch` / `gate_lock.py` 的 **UTF-8 stdout**（那两支都以 `-X utf8` 跑）⇒ 现状成立，**不属本卡**，将来真有工具吐区域编码再开卡。"


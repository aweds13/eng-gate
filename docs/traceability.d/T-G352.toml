[entries."T-G352"]
id = "T-G352"
title = "收口器按批跳：一笔不能自动决定，不许堵住别的（+ 236/237 登记）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/auto_land.py",
  "file:tests/test_auto_land.py",
]
gaps = "① ★ **现象**：`tools/auto_land.py` 遇到**一批**不能自动决定的（`B-20261017` 要动 3 棵树）⇒ 它选 **「什么都不落」** ✗ ⇒ 把本来能落的 `B-20261018`（228）也堵死 ⇒ 收口器每 5 分钟报同一句、**一笔都落不了** ✗。指针：`tools/auto_land.py`。② ★ **改法**：改成**按批跳** —— 能落的照落、不能自动决定的只跳它自己并点名，**只有「全都没法落」才退 4**。指针：`tools/auto_land.py`。③ ★ **反向判据（本卡核心）**：{不能自动决定的批 + 能落的批} ⇒ **能落的那批必须被落**（断言落函数被调用 1 次、参数是那批）—— 旧码在这条上**必红**。指针：`tests/test_auto_land.py`。"


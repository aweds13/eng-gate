gaps = "1. 判据 3 的分叉靠「调用方给的 root 是不是等于模块级 ROOT」来认「这就是服务端那条路」—— 这是**推定**，不是显式信号：将来任何别的入口传一个恰好等于 ROOT 的路径，读端会悄悄换根，而没有任何一行日志说明它换过。指针 `tools/pool_mcp.py`2. 只修了「读」这一半：`tools/pool/task.py` 的 `batch_dir()` 现在认 root，但 task.py 内部 6 处调用（register / claim / find_gates_for_member / draft / why 等）仍旧走默认根 —— 从卡树里跑 `task.main([「register」, …])` 仍然写主树。指针 `tools/pool/task.py`3. `tools/pool/plan.py` 只有 spec 读取跟了 root：`audit_batch_claims()`、`_fence_batch_dir()`、`find_spec()` 还只认模块级 ROOT，判据根在「批量申请审计」这条链上仍可能与调用方给的根不是同一棵。指针 `tools/pool/plan.py`"


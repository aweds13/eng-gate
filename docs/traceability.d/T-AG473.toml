[entries."T-AG473"]
id = "T-AG473"
title = "会话账本并发写：临时文件名必须唯一"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/卡/卡E20-会话账本并发写.md",
]
gaps = "- 2026-10-24 23:43，F3 落地门禁在本机 4 个 worker 下红了唯一一条：`tests/test_wb_dispatch.py::test_execute_auto_resumes_an_interrupted_run`，报 `FileNotFoundError: [WinError 2] ... session-leases.tmp -> session-leases.json`。- 根因：`tools/wb_session.py` 的 `_save()` 把临时文件名写死成 `LEDGER.with_suffix(「.tmp」)`；两个 worker 同时写账本时，先完成者把 tmp 换成 json，后完成者 replace 找不到源文件；原有重试只捕 `PermissionError`。- 影响面：本机 `-n 4` 全量 341 s（`gates/diag/land-F3.log`）、云机 `-n 4` 336 s（`docs/subsystems/ci/云门禁机.md` §7）都踩到过 ⇒ 「多 worker 跑门禁」在此前不可信（`复盘/卡/卡E20-会话账本并发写.md`）。- 没做的：没改账本语义（租约 TTL、`take_over` 规则原样，见 `tools/wb_session.py` 顶部三条口径）；并发用例用线程，没有构造真·多进程竞态（用 `-n 4` 全量连跑做旁证）。"


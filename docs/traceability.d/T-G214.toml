[entries."T-G214"]
id = "T-G214"
title = "收批＝任务栅栏：跨层的多张卡集齐成送申请才收口（+ 两份复盘文档首度进 git）"
group = "RULES"
status = "done"
evidence = [
  "file:复盘/架构审议-外包与门禁.md",
  "file:复盘/口径坑.md",
  "file:复盘/门禁改进清单.md",
  "file:复盘/号池MCP-使用与设计.md",
]
gaps = "**来路**：用户 2026-10-02 两次说这件事，**第二次是纠正我理解错的地方**。第一次：『要引入**版本管理**的理念：小规模的改动应该**堆在一起**，同一个板块堆在一起写文书会好一点』；第二次（★ 关键）：『收批应该是我根据**任务的种类**，就是属于不同的板块 —— 比如属于**审美层**的、属于**后端**的、属于**前端**的。然后我在外包程序的某个地方**注册一个任务**，然后任务需要这些板块下面的**多张卡都完成了**，并且**发送了那个成功申请**，然后**集齐所有的成送申请**再写 —— **而不是单纯的数量**』。★ **我第一版错在两处**：把『板块』当成**目录族**（`tools/`、`复盘/`），把放行当成『同板块攒够 N 条』（还写了 `quorum:N` 和『攒够 5 条 / 2 小时』的阈值）。**根因（今晚实测的固定开销）**：一笔提交 = 一张卡 + 一棵树 + 一趟 17 道门（约 5 分钟，今晚光门禁跑了 40+ 分钟）+ **三段文书**，与改动大小无关 —— 卡 113 只改 16 行、卡 114 只改 9 行也照走全流程（架构审议里的『① 粒度错配』）。**做法（本笔落地，第二版）**：`gates/diag/tf_batch.py` 改成**任务栅栏**：① **注册任务**（人，开工前）—— 声明它需要哪些**卡**、每张卡**属于哪一层**（审美层 / 后端 / 前端 …）、每张卡**自己的域**（＝它能碰的路径，就是卡规格里的禁区/冲突域）；② 每张卡干完就往收件箱交**成送申请**（**成功必须带证据**，没证据的不叫申请；原子写）；③ **集齐全部成送申请**才放行（★ **判据是名单上每张卡都交了成功申请，与数量无关**）；④ **最后一名投递者当场关门**（不轮询、不起守候进程）⇒ 状态 `collecting → ready → gating → awaiting-commit`，每一步**追加进 history**（用户说的『把状态变成写日志』）；⑤ 集齐后自动：跑任务里声明的门禁命令 → 读数写进状态 → **按层分组**生成三段文书骨架；⑥ **停在 `awaiting-commit`，绝不自动提交**（门禁红时提交是红线；『一笔提交恰好一个台账号』是审计判据，要人过一眼）。**五条安全阀**：★★ **逐卡域越界拒收**（一张卡碰了自己域外的文件 ⇒ rc=2，点名到文件**并指出这张卡的域** —— 比第一版的『批级域』严得多，否则任务会变成**绕过冲突域的后门**）· ★ **『不通过』挡住收口**（有卡投 `failed` 且没被豁免 ⇒ **哪怕名单上别的卡都成功了也不放行**，且非零退出）· **名单外不算数**（防夹带）· **`waive` 显式豁免**（留痕，防一张卡挂了整个任务永久卡死）· **过期只判死**（列缺席者，绝不自作主张放行）。**验收**：① **33 条反例钉子全过**（`--selftest`；每条守卫都有『它确实会咬』的例子：第 1 张卡交了仍是 collecting · 重复交幂等 · 逐卡域越界 rc=2 且**不覆盖**已收到的申请 · 名单外 rc=2 · **成功申请没证据 rc=2** · **有卡『不通过』⇒ 不放行且 rc=3** · 重投成功 ⇒ 集齐当场放行 · 门禁红 ⇒ 停在 ready 且非零退出 · 过期不放行 · 缺 `layer`/`paths` **不落盘** · 按层把待办登记收成成员 · 目录不存在也能登记）；② **本笔自己就是真跑**：`B-DOC1` 一个任务 4 张卡（层『文档层』，各带自己的域）—— 前 3 张到齐仍是 `collecting`、第 4 张到齐**当场翻 `awaiting-commit`**；中途**故意拿一张卡投域外文件（`docs/changelog.md`）一次 ⇒ 真被拒**（rc=2，点名 M-4 的域只有 `复盘/号池MCP-使用与设计.md`）；文书骨架按层分组、枚举表由机器填好，人手补的部分写在 `B-DOC1.why.md`（**骨架重算不会冲掉它**）。**★ 搭这套的过程咬出八条真坑**（全进 `复盘/口径坑.md` 33–40）：`contextlib` 里 `yield` 写在 `while` 里（`generator didn't stop`）· 自证把源文件放进被测目录（假阳性）· 兜底把守卫异常收成退出码（自证断言错对象）· 批目录不存在时建不了锁 · **集成跑一半失败后重跑必须先把派生物退回 HEAD**（且要 `checkout HEAD --`，`checkout --` 从索引取会白退）· scratch 工具进不了提交 · **`git` 默认把非 ASCII 路径写成『引号 + 八进制』**（害得卡 116 的台账片段非法，两处工具已修 + 加 `_toml_str` 双保险）· **通配符写法的 md 引用被 `check_layers` 当断链**（害得卡 116 白跑一趟门禁）。**★ 诚实边界**：① **工具本身在 `gates/diag/`（gitignore）⇒ 它自己进不了提交**（与错配③同源，已记进 `复盘/门禁改进清单.md` ⑩）；② 收口入口已给 `_integrate.py` 加 `--batch`（`--card`/`--batch` 恰好给一个，批号当门禁锁标签）—— 但那是 **scratch 工具、没有门禁覆盖**；③ **任务的注册还没有外包面**（用户说的『在外包程序的某个地方注册任务』还差把它接到 `infra/pool` / MCP —— 下一块活）；④ **层名没有全局表**（写在各任务的预声明里；多项目语境下层名属于**项目**，见 `复盘/架构审议-外包与门禁.md` 新增的**记忆层**一节）；⑤ **只治单机**；⑥ **回退粒度 = 整个任务**（一笔提交退不出一张卡 ⇒ 卡内必须逐条写清改了什么，申请内容就是为此）。**★ 本笔另含**：把**此前一直未跟踪**的两份复盘文档（号池 MCP 使用与设计页、架构审议页）首度纳进版本管理 —— 它们此前是工作区里的 `??`，被清理就没了。"


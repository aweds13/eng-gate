title = "框架骨架设计：53 字段 schema + 8 条命令 + 六节 + 追加 A~E（含接续既有缝与解耦路径）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/框架-骨架设计.md",
]
gaps = "本笔落的是卡 178 的设计书（`复盘/框架-骨架设计.md`）。★ 诚实缺口五条：1. **纯设计，一行代码都没有**：schema 是草案、命令面是草案、目录树是**还没建**的目录。⇒「框架能不能跑」它证明不了，那是卡 179 的活。2. ★★ **它把「6 件工具迁移」划进了阶段一（= 卡 179 的交付面）** —— 那是**扩了 179 的范围**（`harness/README.md` 的下期清单 6 件 + `pool/` + 门运行器）。本笔**记下这条**：派 179 之前由主控**显式切一刀**（先把核心库 / 薄 CLI / 模板仓 / 例子做出来，**迁移另立一张卡**），否则 179 会变成一个吞不掉的大件。3. ★ **它现算出的是 375 条路径证据，不是 `harness/README.md` 里写的 271**（`tools/` 316 + `scripts/` 59 vs 226 + 45）。两个读数**都是真的** —— 271 是卡 088（T-G183）当时的读数，HEAD 更早；本设计用现算的 375，并在正文里写明了这个差。★ 这条差本身是「判据会过期」的实例。4. **它自己认了 5 条泛用性条件不满足**（①②③④⑤⑥⑦ 里 ①③⑥⑦ 明确不满足 + ②④⑤ 部分），逐条举到文件与行 —— 这是**如实报缺口**，不是缺陷。但⇒**卡的验收项「哪一条泛用性条件不满足」是满足了，而条件本身还没被关掉**。5. **本笔没有门禁能验它**：设计书不跑测试，门只能证明「这份文档进了 git、没把既有的门弄红」。"


gaps = "- 卡规格判据 3 只列了六个幂等写调用点（attach ×3 / ai ×2 / notify ×1），实测这六个都标了 `retry_ok=True`，但**超时那一支的可重放面比它宽**：`GET`/`HEAD` 由 `IDEMPOTENT_METHODS` 放行，不靠调用点声明；卡规格判据 2 说「超时只对判据 3 认定的幂等调用重放」，我按「幂等面 = GET/HEAD ∪ 显式声明」实现，与判据 3 末句（「重放条件 = method in (GET, HEAD) or retry_ok」）一致。指针 tools/web_live_check.py- 判据 3 说 `:283`/`:294`/`:295` 三处 attach PUT，实测 `:295` 那行（`bad_ext`）折成三行会破 ruff E501，所以按 ruff 要求折行；三处**行号**因此各自下移，语义一字没变。指针 tools/web_live_check.py- 判据 6 钉了七条，实际文件里落了 **12 条**：把「重试用尽点名 broken_read」「每次重放打一行」「零值不许再打」「HEAD 与 GET 同等可重放」「断读（连上后对端先关）也可重放」「拒连不重放」逐条拆成独立钉子，一条钉子只判一件事。卡规格列的是**最少**集合，没有软化的那条。指针 tests/test_web_live_json_retry.py"


gaps = "本笔落卡 187（引文回溯 → 优化候选）。★ 诚实缺口五条：1. ★★ **它是候选表，不是实现**：12 条里 **9 条「采纳」全都还没做** —— 每条要么另立卡、要么并进已有卡（例：OPT-03「每 worker 内存下限 + 资源敏感 flaky 受控复测」与 OPT-10「门按内存分池」该并进**卡 184 / 164**）。2. ★ **`gain` 那一栏，有出处的都是别人的实验条件**：★ **不许把它当成我们自己的预期收益** —— 我们自己的收益**只有量过才算**。3. ★ **一条被否掉（OPT-12 磁盘缓冲）**：理由写的是「本仓内存瓶颈在 pytest/浏览器进程本体，不在门的输出缓冲」。★ 这是**好事**：说明它没有为了凑数而全盘采纳。4. ★ **两条证据缺口**（照本仓 F10 纪律附检索面）：**fencing token 没有直接论文**（我们是自造）；**「CI 里并行跑多个候选再挑一个」也没有直接论文**（只有并行构建加速、补丁并行差分验证、冲突预测预筛当组件证据）。5. **本笔不含任何代码**：门禁只能证明「它进了 git、没把既有的门弄红」。"


gaps = "1. 修的是「症状看不见」，不是 `web_live` 本身：抖不抖、要不要自动重试，这张卡一个字没改。红门仍是红门，`SUSPECT` 只是多一个标注（`gates_ok()` 照旧把它算红）。判据在 `scripts/run_gates.py` 的 `mark_suspect_rows()`。2. 症状进了 `gates/last.json` 的 `detail`，但 GHA 作业里那段 BEGIN/END JSON **仍然看不到它**：`scripts/cloud/gha/adapter.py` 的 `_reading()` 每门只搬七键（name / exit_code / seconds / blocking / status / reused / summary），`detail` 根本不在搬的名单里；要看症状只能看同一份日志的 `=== GHA-GATE-DOORLOG ===` 段。3. 本卡**没有重推 eng-gate**：「症状进 detail」这件事是在本机拿真 doorlog（GHA 上那两趟红门的输出，还原后 362 行）复现验证的，不是 runner 上重新跑出来的新读数。所以「下一趟 GHA 上 web_live 红时会带 `status=SUSPECT`」是推理，不是已观测事实。夹具在 `tests/test_gate_summary_truthful.py`。4. 顺手看见但没修：同一份 doorlog 上 `summarize()` 会挑中一行 JSONL 当摘要 —— `FAIL_SHAPES` 一条都没命中时它退到「最后一行 + [FAIL] 前缀」。适配器那边的 `_door_log_tail()` 早就丢掉以 `{` 开头的行，`scripts/run_gates.py` 主路径没有这道过滤。已写进 gaps，判据未改。"


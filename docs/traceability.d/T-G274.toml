gaps = "本笔修的是**一道「用户一开模型开关、门禁就变红」的用例** —— 它是 2026-10-03 09:57 主控落 158（**纯文档**）时被全量门禁咬出来的，红了整整一趟。★ 诚实缺口四条：1. **本笔只治「用例依赖机器状态」这一条**：模型注册表本身（两份名单、两套 id 体系、`--model` 默认值）**一个字没动** —— 那是**卡 166** 的活（用户已定为「同一层统一 + 按池分流」）。2. 开关文件 `infra/pool/model-switches.toml`（在**本仓之外**、只有用户能改）**一个字节都没动**；`kimi-k3-1` 仍是打开状态（用户 2026-10-03 令）。3. 台账新增 `INV-78`，但台账里**仍有 missing + partial**（那一批由卡 160~164 去关）—— 本笔只是把新缝记进账。4. **顺带落一批一直躺在工作区/暂存区的东西**：队列登记（`docs/workbacklog.toml`，卡 166~174）+ 十一份卡规格（`复盘/卡/`）+ 主控自己写的两份分层文档（`复盘/架构索引-分层图.md`、`复盘/问题清单-分层.md`）。它们不落进 git，收口链的 fail-fast 会**在门禁前停手**（口径坑第 41 条），而且 2026-10-02 夜被 `git checkout HEAD --` 抹过一次。"


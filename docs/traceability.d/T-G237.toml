gaps = "**来路（本仓**自己反复记的最大缺口**，今晚终于补上）**：- `复盘/外包工具-需求与架构.md` **§5 第 1 条**：「★ **收口工具还在 scratch**（`gates/diag/_integrate.py` 等，gitignore）⇒ **别的窗口能派活、不能落地**。这是当前**最大缺口**（错配③：权威与工具位置错配）。」- `复盘/号池MCP-使用与设计.md` §三 同一条；外部审查 GLM-5.3 的 §四 也把它列成「与需求不符」。- ★ **今晚一整晚的实证**：六笔提交都是**手工**跑那两个 scratch 脚本收口的（`_integrate.py` 打的每一步、`_stage_card.py` 那条「ASCII 引号不成对」的断言）—— **别的窗口/别的机器一行都拿不到**。**做法（搬 + 自证行为不变；**没顺手改判据**）**：① `gates/diag/_integrate.py` → **`tools/wb_land.py`**（壳）+ **`tools/pool/landing.py`**（实现）；`gates/diag/_stage_card.py` → **`tools/wb_stage_card.py`** + **`tools/pool/stage_card.py`**。② ★ **七步链行为一字不变**：顺序 · 每步的打印与退出码 · `--card/--batch` **恰好给一个** ·全部参数语义 · **fail-fast**（先跑 `tests/test_card_specs_tracked.py`，红了退 4 并印修法）·**`atexit` 还门禁锁** · `--allow` 里的**目录用 `git ls-files -c -o --exclude-standard` 展开**（不收 `__pycache__`）·`extra`（计划外暂存）**停手** · `DOCS`/`GATES` 自动补 · 三个**片段**自动补。③ **路径自推**：`ROOT` 按新位置重新算（`tools/pool/landing.py` → 上三级；不再写死绝对路径）；`_text_<台账号>.md` 仍在 scratch（**本来就是临时件**），两种 cwd 下都验证过找得到。④ `gates/diag/` 里那两份原件**留成转发壳**（照卡 119 给 `tf_batch.py` 留壳的做法）；★ 它们是 gitignore 的，**不进本笔提交**，由主控在主树替换（见「老实说」①）。⑤ **文档事实句更正**（只改事实、不改判据）：`复盘/外包工具-需求与架构.md` 的 §5 第 1 条 / §2.2 组件表「收口」那行 /§8 处置表 2.4·2.10 两行的「（scratch，不进 git）」字样；`复盘/号池MCP-使用与设计.md` §三 那句「收口工具没进 git」。**验收（工人自验 + 主控复核）**：`tests/test_wb_land.py` **7 passed**（`--help` 参数齐 · `--card/--batch` 恰好一个 ·缺 `_text_*.md` 停手 · `--allow` 目录展开不收 `__pycache__` · 计划外暂存停手 · **fail-fast 退 4 且一步门禁都没跑** ·`atexit` 还锁）· 新旧两条 `--help` 对照 · ★ **行为不变自证**：同一真场景跑新旧两条命令，输出结构与产物文件列表在归一化时间戳/随机名之后 **diff 为空** · `ruff check tools tests` = **All checks passed!** ·全量门禁与审计见 trailer 与提交之后的 audit 段。**★ 老实说（偏差与没做的）**：① ★ **卡里自相矛盾（我的错）**：§1 写「`gates/diag/` 里那两份原件**留成转发壳**」，禁区又写「**不动主树**」——工人**按禁区办**（**没碰主树**），把转发壳留在**自己那棵树**里，并请主控收口时替换。★ **主控照办**：把主树那两份 scratch 换成了它写的转发壳（**内容逐字**取自它那棵树）——主树从此不再有两份真源。★ 那两份是 **gitignore** 的，所以这条**不在本笔提交里**（如实记）。② **`tools/` 不在 mypy 门禁范围内**（`scripts/run_gates.py` 只 `mypy src/`）：四个新文件各有 mypy 报错（`dict` 缺类型参数、`_fragments_mode` 的 `a` 无注解）—— 与旧 scratch**完全一致**，为守「行为一字不变」**未动**。★ 该另开小卡（「把收口链纳入 mypy / 或明确把它排除在外的口径」）。③ `--help` 的 `prog` 名随文件名变了（argparse 自动取 `argv[0]`）—— **改名固有**，行为对照里已归一化。④ **未覆盖的两条路径**：`--commit-only` 与「门禁红 ⇒ release + 退 1」**只看代码等价、没真跑**；⑦ 之后的 **ff 合流 / rebase 自动解决派生物冲突**更没覆盖（那要**两棵真树并发**，属卡 113/115 范围）。⑤ **主控顺手补的一处旧路径**：`tools/pool/task.py` 的收批提示语里 `_integrate.py --batch`→ `tools/wb_land.py --batch`（搬完不改就是漂移；一行字符串，随本笔进提交）。⑥ ★ **本笔不改变「收口只有主控」的分工** —— 它把工具**搬进 git**，于是**别的窗口第一次真的读得到、用得上**收口链；但「谁有权限跑它、跑之前要不要过锁」仍是纪律 + 门禁锁（不是本笔的事）。**★ 本笔另含**：`docs/workbacklog.toml` 把卡 139 标 `done`。"


gaps = "1. 网关今天**没有编排者**，`tools/pool/platforms.toml` 九段 `chat_urls` 全空 ⇒ forward_http 生产上走不到：这条「凭据被拒」的报文只在 stub 上游上验过，没有一次真机 401。指针 tools/pool/gateway.py2. 归因前缀里的状态码集合是「所有尝试的 status 去重排序」，同一个座被重试两次仍只算一次尝试 ⇒ 报文里没有座位级计数，读不出「哪几个座被拒」。指针 tools/pool/gateway.py3. `_why`（:758-766）今天已经把上游 body 前 200 字拼进 `detail`，本卡只钉住「**归因前缀**不读 body」；detail 里 vendor 的自由文案尚未裁决（既有行为，未改）。指针 tools/pool/gateway.py"


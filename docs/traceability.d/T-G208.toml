[entries."T-G208"]
id = "T-G208"
title = "号池写面②：MCP 的 pool_dispatch / pool_cancel（六条不变量 + 存在性即授权）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool_mcp.py",
  "file:tools/pool/__init__.py",
  "file:tests/test_pool_mcp.py",
  "file:tests/test_pool_mcp_write.py",
]
gaps = "**来路**：用户原话「外包调用能不能做成 MCP，更适合不同窗口 AI 调用」→「我会在 DSH 里不同窗口用」。**期 1**（卡 105 / T-G201）交了六个**只读**工具（查队列 / 看某张卡到哪 / 看判决原文 / 看锁 / 看模型白名单）；**写面地基**（卡 108 / T-G205，`e9224f7`）交了作业登记与三条守卫。**本卡把「写」接进 MCP**：新增两个写工具 `pool_dispatch` / `pool_cancel`，并把**六条不变量**逐条接上。**做法**：① `tools/pool_mcp.py`（+377/−18）—— `pool_dispatch(card, tree, spec?, model?, pool?, note?)` 顺序**写死**：**先干跑**（`pool.guards` 三条 + `pool.registry` 租约判据，**import 调用**）⇒ 被咬就**不派活**、逐条回原因（`isError=true`、`dispatched:false`）；**再占位**（`registry.reserve` —— 并发安全就靠这一步）⇒ 占不上就停；**再起工人**（`wb_dispatch.py --cwd <树绝对路径> --model <白名单内> --lean --detach --execute`，**必须 detach**：MCP 调用不能阻塞几十分钟）；**起不来就回滚**（`registry.release`）；参数**写死、不许透传危险项**（`--force` / `--allow` / `--resume` / `--no-preflight` 一律不给，`--model` 只许白名单内）。`pool_cancel(card, reason?)` —— ★★ **先核对 pid 身份**（`tasklist /FI 「PID eq N」 /FO CSV` 的映像名必须是 `node.exe` / `python.exe`，否则**拒绝动手**并把人工命令印出来），再 `taskkill /F /T`，成功后写 `gates/diag/wb-<卡>.cancel.txt`（谁 / 何时 / 为何）并放租约；★ **绝不用 `os.kill(pid, 0)` 探活**（Windows 上它会真杀进程 —— `复盘/口径坑.md` 27）。② **六条不变量在模块 docstring 里列成表**（哪条谁判）：①单写者/树 → `guards.tree_guard`；②冲突域 → `guards.domain_guard`（域从 backlog 读，**查不到就拒**）；③门禁锁 → `guards.lock_guard`；④**内存闸 → 委托** `wb_dispatch` 的前置检查（**不重写**）；⑤日志不许覆盖 → `guards.log_guard` + **不给** `--force`；⑥模型白名单 → `wb_dispatch.MODEL_WHITELIST` + `pool.models`。③ **授权「存在性即授权」**：两个写工具**只在服务端 env 有 `POOL_MCP_WRITE=1` 时才列进 `tools/list`**（没有就只列六个只读工具）；每次写调用还要 `arguments.confirm` **等于卡号**（防手滑）；`initialize` 的 `instructions` 里把这两条讲清。④ `tools/pool/__init__.py` **只改 docstring**（补 `pool.registry` / `pool.guards` 两行、删掉已过时的「本包没有任何写操作」）。⑤ 新增 `tests/test_pool_mcp_write.py`（**17 例**）。**验收（工人自报，主控逐条核）**：① `tools/list` 带 `POOL_MCP_WRITE=1` 时 **8 个**（前六个 `readOnlyHint:true` **一字未变**；`pool_dispatch` → `readOnlyHint:false / destructiveHint:false / idempotentHint:false`，`pool_cancel` → `readOnlyHint:false / destructiveHint:true / idempotentHint:true`），**不带 env 时仍是 6 个**（既有 `tests/test_pool_mcp.py` 的 15 例全过）；② **干跑被咬四种**原样（树被占 / 冲突域相交并点名文件 / 日志已存在 / 锁在跑），每种都 `isError=true`、`dispatched:false`、**起工人桩未被调用**，并附「怎么才能通过」；③ **桩验 argv 逐字**：`['…python.exe','-X','utf8','tools/wb_dispatch.py','--card','111','--spec',…,'--cwd','D:\\…\\.wt\\poolmcp2','--model','deepseek-v4.1-flash','--lean','--detach','--execute']` —— 有 `--detach --execute --cwd`、**无** `--force/--allow/--resume/--no-preflight`，且**起工人那一刻活租约 list = `['111']`**（先占后起）；④ **占位→起不来→回滚**：桩内看到 `['111']`、返回「已回滚租约：OSError」、回滚后 list = `[]`；⑤ **cancel 身份不对**：pid 4242 的映像是 `chrome.exe` ⇒ **拒绝动手** + 印出人工命令，桩记录 **taskkill 调用次数 = 0**、租约原封不动；身份对（`node.exe`）时才杀 + 写 `.cancel.txt` + 放租约；⑥ `ruff check tools/ tests/` → `All checks passed!`；号池相关 5 文件 **83 passed**；⑦ ★ **测试数的账（主控核对）**：工人实测 `pytest -q` = **1777 passed**（= 非验收 **1758** + 验收 **2** + 本卡新增 **17**）；**门禁里那道 `pytest` 门只跑非验收**（`acceptance` 单列一道门），所以门禁原地重跑应读到 **1775** —— 两个数都对，口径不同；既有判据**一条未动**。**★ 主控裁定（四条留白）**：① ★ **pid 住哪** —— 卡 108 明确「**不登记 pid**」（判活只用「租约 + 日志」），而 cancel 要按 pid 核对身份。工人的取法：`pool_dispatch` 起工人拿到 pid 后，**用既有 `registry.load/save` 往那条租约补一个 `pid` 键**（**没改 `tools/pool/**` 一个字符**），cancel 读它 ⇒ **裁定：接受** —— pid 只作**取消用的线索**、**绝不用于判活**（判活仍是租约 + 日志），取消前必须 `tasklist` 核对映像名；副作用也讲清：服务端若在「起工人」与「补 pid」之间死掉，pid 缺失 ⇒ cancel **拒绝动手**（安全的缺省）。② `idempotentHint` 取 dispatch=false / cancel=true ⇒ **接受**（判断项）。③ **未做真机端到端**（真起一次 node 工人 / 真杀一次）—— 卡也禁止未提交即派活；**主控随后自己补一次「零花费的真机 cancel 演练」**（拿主控自己起的 `python -c sleep` 当靶子：核对身份 → 杀 → 验租约已放）。④ `pool` 名只记进租约（`wb_dispatch` 没有 `--pool` 参数，未透传）⇒ 接受。**★ 该改但不属本卡**：① 主仓 `docs/workbacklog.toml` 里 108/109/110/111 四条是**未提交改动** ⇒ 已排进后续一张小卡；② DSH 注册那几行（`~/.dsh/profiles/desktop/cordis.patch.yml`，**在仓库外、非本卡域**）工人给了完整写法 —— ★ `args` 必须指向**主仓**那份（指向卡树会读不到 backlog），`POOL_MCP_WRITE: '1'` 走 `env:`（想只读就删这行、退化成六个工具）；③ 切片 §四「没找到白名单小节就停工」与 §一「现状」两处**误报**（今天三个工人报同一件事）⇒ 排进小卡。"


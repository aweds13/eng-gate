gaps = "- 真领取只在 codearts 上做了端到端读数；workbuddy / trae / qoder / minimax 四家是**假 fetcher 回放**真实响应形状（六态、幂等、二次跑 already-claimed 都有钉子），没有真凭据跑过，见`复盘/卡/卡E48-手动签到与聚合入口.md`。- 本机四个号目前只有 codearts-1 声明了批准模型，其余三个 `approved_models=[]` ⇒ 派活读账本时会被拒；签到的 `uncertain` 也主要来自「账本只存指针、环境变量没设」，见 `tools/pool_accounts.py`。- `--spacing 2.0` 是固定值，没有按平台退避（参考仓的错峰预约没抄）；429 只记 `uncertain` 不重放，真要跨天补签得人来跑，见 `docs/subsystems/pool/README.md`。- `checkin_status` 与今日一页读的是**当天留档**：留档在卡树（数据根）而主树读主树目录，跨树跑时会看到「今天没跑过」，见 `tools/wb_daily.py`。"


gaps = "- **先落 E45 才有账本可签**：本卡 `depends = [\"E45\"]`，没有账本与能力表时 `checkin` 无处读平台端点，见 `复盘/卡/卡E48-手动签到与聚合入口.md` §2。\n- **只有 codearts 有端到端参考实现（四步含 confirm）**：其余平台按参考仓的响应形状写，但没有真号验证过；未验证的平台必须在输出里如实标「未探」，不许伪装成 `claimed`，见 §4 第 6 条。\n- **真领取是唯一写动作，闸门要硬**：写客户端只许放 `tools/pool/checkin.py`，入口唯一 `checkin_apply()`；钉子用 AST 扫，见 §6 判据 10。\n- **「今天已领」各平台判据不同**：qoder 领取成功后列表仍非空、minimax 是 `is_today && status===3`、codearts 看 `claimable/status`；统一按「没有 Claimable 就领」会重复领取，见 §3 硬规矩 1。"

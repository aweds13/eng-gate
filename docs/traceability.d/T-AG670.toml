gaps = "1. 会话维度只钉在「不许编」这一半：网关入站头是闭集、route_log 行恰好八键、`--resume auto` 没会话文件就退 2 —— 但「同一个会话跨轮次怎么归属到同一条读」仍没有实现，归属仍靠调用方自己保管。指针 tools/wb_session.py2. 指纹只认宿主注入的 `DSH_SESSION_ID`，本仓没有第二来源；宿主不注入时放行且**不写租约账本** —— 于是「这是一次工人口径的派活」只能从账本缺失反推，没有正面的标记位。指针 tools/wb_dispatch.py3. 三份判据文件里有两条是**既有文件追加**的（`tests/test_pool_route_log.py` 加第九/第十条钉子、`tests/test_wb_dispatch.py` 加一条），这两份文件的主人是 A363 与派活链，不是本卡。指针 tests/test_pool_route_log.py"


  """- **今天这道闸整体不生效**：`rpm.toml` 是空表 ⇒ `load_rpm()` 恒空 ⇒ `limit` 恒 0 ⇒ `decide()` 恒放行。这一轮验的是判据的判别力（10 条钉子 + 8 条变异），不是「闸真的拦住过一次派活」。
- **profile 名与账本稳定 id 没有映射**：`--account` 收 `tongxue3`，账本是 `codebuddy-tongxue3`，仓内零映射代码。映射 + 填表 + 真接线要另开一张卡（否则填了也是谁也不拦）。
- **进程被强杀不会还戳**：只还两条能捕获的占树失败路径。magpie 靠 ctx 取消给回，pool 没有等价的可取消边界 ⇒ 强杀后只能等 61 秒滑出窗口。

[entries."T-AG472"]
id = "T-AG472"
title = "技能根守卫：默认预设必须看得见仓库技能根（T-AG472）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/卡/卡E19-技能根守卫.md",
  "file:gates/diag/batch/T-AG472.toml",
  "file:tools/dsh_skills_guard.py",
  "file:tests/test_dsh_skills_guard.py",
  "test:test_dsh_skills_guard.py::test_normal_profile_passes",
  "test:test_dsh_skills_guard.py::test_missing_root_fails_and_names_the_default_preset",
]
gaps = "- **只守一条判据**：默认预设的 `customSkillDirs` 必须含仓库技能根。别的东西（其它预设的根、预设开关、插件禁用位）**只报不判**，别把它当 profile 的全面体检（规格 复盘/卡/卡E19-技能根守卫.md）。- **解析是按行的，不是 YAML 解析**：`cordis.patch.yml` 里有 `!!js` 标签，安全载入会报错，所以按行扫。若以后补丁被压成流式 YAML（`customSkillDirs: [a, b]` 一行写完），守卫会退 2「判不了」，**不会错判成绿**（判定口径见 复盘/卡/卡E19-技能根守卫.md）。- **刻意不接进门禁**：profile 是每台机器自己的状态，接进 19 道门会让别人机器无脑红（规格 复盘/卡/卡E19-技能根守卫.md）。要连跑就人手动跑一次。- **真实 profile 那条钉子是条件执行**：`tests/test_dsh_skills_guard.py` 在没有那份 profile 的机器上直接返回（不硬造夹具冒充真机），（同上规格）。- **没有做「自动修」**：守卫只读、只报告，改 profile 仍是人的动作（规格 复盘/卡/卡E19-技能根守卫.md 的「不许做」）。"


gaps = [
  """收益比 magpie 小一个量级：magpie 粘住的是**上游 prompt 缓存**（`cacheWorth=1024` 是它判定「值得粘」的门槛），pool 的派活是起一个新进程跑工人，没有可命中的 vendor 缓存。粘住的实际好处只有「同一个号的环境、凭据、配额水位更连贯」，以及换号带来的额外探测开销。`cacheWorth` 因此没搬。
四个路由态没搬：magpie 的 `strict` / `resting` / `spent` / `main` 是它在**请求级**路由里选的四种形态，pool 没有对应的一层。本笔只有自己的 `spent`（= `used_percent >= USED_SHARE`，取自 `tools/pool/route.py:75`）。
粘性记录里存的是**人给的 profile 名**（`args.account`），不是 A344 解析出的账本稳定 id —— 因为下一轮还要拿它去 `account_env()` 取工人环境。A344 落地后账本里是稳定 id，旧记录的降级路径是「查不到 ⇒ `why == \"gone\"` ⇒ 首次派活重建」，这条降级只在 `tools/pool/sticky.py` 的文件头「边界」节里写着，没有进 changelog 正文。
不做跨机同步：`gates/diag/pool-sticky.json` 只在本机，多台机器各记各的。
`session` 只记「当时用的是哪个会话」，**不保证**下次自动 `--resume` 到它 —— 续跑仍由 `--retry` / `--resume` 显式控制。
粘性命中的 profile 名若 `account_env()` 认不出（账本里没有这个名字的稳定 id），接入点 1 会打一句「这轮认不出 ⇒ 正常挑号」并清空粘性，**fail-open 不拦派活**。这条 fail-open 是卡规格没写、实现时必须补的 —— 不加的话会走到原来的「profile 认不出 ⇒ 退 2 拒派」路径，违反「不拦派活」。
`gates/diag/pool-sticky.json` 是运行状态（已在 `.gitignore:70` 的 `gates/diag/` 覆盖内，未新增规则）；测试一律用 `tmp_path` 当 root，没有写进真仓 —— 所以「真实派活留下粘性、下次真读到」这条端到端没跑过（会真起进程）。
""",

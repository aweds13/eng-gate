gaps = "- 同一段里并存两个时点的读数（最新那趟与前一趟），读者要自己判断哪条是「现在」—— 这是有意的分层（历史读数降级但不删），代价是 §6 变长，判据写在 复盘/卡/卡E150-GHA最近一趟换成骨架自己那一趟.md 判据 3。- 逐门 `seconds` 只保留最新一趟那一张表，旧趟只留 `pytest` 秒数与求和用于对照；代价是「某门在四趟里怎么摆动」这条信息不再能逐门读出来，只能靠 `pytest` 与求和两个量看量级（同上，见 复盘/卡/卡E150-GHA最近一趟换成骨架自己那一趟.md 判据 3）。- 「23 门全绿」的口径仍是「22 门 `exit_code=0` + `render` `EXCLUDED`」，`docs` 那门的 `summary` 原文是「没判完（有 skip）」，`exit_code=0` 只说明没超基线 —— 这条边界在 docs/subsystems/ci/GitHub-Actions-云门禁.md 的 §6 里以两行注意事项写死，但报告里说「全绿」时仍可能被读成「每门都判完了」。"


gaps = "1. 「五仓都在跑」这句话里有一仓是**红的且是环境性红**（`dsh-gate` 的用例比 `statSync().mode & 0o777`，NTFS 上 `0o700`/`0o600` 落成 `438`）。文档 §9 第 3 条只写清「这是 Windows 语义不是代码坏」，没修它 —— 修法（换 Linux runner 或让源仓判据认平台）超出本卡，判据见 docs/subsystems/ci/GitHub-Actions-云门禁.md §9。2. 五仓的读数形状仍不统一（eng 是 23 门 JSON / fw、ura 是 `passed`+`failed` 的小 JSON / dsh 的 `passed`/`failed` **恒为 0** 没解析计数 / om 是 vitest 四段文本）。要收成一张表得各写提取器，判据在 docs/subsystems/ci/GitHub-Actions-云门禁.md §9 末段。3. 号池桩缺件这条只在 profile 加载与 `_rewrite_projects_root()` 两处兜住，**适配器自己现造桩那条路**（scripts/cloud/gha/adapter.py 的 `_ensure_pool_stub()`）没走这条校验；两条路是两份实现，可能各自漂。4. `[workflow].install` 这条键到今天仍**没有使用者**（写了没跑过）—— 本卡只保证 scripts/cloud/gha/gate_profile.py 的交叉校验不会放它跟 `from_remote_workflows` 同时开，没给它加活用例。"


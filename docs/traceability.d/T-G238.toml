gaps = "**来路（两件，两批卡合在**一笔**里落）**：① **卡 136**（任务 `B-HARDEN`）治外部审查 **2.3** 的余波 —— 审查点出「`pool_mcp` 的 `_capture` **进程内**调 `cmd_claim`⇒ 最后一名 claimant 走 MCP 时 **MCP 服务进程同步跑完整个门禁**」；卡 130（`T-G227`）把 claim 改成**子进程 + 后台线程**之后，它**自己如实报了没治的边界**：「超时只掐**直接子进程**，它再起的 grandchild 门禁进程（Windows）**不保证**被一并带走⇒ **孤儿门禁**」。★ 后果很实在：`gate_cmd` 现在必须指向仓库内脚本（卡 128 的白名单），而**那些脚本自己会起进程**（`run_scripts` 起 pytest、真机门起浏览器）⇒ 超时只杀中间那层，**真正吃 CPU / 占端口的还在跑**。② **卡 138**（任务 `B-SWITCH`）治**用户新提的需求**：原话「我能不能你弄个**插件**在那个页面上，我可以调整，可以**开关 GLM5.3 是否用**？…当我**按下开**的时候它就变成 true，**按下关**的时候它变成 false。」背景：`glm-5.3` 当天已按用户令撤（`T-G235` 把 `ONE_OFF_MODELS` 清空）⇒ 用户要的是**一个开关**，而不是「每次改源码 + 跑一趟门禁」 ⇒ **开关必须是数据，不是代码**。**做法（两卡各自在自己的树里干，收口时主控按文件复制进主树）**：- **卡 136**：超时（`TimeoutExpired`）与其它失败路径都把**整棵进程树**带走，**复用** `tools/wb_dispatch.py` 的`kill_tree`（按 PID 收子树，**不按进程名** —— 按名字会误伤同名进程；**不另写一份实现**）；杀完**如实报**（杀了哪些 pid、有没有残留），**不许**只说「已清理」；MCP 的**工具清单与回话形态一字不变**。- **卡 138**：① `infra/pool/model-switches.toml`（**通用层**、仓库外、只有用户能改；UI 也是改它）——`[switch]` 段里 `「<模型名>」 = true|false`；② `tools/pool/models.py` 新增**只读** `load_switches()`：★ **缺文件 ⇒ 空字典**（不报错）、★ **坏文件 ⇒ 报错并点名**（**不许静默当空** —— 那会让「我明明开了」变成「实际没开」，这类「看着绿其实没查」的缺陷本仓吃过太多次）、复用既有 `find_pool_dir()`、允许 `TF_MODEL_SWITCHES` 覆盖；③ `tools/wb_dispatch.py`：`ALLOWED_MODELS = MODEL_WHITELIST + ONE_OFF_MODELS + <开关打开的>` ——★ **名单常量一个字不动**、★ 开关打开的模型**仍不进 `next_whitelist_model()` 的轮换链**（轮换只走 `MODEL_WHITELIST`）。**验收（工人自验 + 主控复核；全量门禁与审计读数见 trailer 与提交之后的 audit 段）**：- 卡 136：★ **孙进程是真起的**（门禁桩真 `Popen` 一个 `python -c 「…time.sleep(120)」`，pid 落盘后用**真 psutil** 核**已被带走**）· 四条钉子（含**先红后绿**：改前跑「孙进程也死了」那条**要红**）· 工具清单两段仍是 **9 / 13**。- 卡 138：五条钉子 —— **开关开**（放行且**不进轮换链**）· **开关关**（被拒）· **文件不存在**（空字典、行为与今天逐字相同）·**坏文件**（报错点名、**不是**静默当空）· ★ **开关只做加法**（开关写别的模型 ⇒ 它被放行，而**名单里那两个不会因此被关掉**，这条是**有意**口径、写成钉子）；★ 两种状态下的 dry-run **原样输出**。- 主控在**当前主树**上跑的收口前体检：`pytest tests/test_pool_models.py tests/test_wb_dispatch.py tests/test_pool_mcp_task.py`= **185 passed** · `ruff check tools tests` = **All checks passed!**。**★ 老实说（偏差、裁定与没做的）**：① ★★ **卡 136 违反了我写在卡里的一个字面，我裁定接受**：卡里写「既有断言一条不许改」，而它**改了 ⑦⑨⑩ 三条的接缝**（`monkeypatch subprocess.run` → `Popen`/`communicate`）。理由**不可回避**：`kill_tree` 要 **PID**，而`subprocess.run` **不暴露 PID** ⇒ 想收子树就必须换 `Popen`；三条的**判据意图一字未动**（真走子进程 / timeout≥1800 +utf-8 / 非零退出带出退出码与原文 / 超时不当成功）。★ **那句话是我写错的**，工人是对的 —— 记在这里，以后写卡不许把「实现手段」写死成「断言一个字不许改」。② 卡 136 的**非零退出路径收不到已死父下的孤儿**（`taskkill /T` 需要活 PID）⇒ 它如实记「没有活子树可带」，并指出「要覆盖子进程被外部杀死的情形，需要更早的后代快照机制」（**不在本卡范围**，如实留）。③ 卡 138 的**界面那一半**（用户说的「页面上的插件」）**不属于本卡** —— 本卡只保证「改那个文件即生效」；界面路线（DSH 客户端插件 / 本地小页面）**已在主控这边探好**，另开卡。④ 卡 138 **动了既有钉子一行**（给那条一次性模型的钉子加 `TF_MODEL_SWITCHES` 隔离，免得它读真文件）——**动机是隔离测试环境**，判据没松，**主控接受**。⑤ 本笔仍是**按文件复制**收口（两棵树 → 主树），不是分支合并；两批卡（`B-HARDEN` 的 136 与 `B-SWITCH` 的 138）**合成一笔**落地（一笔提交只有一个台账号 `T-G238`），★ 各自任务的成送申请仍**由卡自己交**。**★ 本笔另含**：`docs/workbacklog.toml` —— 卡 136/138 归到 `T-G238` 并标 `done`；顺序链 `138 → 120 → 135`（三张卡都碰 `tools/wb_dispatch.py`，用 `depends` 串起来）。"


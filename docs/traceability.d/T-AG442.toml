gaps = "- `--profiles auto` 只按「改动面」选档，**没算依赖传播**：改了 `tools/` 里被判的门用的夹具、却只碰 `docs/` 的提交，理论上仍可能漏掉 lang 档。指针：`gates/defs/domains.py`。- 映射表的前缀（`src/` `tools/` …）是**本仓**的形状；换仓要改表本身（`PIPE_HOME` 适配时一起改）。指针：`gates/defs/domains.py`。- 判据本体（`scripts/**`、`tools/**`、`gates/**`）仍强制全量 —— 所以**改这张表自己**那一笔省不掉 13 分钟。指针：`tools/pool/landing.py`。- `last.json` 新增三个键（`profiles_run` / `required_profiles` / `changed_paths`）只在非全量时写；老产物没有它们时按老口径判，**没有回填**。指针：`scripts/run_gates.py`。- 测试只覆盖映射表与提交闸两侧，**没有**端到端「改 docs 只跑 audit」的集成用例（落地链那层靠真跑验）。指针：`tests/test_run_gates_domains.py`。"


gaps = "本笔落卡 188（域细化到符号级）+ **同笔攒批的主控文档笔**。★ 诚实缺口五条：1. ★★ **它只交「零件」，没接线**：`tools/pool/plan.py` 与 `tools/wb_plan.py` **一个字没动**（★ 刻意 —— 那两处已被卡 157/161 占域，碰了我就成了**串行链上的第 10 张卡**，正是这张卡要治的病）。⇒ **符号级判定今天还不会生效**，收益要等接线卡。2. ★ **符号级是概率性的**：它在「文件相交」里找「符号不相交」，但**文本合并仍可能撞**（文献：文本级工具**漏检 75~79%** 的编译期/动态冲突）⇒ 必须配「**撞了就 rebase + 留痕**」。3. ★★ **收益一个数都没量**：同批并行度 ↑ 多少 · 落地冲突率 ↑ 多少 —— **两个数都还没有** ⇒ 现在**说不出它值不值**。4. ★ **本笔是攒批**（188 的产物 + **主控文档笔 18 份**）：理由与代价见 changelog 末条。5. **本笔不含任何产品改动**；★ 用户自己的三份未跟踪文档（`DSH-窗口化方案.md` / `Hermes-数据位置.md` /`dsh-skill-docs-report.zh.md`）**我一个字没动** —— 不属任何卡，也不该我替用户决定入库。"


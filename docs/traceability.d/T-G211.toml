[entries."T-G211"]
id = "T-G211"
title = "main_tree_root 不许依赖当前目录（MCP 真机跑出来的 bug）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool/registry.py",
  "file:tests/test_pool_registry.py",
]
gaps = "**来路**：主控把 `mcp-pool` 注册进 `~/.dsh/profiles/desktop/cordis.patch.yml` 之后，**用注册时那条真命令**起了一次服务（miniconda python + `tools/pool_mcp.py`，`POOL_MCP_WRITE=1`）做端到端：`initialize` 正常、`tools/list` **8 个**、`lock_status` 真跑 —— 六个**只读**工具全对；但一调**写面**就现形：`pool_cancel：读登记失败：算不出主工作树：`git rev-parse --git-common-dir` 没回路径`。**根因**：`tools/pool/registry.py::main_tree_root()` 跑 git 时**没给 `cwd=`** ⇒ 用的是**进程当前目录**；而 DSH 起 MCP 子进程时 cwd **在仓库外** ⇒ 算不出主工作树（只读那六个的 `ROOT` 从**脚本路径**推导，所以**只有写面** `pool_dispatch` / `pool_cancel` 中招）。★ **为什么卡 108 / 111 的测试没抓到**：那些测试**全都在仓库里跑**（cwd 就是仓库），这条依赖一直没暴露 —— 又一次「**桩验过了 ≠ 真机能用**」。**做法**：给那次 `subprocess.run` 加 `cwd=str(tree_root) if tree_root.is_dir() else None`（`tree_root = Path(__file__).resolve().parents[2]`，即 `tools/pool/registry.py` 的上三级）+ 一句注释（「服务可能被别的程序从任意 cwd 拉起」）；**卡树语义不变**（卡树里 `parents[2]` = 卡树、它也是 git 工作树 ⇒ `--git-common-dir` 照回**主仓**的 `.git` ⇒ 父目录仍是主工作树，正是卡 108 设计的那条语义）。**顺带审计**：`tools/pool/**` 与 `tools/pool_mcp.py` 里**所有** `subprocess.run` 的 `cwd=` 逐个过了一遍 —— `registry.py:242 read_lock_body` 有；`jobs.py:281`（`render_timeline` 的 git）是**可选 cwd 的既定设计**（不传 = 继承进程 cwd，是 `wb_status` CLI 的默认口径，且 `pool_mcp` 的调用处都显式传了 `diag`）；`pool_mcp.py:361 _run`（lock_status）有；`pool_mcp.py:660 _spawn_worker` 有；`pool_mcp.py:700/715 _image_name` / `_kill`（`tasklist` / `taskkill`）**按 PID 查/杀本机进程表、与 cwd 无关** ⇒ **漏网的只有 `registry` 那一处**。**验收（工人自报，主控逐条核）**：① **单元钉子**（`monkeypatch.chdir(<临时目录>)` 之后 `registry.registry_path()` 仍等于 `<仓库根>/gates/diag/pool-registry.json`）—— **先红**：`E pool.registry.RegistryError: 算不出主工作树：\\`git rev-parse --git-common-dir\\` 没回路径`（test:83）；**后绿**：passed；② **端到端钉子**（用 `subprocess` 起 `tools/pool_mcp.py`，**子进程 cwd = 临时目录**、**不设** `TF_POOL_REGISTRY`、`POOL_MCP_WRITE=1`，喂 `tools/list` + `tools/call pool_cancel {「card」:「999」,「confirm」:「999」}`）—— **先红**：回话正是线上那句「算不出主工作树」（断言 FAILED）；**后绿**：回话 `pool_cancel：本机登记里没有卡 999 的**活租约** —— 不动手。` 且 `tools/list` **8 个**（含两个写工具）→ PASS；★ **先红后绿做了两遍**（修复前跑 = 红；修复后再「临时撤掉 `cwd=`」跑一次仍是那两条红，随后恢复）；③ 号池五个测试文件 **87 passed**（0 failed / 0 error）；④ 门禁同款 `ruff check src tests scripts tools examples harness` → `All checks passed!`（仓级 `ruff check .` 另报 5 条，全在未跟踪且门禁不扫的 `gates/diag/gate_lock.py`，动手前就在）；⑤ 测试**自收尾**（kill 自起的服务进程）、卡树 `git status` 只有这两个文件、**没往真 `gates/diag/` 写一个字节**。**★ 该改但不属本卡**：`tools/wb_dispatch.py:1391` 的 `taskkill` 同样没有 `cwd=` —— **按 PID、与 cwd 无关，不必改**（工人核过，主控认）。**★ 本笔另含一处补账（同一提交）**：`docs/workbacklog.toml` —— 把 108~114 七张卡的登记与状态（108/109/110/111/112/113 标 `done`、114 本笔）与 `[base] reviewed` 一次收干净；此前它一直是主树里**唯一**的未提交改动（也是每次派活前「主仓脏」提示的来源）。"


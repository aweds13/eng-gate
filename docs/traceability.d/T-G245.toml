gaps = "**来路（三件都是**现场咬过**的）**：- **卡 141**（死掉的工人不还租约）：今晚**第四次**现场 —— 143/144 的续跑被「死工人留下的活租约」拦住、我自己被打断的几次派活也留下三条活租约，每次都是**主控手工** `registry.release` 才继续。★ 同族的门禁锁在卡 118（`T-G216`）之后早有 **`atexit` 兜底、任何退出路径都还**，工人租约也该有。- **卡 147**：**卡 140 自己发现的后门** —— `tools/wb_verify.py` 查 `EXPECT_GATES=17` **会**拦部分跑的 `last.json`，但 **`tools/wb_review.py` 只查 `ok`/`rev`/每门 `exit_code`、不查门数** ⇒ 有人把 `--affected` 那一趟的 `last.json` 提交上去，**复核主链可能不拦**。- **卡 148**：用户反馈「**一直在蹦命令行窗口**」 —— 主控逐层查证：派活器 `--detach` **已带** `DETACHED_PROCESS|CREATE_NO_WINDOW`（`T-G96`）；工人 CLI **自己**起子进程带了 `windowsHide: true`（在它 dist 里数到 **240 处**）；★ 但 **`tools/pool_mcp.py` 那个起「收申请」子进程的 `Popen` 没带** —— 而它跑 `wb_task.py claim`，**可能连带整趟门禁**（pytest/bash/浏览器）⇒ **一次能闪一串**。**做法（三张卡各自在自己的树里干；主控按文件收口）**：- **141**：把「还租约」放进**正常/异常退出路径**（含 `kill_tree` 之后、看门狗掐掉之后、任何异常早退），照门禁锁那套用 **`atexit` 兜底**；`--detach` 那条放在**那个脱离子进程**的退出路径上；★ 还要**扛得住被强杀**（陈旧租约要能被清 —— 判据不够就**如实说**，别自己发明按 pid 判死活）；五条钉子，含「**别人的活租约不许被误清**」。- **147**：`wb_review.py` 补「**这一笔所依据的 `last.json` 必须是全量那一趟**」——门数**从 `run_gates` 的门表读**（★ **不许写死 17**、**不许再造第二份门表**）；或对 `affected.enabled = true` **判红/标注**；四条钉子，含「**桩掉门表 ⇒ 跟着算**」那条防第二份真源。- **148**：新增 **`tools/pool/no_window.py`**（「不弹窗」flag **收敛成一处**）+ `pool_mcp.py` 用它；**审全仓**并列清单；★ 加一条**扫描钉子**（`tools/**` + `scripts/**` 里起子进程没带不弹窗 ⇒ **红并逐条点名**，例外**显式带理由**）。**★ 本笔的关键现场（环境变了，值得记）**：① ★★ **今晚把「CLI 与界面是两套登录态」查清了**：界面（WorkBuddy）的登录态在 `~/.workbuddy`，而**CLI 根本不读它**（我把界面那份**连 Cookies 一起完整拷出来**做成 profile，起来仍是「**未登录**」）；CLI 的登录态在**它自己的家**里 ⇒ ★ **换号的正确做法 = 给 CLI 一个自己的家（`USERPROFILE`/`HOME` 指到沙箱）+ 在那个家里登录**；② 于是这三张卡**跑在备用号上**（我自己的号被 429 限流到 **10-03 13:03**）：派活时把那组变量给工人进程，★ **外面那个号一字未动**（指纹核对过）；备用号探针返回完整会话（**不是 429、不是未登录**）；③ 派活途中被闸拦两次：**死租约**（第 4 次，见上）与**内存闸**（一次可用 0.2 GB、一次瞬时读成 **0.0 GB** —— 腾出后重派即过）；④ ★ **我的同类漏项第 7 次**：卡 147/148 的**规格**里写的是任务 `B-BACKDOOR`，而我的**预声明**用的是 `B-LEASE`⇒ **两个名字都没注册** ⇒ ★ **三张卡的成送申请全都没交成**（它们**如实报了**「没交成」）⇒ 现已按规格补注册 `B-LEASE`(141) 与 `B-BACKDOOR`(147/148)。**验收（工人自验 + 主控复核；全量门禁与审计见 trailer 与提交之后的 audit 段）**：四个目标测试文件（`test_wb_dispatch` / `test_wb_review` / `test_no_window` / `test_pool_mcp`）**217 passed** ·`ruff check tools tests scripts` = **All checks passed!**。**★ 老实说**：① ★ **成送申请是在落地之后由主控补交的**（卡尝试交的时候任务还不存在）—— 这**削弱了「卡自报」这条链**，如实记；② 148 的**审计清单**与**扫描钉子的例外名单**需要人看一眼（哪些「确实要给人看」的交互式子进程被列进例外）；③ 本笔**不改**任何放行判据（申请必须带证据、既有守卫、收口唯一写者都一字未动）。**★ 本笔另含**：`docs/workbacklog.toml` —— 卡 141/147/148 归到 `T-G245` 并标 `done`。"


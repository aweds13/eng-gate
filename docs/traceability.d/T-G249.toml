gaps = "本笔落卡 149（派活器 `--account`）。★ 诚实缺口四条：1. **它只把「手打六个环境变量」变成「给一个名字」** —— 号池那边的 profile 体系（仓外的 `infra/pool/codebuddy_accounts.py`）**一个字没动**（只调不抄）。2. ★ **本卡没交「两个号并行派活」的现场读数**：卡的标题是「两个号并行派活」，而本笔的产物是「**指定 profile**」；**同一时刻两个号各跑一张卡、互不干扰**这件事，本笔**只提供了能力、没有实测证据**。★ 这一条我不替它圆。3. **没有切换默认值**：不给 `--account` 时行为**逐字不变**（卡的硬要求）⇒ **今天的派活姿势没有任何变化**。4. **禁区守住**：没动 `infra/`、没动 `tools/` 里别的文件、没 commit、没跑全量门禁。"


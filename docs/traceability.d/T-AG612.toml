gaps = "1. 请求路径上仍然 fail-open：`apply_strategy` 收到不认识的名字只退恒等、不抛也不记一行。名字该不该被接受由启动面拦，但**运行中**若有人改 `_Server.routing`，静默仍可能发生。指针 `tools/pool/gateway.py`2. 名字表只覆盖 magpie 的九个值 + 本仓别名；原件 `provider.PluginRouting` 的 `<plugin>/<name>` 本仓**没有**插件路由，`parse_routing` 只“明说不支持”，不是实现。指针 `tools/pool/route.py`3. `--routing` 仍只在网关命令行上生效：`tools/wb_dispatch.py` 的派活链不走 `_order`，`smart` 对真派活**零影响**（E94「四路由默认关」的口径没动）。指针 `tools/wb_dispatch.py`"


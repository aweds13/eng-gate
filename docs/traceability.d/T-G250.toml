ived` 打印三态各一行⇒ **回退后 `git status --porcelain` 为空**；**未跑门禁、未提交、主仓一字未动**，临时 clone 已删。工人：第 1 次尝试、退出码 0、**正常收工**、用时 **23.3 分钟**、回合 35、工具 39 次、碰过文件 8 个、**工具报错 0 次**；域内只动了 `tools/wb_land.py`、`tools/pool/landing.py`、`tests/test_wb_land.py` 三个文件。**★ 老实说**：① **边界**：rebase 冲突那条路（`resolve_derived_conflicts`）**未加回退** —— 它走幂等汇总器、**理论**无此问题，**未验证**，如实写；② **边界**：钉子 ⑧/⑨ 用**故意失败的 `stage_card` 桩**把现场冻在 **⓪ 之后**（比卡里括号说的「桩住门禁」**冻得更早**，观察点等价）；**幂等钉子走桩路径**（`sync_docs` 桩带真合并语义），**没跑真全量链**；③ **边界**：**`--commit-only` 不回退**是**本卡内**定的口径（它要提交的就是上一趟文书）；若主控希望它也回退，**需另立卡**；④ ★ **成送申请是主控在落地前补交的** —— 规格里写的任务名 `B-IDEMPOTENT` 当晚**没预声明**（batch 目录里确无此文件）⇒ 工人**交不成**，它**如实报了**「没交成」。这是**同类漏项第 9 次**，如实记，不美化。⑤ **该改但不属本卡**（工人自己提的根治方向）：**派活时校验预声明文件存在** —— 发卡前查 batch 文件，缺就拒发，可省掉整轮白干。- ★ **内存闸例外（留痕）**：跑这一趟集成时本机可用内存只有约 **2.7 GB**（`UltraRAG` 那套服务占着 2.7 GB+），低于默认阈值 4.0 ⇒ 主控显式 `TF_GATE_MIN_FREE_GB=2.5` **放行**，并同时用 `TF_PYTEST_WORKERS=1`（阈值 4.0 是按 4 worker 跑全套定的；**1 worker 的实际占用只几百 MB**）。★ 这不是跳过门禁：**全量门禁照跑、17 道门一道不少**，只是把闸门对齐到真实占用。"


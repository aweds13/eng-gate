gaps = "1. engineering 的 GHA 快照上仍有一道门是「本机绝对路径」内债，与本卡无关但会咬下一趟读数：tests/test_pool_limits_data.py:41 的 DOCUMENTED 常量写死仓外号池目录的绝对路径，runner 上必然红（eng-gate 快照那一趟的唯一红门）。指针 tests/test_pool_limits_data.py 与 gates/enggate-logs/win-136403301980.log2. [workflow].install 这根骨头今天没有真使用者：本机 token 无 workflow scope（推 .github/workflows/** 一律 remote rejected），om-gate 自己树里带着 8 份 ci.yml 不需要装 ⇒ 只有单测覆盖，没在真跑里验过。指针 scripts/cloud/gha/build_snapshot.py3. OpenMAIC 那条腿的 vitest 读数不是本构建器打的，是它自己 ci.yml 的 unit 作业（骨架不认识 vitest）；快照是 --force 推的镜像，历史不连续，不能当备份。指针 docs/subsystems/ci/GitHub-Actions-云门禁.md4. sync.mode = tree 是为浅克隆准备的（bundle 会打 did not send all necessary objects），代价是快照提交写成 base: working tree snapshot，与源仓没有共同祖先。指针 scripts/cloud/gha/profiles/openmaic.toml"


gaps = "1. 只修了**说法**，没修**id 口径**：号池侧是 `provider/model`（如 `huaweicloud-maas/GLM-5.2`），派活器侧是裸名（`GLM-5.2`），两套名字之间没有映射 ⇒ 交集空不空与派活能不能派，仍是两件互不校验的事；今天只能靠人眼看两行字。指针 `tools/pool_mcp.py`2. 新鲜度三态只落在 pool_models 的**人话段**，别的读面（quota_status、看板）仍只在机器块里带快照时间 ⇒ 「过期」这件事在别处还是静默的；技能层 `skills/softeng-manage/references/asset-layers.md` 第 80 行还在教人「看批准集 ∩ 可用集」（不在本卡卡域，挂账）。指针 `tools/pool_mcp.py`3. 派活允许集是每次 tools/call **现算**（读注册表 + 一次性授权 + 开关文件），读不出来时如实说「读不出来」但没有「上次读到的是什么、什么时候读的」⇒ 注册表坏掉的那一刻，人只能知道现在没答案，不能知道昨天有没有答案。指针 `tools/pool_mcp.py`"


  """度量表里「最近一份跑完的」与「单次派活墙钟」两行按判据 4 退化成口径句（只写怎么取、不写死数字）—— 这两行仍然不是现算值，读者看不到具体数字。为什么本卡不做：这两项要真跑一趟派活才有读数，属派活器那一侧，本卡只治「能现算的必须现算」。

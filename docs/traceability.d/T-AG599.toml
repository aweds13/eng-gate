gaps = "- 三家平台的真实响应是用参考实现的存档夹具喂进去判的，**没有**本机真凭据打过的记录（本机 7 个平台 token 环境变量全空）；形状对不等于手上那个号真能领 —— 真机那一趟仍缺，判据见 `复盘/卡/卡E91-号池签到与额度对齐真机.md` 第 1 条。- 本机 codearts 的凭据文件里只有两个键，没有安全令牌那一项 ⇒ 需要安全令牌的路径仍未验证；`tools/pool/platforms.toml` 的 `token_env` 已按本机真名排在最前，但那条路径没有样本。- Meoo 凭据是 OAuth，池只读 accessToken、不刷新（`tools/pool_accounts.py` 的文件型 token 分支）⇒ 过期就只能报 uncertain，实测过期时回 401 已复现一次。- qoder 与 minimax 本机没有号 ⇒ `tools/pool/checkin.py` 里两条客户端只能靠参考实现的形状判，没有号就没有反向样本。"


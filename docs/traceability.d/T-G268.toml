gaps = "本笔落**用户两步走的第一步**产物：五个便宜工人（`deepseek-v4.1-flash`，默认 High）按层**想出来的 148 条具体问题**（五份清单）。★ 诚实缺口五条：1. **只有问题、没有答案** —— 这一步**故意**不给答案：答案是第三步「问 MCP」的事。清单里每条都带「**为什么它会咬人 / 该由谁回答 / 什么证据能把它了结**」三个字段（各卡规格要求）。2. **本笔攒批**（五张卡一笔提交 / 一段文书 / 一趟门禁）：五张卡是**同一件事**拆给五个工人并行干、产物同构。之所以不留成五笔，是因为**本机内存长期只够 2.5 GB 上下**，五趟全量门禁（每趟 5~8 分钟、每趟都要 ≥2.5 GB 可用）在这个约束下既是浪费也是风险。★ 用的是 `--batch` 的**攒批通道**（它本来就是为「同一板块若干小改攒一批」设计的），不是把五笔合并蒙过去。3. **成送申请是主控回填的**：五个工人都**正常收工**（`subtype=success`）却**一张申请都没交**（`B-Q168…B-Q172` 一直 `collecting 0/1`）。这已是当晚**第 10~11 次同族**——工人的「收工侧漏交」这条缝**今天仍然没治**（卡 157 治的是写卡侧的预声明登记）。4. **主控自己写的两份种子/索引也在盘上**：`复盘/问题清单-分层.md`（种子）与 `复盘/架构索引-分层图.md`（12 层实况）—— 它们**已随 T-G274 落进 git**，本笔不重复落。5. **五份清单一条都没进过门禁**（工人只许写文件、不许 commit）：本笔是它们**第一次**过全量门禁。"


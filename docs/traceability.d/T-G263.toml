[entries."T-G263"]
id = "T-G263"
title = "锁与租约的接线：续租线程 + 去掉硬编码 --stale-after + prune/first_attempt"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/pool/landing.py",
  "file:tools/wb_dispatch.py",
  "file:tests/test_gate_lock_lease.py",
  "file:tests/test_wb_dispatch.py",

gaps = "1. `scan_jobs()` 的第五类「台账已完结」要靠调用方把 `backlog=` 传进来；今天只有 `tools/pool_mcp.py` 的 `job_list` 传了，`tools/pool/registry.py`、`tools/pool/trae_dispatch.py`、`tools/wb_status.py` 三个调用点没传 ⇒ 同一份日志在不同入口可能落进不同的桶（`断了` vs `台账已完结`）。本卡只把读面那一面统一，三个内部调用点维持原状 —— 这是已知分叉，不是没发现。指针 `tools/pool/registry.py`2. `job_status` 查正式证据时，第 ⑤ 类只读 `docs/traceability.toml` 的 `entries` 一张总表；本仓现在只有总表所以成立，将来若把它像 `docs/workbacklog.toml` 那样拆成分片，这一类会在分片仓里静默失效（其余四类不受影响）。指针 `tools/pool_mcp.py`3. `land-<card>[a-z]?.log` 这条规则按卡规格写死成「只许一位小写字母」：a→z 共 26 次落地都认，但第 27 次或有人写成 `land-E116-x.log` 就静默漏掉，退化成「查不到正式证据」。放宽会串卡（实测 `land-E1` 会命中 29 张），所以本卡选择宁可漏也不串，漏的那天靠人在日志里看见。指针 `tools/pool_mcp.py`"


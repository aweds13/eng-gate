gaps = "- 攒批粒度比单卡粗：这批是 F6/F7/G5 三张卡合成一笔提交，要回滚就是回滚一批；成员卡的「自己落地了没有」由落地链按「产物 ∩ 暂存清单」判定，不在人手里（规格 复盘/卡/卡F6-文档门成立与索引重建.md）。- 文档门第一版用 `--mode report`（有债不红、基线被顶破才红），债的真值仍在 152 死指针 / 434 漂移上；`复盘/` 769 篇零 frontmatter ⇒ 判据 3 在这片上只能靠正文句式，同一事实两处口径（规格 复盘/卡/卡F6-文档门成立与索引重建.md）。- `复盘/INDEX.md` 正文宣称的 `--write` / `--extract` 两个旗标在六支生成器里**不存在**（只有 `--preview` / `--sample` / `--only` / `--show` / `--id` / `--all` / `--full` / `--top` / `--grep`）—— 入库的是生成器本体，索引正文与它的口径差这一处仍留着（规格 复盘/卡/卡F7-复盘索引生成器入库.md）。- 「别仓路径」这一档判据只按扩展名划界不够：`OWN_EXTS` 含 `.js` 与 `.md`，于是真·别仓的 js/md 引用仍被算成本仓死指针（实测 3 条，全在 `复盘/` 证据层），要开卡收（规格 复盘/卡/卡G5-技能去陈旧与退出码诚实.md）。"


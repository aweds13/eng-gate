gaps = "本笔落卡 160（台账接进门 + 封存树/提交树对账），**并修掉落它时挡住收口的两条根因**，**外加两处必然连带**（默认阈值 · 台账指针迁移，用户当场点头的域修订）。★ 诚实缺口十二条。① ★★ **这 9 个文件是重做的，不是第一轮的原件**：第一轮的成果被主控自己的攒批工具覆盖掉 6 份（旧规则「主树有就从主树拷」，而 `--evidence` 里那几份**正是工人改好的产物**，主树那份是旧 HEAD）。抢救分两路：3 份从 `git fsck` 的悬空对象恢复（工人自己 `git add` 过：`tools/wb_review.py` / `tests/test_wb_review.py` / `复盘/不变量台账.toml`），6 份由**同一个工人**照**它自己的会话日志**（`gates/diag/wb-160.jsonl` 里每次 Edit 的原文）重放。⇒ 功能等价**有论证**（同一规格 + 同一日志 + 同一工人），但**没有「与丢失的原件逐字节相同」的证明** —— 原件已不存在。★ 自动回放先试过：37 处能应用、9 处锚点失配（会级联）⇒ 判「半复原比重做更危险」改重做；**这条判断是主控的判断，没有独立判据**。② ★★ **`_batcher.py` 与「卡树才是真源」那一类落地不兼容**：它的 step ① 已经按「谁是真源」把文件分成两类（只有 `--docs` 从主树拷），但 step ② 对 `--allow` 里**每一项**又要求「主树那份与卡树那份逐字节相同」。而工人产物的主树那份**必然是旧 HEAD** ⇒ **拿它落工人产物必停在 step ②**。本笔因此**没有用** `_batcher.py`，改用收口配方手工做（拷文档笔 → 逐文件核对 → 撤主树 → 落地）。③ ★ **`wb_review.py` 的第 ⑥ 档要在「卡树自己那份」上跑**：`ROOT` 由文件位置决定，在主树跑它 ⇒ 它读的是**主树工作区**，却把结果标成「卡树实际改动」⇒ 主控第一趟拿到 **9 条假的域外**（全是主树的文档笔）。★ 工具本身没坏（在卡树里跑 ⇒ **域外 0 个 ✓**），坏的是**我用错了对象** —— 与今晚记的「规则/判据写对了，但没作用在我以为的那个对象上」**同族**。④ ★ **工人自报的「审计三条确认真跑」主控没有独立复跑**（`check_commit_trailers` / `check_contract_ops` / `check_spec_child_cards`）。⑤ ★ **新判据 `check_seal_tree()`（封存树 vs 提交树正面对账）的误报率没有独立验**：它的口径自称「只对真产物判红、旧笔只标注」，门禁里跑它的用例，但「会不会误报」要靠真实历史笔才看得出来。⑥ ★★ **本轮的预算判决是「止损」**：`wb-160.verdict.txt` 记 `input tokens 累计 42,165,276 ≥ 预算 25,000,000 → 止损，不自动续跑`。它**已经干完并交了申请**（退出码 0、末事件 `result`），所以这次没砍掉成果；但读数说明这张卡的预算是**事后**才判的 —— 中途**没有任何东西拦它**。⑦ **门数 17→18 的影响面**：本次扫过 `.py / .md / .toml`（排除 `gates/logs`）—— `EXPECT_GATES` **已无残留**；仍在说 17 的只有 `docs/changelog.md` 与 `docs/traceability.toml` 的**历史条目**（追加型记录，不该改）。★ 但这是我的**扫描面**，不是「全仓穷尽」的证明。⑧ 工人还留下 3 份**派生物**（`docs/changelog.d/T-G260.md` 等）—— 那是**收口链自己的产物**，不计入它的声称。⑨ ★★ **落这一笔连红三趟，三趟的红都不在卡 160 的原域里**（卡 160 一个字没碰 `wb_dispatch.py`）。两条根因已**第一手复现**并在本笔修掉（见 changelog）。★ 但**「修好了」的证据是**：改了之后 `tests/test_wb_dispatch.py` **170 passed**（**4 worker + 4 路 CPU 满载**下，退出码 0），不是「反复重跑到绿」。★★ 顺带查实：**T-G194 当初把那条假红归给了 `gates/**` 与未跟踪文件**（它的注释里写着「少了而不是多了」）⇒ **修在了错的对象上，真凶（兄弟门在改一个真文档）一直活着** —— 也就是说，这条假红在今晚之前**至少骗过一次人**。⑩ ★★ **两条顺带查实、本笔没修的**（不在本笔的域，留档）：· `_snapshot.py` 用的是 `git stash create`，**对未跟踪文件是瞎的** —— 卡 180 的 9 份产物（全未跟踪）它报的是「工作区干净 ⇒ 无需快照」；· `wb_dispatch.py --detach` **挡不住换窗口** —— 180/181 的派活器随旧窗口一起死了（现场与证据见 `gates/diag/_HOLD.md` 18:5x 那节）。⑪ ★ **启动宽限的代价如实写**：零输出的工人从「起手就掐」变成「过了 60 秒宽限再掐」。生产阈值 `STALL_SECONDS = 480 > 60` ⇒ **生产口径一个字没变**；但**如果有人把 `--stall-seconds` 调到小于 60**，那档就再也不会「起手掐」 —— 这是本笔**换来的东西**，写在这里，免得以后被当成「一直如此」。⑫ ★★ **第 4 趟红是「本笔自己引入的连带」，值得单独记**：本笔把 `scripts/check_layers.py` 里一行实现改了，而 `docs/traceability.toml` 的 `T-G127` **用整句正文钉着那一行** ⇒ 审计红、收口被挡。★ 这条**不是新坑** —— 本仓 §22⑤ 与 **INV-77** 早就立了口径（指针要指**语义锚点**），且 INV-77 的 note 明写「存量钉整句的指针未逐一迁移，改到对应文件时逐条换」。⇒ **教训**：改任何被判据钉着的实现之前，先跑 `python -X utf8 tools/evidence_map.py --stale`（或 `pin_check --literal`）——**门禁会告诉你，但那是四趟门禁之后**。★ 另：这一趟也**又一次**验证了那条老坑的价值 —— 门禁失败后手工复跑审计会看到 ⑪ 的三条假红（`last.json` 滞后一拍），**先把门禁产物还原到 HEAD** 才看得见真因（本笔照做后 audit 立刻 0 项失败）。⑬ ★★ **一条结构性缺口（本笔现场撞出来的，值得单独立卡）**：INV-77 写着「存量钉整句的 `text:` 指针，**改到对应文件时逐条换锚点**」—— **这条路径在当前收口链下走不通**：`docs/traceability.toml` 是**派生文件**，收口链的 ⓪（`reset_derived`）会把它**退回 HEAD**（与 `docs/changelog.md` / `复盘/交接-重构进度.md` 同一批），而 traceability 片段**只能追加条目**（`tools/sync_docs.py::_merge_traceability` 就是 `base + 换行换行 + 新条目`），追加同名条目会撞 `Cannot declare … twice` ⇒ **存量条目的 evidence 根本改不动**。★ 本笔的处置（如实、非默认路径）：照 ⓪ 自己的代码先清派生物（直接调 `pool.landing.reset_derived`）→ 再打补丁 → 再**以 `--no-reset` 收口**（★ 该旗子**只**跳过 ⓪，**不关任何门**）。★ 真正该有的机制是「合并件里**存量条目**的修补 / 覆写通道」（例如让片段支持 patch 语义），**本笔没做**。★ 另一条同族观察：**审计失败后手工复跑之前必须先把门禁产物还原到 HEAD** —— 否则 ⑪「封存未跟踪清单」会拿本趟刚写进去的片段报三条**假红**（本笔先踩到，还原后 audit 立刻 0 项失败）。"


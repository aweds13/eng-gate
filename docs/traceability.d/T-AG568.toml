  """`tries` / `handed_on` / `stop` / `tier_*` 四样只在 pool 的**续跑循环**语义下成立，与 magpie 的**路由重试**不是同一层：magpie 的重试是「换上游再试一次」，pool 的续跑是「同一个工人带同一会话接着干」。`Tries` 在 pool 侧实为「续了几轮」。
magpie 有 `RouteID` 能把同一次请求的多个 try 串起来；pool 没有这种 id，只能按「同卡、连续轮次、前一轮 `handed_on`」串 —— **这是弱口径**。若将来出现「同卡并发两条流水」或「轮次跳号」，这个串法会错，届时要加显式 id。
429 三拍那段（A351 的地盘）今天**低估 `handed_on`**：它的判断在写行**之后**才解析（`quota_error(round_lines)`）⇒ 那一轮 `handed_on` 留在 `False`。补写就是二次改写（判据 2 明令禁止），所以只在 `wb_dispatch.py` 的注释里标明，没有补。

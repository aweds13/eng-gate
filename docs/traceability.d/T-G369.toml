gaps = "① ★ **⑨ 盖章前必须先看「成员自己交没交申请」**：产物与本笔提交有交集、**但该成员没有成功申请**（且没被豁免）⇒ **拒盖章并点名**，原话要点「该卡可能未开工或未交申请；⑨ 不许代写申请、不许盖章」。指针：`tools/pool/landing.py`。② ★ **`landed` 的前置同样收紧**：任一非只读成员没有自己的成功申请 ⇒ **不标 landed**（不许因为「产物交集在」就标）。指针：`tools/pool/landing.py`。③ ★ **老调用形状不许变**：`claims` 传 `None` 时**只验产物**（卡 238 的老行为一字不变）⇒ 免得把既有落地判据搞红。指针：`tools/pool/landing.py`。④ ★ **反例判据**（新文件 `tests/test_landing_stamp.py`）：造「两成员 paths **相同**、只有甲有申请、乙没有」的假栅栏 + 假提交 ⇒ 断言**不标 landed**、**不替乙写申请**、输出**点名乙**；既有行为（两成员都有申请且产物都在）⇒ 照旧盖章。指针：`tests/test_landing_stamp.py`。"


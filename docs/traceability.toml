gaps = "**为什么有这张卡**：并行五张卡实测三条结构性病灶 —— ①固定端口（render 8531/8532、ui_flow 8541~8544）多树排队等端口（059 约 45 分钟纯等）；②清端口按进程特征（serve.py --fresh / tf-flow-profile-）不认哪棵树 → 058 清端口把 059 正在跑的 render_check 一起杀了；③全量门禁超工人 CLI 的 10 分钟单次调用上限 → 调用被掐 → 服务/浏览器变孤儿。**做了什么（不设新变量时端口/门数/复用键/黄金/last.json 形状逐字不变）**：①新增可选 TF_GATE_PORT_BASE，run_gates 构造命令行时透传 --port 给 render（BASE）/ui_flow（BASE+10），render_check.mjs/ui_flow_check.mjs 已支持 --port；lf1_live（free_port）/web_live（T-G47 自动挑空闲）保持自动挑、ui_dom_probe（假 DOM）不用端口，均未动；②开场清遗留判据 = 端口段 ∩ cwd=本树根（_is_our_tree），只掐本树在本段端口上的 LISTENING 进程与其无头浏览器（_is_orphan_browser：镜像名像浏览器且命令行含本段端口/ profile 名），幂等有读数不静默，实现里无任何按 serve.py --fresh 匹配就杀的写法；③pytest worker 数读 TF_PYTEST_WORKERS，不设 = min(4, cpu)，xdist_available 与没装就串行的口径一个字不动。**真事故（本卡自撞，成了双判据的来由）**：只按端口的初版在默认（共用）端口段把 .wt/left1（卡 060，正握锁跑全量）正在跑的 render/ui_flow 一起掐了 —— 其 gates/logs/render.log 与 ui_flow.log 尾巴是 node 的 unsettled top-level await、两门 exit 13、last.json ok=false；加 cwd 树判据后对 left1 的活进程全打印不是本树→不动、对本树进程（serve.py --fresh --port 8543，cwd=本树根）照掐。**边界（如实写）**：gates/reuse.json 与 gates/last.json 每棵树各一份 tracked 副本 → 端口隔离不会造成跨树假复用；门禁锁仍是跨树一把（gate_lock 的 gate_ports 只让忙端口报告跟随 TF_GATE_PORT_BASE，向后兼容）；清理只在全量档跑（--quick/--fast 不起真机服务）；TF_GATE_PORT_BASE 非法（非整数/越界 1024..65500）→ WARN 并退回 8531；真并行证据用浏览器层双段并发，未在同一棵树同时跑两个全量 run_gates（会互写 last.json/reuse.json/.coverage 且违反重活不许并发）。**没动**：src/**、docs 其它文件、tools/render_check.mjs 与 ui_flow_check.mjs 的行为逻辑、tools/ui_dom_probe.mjs、tests/**、.wt/**、主树三个外来未跟踪文件、data/ 与真实库/备份。"


gaps = "**发现人**：卡 001 的独立复核（`gates/diag/wb-review-T-G79.md`，33 条 check 里 3 条 FAIL），主控独立复现（`gates/diag/probes/myday_noop_write_check.py`）。**事实**：T-G79 的文档与提交信息写着「拖到自己前面 / 已在头尾按 ↑↓ …也都不写库」——**那句是错的**：那三种空转把今天清单**每一行**都写了一遍（`version + 1`），并把「没拖过 = NULL」冻成显式 `1..N`（探针量到 3/3 行被改）。**为什么是真缺陷**：① 一次空转就把「没拖过」这一态抹掉，之后分不清哪些是没拖过的；② 跨端合并按 `version` 判谁新，空转抬高 `version` 却不改 `updated_at` → 真改动更容易输给这些空写。**根因**：`place_myday()` / `move_myday()` 的第一句都是 `_myday_sequence(conn)`，而它会「读顺序 + 把每行写一次号」—— 归一化写在了**读路径**上。**修法（只动 `core/tasks/manager.py`）**：① `_myday_sequence()` 改成**只读**（`return myday_tasks(conn)`）；② 新增 `_myday_rank_plan()` / `_apply_myday_order()` —— **顺序没变就一个字节都不写**（空转 0 写），变了也只写**排过号的那一截**：从 `order` 尾巴往前找**最长的一段**（全是不带号的行、且在里面仍是老口径次序），这段尾巴**一个都不写**（「不许把没动过的 NULL 冻结成序号」），头重排成 `1..m`、本来就等于目标号的跳过。**反证（做了才算数）**：新增 `tests/test_myday_idempotence_line.py` **7 条**（判据是数出来的：直连库取 `{id: (myday_rank, version)}` 前后逐行比）—— 改实现前 **6 failed / 1 passed**，改后与 `test_myday_order_line.py` 合计 **19 passed**；主控探针复跑从「3/3 行被改写」变成「**0/3**、结论=站得住」。**外加一次性验证**（不进仓库）：随机 400 组配置跑 `place_myday` / `move_myday`、独立算期望顺序比对 → **400 次动作 0 问题**。**边界（如实写，不假装做到「只写换位的那一行」）**：一次**真拖**仍是把**排过号的那一截**整截重排成 `1..m`；要做到「只动换位的那一行」得把序号改成**有间隙**的（sparse index）—— 那是另一张卡的事。本卡消除的是**空转整表重写**与**冻 NULL**。**顺带更正**：`复盘/拖拽排序-T-G79.md` 那句错话 + `tests/test_myday_order_line.py::test_leaving_today_clears_the_rank_and_coming_back_goes_last`（原来靠「拖一次 → 整份清单都写号」制造前提，结论不变、走法改成真换位置那条）。**没动的**：`src/web/**` 一行没改、`api/app.py` 路由语义（两键规则 / 400·404 次序 / `myday_rank` 不进 PATCH 白名单）一字不改、`_MYDAY_ORDER_BY` 与 `myday_tasks` 的排序口径一字不改、`move_doing` 一个字没改、`T-G71` 的多写扫描器没改（调用方那步 `conn.commit()` 与 `_write_myday_rank` 的自提交都留着，与扫描器模型一致，所以 `test_unit_of_work.py` 的冻结清单不必动）。"


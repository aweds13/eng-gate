gaps = "**等价（逐字节）**：冻结输入（把 gates/diag/wb-088.jsonl 与 wb-usage.jsonl 复制成只读冻结夹具、自造富事件 jsonl 走 FAILED/断言/项目栈帧非空段、冻结 backlog 夹具）下，原件 tools/ 四件 vs 复制体 harness/ 四件共 14 路（wb_plan 的 check/plan/stats/worktrees/dispatch 五子命令、wb_status 两夹具含 --json、wb_diag 两夹具含 --full --exit-code 7、富夹具 status/diag）stdout 全部逐字节相同；wb_state 现场板固定在无锁状态背靠背跑，均 878B 逐字节相同（有锁时锁行含秒数属易变字段，故取证避开）。**可独立**：临时目录只放 6 个 py（含 manifest）+ harness.toml、不含 tools/，PYTHONPATH 清空、探针证实 sys.path 无 tools/ 项、wb_diag 的兄弟 import 落在临时目录 —— 6 路确定性输出与仓内原件逐字节相同；wb_state 与同等剥离的原件对照目录相比，唯一差异是锁脚本缺失时【Python 解释器自己】报错里带的各自绝对路径，叶子目录名归一化后 1039B 逐字节相同。**配置真被读 + 写错报错**：HARNESS_TOML 把 paths.workbench 由 tools 改 wb99 → pending 夹具 dispatch 输出由 tools/wb_dispatch.py 变 wb99/wb_dispatch.py；backlog 指向不存在路径、删掉 paths.gate_lock、ledger 拼成 ledgre 三种错法均退出码 2，stderr 以 [FAIL] 指名键名/配置文件/合法键（原文已留证）。**grep**：harness/*.py 里的 tools 仅剩 docstring/注释与变量名 tools（语义是「工具调用」、非路径），无 sys.path 挂载、无 import tools。**tools 零改动**：git status --porcelain tools/ 与 git diff --stat -- tools/ 均为空。**接线**：run_gates.py 仅 ruff 目标加 harness/（同一条语句折成两行物理行，git diff 仅此一处），ruff 全绿；tests/test_harness_manifest.py 新增 15 个用例全绿，覆盖缺文件/坏 TOML/缺段/缺键/未知键/未知段/空值/非字符串/must_exist/绝对路径/HARNESS_TOML 旁路。harness/README.md 3069B（≤3KB）。**未做（下期）**：6 个重工具 wb_dispatch(13)/wb_verify(9)/wb_brief(5)/wb_dash(5)/wb_review(4)/wt_prune(4) 的复制抽空，以及退役原件所需的台账证据迁移。"
[entries."T-G185"]
id = "T-G185"
title = "修 wall-clock 定时炸弹：离线建任务的初始状态改按事件时间 at 判定（phone_check 基线红 14 项转绿）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:src/web/offline.js",
]
gaps = "**症状**：`pytest tests/test_offline_phone_line.py` 在 base（dd2548c）上 **13 ERROR + 1 FAILED**，全部出自同一个夹具 `tests/test_offline_phone_line.py` 的 `phone`（第 54 行断言），它跑 `tools/phone_check.mjs` 校验手机包，校验器只报一项 `❌ 新任务的行不对`；那唯一的 FAILED（`test_phone_import_does_not_touch_machine_settings`）也是直接调同一个 `phone_check.mjs` 挂的 ⇒ 一处根因拖垮 14 个测试，且**与卡 089 无关**（干净 base 树同样红，主控对照实验证实）。**根因**：`phone_check.mjs:145` 要求 `status === '未开始' && is_myday === 1`，而生成侧产出 `status = '逾期'` —— `src/web/offline.js` 的 `taskRow()` 用 `localDay()`（= **真实系统时钟**，实测当天 2026-10-01）与 `due_date` 比较来定初始状态，而夹具把事件时间 `at` 固定成 2026-09-23、`due_date` 固定成 2026-09-30 ⇒ **同一个输入，日期一走过 2026-09-30 就自己变红**，是墙钟依赖型「定时炸弹测试」，属本仓反复吃过的 wall-clock false red 一类。**修法**：把判据从墙钟换成**事件自己的时间戳** `at`，即 `status: (due && due < String(at).slice(0, 10)) ? STATUS_OVERDUE : STATUS_TODO`（`+2/-1`），`at` 缺省时仍有 `localNow()` 兜底故行为不退化；`.slice(0,10)` 取 `YYYY-MM-DD` 与 `due_date` 格式对齐。**没有把校验器改松**：`tools/phone_check.mjs` 一字未动（`git diff --name-only` 只有 `src/web/offline.js`），也没有 xfail/跳过/删测试。**验收读数**（主控亲跑，不采信工人自报）：`pytest tests/test_offline_phone_line.py -q --no-cov` → **14 passed**（原 13 ERROR + 1 FAILED）。**边界（如实）**：只修了 `taskRow()` 这一处；本文件里 `localDay()` 若还有别的调用点**未逐一审**（超出本卡范围），墙钟依赖可能在别处仍存在。**来源**：华为码道 codearts 号池第二张真卡（卡 090，GLM-5.2，树 .wt/fixphone，base dd2548c）；★ 工人未提交，提交由主控做。"
[entries."T-G186"]
id = "T-G186"
title = "修两处负载敏感门：test_run_bg 墙钟断言改行为断言 + 门禁浏览器层改内部串行（满载不再假红）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tests/test_run_bg.py",
  "file:scripts/run_gates.py",
]
gaps = "**症状与判据**：主控三趟全量门禁的实测对照 —— 跑 A（满载、未复用）`pytest` 门挂 `test_run_bg::test_run_returns_immediately_and_status_polls_two_states`、`ui_flow` 门挂 2/26（**⑮ Obsidian 只读跳转**）；跑 B（多数门命中复用、**负载低**）两道门**都绿**；跑 C（满载、未复用）`test_run_bg` **还是同一条**，而 `ui_flow` 挂的是 1/26（**⑪ 备份与恢复**，**换了另一条**）。⇒ 两种签名：① 每次挂同一条 = **墙钟敏感**；② 每次挂不同条 = **竞态/时序**。这两道门让**任何**卡的提交在满载下都过不去（每趟白跑约 8 分钟 + 一次人工判断）。**修法一（墙钟）**：`tests/test_run_bg.py` 删掉墙钟断言 `assert elapsed < 1.5`（它把「这台机器此刻快不快」当成被测对象），改为**行为证据** —— `run` 返回后立刻查 status，子进程仍在 `state=running`（若 `run` wait 了子进程，这里只会是 done）；被测命令的 sleep 由 2s 调到 5s，并在注释里写明**那是被测时长、不是断言阈值**（没有靠放大阈值蒙）。**修法二（竞态）**：`scripts/run_gates.py` 的 `main()` 泳道段把**浏览器层（render / ui_flow）改成内部串行**（原来两个真浏览器实例同时跑，满载下争磁盘 IO/内存/浏览器资源，`ui_flow` 的「等元素就绪」抢不到时间片而误判稳定 —— 症状正是「元素 0×0 / 匹配 0 个 / 可见 0 个」）；轻门泳道仍与浏览器层并行。代价如实：总时长 ≈ render+ui_flow 而非 max，仍在 gate_lock 90 分钟预算内。**没动**：`run_gates.py` 的 `input_hash()` / `REUSE_INPUTS` / 门清单 / `staged_tree` / 封存指纹一字未动（`git diff` 只落在 `main()` 泳道那一段）。**验收证据（工人自测，主控已从派活日志逐条核对）**：① 自写负载器 `gates/diag/flake091_under_load.py` 起 28~31 个 burn 子进程（cpu=32）**在负载下三次**跑 `pytest tests/test_run_bg.py -q --no-cov` → 三次都 **5 passed**（15.1s / 26.6s / 11.7s，退出码均 0）；② `TF_GATE_PORT_BASE=8994 python -X utf8 scripts/run_gates.py --no-reuse` **连跑两趟**（`gates/logs/run091_p1.log` / `run091_p2.log`）→ 两趟 `pytest` 门均 **1578 passed**，`gates/last.json` **ok=True 且 rev=16af828**（= 本笔的父）。**主控独立复核**：`git diff --name-only` 只有 `tests/test_run_bg.py` 与 `scripts/run_gates.py`（加派生的 `gates/last.json`/`gates/reuse.json`）；`git diff | grep '^+' | grep -iE 'xfail|skip'` **无命中**（无作弊）；自己空载跑 `pytest tests/test_run_bg.py` → **5 passed**；未提交、未碰台账/changelog/复盘/`src/web/offline.js`。**边界**：`ui_flow` 的收尾是**结构性规避竞态**（串行化），不是逐条修那 26 条行为流的等待原语；若将来真机门变多，串行的时长代价会线性增长，届时应转而修等待原语。**来源**：华为码道 codearts 号池第三张真卡（卡 091，GLM-5.2，树 .wt/flake，base 16af828，耗时 3175s / 229 事件 / 102,026 tokens）；★ 工人未提交，提交由主控做。"
[entries."T-G184"]
id = "T-G184"
title = "复用口径与换行无关：input_hash 归一 \r\n → \n + 同内容跨换行一致钉子（华为码道 pool 首张真卡）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:tests/test_gates_reuse_line.py",
]
gaps = "**问题**：`input_hash()` 直接对工作区文件字节做 sha256，而本仓库 `core.autocrlf=true`、`.gitattributes` 只给 `gates/render/*.txt` 钉了 `eol=lf` —— 已跟踪文件在工作区里 CRLF 256 / LF 288 / 混合 5（主控实测），门禁输入正是这种混合（`src/web/app.css`、`tools/ui_flow_check.mjs` 是 CRLF，`tools/serve.py` 是 LF）。⇒ **同一份提交内容**在「CRLF 签出」与「LF 签出」的树里算出不同哈希，复用结论随存放形式漂移。与 T-G181（按**路径**排掉生成物）同族。**修法**：哈希前把读到的字节里的 `\r\n`（两字节序列）替换成 `\n`，即 `hashlib.sha256(path.read_bytes().replace(b\"\\r\\n\", b\"\\n\")).digest()`；**只动这一个两字节序列，孤立 `\r` 不碰**（那会改内容语义）。docstring 按 T-G181 的写法补全原因与代价。**没动**：`REUSE_INPUTS` 的 glob 宽度与门清单一字未动、`skip_reused` 语义未动、`staged_tree`/封存指纹未碰、`.gitattributes` 未动、`gates/render/*.txt` 未动。**主控亲验的性质**（同一路径分别写 LF / CRLF / 混合换行 / 内容真变，调 `input_hash()`）：LF=`2ea4465b4b8cc743` · CRLF=`2ea4465b4b8cc743`（**相等**）· 混合=`2ea4465b4b8cc743`（**相等**）· 内容真变=`01b53dfdc69e575e`（**不等**）。**用例**：`pytest tests/test_gates_reuse_line.py tests/test_gate_fingerprint.py -q --no-cov` → **26 passed**（既有 20 + 新增 3 = 23 于 reuse_line，另 fingerprint 3）；★ 直接 `pytest` 会报 `Coverage failure: total of 0 < fail-under=70`，那是 `--cov=timeflow` 与「这些测试只 import run_gates」的既有现象，**不是测试失败**，故加 `--no-cov` 取真数。`ruff check scripts/run_gates.py tests/test_gates_reuse_line.py` → All checks passed。**代价（接受的取舍）**：只改换行不改内容时复用哈希**不会**失效 —— 但本仓库已给 `gates/render/*.txt` 钉 `eol=lf`，「只改换行」本就是违规改动。**自愈**：哈希口径变了 → `gates/reuse.json` 既有记录失效一次，下一轮真跑后按新口径重落盘。**来源**：华为码道 codearts 号池（infra/pool）派出的**首张真卡**（卡 089，GLM-5.2，树 .wt/p089，base dd2548c，本笔的父为 16af828）；★ 工人未提交，提交由主控做。"


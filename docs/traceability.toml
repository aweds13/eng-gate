gaps = "**触发**：用户 2026-09-25 选「用 DSH 接一次」（D 组那条人工项）→ 要给他一条**能真用**的客户端配置，于是先按客户端真实的方式手动握了一次手（真子进程真 stdio，`timeflow.exe mcp`）→ 握手本身是通的（14 个只读工具、写工具不列出、`db_missing` 不建库），**但编码是坏的**。**怎么证的（不靠人眼看终端）**：三个探针读**原始字节** —— ① `mcp_encoding_probe.py`：那一行 `decode(\"utf-8\")` **失败**（invalid start byte @130）、`gbk` 成功 → stdout 上是 GBK；② `mcp_inbound_probe.py`：发一条**中文标题**的 `add-task`，服务端当场崩：`UnicodeEncodeError: 'utf-8' codec can't encode character '\\udcad' ... surrogates not allowed`，任务没建、客户端拿不到任何回话；③ `mcp_badline_probe.py`：一行坏字节之后 TextIOWrapper 整个进入坏状态（连它**前面**那条正常请求的回话都拿不到）。**根因**：`for line in sys.stdin` 与 `sys.stdout.write` 都按**语言环境编码**走（这台 cp936）—— 客户端按规范发 UTF-8，被 cp936 解成带**孤立代理**的怪字符（JSON 结构还在，所以**不报错、静默改字**），该字符串再被 `json.dumps(...).encode(\"utf-8\")` 编码时抛出，没兜住就整个进程退掉。**为什么以前的测试全绿（最该记的一条）**：`tests/test_mcp_line.py` 的\"真 stdio\"起子进程时带着 **`-X utf8`** 且 parent 侧 `encoding=utf-8` —— **正好把要验的那件事关掉了**；真客户端不会替我们加解释器开关（照配置直接 spawn `timeflow.exe mcp`）。与 T-G69/T-G71 同一族：**判据自己会在错的地方替被测者兜底**。**修法三件**：① `_pin_stdio_utf8()` 把 stdin/stdout/stderr 钉成 UTF-8 —— ★ **只钉 MCP 这条协议，不动交互式命令行**（命令行落在 Windows 老控制台上，本地编码反而是对的；`--help` 与参数错在钉之前就返回）；② ★ **协议数据走字节不走文本层**（`_read_line()` / `_emit()`：JSON 自己 `.encode(\"utf-8\")` 写 `sys.stdout.buffer`，读也从 `sys.stdin.buffer` **逐行解码**）—— **第一版只做第 ① 条实测不够**（坏行会把流搞坏），改完实测 id 序列 `[1, None, None, 4]`；③ **一条坏消息不许打死循环**：坏字节 / 坏 JSON / 处理时冒出来的异常一律只换一条 JSON-RPC 错误（`-32700` 与新增的 `-32603`），循环继续 —— 与 T-G66「别把栈丢给用户」同一件事，只是对面从人换成了客户端；★ 坏字节**故意不用** `errors=\"replace\"`（替换符会把乱码当合法内容写进库，**静默改字比回错误坏**）。**验收**：`tests/test_mcp_line.py` 14 条全过，新增两条最值钱 —— ① stdout 原始字节能被 UTF-8 解码 + 中文标题**一字不差**落库、回话里也是它；② 坏字节与坏 JSON 插在**中间**，回两条 `-32700` 而**后面那条正常请求照样有回话**。**顺带交付**：用户的 DSH 配置（`cordis.patch.yml` 的 `insert` 一条 `@deepseek-ai/dsh-mcp-client`，`command` 用装的 `.exe` 入口、`args: ['mcp']`、`cwd` 给死；插件包不用另装，它是 dsh 自己的依赖），写进 `docs/人工验收-照着点.md` D 组 —— **但那条人工项仍留着**：能证明的是协议层通、字节是对的、边界在，\"DSH 里真接上、模型真调到\"要人在界面上点一次。**边界**：仍没有第三方 MCP SDK（\"兼容\"只证到按规范手写的握手 + 真字节 UTF-8）；传输仍只做 stdio。**没动的**：CLI 输出编码、契约、命令表、界面、45 份黄金。教训进 `复盘/视觉线地图.md` §6。"


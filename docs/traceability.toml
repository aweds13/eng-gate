gaps = "**症状（T-G73 照实记下、用户点名顺手修的那条）**：断网期间「在飞」的请求失败得晚，回到在线之后它才回来 —— 界面于是还挂着「连不上」**一两秒**。**真正的病灶比那两秒重**：旧写法把 `offlineNow()`（= 上一次请求的结论）**当判据去拒绝**动作 —— `offlineUpload` 直接回一句「先导出同步包」连试都不试、`writeOrQueue` 把一条本来能落库的记录白白塞进手机队列、轮询被它挡掉之后**再没人能推翻这个结论**（自锁）。**两条规矩，缺一条都堵不住**：① **一条失败只代表它出发的那一刻**（`markDown(startedAt)`：出发早于 `lastOkAt`（最近一次成功）的失败不许改标记）—— 这半修的是「界面自己走回在线」；② **要拒绝，先探一次**（唯一入口 `offlineConfirmed()`：提示说离线时才真发一条 `GET /api/health`，探得通就照做）—— 这半修的是「不许拿上次替这次回答」；另加四处配套：`api(..., {quiet:true})`（探测/轮询失败不弹提示）、轮询不再被提示挡住（它是**唯一**会自己重试的请求）、`markUp()` 在判断被推翻时**当场重画**（一处机制：判断变了 → 界面跟着变）、`online` 事件用它的返回值决定要不要补一次重画（`navigator.onLine` 那半带来的离线标记没翻，得单独把那页叫回来）。**探的判据是「有没有回话」不是「回话是不是 200」**（401/429 是「后端说不行」，不是「连不上」）；超时 1.5 秒，探不通就照离线办、不拖住用户。**验收**：`tests/test_web_frontend.py` 两条新护栏（**三个会拒绝人的地方一个都不许看标记就拒**、`offlineNow()` 上必须写着「它只是提示」、轮询不许被它挡住；外加 `/api/health` 这条证据**必须真的存在** —— 拿一条不存在的路径去探会得到「有回话」→ 恒真假判据，同 T-G69/T-G74 那族）+ 行为流 ㉖ **25 项断言**；★ **那条判据是确定性的**：把「它以为是断的」与「点下去」放进**同一次求值**里（旧写法这一步必然被拒绝），不再靠「等那两秒过去」——T-G73 当时只能等着它稳下来，等的是竞态，不是产品。**★ 先量再改（第一版我猜错了原因）**：第一版判据分两次 CDP 求值 → 红了；我猜「有一条探测在飞」，**探针当场否掉**（`gates/diag/probes/stale_flag_probe.mjs`：断网时探测 **3~13ms** 就失败回来、`online` 事件 **2~10ms** 就到、干净启动下强制置位留得住），真凶是④量出来的调用栈 —— `markUp@3 ← online 事件处理器`、`view:offline@3 ← 同上`、`markUp@14 ← api()`：**回网事件触发的那次重画**里 `paintRail` 发的 `/api/focus/active` 在 14ms 后**成功**了 → 标记被正当清掉（那条请求确实成功了）、`#main` 被重画（判据打在按钮上的 `data-tfprobe` 标记随之消失 → 报「找不到元素」，**按钮其实还在**）。教训：**判据不许假设「两次求值之间世界没变」**；猜出来的因果没量过不算数。**没动的**：后端一行没改（`/api/health` 本来就在，只是从没人拿它当判据）、45 份黄金一份没动、离线包格式与合并规则一个字没改。**★ 顺带抓到并修掉一个工具缺陷**：`--twice` 比的是「每条流 × 每条断言的**标签** + 通过与否」，而 ㉘ 有一条把**测量秒数写进了标签**（`涨了 ${grew}s，会话约 ${secs}s`）→ 两遍差一秒就报「这是工具的问题」；T-G73 那次没红纯属两遍秒数**凑巧一样**（潜伏的假红）。修法：标签固定、数字搬进 `detail`（不进指纹）；同一次把那条报错变有用 —— 两边都全绿却指纹不同时，旧写法只印「第一遍 [] / 第二遍 []」（等于什么都不说），现在印**只在某一遍出现的断言标签**（本卡就是靠它一眼定位的）。"


、在同一次求值里读两个 rect**，并在按下前做命中测试（零点/出屏直接报明确原因）。**没动的**：`_ORDER_BY` 本身（老口径一个字没改）、`move_doing`（进行中那套序号照旧）、离线包格式与合并规则。"



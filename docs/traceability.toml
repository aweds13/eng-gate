gaps = "**是商讨稿**：回答用户三条（键盘附加层 / OpenWork / AI 原生 CLI），并**替他定了三条**（按钮上的字白→深、底栏选中用 `--accent-weak` 底 + 2px 条、体检表已建）—— 依据是他这句「我对这些没有很明确的想法，我都是让 AI 给我推荐的」，所以工作方式改成**少问、多给可看的**。**没动样式、没写 CLI。** 三条关键判断：① 键盘的前置条件已经量出来了（`:focus-visible` 全表 0 条，T-G29）——**第一步不是快捷键而是一条全局焦点环**；② ★ **`ACTIONS` 已经是 125 条的命令注册表**，把它升级成带元数据的命令表（标题/快捷键/参数/可逆性/对应 OP）就能**同时喂四个面**（界面按钮、⌘K、CLI、AI/MCP）—— 用户想的「AI 用虚拟键盘给它命令」能通，但**合成 DOM 事件是最脆的一层**（把界面当 API，视觉线一改就全废），正确顺序是 命令表 → HTTP/CLI → MCP（DSH 本身是 MCP 客户端）；③ ★ **直接加 CLI 会让维护变差**（四个面各写一遍 = 四处会漂），维护变好的关键是那张表。**顺带**：OpenWork 是 AI agent 控制台 → 它的精华（run log/streaming/工具行/错误确认）落在**我们唯一没做的那张卡 T-G21** 上，且 T-G26 装的 sheleg 包里正好有 `AI_PRODUCT_PATTERNS.md`（chat/agent/streaming/run log/model errors/confirmation），三条线索指向同一处。**待用户确认 2 条**：AI 面并进这次视觉线还是等 T-G21；CLI 现在做（只做命令表）还是等 T-G21 之后。"


gaps = "**2026-09-23 更正（T-G18）**：原文「白名单/勿扰配置（SR-F3.3）、子任务（OP-12）等仍无界面入口」**已过期** —— 两处界面都接上了（前端批次③ 设置页「专注（白名单 / 勿扰）」+ T-A2 详情面板「步骤（子任务）」）。这次不再靠人眼，写了报告工具 `tools/route_ui_gap.py`（后端 151 条路由逐条到 `src/web/` 里找，模板字符串与 `?query` 都归一化后按段比）。**核对结果：还剩 11 条后端路由前端一个字都没提** —— ① `GET /api/reminders`（全量提醒列表；界面用的是 `/api/reminders/due`）② `GET /api/sync/logs`（跨端冲突日志，界面只显示同步状态，没有日志页）③ `GET /api/team/assignments`（团队分配列表，界面走 `/api/team/board`）④ `GET /api/groups/{group_id}/tasks`（分组下任务列表）⑤ `POST /api/sync/tasks`（老的「推任务」端点，界面走同步包）⑥ 其余 6 条 = AI 接口 5 条 + `GET /api/health`，**按设计就不给界面**（给本机程序/运维用）。前 5 条接界面还是删接口属产品判断（未登记为卡，见 `复盘/交接与台账陈旧-T-G18.md` §五）。"

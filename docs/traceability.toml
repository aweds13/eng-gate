  "file:tests/test_wb_dispatch.py",
]
gaps = "**病（卡 106 的工人当场暴露，主控从派活日志里读出来的）**：`--lean` 的**开工切片**与 `--spec` 传给工人的是**仓库相对**路径（`gates/diag/…`），而 `--cwd`（T-G199）已经把**工人进程的 cwd** 挪到了卡树 —— 于是那两个相对路径在卡树里**指不到东西**：`gates/diag/` 是 **gitignore 的目录**，卡树里**根本没有它**。卡 106 的工人日志原话是「Working directory is already the poolkit worktree」，而它**同时读了** `.wt/poolkit/gates/diag/brief-106.md`（**不存在**）与主仓那份 —— 也就是说它**自己满盘找才找对**：那是**运气，不是设计**。**做法**：新增 `prompt_path(p, worker_cwd)` —— **只在给了 `--cwd` 时**把路径解析成**绝对**（`q if q.is_absolute() else (ROOT / q).resolve()`），并在**三处** `build_command(...)` 调用（首次 / 重开一轮 / 续跑拿不到 session）与**一处** `spec_changed_notice(...)`（续跑那段「规格改了」提示）都用它；**不给 `--cwd` 时逐字不变**。**验收**：新增**两条**用例 —— ① 给了 `--cwd`：开场白里出现 `str(sandbox/「spec.md」)` 与 `str(sandbox/「gates」/「diag」/「brief-001.md」)`（**绝对**路径），且**裸相对写法 `读 gates/diag/brief-001.md` 不再出现**（「还留着指错路的相对写法」）；② **反例**：不给 `--cwd` 时**仍是相对**（`读 gates/diag/brief-001.md` 在、绝对路径不在）——证明老用法逐字不变。`pytest tests/test_wb_dispatch.py` → **126 passed**；`ruff` 对两个被改文件 `All checks passed!`。**★ 顺带修的一处（T-G199 留下的接缝）**：测试夹具 `sandbox` 里 `git_dirty` 的桩是**零参** lambda（`lambda: []`），而 T-G199 之后 `preflight` 在**给了 `--cwd`** 时会调 `git_dirty(worker_cwd)` ⇒ 任何带 `--cwd` 的用例都会 `TypeError: <lambda>() takes 0 positional arguments but 1 was given`（我这条新用例就是这么撞上的，报错点 `wb_dispatch.py:1724`）。改成**可变参** `lambda *a, **k: []`（对零参调用行为不变）—— 这属于「**改了签名，测试桩没跟上**」的典型接缝，记一笔。**★ 过程如实（我自己第二次栽在同一处）**：第一版补丁的注释里带了**反引号**，而我是用**内联 `python -c 「…」`** 打进去的 ⇒ **bash 把反引号当命令替换吃掉**，注释缺了三处词（`git_dirty` / `--cwd` / `TypeError…`，原样：`# ★ T-G204： 现在能收「看哪棵树」这个参数`）；**功能改动是对的**（`ruff` 全过、126 passed），注释已按原文补回 —— 这正是 `复盘/口径坑.md` 里记的那条「**内联 shell 字符串里不许放反引号**」，我今天第二次犯。**没动**：`--status` 三态判据 / 端口体检 / 内存闸 / 心跳 / 看门狗 / 429 / retry / 判决口径 / `--cwd` 的**脏检查语义**（仍看工人干活那棵树，主仓脏只提示）。**来源**：主控自做（不是外包卡）；树 `.wt/cwdpath`，base `d05efab`。**★ 内存闸留痕（用户授权）**：这趟门禁**先被内存闸拒了两次** —— 第一次`可用 3.3 GB < 阈值 4.0 GB`、退 3；主控把阈值调到 3.0 后，第二次 `可用 2.7 GB < 阈值 3.0 GB` **又被拒**、退 3。现场硬证据：`MemCompression` 已 **506 MB**（Windows 又在压内存）、`msedge` 1.2 GB、DSH 604 MB、Defender 602 MB ⇒ **这台机器的常态可用就是 3 GB 上下**。主控当时的处置是**不继续降阈值、挂起等腾内存**；用户随后明确授权「**可以暂时关掉内存阀**」⇒ 这一趟用 `TF_GATE_MIN_FREE_GB=0` 跑（**是用户点头的例外，不是主控自己关的**）。★ 由此记一条改进：那道闸的阈值该按「**这一趟要跑什么**」定（真机门全复用、不起浏览器的趟次与要真跑 `ui_flow`/`render` 的趟次差一个量级），且 **4.0 的默认值在这台机器上会常态误拦**（今天 T-G201 / T-G199 / T-G204 三笔都被拒过）。"


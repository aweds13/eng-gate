gaps = "**T-G30 §4.3 的最后两步一起做**（顺序是 命令表 T-G31 → 只读 CLI T-G64 → **MCP** → **写操作 CLI**），用户 2026-09-23 要的「4 个面集中到一个点」到这里**四个面全通**：界面 / ⌘K / 命令行 / **AI·MCP**。三条口径（用户 2026-09-25 当面定）逐条落成机器判据：① **只做界面上已有的那些** —— 每条写命令/写工具的 OP 的 `ui` 必须非空（`check_commands.py` 判，`tests/test_cli_line.py` 再判一次）；② **默认关** —— 每次调用都要显式带 `--allow-write`，CLI 退 **4**（新退出码）+ 机器码 `write_disabled`，MCP 不给开关就**不列出**写工具、硬调回 `-32602`；③ **语义与界面完全一样** —— 写命令挂在同一条真路由上，`tests/test_cli_writes.py` 逐条比「走 CLI」与「直接打那条路由」的**可观察状态**。**做法**：`docs/commands.toml` 多一栏 `mcp`（与 `cli` 是**两份投影**，门禁分别核对）；`registry.py` 多一批 `WRITE_COMMANDS`（6 条：add-task / complete / myday / focus-start / focus-finish / memo），**「是不是写」由路由方法算**（不加 `write = true` 那种第二个真源）；`call.py` 支持路径参数与 JSON body；新增 `src/timeflow/mcp/`（stdio + JSON-RPC 2.0，零依赖：`initialize` / `tools/list` / `tools/call` / 通知不回 / `-32601` / `-32602` / `-32700`），**工具清单由 `registry` 现算**、`tools/call` **直接把参数翻成 argv 调 CLI**（所以「两边语义一样」不是承诺而是同一段代码）。**验收**：新增 `tests/test_cli_writes.py` **7 条** + `tests/test_mcp_line.py` **12 条** + `tests/test_check_commands.py` **+4**（三条写命令的硬冲突 + MCP 双向）+ `tests/test_cli_line.py` 改写 4 条；其中两条是「证明咬得住」的：不带开关跑**每一条**写命令都退 4 且**库一个字节没动**（快照逐条比）、以及**真起子进程走 stdio** 的端到端（stdout 上只有 JSON-RPC、写操作真落库、读回来对得上）。**★ 顺手修的一条基础设施缺陷**：`logs.setup_logging` 把 `sys.stderr` 在**配置那一刻**绑死，而 pytest 的 `capsys` 每个用例都会换掉它 —— 只要「第一次配置日志」发生在用了 capsys 的用例里，后面的用例一记日志就往**已关闭**的流写，logging 打出一段「--- Logging error --- + Traceback」混进别的用例的 stderr（症状是 `test_broken_database...` 断言「没有 Traceback」会**随跑的先后顺序**时红时绿）。修法是 `_CurrentStderrHandler`：每次 emit 现取 `sys.stderr`。**另一处**：检查器里两条「写命令不能是 GET / 只读命令必须是 GET」的判定是**恒真**的（`is_write` 本来就由方法算出来）—— 换成了真会失败的一条：写方法必须在 `POST/PUT/PATCH/DELETE` 里（挡 `FETCH` 这种手滑）。**边界与洞（如实记）**：① 写命令第一批 **6/40 条**写操作（「只做界面上已有的那些」是慢工，`check_commands.py` 把还差多少条报出来 —— 洞是进度）；② MCP 的协议是**手写**的（本项目零依赖），验的是「我们的客户端脚本 ↔ 我们的服务端」，**第三方客户端（DSH / Claude Desktop）接一次**是人工项（写进了交接的验收清单）；③ 传输只做 stdio，没有 `resources`/`prompts`/`logging`；④ 应用内那条 `/api/ai/*` 边界**没有放宽**（仍是「只写事实 + 只勾自己建的」）—— MCP 是**用户自己本机**的另一个出口、默认关，两者的关系写在 `复盘/MCP与写操作-T-G65.md` §6；⑤ 没做**持久开关 + 设置页 UI**（那属产品面）：现在的开关是「每次带上」，理由（持久开关开了就忘了关）也写在复盘里。"



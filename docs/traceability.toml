gaps = "**怎么发现的**（T-G87，目标轮 3）：卡 002（T-G86）那轮外包真跑全量门禁时，16 门里 15 门绿、**唯一红**是 `tests/test_wb_review.py::test_chinese_paths_are_not_escaped` —— 而那是我 T-G84 自己写的用例。**根因（定时炸弹）**：它断言的是**真仓库 HEAD 这一笔**的改动清单里必须出现 `复盘/…`；可门禁是**提交前**跑的，那时 HEAD 还是**父提交**（恰好带中文路径）→ 绿；提交一落，HEAD 变成自己那一笔，只要它全是 ASCII 路径，**这条用例从此永远红**（实测：`46be295` 只动了 3 个 ASCII 路径 → 此后 pytest 门恒红）。同一棵树「提交前绿、提交后红」是**判据自己的毛病**，不是被查对象变了 —— 这种用例比没有用例更坏：它会把真红灯淹掉（这一轮门禁红了，而红的原因跟被验的东西毫无关系）。**修法**：不再看真实历史 —— 在 `tmp_path` 里**自己搭一个 git 仓库**、提交一个 `复盘/中文.md`，再用 `monkeypatch` 只把 `wb_review.ROOT` 指向它（**`tools/` 一行不改**），然后 ① 先证明**普通 git 确实会转义**（少了这一半，夹具就看不见这个现象）、② 再证明 `wb_review.git()` 原样给出中文路径。**证据**：`gates/diag/probes/wb_cjk_tmp_repo_probe.py` 先跑通（普通 git → `\\345\\244\\215…`，`wr.git()` → `复盘/中文.md`）；改完 `tests/test_wb_review.py` **仍是 12 条**（就地重写那一条，不新增 —— 省得全项目所有「12 条」都要跟着改）；**突变检验**（`gates/diag/probes/wb_review_mutation_probe.py`）：把 `-c core.quotepath=false` 临时拿掉 → 该用例**当场红**（exit 1），还原 → 绿（exit 0），且 `tools/wb_review.py` 一字未改（`git diff --quiet` 为真）—— 证明修好之后**判据还有牙**，不是装饰。**没动的**：`tools/**`、`src/**` 一行没改；T-G84 的五条判据一条没变。"

[entries."T-G86"]
id = "T-G86"
title = "修 T-G79 的「幂等也在写库」：今天清单的空转不再整表重写 —— `_myday_sequence` 改成只读 + 顺序真变时才写、只写排过号的那一截（7 条 pytest）"

gaps = "**用户 2026-09-23 要的「键盘优先做成附加功能」，按 T-G30 排的顺序做到第 ③ 步**（① 焦点环 T-G45 ✅ / ② 命令表 T-G31 ✅ / ③ 面板 + 快捷键 = 本卡 / ④ CLI·MCP 待做）。**三件东西**：① `index.html` 的 `const COMMANDS`（18 条 × 7 键位：`n` 新建任务 · `t/f/r/s/h/p` 六视图）；② ⌘K 面板（`Ctrl/⌘+K` 开、打字筛、`↑↓` 换选中、`Enter` 跑、`Esc` 关；鼠标点左栏「命令」也能开、点空白关）；③ Esc 三层（面板 → 模态 → 右栏详情）。**顺手补的真缺口**：模态从 R2 建起来那天的注释就写着「可键盘」，但 **`Esc` 对它一直没有作用**（现在 `Esc` = 取消，确认框不动数据 —— 流层第 K 条拿「任务还在」证明这一点）。**四条口径**：只加不改（原按钮一个没删没改）；行是 `div` 不是 `button`（焦点留在过滤框，否则 Tab 要走十几行）；不抢键（打字时/模态开着时/带修饰键时一概不认）；面板里没有一行自己打接口（「新建任务」只做「切今日 + 聚焦输入框」，创建路径仍只有 OP-1 那一条）。**「不是第二套命令系统」是机器判的**：`check_commands.py` 新增一节 —— 每条命令的动作必须真注册、键位不许重复、视图在 `VIEWS` 里、**声称对应的 OP 的 `ui` 里真有这个动作/视图**（第一次跑就报出 6 条对不上）；顺带把 6 条一直空着的 `ui` 补上（OP-1 加 `palette-new-task`，OP-7/OP-3/OP-19/OP-25/OP-35 各加一个 `view=`），**「还没填出界面入口的」10 条 → 7 条**。**新增采集能力**：浮层默认不出现，渲染层加 `PSEUDO_VIEWS`（`open` + `over`）——`over` 写死「先回今日页」，否则会重演 T-G51 那个「采到别的页版式」的假黄金；黄金 42 → **45 份**（3 档宽度 × 15）。**踩到的两个坑**：① 读那张表**不能用正则、也不能「找第一个 `{` 再配对」** —— 注释里的 `{` 会被当成条目开头，然后配到别处的 `}`，报「括号没配对」；改成「一个扫描器同时跳字符串/注释与配对」，并把「注释里放 `{` 与 `'`」钉成测试。② `ruff` 的 E501 按**显示宽度**算（中日韩字符算 2 列）—— 一行 80 个字符可能已经 107，中文表格行要按宽度留余量。**顺带修的两条（都不属本卡功能面）**：① 面板的「没找到」第一版直接写 `<div class=\"empty\">`，被 R5 那条「空态只有一个出口」的护栏当场拦下 → 改走 `emptyState()`；② **一条门禁午夜红** —— 2026-09-24 23:53 起 `pytest` 红两条复习线用例、**过了午夜又自己变绿**：FSRS 学习步长是分钟级、落库只存本地日历日，23:57 复习「记得」的下一步落在 00:07，卡「正确地」离开今天的 My Day 而用例假设它还在（同族问题 T-G40 记过，那次是「星期几」）。**修的是用例不是产品**：`tests/test_review_line.py` 加 autouse fixture 把「现在」钉在本地正午（只钉 FSRS 那一刻，`date.today()` 仍是真日期）+ 新增一条**把跨午夜行为写死**的用例；补丁要用 `importlib.import_module` 拿实现模块（包 `__init__` 把同名函数 `review` 重绑进了包命名空间，点号路径会走到函数上）。**边界（不许假装验证过）**：只认单字母 + ⌘K（没做可配置键位/键位表浮层）；面板只有 18 条命令（`ACTIONS` 有 147 个，绝大多数是必须带 id 的上下文动作，**有意**不进面板）；`Ctrl K` 徽标**写死**不按平台换成 `⌘K`（黄金逐字节比，按平台变的标签会让同一份黄金在两台机器上不一样；按键两个都认）；移动端不受益（≤640px 没键盘、左栏隐藏）；AI/MCP 读同一张表属第 ④ 步，未做。"

[entries."T-G60"]
id = "T-G60"
title = "第 4 条「孤儿路由」接界面：分组管理里**点开一个分组看它的任务**（`GET /api/groups/{group_id}/tasks`，行内只读展开）"
group = "PROCESS"
status = "done"
evidence = [
  "text:src/web/index.html::data-action=\"group-tasks\"",
  "text:src/web/index.html::async function toggleGroupTasks(id){",
  "text:src/web/index.html::groupTasks-${g.id}",
  "text:tools/ui_flow_check.mjs::点开一个分组看它的任务",
  "test:test_web_frontend.py",
]
gaps = "**用户 2026-09-25 拍板**：「要在分组管理里点开一个分组看它的任务」。这条路由（OP-11 里写着「点分组看任务」）一直只有后端、没有界面入口 —— 于是它既不被任何一层覆盖，也没人知道它存在（`DELIVERY.READY` 那条盘点里排第 ④）。**做法**：分组管理里每个分组行加一个「看任务」按钮 + 该分组自己的挂载点（`#groupTasks-<id>`），点开就在**那一行下面行内展开**它的任务（状态徽标 + 标题 + 截止日，**只读**），再点「收起」收起来。**为什么不新开一页**：分组本来就管在这一节里，多开一页只是把一个点击换成一次导航（当初 T-G39 定的也是「并入视觉线那轮给位置」）。**两个小决定**：① 「收起」在**两种情况下都给**（哪怕这个分组还没有任务）—— 不然展开一个空分组之后就没法关掉它（第一版漏了，行为流第 ⑩ 条的收起断言当场没跑起来，断言数从 13 掉到 12 才发现）；② 这一节**只读**，不带任何改任务的动作（改任务都在任务页/详情面板 —— 一处一套口径），pytest 里钉了这条。**覆盖**：标记层 `tests/test_web_frontend.py::test_group_admin_can_open_a_group_and_see_its_tasks`（按钮/挂载点/动作注册/真的打了那条路由/只读）；**真浏览器点开与收起**由行为流第 ⑩ 条覆盖（同一页同一批控件，顺手加进去，13 项断言）；`ui_dom_probe` 的分组那一段加了两个 needs。**代价**：设置页 3 档宽度黄金重采（分组行外层多了一层包裹）。**顺带**：`DELIVERY.READY` 那条盘点因此可以收口（①②④ 已接界面、③ 界面走 `/api/team/board`、⑤ 已标弃用、⑥ 六条按设计不给界面）。"


gaps = "**缺口原文出处**：gates/diag/do_tg120.py §19.3（同见台账 T-G120）——拆树之前把 wb-<卡>.dispatch.log / .verdict.txt / .report.md 拷回主树 gates/diag/；真丢过一次（换成 kimi 的那几轮日志随树消失，事后查不出哪张卡用了哪个模型）。卡 081 的 tools/wt_prune.py 完全没有这段逻辑（主控 grep copy|copytree|rescue|证据|report|jsonl 零命中），它的 9 棵可删里就有 lean1(078)/accept2(079)/darkgate(080) → 一跑 --apply 就烧掉这三张卡的凭证。**修法**：① scan_rescue 用 glob(wb-*) 通配整族（不写死卡号），wb-usage.jsonl 单独拎出来；② 每卡独占 wb-<卡>.* 拷到主树 gates/diag/、目标已存在则不覆盖（打印 已存在→跳过 并计数）、目标同名位置是目录则算冲突失败；③ wb-usage.jsonl 逐行追加合并、按 (卡,开始) 去重、既有行一个字节不改；④ 任何一份拷不出来 / 合并失败 → 该树本轮不删 + 理由进表 + 退出码 1（宁可保留）；⑤ 加 --no-rescue（默认关）逃生门并打醒目警告；⑥ dry-run 表里加「待留档」列预演 N份+usage追加K/跳过J。**动的是哪一行**：tools/wt_prune.py:698-707 的留档块插在 :708 的 git worktree remove 之前（do_apply 内、第二拍复核之后）。**三份拷贝与保留的临时仓库读数**：场景A 可删树带整套假证据 → [rescue] 拷了 7 份（跳过 0）usage 追加 1 行（跳过 0）、树已删、主树 gates/diag/ 里 7 份 wb-900.* + wb-usage.jsonl 都在、退 0；场景B 目标同名位置做成目录 → 留档失败→保留、理由「留档失败：目标 wb-901.jsonl 是同名目录（不覆盖）」、退 1；场景C --no-rescue → 不拷不合并、树仍按判据删、退 0、stderr 有警告。usage 追加合并钉在 test_apply_merges_usage_without_clobbering：主树 2 行 + 树里 1 新 1 重复 → 主树 3 行、after_bytes.startswith(before) 为真、重复行没被重复追加。**真树 9 棵各自的待留档份数**：★ 与卡原文偏差（如实）——卡写 9 棵，本卡现算（底座 68df254）是 11 棵（期间 tip 陆续集成）；逐棵：darkfix 7份+usage追加1/跳过0（082 的 usage 尚未进主树）、lean1 7份+usage追加0/跳过1（078）、wtprune 7份+usage追加0/跳过1（081）、darkgate 7份+usage追加0/跳过1（080）、traepool1 7份+usage追加0/跳过1（077）、accept2 7份+usage追加0/跳过1（079）、index2 0份（无 gates/diag/wb-*）、RI10 7份+usage追加0/跳过1、ledger5 6份（无 usage）、survey4 6份（无 usage）、decide 6份（无 usage）；合计 10 棵有凭证、67 份独占文件待拷，只有 darkfix 会往 usage 追加 1 行。**真树未删的两个计数**：git worktree list --porcelain | grep -c '^worktree ' 跑前 88 / 跑后 88（相等）；--apply 一次未对真 .wt 跑过。**测试**：pytest tests/test_wt_prune.py → 16 passed；变异副本（去掉 usage 去重）→ 1 failed（test_apply_merges_usage_without_clobbering：assert 4 == 3）+ 15 passed（先红后绿）。**没动什么**：.wt/** 任何树一个字未删未改；src/ scripts/ 别的 tools/ 别的 tests/ 其余 docs/ 复盘/ gates/diag/**（本树没往里拷证据）data/ 主树外来未跟踪文件全未碰。"
[entries."T-G179"]
id = "T-G179"
title = "封存指纹修真：worktree 回退 + 摘掉 gates/** 成固定点 + wb_verify 可独立复算"
group = "OUTSOURCE"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:tools/wb_verify.py",
  "file:tests/test_gate_fingerprint.py",
  "file:复盘/封存指纹可核-T-G179.md",
]
gaps = "**缺口（卡 §0 主控实测，照抄；本树现算坐实）**：`scripts/run_gates.py:349` 把临时索引写死在 `ROOT/.git` 下 —— linked worktree 里 `.git` 是【文件】（git-dir=`<主树>/.git/worktrees/<名>`）→ `GIT_INDEX_FILE` 指向文件底下 → `read-tree HEAD` 失败 → `:359` 回退 `HEAD^{tree}` = 父/底座那棵树的哈希；叠加 `gates/last.json` 自己在那棵树里（自指）→ 永远追不上。本树现算：提交在 `d8ed19c` 的 `last.json.tree`=`c5047aa46bcb…`（==`git rev-parse d8ed19c^^{tree}`，父提交的 tree），而 `d8ed19c^{tree}`=`bfa8abcc…`。`audit_progress.py:515-516` 与 `wb_verify.py:32` 都明写故意不查它。**修法**：① `_git_index_path()` 改用 `git rev-parse --git-path dsh_gates_index`（退 `--absolute-git-dir`），拿不到打印警告再回退（不静默）；② `tree_without_gates(repo,rev,include_worktree,exclude_gates)` 是唯一实现（`read-tree`（可叠 `add -A`）→ `git rm -r --cached --ignore-unmatch gates` → `write-tree`），指纹=「除 `gates/**` 外、即将提交的内容」的 tree 哈希=可复现固定点；③ `wb_verify.check_fingerprint` 加独立复算行（import 门禁那份实现，不手写第二套；旧笔无 `tree_scope` → INFO 按旧口径不核）；④ `last.json` 加 `tree_scope=worktree-minus-gates`（payload 与 seal 两处）。**读数**：改前 `staged_tree()==HEAD^{tree}==bfa8abcc3bf4493bbd078f000377a258dfd71f50`（相同=洞）；改后 `staged_tree()=5d2f45dc4bc66ed6a062fc39cfe89c366b771294≠HEAD^{tree}=bfa8abcc…`；指纹树 `gates/` 条目 0 个（完整树 49 个）。**固定点三次**：5d2f45dc…/5d2f45dc…/改 `gates/last.json` 一字节后仍 5d2f45dc…（全等）。**独立复算**：`wb_verify --tree . --expect-parent d8ed19c` 新行 OK（本笔）；手工复算=`tree_without_gates` 结果与记录相等；旧笔 d8ed19c → INFO 不核。**防恒真**：喂一笔用 `commit-tree` 把 `docs/changelog.md` 换成一字节 blob 的提交（ab9e7b78b2a1）→ 复算 291e989847da≠记录 c5047aa46bcb → FAIL。**主树（普通仓库）**：新索引路径==旧写死值（逐字相同）、完整树算法（exclude_gates=False）结果 67ce83be…==旧算法（逐字相同）→ §1.1 零行为变化。**测试**：pytest tests/test_gates_reuse_line.py → 16 passed（★卡写 12 条，实测 16 个用例，既有全绿未放宽）；新增 tests/test_gate_fingerprint.py → 3 passed。**自指悖论只削弱未消除**：指纹不含 `gates/**` ⇒ 证明不了门禁产物本身、也不证明「门禁真在脏树上跑过」；旧笔仍核不了（INFO）；RI10 从查不了降到查得到、未被消除。**端口偏差（如实）**：卡指定 TF_GATE_PORT_BASE=9181，但本机 9197 被外来服务 vivoesService_x64.exe（PID 6736，09-24 起常驻）占用 —— 行为流 ㉒ 的对端=ui_flow 端口+6=9197 → base=9181 时 ㉒ 稳定 fetch failed（已复现）；改用下一段空闲的 base=9201（整段实测无 LISTENING）跑 → 17 门全过。末轮门禁 12 道真跑 + 5 道真机层复用（ui_dom_probe/lf1_live/web_live/render/ui_flow，输入一个字节未变；按卡 §4③/§6-3 用默认命令、未加 --no-reuse）。**没动什么**：input_hash / REUSE_INPUTS 一个字未动；src/、别的 tools/、别的 scripts/、别的 tests/、其余 docs/、复盘/、gates/diag/**、.wt 别的树、主树外来未跟踪文件、data/ 全未碰。"



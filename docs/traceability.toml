gaps = "**为什么要有**（T-G82，目标轮 1）：派活 = **别人替我改工作区**，手工敲命令有三个坑，三个都真会咬：① 在**脏工作区**里派活 → 工人和我的未提交改动混在一起，事后分不清谁动了什么（**一写一读**当场失效）；② **没登录**就派 → 白等一轮只拿到 `Authentication required`（T-G80 实测）；③ 派活不留痕 / 覆盖上一轮 log → 之后没人说得清它干了什么。**做法**：四道前置检查放在**真跑之前**，任何一道不过就**不派活**并说清原因 —— ① `--spec` 指的卡规格文件必须存在（不许凭记忆派活）；② `git status --porcelain -uno` 必须空（**未跟踪文件不算**：那两个是别的窗口放的）；③ 真发一条极短请求做**登录自检**（认出那句 Authentication required 就提示去 TUI 敲 `/login`）；④ `gates/diag/wb-<卡号>.jsonl` 已存在就拒绝（要覆盖得显式 `--force`，证据不许被悄悄盖掉）。默认 **dry-run**（打印将要执行的命令），`--execute` 才真派；派活命令固定带 `--output-format stream-json`（实时留痕）+ `--no-session-persistence` + `-y`，**开场白写死在脚本里**（三份协议文件 + `复盘/外包-卡表与规矩.md` + 这一张卡的规格 —— 不是随便一句提示词）；跑完**自动调用状态器**（T-G81 的 `tools/wb_status.py`，同一个渲染器不写第二份）把时间线印出来。退出码 `0` 过 / `2` 前置检查没过 / `4` 工人自己失败。**验收**：`tests/test_wb_dispatch.py` **9 条**（命令拼装含开场白与 stream-json、缺规格拦下、脏工作区拦下且不白戳登录、log 已存在拦下且 `--force` 放行、登录失败拦下、`auth_ok` 真认那句 needle、dry-run **一个子进程都不派**、`--execute` 用假 runner 钉住「真派 + 落 log + 渲染时间线」、工人非 0 退 → 脚本退 4、`git_dirty` 走 `-uno`）；**dry-run 真机实测过**（真前置检查认出未登录并拒绝派活）。**★ 边界（不假装）**：`--execute` 那条路**还没在真登录下跑过**（CLI 未登录，见 T-G80）—— 被验证的是四道检查与命令拼装；它也不管工人的**内容质量**（那是主控复核的事）、不替工人写卡规格、不检查工人有没有偷偷提交（靠复核：`gates/last.json` + `git log` + audit）。**同轮交付**：外包链路的**第一张卡规格** `复盘/外包卡-001-独立复核T-G79.md`（只读复核：四条硬主张 + 必须真跑 + 至少 3 条新边界 + 唯一允许写的文件 + 禁区）。**没动的**：`src/` 一行没改。"


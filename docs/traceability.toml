gaps = "**清完了**：`≥30` 字从 **18 条 → 0 条**；`≥20` 字（含上一档）从 **66 → 43 条**（顺带带走 20–29 那一档的一批）。逐条做法只有三种：① **数字口径全删**（用户 2026-09-25 的最终决定：先前选过「≤8 字」、按那版改短过，他随后改主意要**全删** —— 界面上这三句一个字都不留，事实搬进 `docs/user-guide.md`；团队页那句同理，改短保留）；② **删解释与教学句**（「为什么这么算」「点上面那颗按钮」这类 —— 用户原话：这是给人用的）；③ **清单搬进 `docs/user-guide.md`**（离线能做/不做、局域网怎么开、跨端包里不含什么、任务字段口径）。**尺子修过两次，都值得记**：第一版按「行首是不是注释符号」跳注释，注释的**续行**照样进统计（74 条 20–29 里约 13 条是噪声）；换成字符串/正则状态机之后**又被 `esc()` 里那个正则字面量弄错位**（它同时含单引号与双引号），整片注释被当字符串收进来 —— `≥30` 的命中当场从 19 涨到 **38**。最终版只做三件能确定的事（块注释**跨行**跟踪 / 行注释 / HTML 注释，`//` 前面是 `:` 的不算），并**证明新清单是旧清单的子集**（只有旧的 363 条、只有新的 **0** 条）。**上限门**：`tools/ui_text_audit.py` + `tools/ui_text_baseline.toml`（`[known]` 为**空**、`[ratchet] count = 43`），接进 `--fast` 与全量；判据与对比度/一致性那两张登记表同款（未登记的新长句 FAIL / 登记项被改写 FAIL / 清掉了提示删行）。★ **一条重要教训**（进地图 §6）：**改短时不许连带删掉被钉着的边界事实** —— 这一轮有 5 处钉子把我拦住了（包里不含什么 + schema 版本、注销/关机时不响、合并规则只在电脑那边 + 失败绝不清空、复习已记录这条 toast、离线能力边界 + 同一 WiFi 直连 + 设备号会写进包里 + 手动投入指路 + 改判要说明重算与不重复计）—— 它们是**二次确认的必要信息、能力边界、诚实披露**，不是解释句。**没做**：团队页那句口径在**后端**（`core/team/team.py`，界面直接显示），而 `ui_text_scan` 只扫 `index.html` —— **扫不到它**；这一轮顺手把它也改短了（同步改了测试与黄金），但它**不在门的覆盖里**（如实记）。"


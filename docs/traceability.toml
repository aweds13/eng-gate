gaps = "**来路（用户第二件事 + 外部审查点名 + 今晚的四条口答）**：- 用户原话（意译）：*有时候我**同一个对话框**里会运行**不同的项目** ⇒ 需要把**记忆层**弄好：有一个好的方式，**去不干扰，然后又能外包**。*- 外部审查 GLM-5.3 §四 把它列成「与需求不符」：`infra/pool/projects.toml` **自己写着**「已写未接线」。- ★ 用户 2026-10-02 晚的**四条口答**（本笔照它做）：① **暂时就 timeflow 一个**（架子做对、留好新增位置）；② 力度选 **中档**（硬档**不做**）；③ 切换用 **显式一句**（按 cwd 自动判**不做**）；④ `memory` 列表**本卡不动**（用户要等他把「软件工程管理」那个 Skill 纳入之后再定）。**做法（七件，都在 `tools/`）**：① 新增 **`tools/pool/projects.py`**：读 `infra/pool/projects.toml`（`TF_PROJECTS_TOML` 可覆盖；找不到 ⇒ **报错不猜**），并校验索引本身 —— **三条硬判据**：`root` 必须**真实存在** · **两个项目不许同一个 root** · `tree_prefixes` **非空**（空的树前缀 = 哪儿都能派 = 没有守卫）；报错一律**点名**。② **`guards.project_guard(tree_rel, project=None)`**（与同模块另三条同一风格：吃数据、回 `list[str]`）：**没登记过的项目 ⇒ 拒**（存在性即授权）· `tree` 不落在该项目 `tree_prefixes` 里 ⇒ 拒并**点名允许哪些前缀** ·不给 `project` ⇒ 用 `find_by_tree` **反查**，反查不到 ⇒ 拒（「这棵树不属于任何已登记项目」）；★ **主树（`tree_rel == 「」`）= 项目根本身 ⇒ 放行**（越界的定义是「落在树前缀之外」，不是「不是主树」）。③ **租约带 `project`**（`pool/registry.py` 占树时定下来）+ `wb_registry.py` 打印带上它。④ **`wb_dispatch.py`** 前置检查**接上 `project_guard`**（放在**既有树/域/锁守卫之后**）；`--project` 可显式给，不给就反查；★ **没放宽任何既有前置**（内存 / 登录 / 白名单 / 日志 / 树 / 域 / 锁 / `--already-reserved` 一字未动）。⑤ 新增 **`tools/wb_project.py`**：`use <项目>` / `show` / `memory` —— `use` 写`<主工作树>/gates/diag/current-project.json`（**带窗口 id**，**窗口级**）；`show` 没选/没登记 ⇒ **说清并退非 0**；`memory` **照索引**打印该项目的最小记忆入口（**别的项目一份都不读** —— 这就是「避免脏 token」的正解）。⑥ **收批栅栏带 `project`**（`pool/task.py`）：反查得到就写，拿不到就留空并**在 `history` 里记一行**说清为什么；★ **不改任何放行判据**。⑦ 新增 `tests/test_pool_projects.py` + 既有三份测试各补几针（索引坏 / 别的项目的树 / 未登记项目 / 正常树 /**「码道」必须被拒**（索引里只有注释 ⇒ **不许猜路径**）/ 租约里真的写了 `project` / `wb_project memory` 与索引逐字一致）。**验收（工人自验 + 主控复核；全量门禁与审计见 trailer 与提交之后的 audit 段）**：六个受影响测试文件（`test_pool_projects` / `test_pool_guards` / `test_pool_registry` / `test_pool_task` /`test_wb_dispatch` / `test_mem_guard`）**全绿**（139 passed）· `ruff check tools tests` = **All checks passed!**。**★ 老实说（裁定、接缝、以及又一次同一个坑）**：① ★ **工人报「2 条既有测试转红」，我裁定：守卫拒得对、错在夹具** —— 那两条把 `--cwd` 指到**仓外临时目录**，新守卫按「这棵树属于哪个已登记项目」反查 ⇒ **正确地**拒。⇒ 主控给 `sandbox` 夹具补了**沙箱项目索引**（照 `TF_POOL_REGISTRY` 同款把索引也隔离到沙箱）。★ 补的时候踩到一处**非显然**的语义：**「主树」那条反查用的是 `projects.tree_root()`（从模块位置推出来的真实仓库根），不受 `wb.ROOT` monkeypatch 影响**⇒ 只登记「沙箱临时目录」不够，还得有一条 `root` 是**真实仓库根的祖先**的登记 —— 这一条**写进夹具注释**了。② ★★ **本笔又咬到「卡树基点过期」那个坑（卡 135 正是要治它）**：卡 120 的树建在 `ce222db`（**卡 138 落地之前**），而 138 改了 `tools/wb_dispatch.py`（加开关支持）⇒ 拷回来**把开关功能覆盖掉了**（`SwitchFileError` 消失、**3 条开关测试转红**）。⇒ 按老办法把卡 120 的 diff 用 **`git apply -3`** 重新落到**当前**的 `wb_dispatch.py` 上；**一处冲突**（`--model` 的帮助文本 vs 新增 `--project`）⇒ **两边都留**。★ **同一个坑今晚咬了两次**（卡 130 那次 + 这次）⇒ 卡 135 那条「基点过期」的机器判据**优先级该往前提**。③ ★ **我写卡时的第三个同类漏项**：**没把 `tests/test_wb_dispatch.py` 写进白名单** —— 而「改前置检查」必然连带它的若干条用例（今晚第三次：卡 121 漏清单文件、卡 125 漏夹具文件、卡 120 漏这条）。⇒ 该做成一条**写卡规矩**：「**改了哪个文件的前置/清单/工具表，就要把钉住它的测试一起写进域**」。④ **硬档（一个窗口一活跃项目）不做** · **按 cwd 自动判不做** · **`memory` 列表本卡不动**（用户要等 Skill 纳入后再定）。⑤ **MCP 写面的 `pool_dispatch` 干跑没接 project 守卫**（`tools/pool_mcp.py` 不在白名单）：真派活走`--already-reserved`（守卫段本就跳过），另有 `registry.reserve` 会写 `project`；★ **如实记**，该另开小卡。⑥ 本笔**不改**「收口只有主控」的分工；★ 另：**这是 `tools/wb_land.py` 的第一次真机收口**（转发壳 → 新工具），而它**第一次就把我拦住了**（我只写了代码、忘了写 `_text_TG232.md` ⇒ 它 3 秒就停手，**没白跑 12 分钟门禁**）。**★ 本笔另含**：`docs/workbacklog.toml` 把卡 120 标 `done`；卡 140/141 的规格随本笔进 git。"

[entries."T-G239"]
id = "T-G239"
title = "「门 × 输入」表 + run_gates --affected（自查提速；宁多勿漏；收口链仍走全量）"
group = "OPS"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:tests/test_run_gates_affected.py",
  "file:docs/workbacklog.toml",
]
gaps = "**来路（架构审议里**唯一还没动的结构性项**）**：`复盘/架构审议-外包与门禁.md` **§二 错配①（粒度错配）** + **§五** 原话：> 「**A 分档**：现在门禁**只有「全量」**，没有「哪个文件影响哪道门」的依赖图 ⇒ 中等工作量，> 而且**判据方向是反的**（不是「多跑安全」，而是「**漏跑危险**」）⇒ 要先做一张**门 × 输入**的表。」实测代价（今晚真读数）：一趟全量门禁 **`pytest 1973 passed in 633s` ≈ 10.5 分钟**，而 17 道门里**真机浏览器门**最贵。★ **本笔只做「自查提速」**：判据方向写成**宁多勿漏**，而且**收口链仍走全量**（绝不动「提交前必须全量」那条铁律）。**做法（四件，都在 `scripts/run_gates.py`）**：① 把文件里**已有的** file→门 映射抽成一张显式的「**门 × 输入**」表；★ **逐门核过**——`pytest` / `acceptance` / `ruff` / `mypy` / `check_layers` / `check_layers_selftest` / `audit` **这七道**被判为「**任何改动都可能影响它**」（它们的输入太广：`pytest` 的用例到处在读 `docs/`·`复盘/`·台账；`ruff` 扫六个目录；`mypy` 整份 `src/`；`check_layers` 读整棵 docs 体系；`audit` 的证据指针可指向任何地方）⇒ **永远跑**。这条**保守**是**故意**的。② 新增 **`--affected <路径…>`**：只跑「被这些路径影响」的门。★ **判据方向写进 `--help`**：路径匹配不上任何门 ⇒ **跑全量**；某道门在表里缺输入 ⇒ **那道门照跑**；拿不准就多跑。③ ★ **一切「真的判提交」的路径仍走全量**：`tools/wb_land.py`（+ 转发壳 `gates/diag/_integrate.py`）**不透传** `--affected` —— `--affected` **只给「改完一小块自查」**用（像工人跑目标用例那样）。④ **不许静默跳过**：`--affected` 那一趟把「跑了哪几道 · **跳了哪几道、为什么跳**」写进`gates/last.json` 的 `affected` 块（`to_payload()`），输出里也打印；★ **默认（不给 `--affected`）行为逐字不变**。**验收（工人自验 + 主控复核）**：`tests/test_run_gates_affected.py` **13 passed** ·既有 `tests/test_run_gates_timeout.py` **未被打穿** · `ruff check tools tests scripts` = **All checks passed!** ·★ **真读数**：`--affected <本卡自己的文件…>` 那一趟的门集合与耗时（端到端补证「affected 块真写进 `last.json`」）·全量门禁与审计读数见 trailer 与提交之后的 audit 段。**★ 老实说（偏差、以及它自己发现的一个后门）**：① **保守的那七道门是「照卡处理」**：卡里把 `ruff`/`mypy`/`check_layers` 点成「无输入」的例子，工人**照保守**列成「永远跑」，并**如实**给出「其实可给精确输入」的建议（`ruff` = `src/ tests/ scripts/ tools/ examples/ harness/` + `pyproject.toml`；`mypy` = `src/**`；`check_layers` = `docs/**`）—— ★ **本卡不改**（宁可多跑，别漏跑）。② ★★ **它发现一个真后门（重要）**：`tools/wb_verify.py` 查 `EXPECT_GATES=17`，**会**拦住部分跑的 `last.json`；但 **`tools/wb_review.py` 只查 `ok` / `rev` / 每门 `exit_code`，不查门数** ⇒ 若有人把 affected 的 `last.json` 提交上去，**复核主链可能不拦**。★ **`wb_review.py` 不在本卡白名单** ⇒ **如实记、另开卡**（这是「自查提速」最该防的那条缝）。③ **没跑 `main()`**（那等于真跑一趟门禁）：钉的是 `AffectedPlan.to_payload()` 与**默认门集**；端到端（`last.json` 里真有 `affected` 块）由**真读数那一趟**补证。④ `--fast --affected` 那一档**不落盘**（`--fast` 本来就不写 `last.json`）⇒ `affected` 块不会进—— **符合既有口径**（那一档不是提交闸）。⑤ 本笔**不改**任何门的**判据**，也不改「提交前必须全量」。**★ 本笔另含**：`docs/workbacklog.toml` 把卡 140 标 `done`。"

[entries."T-G244"]
id = "T-G244"
title = "卡树基点过期判据 + 影响面反推 + 对抗复核常态化（提交后异步、不挡收口）+ 不变量台账"
group = "OPS"
status = "done"
evidence = [
  "file:tools/wb_dispatch.py",
  "file:tests/test_wb_dispatch.py",
  "file:tools/wb_impact.py",
  "file:tests/test_wb_impact.py",
  "file:tools/pool/task.py",
  "file:tests/test_pool_task.py",
  "file:tools/wb_advcard.py",
  "file:tests/test_wb_advcard.py",
  "file:tools/wb_invariants.py",
  "file:tests/test_wb_invariants.py",
  "file:复盘/不变量台账.toml",
  "file:复盘/外包-卡表与规矩.md",
  "file:复盘/卡/卡142-影响面反推.md",
  "file:复盘/卡/卡143-对抗复核常态化.md",
  "file:复盘/卡/卡144-不变量台账.md",
  "file:复盘/卡/卡146-合并模型白名单.md",
  "file:复盘/卡/卡147-复核器查门数.md",
  "file:复盘/卡/卡148-子进程不弹窗.md",
  "file:复盘/卡/卡149-派活器按账号.md",
  "file:docs/workbacklog.toml",
]
gaps = "**来路（用户点名的三条 + 今晚反复咬人的那个坑）**：- **卡 135（卡树基点过期）**：今晚咬了**两次** —— 一次把凭据/白名单的已落地改动拷回旧内容，一次把卡 138 的**模型开关功能整个覆盖掉**（3 条开关测试转红），是主控用 `git apply -3` 手工救回来的。- **卡 142 / 143 / 144**：用户问「**为什么你总是能发现后门**？是不是缺乏一个**审核**以及**需求架构的整理**？…后面为什么总是有？」主控的诊断：**文档不缺**，缺的是「**不变量台账**」（哪些安全主张还没被判）、「**影响面靠手打**」（今晚四次同类漏项）、「**审核在收口之后、范围之内、且不对抗**」。用户随即给出关键口径：*「对抗复核**放在提交之后**，然后**继续推进任务**，这样子可以**加快任务推进**。」***做法（四张卡）**：- **卡 135**：`tools/wb_dispatch.py` 新增 `stale_base_problem()` + 三个 git 小助手（`_tree_head` / `_changed_since` /`_commits_since`），**接进 `preflight`** ⇒ 卡树基点与当前主树基点对不上就**在派活前**拦；配 4 条反例钉子 + 1 条接线钉子。- **卡 142**：新增 `tools/wb_impact.py` —— 吃「改了什么」，回「**受影响的门**（★ **读** `scripts/run_gates.py` 的「门 × 输入」表，**缺输入的门一律必跑**）+ **钉住这些文件的测试** + 建议的白名单」；还有 `--check`：**事前**点名「改动面里有文件不在声明域里」（事后那条在 `wb_review` 里）。- **卡 143**：`tools/pool/task.py` 支持「**审计型只读成员**」（`read_only = true` + 空 `paths`）——★★ **它不参与放行判据**（`need` 只数非只读成员）⇒ **提交之后才跑的对抗日志不会把任务卡在 `collecting`**；新增 `tools/wb_advcard.py`（从 `--task`/`--commit` 生成对抗**开场白 + 指针索引**，含固定**四问**：①哪条新能力让「看着绿其实没查」变得可能 ②哪条判据只查存在性而非真伪 ③哪条自报清单还在被当判据④哪条退出码/产物被当成了结论；并写明硬要求：**只读 · 证据指针 · 找不到就说找不到 · 产出是跟进卡清单**）；`复盘/外包-卡表与规矩.md` 新增一节：**默认提交后异步** · 发现了**开跟进卡** · **不可逆/影响面大的仍要前置** ·**实现者与复核者必须不同族** · 输入用**指针索引** · 开场白必须**对抗** · 诚实边界（降低概率、不归零、最终责任在主控）。- **卡 144**：新增 `复盘/不变量台账.toml`（**安全主张 → 判据在哪 → 反例钉子 → `covered`/`partial`/`missing`**）+ `tools/wb_invariants.py`（`--check` 核**判据与钉子真的存在**，对不上就**咬**；`--missing` 就是那份**待验台账**；★ **`missing` 是状态、不是错误** —— 不许把「诚实」判成失败）。**验收（工人自验 + 主控复核；全量门禁与审计见 trailer 与提交之后的 audit 段）**：五个目标测试文件（`test_wb_dispatch` / `test_wb_impact` / `test_pool_task` / `test_wb_advcard` /`test_wb_invariants`）**219 passed** · `ruff check tools tests` = **All checks passed!**。**★ 老实说（偏差、裁定与两次现场）**：① ★★ **135 要治的坑，当晚报了两次**；而这次落地我**特意等卡 140 落完才建 142/143/144 的树**（142 要读 140 刚加的「门 × 输入」表）—— ★ **纪律生效了一次**，写在这里当正例。② ★★ **143/144 第一次都撞了 `--max-turns` 上限**：退出码 **0**，但 `result.subtype = error_during_execution`、**回话是空的** ⇒ ★ **看门狗没被骗过**（这正是「退出码 0 其实没跑完」那一族，判决照实报「没跑完」）。续跑时又连撞**两个坑**：**死掉的工人没还租约**（域守卫照旧拦，★ **卡 141 正是要治它**）·**`log 已存在`**（守卫说「证据不许被悄悄盖掉」）⇒ 主控**手工还租约** + 把第 1 次的 log **改名留档**（`wb-143.attempt1.*` / `wb-144.attempt1.*`）+ 再 `--resume auto --max-turns 400`，两次都跑完并交申请。③ **144 的台账故意保留 `missing` 条目**（例如「**门数≠17 冒充全量门禁**」—— 卡 140 自己发现的后门：`wb_verify` 查门数、**`wb_review` 不查**）⇒ 本笔**不修**那个后门（**另开卡**，写进台账的 `note`）。④ **142 与 143 是同一族工具**（一个**算**影响面、一个**拿**影响面写对抗开场白）：143 的生成器**复用** 142 的`wb_impact.py`，★ **不复制第二份门表**（本仓最忌第二份真源）。⑤ **本笔不改**任何既有判据：申请仍必须带证据、既有放行判据一字未动、收口仍只有一个写者。**★ 本笔另含**：`docs/workbacklog.toml` —— 卡 135 / 142 / 143 / 144 归到 `T-G244` 并标 `done`。"

[entries."T-G245"]
id = "T-G245"
title = "死租约要还（atexit 兜底 + 扛强杀）+ 复核器查门数（部分跑不许冒充全量）+ 子进程一律不弹窗（+ 扫描钉子）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/wb_dispatch.py",
  "file:tests/test_wb_dispatch.py",
  "file:tools/wb_review.py",
  "file:tests/test_wb_review.py",
  "file:tools/pool/no_window.py",
  "file:tests/test_no_window.py",
  "file:tools/pool_mcp.py",
  "file:gates/diag/gate_lock.py",
  "file:复盘/卡/卡150-收口链幂等重跑.md",
  "file:复盘/卡/卡151-判决文案要分真因.md",
  "file:docs/workbacklog.toml",
]
gaps = "**来路（三件都是**现场咬过**的）**：- **卡 141**（死掉的工人不还租约）：今晚**第四次**现场 —— 143/144 的续跑被「死工人留下的活租约」拦住、我自己被打断的几次派活也留下三条活租约，每次都是**主控手工** `registry.release` 才继续。★ 同族的门禁锁在卡 118（`T-G216`）之后早有 **`atexit` 兜底、任何退出路径都还**，工人租约也该有。- **卡 147**：**卡 140 自己发现的后门** —— `tools/wb_verify.py` 查 `EXPECT_GATES=17` **会**拦部分跑的 `last.json`，但 **`tools/wb_review.py` 只查 `ok`/`rev`/每门 `exit_code`、不查门数** ⇒ 有人把 `--affected` 那一趟的 `last.json` 提交上去，**复核主链可能不拦**。- **卡 148**：用户反馈「**一直在蹦命令行窗口**」 —— 主控逐层查证：派活器 `--detach` **已带** `DETACHED_PROCESS|CREATE_NO_WINDOW`（`T-G96`）；工人 CLI **自己**起子进程带了 `windowsHide: true`（在它 dist 里数到 **240 处**）；★ 但 **`tools/pool_mcp.py` 那个起「收申请」子进程的 `Popen` 没带** —— 而它跑 `wb_task.py claim`，**可能连带整趟门禁**（pytest/bash/浏览器）⇒ **一次能闪一串**。**做法（三张卡各自在自己的树里干；主控按文件收口）**：- **141**：把「还租约」放进**正常/异常退出路径**（含 `kill_tree` 之后、看门狗掐掉之后、任何异常早退），照门禁锁那套用 **`atexit` 兜底**；`--detach` 那条放在**那个脱离子进程**的退出路径上；★ 还要**扛得住被强杀**（陈旧租约要能被清 —— 判据不够就**如实说**，别自己发明按 pid 判死活）；五条钉子，含「**别人的活租约不许被误清**」。- **147**：`wb_review.py` 补「**这一笔所依据的 `last.json` 必须是全量那一趟**」——门数**从 `run_gates` 的门表读**（★ **不许写死 17**、**不许再造第二份门表**）；或对 `affected.enabled = true` **判红/标注**；四条钉子，含「**桩掉门表 ⇒ 跟着算**」那条防第二份真源。- **148**：新增 **`tools/pool/no_window.py`**（「不弹窗」flag **收敛成一处**）+ `pool_mcp.py` 用它；**审全仓**并列清单；★ 加一条**扫描钉子**（`tools/**` + `scripts/**` 里起子进程没带不弹窗 ⇒ **红并逐条点名**，例外**显式带理由**）。**★ 本笔的关键现场（环境变了，值得记）**：① ★★ **今晚把「CLI 与界面是两套登录态」查清了**：界面（WorkBuddy）的登录态在 `~/.workbuddy`，而**CLI 根本不读它**（我把界面那份**连 Cookies 一起完整拷出来**做成 profile，起来仍是「**未登录**」）；CLI 的登录态在**它自己的家**里 ⇒ ★ **换号的正确做法 = 给 CLI 一个自己的家（`USERPROFILE`/`HOME` 指到沙箱）+ 在那个家里登录**；② 于是这三张卡**跑在备用号上**（我自己的号被 429 限流到 **10-03 13:03**）：派活时把那组变量给工人进程，★ **外面那个号一字未动**（指纹核对过）；备用号探针返回完整会话（**不是 429、不是未登录**）；③ 派活途中被闸拦两次：**死租约**（第 4 次，见上）与**内存闸**（一次可用 0.2 GB、一次瞬时读成 **0.0 GB** —— 腾出后重派即过）；④ ★ **我的同类漏项第 7 次**：卡 147/148 的**规格**里写的是任务 `B-BACKDOOR`，而我的**预声明**用的是 `B-LEASE`⇒ **两个名字都没注册** ⇒ ★ **三张卡的成送申请全都没交成**（它们**如实报了**「没交成」）⇒ 现已按规格补注册 `B-LEASE`(141) 与 `B-BACKDOOR`(147/148)。**验收（工人自验 + 主控复核；全量门禁与审计见 trailer 与提交之后的 audit 段）**：四个目标测试文件（`test_wb_dispatch` / `test_wb_review` / `test_no_window` / `test_pool_mcp`）**217 passed** ·`ruff check tools tests scripts` = **All checks passed!**。**★ 老实说**：① ★ **成送申请是在落地之后由主控补交的**（卡尝试交的时候任务还不存在）—— 这**削弱了「卡自报」这条链**，如实记；② 148 的**审计清单**与**扫描钉子的例外名单**需要人看一眼（哪些「确实要给人看」的交互式子进程被列进例外）；③ 本笔**不改**任何放行判据（申请必须带证据、既有守卫、收口唯一写者都一字未动）。**★ 本笔另含**：`docs/workbacklog.toml` —— 卡 141/147/148 归到 `T-G245` 并标 `done`。"


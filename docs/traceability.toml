`samples` 仍是 20 条上限（`tools/pool_accounts.py:63 SAMPLES_CAP = 20`）、仍不带 `reset_at` —— 本笔只读它、不扩它。要扩是另一张卡，且会改账本形状。
`test_real_ledger_produces_no_curve_today` 是对**夹具**跑的不是对真账本跑的：卡规格明令源码与测试不许出现仓外路径，所以夹具按真账本形状裁到两个号。真文件的结论（`used_percent` / `reset` / `span` 零命中）另行只读 grep 过，是旁证不是自动化验证。
`pipe doctor` 在本仓不存在（无 `tools/pipe.py`、根目录无 `pipeline.toml`），所以这一条没验。
""",
]


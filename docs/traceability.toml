gaps = "**颜色令牌全改、值一个没动**：`--card→--panel`、`--surface-2→--panel-2`、`--line→--border`、`--line-strong→--border-strong`、`--text→--ink`、`--accent-on→--accent-ink`、`--accent-N-on→--accent-N-ink`、`--text-on-dark→--toast-ink`（118 处，含 app.css / index.html / 门禁工具 / 测试）。**尺度令牌刻意不跟包**（`--sp-*`/`--r-*`/`--fs-*`）：我们是包的超集（11/5/9 档），把 11 档间距砍成包的 6 档、5 档圆角砍成 3 档是**改视觉**，必须与步 2「层次语言」、步 3「排版节奏」一起做 —— 映射表里写明了这条理由。**唯一有意变化**：`--accent-soft` 并进 `--panel-2`（值为中性灰 `#f1f5f9` 而名字写着强调浅底，T-G26 记过；T-G42 后只剩进度条槽一处）→ 24 行黄金的颜色 `#f1f5f9→#eef2f7`。**证明**：42 份渲染清单**逐行一致**（脚本一次性：旧行必须在新行里，唯一例外逐条点名「颜色变了的那 24 行」），所以「改名零变化」不是口号。**三条教训**：① **全仓替换必须配一次真跑** —— `f\"--accent-{idx}-on\"` 这种拼出来的名字字面替换抓不到，是跑测试喊出来的；② 台账两条 `text:app.css::…` 证据指针指着旧名 → 同提交改（否则 audit 红）；③ **历史文本不改**（复盘与 baseline 销账记录留旧名，baseline 顶上写明「这是当时的名字 + 映射表在哪」）。**没做**：`--shadow` 的归位（包只给真浮层用 `--shadow-1`，而我们把阴影用在卡片上 —— 属步 2 的决定）。"


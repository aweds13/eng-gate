gaps = "**先量后改**：全仓只有 **15 处真图标字形**（14 种），全在 `src/web/index.html` —— 底栏 7 个 emoji、标记 ⚑、删除 ✕ ×4、折叠 ▸▾、上移下移 ↑↓、分组勾选 ✓；另有 10 处「当标点/状态用」的（✅❌⚠️）不在本卡范围。**门禁侧现状**：**没有任何测试或工具断言过这些字形**（工具控制台里的 ✅❌ 是它们自己的输出），会动的只有渲染黄金的**文字列**。**换的理由**：emoji 是**彩色字体**、不吃 `currentColor` —— 选中态改不了它的颜色、也看不出「这个图标现在是次要色还是强调色」，而且它随系统字体变样子。四条规矩（写进 `index.html` 注释）：尺寸与颜色只在 CSS 定（底栏 20px / 行内 16px）；**不给 `svg` 加 class**（加了会被黄金当「有名字的容器」多采一行）；**不加 `<title>`**；svg 在 `button` **内部**、自己不注册动作（靠 `closest('[data-action]')` 冒泡）。底栏 7 个按钮同时补 `aria-label`（黄金对「有真元素孩子的容器」取 aria-label 当文字列，不补那 7 行的标签就从黄金里消失）。**三个当场踩到的坑**（进地图 §6）：① 底栏是**静态壳**，`${icon(...)}` 写在 HTML 里只会当字面文字渲染 → 改成启动时填槽位；② 把 `⚑ 已标记` 换成模板串时忘了原来那对是**单引号字符串** → 引号提前闭合、整页起不来（`ui_dom_probe` 一句 `Unexpected identifier 'flag'` 指到了）；③ **底栏矮了 3px**（65 → 62）：emoji 字形行盒 24px、20px 图标 21px —— 这是想要的（图标不该撑高行盒），没有为凑 3px 写 `line-height: 24px` 那种裸值。**代价**：渲染黄金 26 份动（nav 7 字形 +98 行、⚑ +15、✕ +24），理由落 `gates/render/LAST_UPDATE.md`。"




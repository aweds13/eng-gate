gaps = "**用户原话**：2026-09-27「不能多几把跨树锁」。**为什么全局串行已无必要**：062（T-G156）已把端口按树隔离并实测两段端口基可同时跑真机门（四进程 rc 全 0）——必要条件收敛为「同一段不并行」+「整机趟数有上限（内存：一趟 17 门 15-30 个无头 Edge，机器 15.2 GB 常驻剩 1-3 GB）」。**锁路径向后兼容**：不设 TF_GATE_PORT_BASE → 仍是 gates/diag/gates.lock（逐字不变）；设了 → gates-<BASE>.lock；非法/越界 WARN 退默认段（与 run_gates.py 的 port_base() 同口径）；release 不给段 = 默认段，与今天一致。**上限语义与空位过期**：TF_GATE_MAX_CONCURRENT 默认 2（=1 退回全局串行旧行为）；实现 = 先创建本段锁再重扫全目录计数（含自己），超限自删退回并打印「当前 N 把在跑（上限 M）…等空位」，计数发生在创建之后不会超卖；名额只数租约内活锁 → 持有者死了/租约过期空位自动回归不泄漏；上限只保护内存不当门禁判据。**五条反证读数**：①不同段同时拿（9061+9081 各 rc=0，全局 1/2→2/2，锁文件各是一把）；②同段第二把等（rc=3，报持有者 card=075 已 19s）；③上限=1 第二段 rc=3 且其锁文件自删（报「当前 2 把在跑（上限 1）…等空位」）、=2 两段都 rc=0（全局 2/2）；④不设变量 lock_path()=主仓 gates/diag/gates.lock（只读验证不 acquire）；⑤同卡 renew rc=0（age 刷回 0s）/ 别人 renew rc=5 原锁未动 / 短租约 4s 睡过头后第三个卡清陈旧（已 7s 未动 > 租约 4s）拿到 rc=0。**先红后绿**：tests/test_gate_lock_multi.py 10 条在旧实现 b90c4e4 上 8 failed 2 passed（红的正是分段并发/上限/路径兼容/新字段/status 多段/默认上限）；新实现上 multi+lease 15 passed（lease 五条一字未动仍全绿）。**租约与续租未丢**：陈旧判定/续租/别人不能续全保留，且顺手收紧一条——同段 acquire 的陈旧判定改以持有者写进锁文件的租约为准（旧实现等的人拿短 --stale-after 就能清别人的活锁 = 063 现场机制；铁律 25/29 收紧非放松；此问题由反证 5 第一版 rc=3 暴露后修掉）。**没动**：scripts/**（含 run_gates.py）、src/**、tools/**、docs/ 下除 traceability/changelog 外的一切、gates/diag/ 下除 gate_lock.py 外的一切、.wt/**、data/、主树外来未跟踪文件；默认段锁全程未碰（开工基线不存在，期间卡 072 正常业务 acquire 持有，收工对比如实说明）。**CLI 反证跑法**：临时 git 仓库隔离（gate_lock.py 只依赖 git 定位 main_root），不在主仓锁目录留测试痕迹、不受正在跑的别的卡干扰。"



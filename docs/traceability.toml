gaps = "行为流层继续搬第四批：**㉗ 手机离线只读区**（手机档宽度；联网先逛 今日/全部任务/复习 → 确认**壳已被 Service Worker 接管** → 断网 → ★ **刷新真的落进「离线记」**（壳从缓存里拿出来）→ 只读区四段都在（该提醒了/今天该复习/逾期/今日摘要）+ 如实写着「上次联网时看到的样子」「只标出来、不发系统通知」+ ★ **反证：只读区里一个 `data-action` 都没有**）；**⑮ Obsidian 红线**（存 Vault 需要**真的存在**的根目录 → ★ 把导出目录填成 Vault 子目录 → 400 原话「导出目录不能放在 Obsidian 的 Vault 里」被界面透出 → ★ **拦下之后后端设置没被偷偷改掉**）。合计 **17 条流 / 172 项断言**（两遍指纹一致，实测 342s）。★ **这一批的两个发现**：① **「点得到」在手机档是真的挑入口的** —— 手机上左栏 `display:none`、底栏只 7 个入口，复习/学业/备忘录要从**设置页那一节**进；第一版直接在手机档找 `[data-view=\"review\"]`，命中测试当场报「元素是 0×0，点不到」（渲染层看不出来：它拿 `offsetParent` 兜底，找不到可见的就退回隐藏元素再 `.click()` —— 那是「能渲染」不是「用户点得到」）。② **`type(sel,'')` 不是清空**：它一个字符都不打、原值原样留着，于是「关掉跳转」静默没生效 → 新增 `t.clear()`（真点 → Ctrl+A → 真按退格）。这与「`attr('value')` 不等于用户打进去的值」同族：**把「我调了一个看起来对的 API」当成「事情发生了」——凡是我做了什么与世界变成什么样之间隔着一层，就要用世界的样子去断言**。**故意不验的**：⑮ 里「点一下真的跳进 Obsidian」那一下会真的把 Obsidian 拉起来，只有人在装了它的机器上点一次才知道（如实写在复盘 §1）。**成本**：单跑这一层 ≈285s → **≈342s**，整轮门禁 ≈480s → **≈545s**；三条出路里我倾向「压每条流的启动开销」（每条起步 ≈3–4s，十几条就是 60~90s 纯等待），但那是**改共用底座**（渲染层同一份），得单独一张卡、单独验 —— **先记账，不在这张卡里顺手改**。"



status = "done"
evidence = [
  "text:复盘/外包-卡表与规矩.md::铁律 27",
  "text:.gitignore::gate_lock",
]
gaps = "**为什么有这张卡**：两件事一个根因 —— 该进版本管理的东西住在被 gitignore 的工作台里。① gates/diag/ 整个目录被 .gitignore 忽略，卡 062 给 gate_lock.py 加的「锁报告的端口段跟随 TF_GATE_PORT_BASE」改好却进不了提交（只在自己树生效，主控只能手工拷到主树，换机器/换窗口就没了）；② 本轮新增的铁律 23–28 只写在 gates/diag/第二批界面反馈-队列.md 里，而那个文件被忽略，规矩留在那里迟早随工作台一起丢。**做了什么**：把铁律 23/24/25/26/27/28 六条（含各自日期、代价数字、原话、修法）+ 门禁串行锁口径（gate_lock.py 的用法、租约判陈旧、为什么不许用 pid）+ 端口按树隔离口径（TF_GATE_PORT_BASE 不设=8531/8541 段逐字不变、设了则 render=BASE/BASE+1、ui_flow=BASE+10..+13；TF_PYTEST_WORKERS 不设=min(4, cpu)），原文搬进已入库的 复盘/外包-卡表与规矩.md 新增 §24「并行期铁律（23–28）+ 门禁锁/端口口径」（子节 24.1–24.8）；逐条在段首标出处（来源 gates/diag/第二批界面反馈-队列.md §五 + 铁律号 + 2026-09-27），台账号/日期/代价数字/原话一字未改写，新家只重排标题层级；只动这一个协议文档（复盘/长任务执行协议.md 归卡 066，不碰）。.gitignore 里 gates/diag/ 那行不动，在其下加精确取反三步 !gates/diag/ → gates/diag/* → !gates/diag/gate_lock.py（忽略目录再取反文件不生效，必须三步），只 git add gates/diag/gate_lock.py 这一个文件（卡规格/诊断日志/活文档仍不入库，绝不 add 整个目录）；不改来源文件。**读数**：git check-ignore -q gates/diag/gate_lock.py 退出码 1（不再忽略）；git check-ignore -q gates/diag/第二批界面反馈-队列.md 退出码 0（仍忽略）；git ls-files gates/diag 恰好一行 gates/diag/gate_lock.py；六条铁律各一条 Select-String 命中，台账号/日期与来源一致。**门禁连带**：新入库的 gate_lock.py 若被 check_layers / audit_titles / style / pin_check 挑出要求（层归属登记、标题规范等）则按门禁要求如实补登记，绝不关掉或降低任何门禁。**没动**：src/**、tools/**、scripts/**、tests/**、gates/diag/ 里除 gate_lock.py 之外的一切（尤其卡*.md / wb-*.jsonl / 自动推进表.md / 第二批界面反馈-队列.md）、.wt/**、主树外来未跟踪文件、data/ 与真实库/备份。"
[entries."T-G160"]
id = "T-G160"
title = "run_bg：长命令分离起 + 哨兵轮询，治工人单次调用 10 分钟上限导致的孤儿服务与跨树误杀"
group = "OUTSOURCE"
status = "done"
evidence = [
  "file:tools/run_bg.py",
  "file:tests/test_run_bg.py",
]
gaps = "**为什么有这张卡**：工人单次调用有 10 分钟上限，而全量门禁 6–7 分钟（pytest 107s / render 110s / ui_flow 176s），重采黄金加再跑一遍必越界；越界即调用被掐 → serve.py/无头 Edge 变孤儿 → 跨树误杀（铁律 27/28；058 为此烧 37M tokens/2h15m）。**做了什么**：①新增 tools/run_bg.py（纯标准库）：run 用分离进程起命令（Windows 用 creationflags = CREATE_NEW_PROCESS_GROUP | DETACHED_PROCESS；一律 subprocess.Popen(argv_list)、不用 shell、不拼命令行字符串），stdout/stderr 都进 --log，立刻返回 pid=/log=/rc_file=，父进程退出不带走子进程；status 只按哨兵文件 <log>.rc 判终态（包装器在命令结束时先写临时文件再 os.replace），不看端口不看进程名，打印 state=running / state=done rc=N + 日志静默秒数（按 mtime）+ 尾 --tail 行；退出码 running=0 / done rc=0→0 / done rc!=0→3 / 用法错或日志不存在→2。②不改被测命令、不给 run_gates.py 加任何参数（rc 由外部包装器 __wrap__ 落盘）。③tests/test_run_bg.py 五条钉子（秒回 / 两态轮询 / 命令不存在 rc!=0 且 status 3 / log 不存在 2 / 缺 -- 与 log 不可写 2；慢命令只用 sleep 2、结束前轮询干净不留孤儿）。④复盘/长任务执行协议.md 新增 §十三（判据 / 为什么 / 代价读数 / 与 T-G156 分工 / 四条坑）。**反证读数**：20 秒命令 run 实测 0.24s 返回且 pid=79556（父退出后子活到最后、rc=0、日志尾 bg done）；status 先 state=running（idle 9.8s，退出码 0）后 state=done rc=0（退出码 0）；负样例命令不存在→done rc=127 且 status 退出码 3、log 不存在→2、缺 --→2、log 不可写→2；先红 5 failed → 后绿 5 passed；ruff All checks passed；mypy src/ 56 文件 0 error。**真撞的坑（写进 §13.4）**：DETACHED_PROCESS 的子进程不把重定向过的 std 句柄再传下去，包装器用 Popen(stdout=None) 跑真命令会丢孙进程输出 → 改成包装器自己 open(log,'ab') 并显式把句柄交给被测命令。**边界**：§3 列的共享三件（traceability.toml / changelog.md / 交接-重构进度.md）按卡 §4 与外包规矩 §16.3 归集成者，本卡未写、台账条目放复盘末尾；未同树跑两个全量；gates/logs/ 是 gitignored 产物。**没动**：src/**、scripts/**（含 run_gates.py）、其余 tools/**、复盘/外包-卡表与规矩.md、gates/diag/**、.wt/**、外来未跟踪文件、data/。"


[entries."T-G161"]
id = "T-G161"
title = "门禁锁租约改大并支持续租：长门禁卡不再自己把自己变成陈旧锁而被别人拿走"
group = "OUTSOURCE"
status = "done"
evidence = [
  "file:tests/test_gate_lock_lease.py",
  "text:gates/diag/gate_lock.py::DEFAULT_STALE_AFTER",
]
gaps = "**为什么有这张卡**：063 实测（时间线）11:10:08 拿到锁（租约默认 1800s）→ 11:16–11:41 连跑三趟全量门禁（反证 A/B/C，持锁 31 分钟）→ 11:40:08 租约满而它还在跑 → 11:40:18 卡 066 按规则判它陈旧、把活锁拿走 → 11:41:12 最后一趟才结束，两趟真机门重叠约 1 分钟。没红只因两张卡用了不同端口段（T-G156 隔离）；都用默认段就是一次假红。**两条根因**：① DEFAULT_STALE_AFTER=1800（30 分钟）小于「一张卡持锁的常见时长」（三趟门禁 ≈ 30 分钟），正好把租约用光；② 租约是从 acquire 起算的静态计时，跑门禁期间锁文件没人动，「已 N 秒未动」一路涨到过期 —— 续跑中的卡会自己把自己变成陈旧锁。**改法（选 A：外部续租子命令，不选 B）**：① 默认租约 1800 → 10800（3 小时），docstring 与 --stale-after help 同步；② acquire 成功多印一行租约到期时刻（本地时间）+ 到期前记得 release 或让它自己续租，只加不改既有措辞；③ 新增 gate_lock.py renew --card，持有者定期调用即 os.utime 刷新锁文件 mtime，只有当前持有者同卡号才允许续（别人续不了，退 5 且不动原锁）。**选 A 的理由**：工人每次以子进程调用 gate_lock.py（acquire/run_gates/seal/release 各是独立进程），实现 B 的进程级守护线程只在同进程里 acquire 后就地跑门禁时有效、跨进程不生效；A 的 renew 在跨进程下就生效且判据干净。**判据与串行**：判据仍是锁文件 mtime（不引入 pid 判活），串行性没放松（renew 不改谁能拿锁、只刷 mtime、只有同卡号能续）。**先红后绿读数**：tests/test_gate_lock_lease.py 用 importlib 按路径加载 gate_lock.py、lock_path monkeypatch 到 tmp（绝不碰跨树共享真锁 gates/diag/gates.lock）、用 os.utime 拨 mtime 造陈旧（不靠长 sleep）；旧实现（git show 393fe84:gates/diag/gate_lock.py）上 3 failed 2 passed（默认租约 1800!=10800、cmd_renew 缺失两处），新实现 5 passed。**续租与不许别人续的反证**：测试里先拨 mtime 到租约之外让 status 报可被清，renew 后 status 报租约内且另一个卡 acquire 退 3（拿不走）；真机 CLI 上 renew --card 067 退 0、renew --card 999 退 5 且锁文件 mtime 前后不变。**串行未松的反证**：两个不同卡号 Barrier 同时 acquire，结果集恰为 [0, 3]（只有一个成功）。**没动**：src/**、scripts/**（含 run_gates.py）、其余 tools/**、复盘/外包-卡表与规矩.md（禁区，其 §24.7 仍写默认 1800s 与本卡不一致，建议主控后续加日期注）、gates/diag/ 里除 gate_lock.py 之外的一切、data/、真实库/备份、.wt/**、主树外来未跟踪文件。"


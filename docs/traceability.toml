[entries."T-G43"]
id = "T-G43"
title = "视觉线步 0（SR-NF1 / N30）：99 处内联 style 收进 app.css（静态 → 语义类/工具类，动态留在标记里）+ 逐视图证明视觉零变化"
group = "PROCESS"
status = "done"
evidence = [

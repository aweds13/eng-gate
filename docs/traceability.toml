[entries."T-G40"]
id = "T-G40"
title = "验证层两个漂移源：采集竞态（`stats` 的黄金一直是上一个视图的内容）+ fixture 日期与**星期几**相关"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/渲染采集漂移与星期相关-T-G40.md",
  "text:tools/tf_browser.mjs::export const FETCH_WATCH",
  "text:tools/tf_browser.mjs::export async function waitIdle",
  "text:tools/tf_browser.mjs::due_date: dayOffset(7)",
  "text:tools/render_check.mjs::await waitIdle(cdp)",
  "text:tools/render_check.mjs::['title', 'desc'].includes",
  "text:tools/ui_flow_check.mjs::await waitIdle(this.cdp)",
  "text:gates/render/LAST_UPDATE.md::采集竞态",
  "test:test_ui_flow_check.py",
]
gaps = "**两条漂移源都堵上了**，四条实测记录：① **采集竞态** —— `waitQuiet` 只看 DOM 变动，而「点视图 → 请求在飞 → 最后一次 innerHTML」中间**一段 DOM 都不动**；`stats` 视图 7 个接口串行（含 371 天热力图），冷启动时这一段超过 0.72s → 采到的是**上一个视图（focus）的残留画面**（两份黄金逐字节同大小、同 rows=51 是旁证）。修法 `FETCH_WATCH` + `waitIdle`（DOM 静 + **没有在飞请求**），两个工具共用。② **fixture 与星期几相关** —— 周结算的债务是**周日快照**，而「周日离今天几天」随星期几变；未完成任务的偏移 0…+6 会让读数变 → **没有代码改动、换个星期几黄金就红**。修法：未完成的偏移只留 ≤ -1 与 ≥ +7；真库上把 7 个候选周日各算一遍，全是 1（证明不假红）。③ 顺带补了采集器一个盲区：嵌 `title` 的 SVG 图元（热力图/节奏图的每一格）被「匿名容器」规则整类跳过 → 点亮状态从来没进过黄金；改成 `title`/`desc` 不算真孩子（黄金因此长大，归一化计数 129 → 3441，**照实报数**）。④ 行为流层的同一个等待也换成 `waitIdle`，17 条流复跑全绿。**没做**：「每个视图采到的内容必须与它自己有关」这道保险（防「三方一致地错」）—— 记在这里当下一张卡；`waitIdle` 也不覆盖 setTimeout 里以后再发请求那种写法。"

[entries."T-G41"]
id = "T-G41"
title = "缺陷：习惯页的「今天」用了 UTC 日期（凌晨差一天；点一下反而把打卡取消掉）+ 热力图同族差一天"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/习惯页今天差一天-T-G41.md",
  "text:src/web/index.html::const today=todayISO();",
  "text:src/web/index.html::const iso=todayISO(d);",
  "test:test_web_frontend.py",
]
gaps = "**修了发现的两处**：`renderHabit` 的今天、`heatmap` 的格子日期（都改走 `todayISO()`，本机时区）。**它为什么会伤人**：`new Date().toISOString()` 给的是 UTC 日期，本机 UTC+8 → **本地 0–8 点算出来是昨天**：界面把「今天已打卡」显示成「打卡」，而点下去（服务端按本地今天翻转）会把那次打卡**取消**掉，提示还写着「已打卡」。**护栏两层**（都在 `test_web_frontend.py`）：全文件级不许出现裸的 `new Date().toISOString()`；函数级 `renderHabit`/`heatmap` 里不许出现 `toISOString` —— 判的是**剥掉注释后的代码**（不剥注释会把「别这么写」那句解释也判红，同 T-G39 的教训），并用合成数据证明它咬得住。**没做**：全仓的「日期取法」清点（`docs/` / `tools/` / 别的 `.js`）；护栏只扫 `index.html`。"


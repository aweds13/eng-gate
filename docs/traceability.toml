  "text:src/web/app.css::.card.block { display: block }",
  "text:src/web/app.css::.grow { flex: 1 }",
  "text:src/web/app.css::.chart { width: 100%; height: auto; display: block }",
  "text:src/web/app.css::.chart.radar { display: inline; max-width: 260px }",
  "text:src/web/app.css::.bar-v { border-radius: var(--r-xs) var(--r-xs) 0 0 }",

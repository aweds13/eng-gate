  "route:POST /api/settings/restore",
  "test:test_backup_restore_line.py",
]
gaps = "**为什么这一条一直没搬（T-G73 当时如实记的）**：恢复是**不可逆**动作，而备份就落在**库文件旁边**（`<库名>.bak-<时间戳>`，见 `storage/backup.py`）—— 在真实库上跑一遍就是拿用户的数据做实验。**走法（本卡设计的那个）**：这一层起服务用的是 `serve.py --fresh`，库在 `%TEMP%/timeflow_fresh_*` 里，**它的备份也在那儿** —— 于是「临时库 + 临时备份目录」天然是同一个临时目录，**真实库与真实备份目录一个字节都不会被碰**，而且这一条本身有断言（`dir` 必须含 `timeflow_fresh_` 且不在仓库路径下），不是口头保证。**一条流里没法重启服务**去触发「启动前自动备份」，所以那份「旧备份」由流自己按**产品的命名规则**放一个（时间戳取 1 分钟前）—— 于是这一条验的是**恢复那条不可逆的路**：① 列表认得它（按数据名点得到、界面把它当正常备份：时间戳解析得出来、没被标「名字被改过」）；② 二次确认里**写清恢复到哪个时间点**（原始时间戳）并写明「选错了还能回去」；③ ★ **取消之后一步都没走**（备份数不变 + 那条新任务还在）；④ 确认后**数据真的回到那一刻**（后来才加的任务不在了）；⑤ ★ 恢复前**自动又备份了一份现库**（多出一条 + 回话里念出它的名字）；⑥ ★ **可逆是真的**：点那份「恢复前的现库」→ 那条任务**又回来了**（「选错了还能回去」不是一句空话）；⑦ 收尾再恢复一次，世界回到这一遍开始的样子（不污染后面那些流）。**边界（不假装）**：`make_backup` 本身**不在这里重复验**（`tests/test_backup_restore_line.py` 14 条盯着它，含「比程序新」那条分支）；**流自己造的那份备份不是「启动前自动备份」那条路**，只是按同一命名规则放的文件 —— 「起服务时真的自动备份了一份」仍在人工那一眼里（那是**你的真实库目录**，机器不许碰）。**顺带更正清单里一处错的期望**：⑪ 的反证原来写着「不许把比程序新的备份硬恢复（应如实说不支持）」—— 而实现的口径（2026-09-21 用户定）是**照常恢复 + 如实报 `newer_than_app`**（界面回话写「但这个备份比当前程序新…可能有字段读不出来」），两处对不上，清单那句按实现改了。**成本如实记**：这条流 **41.4s**（四次恢复 + 文件操作，是这一层里最慢的一条），整层从 ~310s 涨到 ~350s —— **已经超出 T-G38 定的「一遍 ≲3 分钟」**（T-G73 那批就已经超了，不是本卡造成的），理由与取舍写在复盘里。"


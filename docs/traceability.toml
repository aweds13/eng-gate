gaps = "**回答用户那句「为什么是要我来验证？你不能验证吗？」** —— 结论：以前**没验过界面**，不是不能：把「沙箱不让我起浏览器」当成了「这台机器没有浏览器」。**做出来的东西**：`tools/render_check.mjs` 起临时库 + 种子数据（走真 HTTP 接口）+ 真浏览器（CDP），采 3 档宽度（1280/820/390，跨过 app.css 三条断点）× 14 个视图的**几何清单**（选择器/文本/盒子/字号·行高·字重/前景·背景/圆角·内边距），与 `gates/render/*.txt` 42 份黄金**逐字节比**；**每轮把同一份清单采两遍**做确定性自检（不一致 = 工具自己不可信，退出码 4，不当成「界面变了」）；改黄金必须 `--update --reason`，理由落进 `LAST_UPDATE.md`；**起不了浏览器 = NOT RUN**（退出码 3 → `gates/last.json` 的 `not_run` 栏 + trailer 写 `render NOT RUN`，**不算通过**）。★ **建成当天抓到三类真缺陷，都修了**：① **卡片正文被一排动作按钮挤成「一列一个字」**（行内 `flex:1` 基宽 0 + 中文 min-content = 一个字宽；标题实测 34×105，24 个元素横跨 5 个视图 × 3 档宽度；修法 = 19 处行内 `flex:1` → `.card-body`「真实基宽 240px + 下限 8em」，扫描 24→1，important 页整页高 791→450）；② **复选框被当文本框画**（`.new input` / `.field input` 命中 checkbox，`#newMyDay` 76×13 白盒子、标签被挤成 122×64 竖排；修法 = 加 `:not([type=checkbox]):not([type=radio])`，修后 13×13 / 122×19）；③ **离线页那张「这台设备用不了离线存储」永远挂着**（`notReady` 无条件拼进去、而 `capture` 按 `ready` 判断 —— 同屏自相矛盾，只有渲染出来才看得见；修法 = `ready ? '' : …`）。**建层时踩到 6 个确定性坑（全部由自检抓出）：选中态随首屏时序翻 / 随机设备号 / 滚动条吃 15px（且改视口尺寸后会重置）/ mkdtemp 随机目录名在换行临界宽度上换折行 / 字面日期明天就变 / 元素 id 拼数据 uuid**。**没做的**：① 真实交互（真点击/真按键/断网/窄屏溢出/触摸目标）还没接进来 —— 那 28 条「待人工确认」里属于功能性的部分要靠它逐条搬；② 顺手抓到但**没修**（登记在复盘 §7 与 T-G33）：手机版习惯页文字与按钮被压（68×80）—— 那是**版式选择**归视觉线，已钉进黄金；③ 归一是取舍：日期/时刻/机器路径归一之后，那一类值**变错它不会红**（归 pytest 管），分工写在复盘 §6；④ 黄金与机器绑定（字体/路径），换机器第一次跑要先看 diff 是不是只有字体度量差异。"


# 五层台账（机器可读真源）—— 手写维护（本条注释由 2026-09-18 框架落地时更新）
#
# 状态词表：done=已做到（断言必须全过）/ partial=半成品 / todo=没做 / deferred=规格自标二版或后置
#           broken=声称 done 但证据对不上（审计必须 FAIL）
# 证据语法：file:路径 | text:路径::要包含的文字（或 text:路径::re:正则）| route:方法 路径 |
#           table:表 | column:表.列 | ui:data-action=x | ui:view=x | test:文件名
# 规则：status=done 必须至少 1 条证据；partial/todo/deferred 必须写 gaps（说明缺什么）
#
# [exceptions]：已知欠账（**逐条留痕、修一条删一条**），不许静默豁免。两种用法：
#   ① 声称 done 但某条断言暂时不成立（③ 声称=证据 会打印为"已豁免"）；
#   ② **有意拆分的任务**：Task 提交只覆盖了条目的一部分（如 T-B5 前半字段+界面、后半等用户选型），
#      条目如实保持 partial，但 ⑥ 进度对账不再报"台账漏更新"（同样打印理由）。
# [meta.acknowledged_routes]：确认过但暂不单独登记的运维/根路径。

[meta]
acknowledged_routes = []

[exceptions]
# T-B5 的豁免已删除（2026-09-18）：用户选 B′ 后通知通道已落地，条目转 done —— 修一条删一条。
# T-C5 / T-C7 的豁免（2026-09-20 加）：**有意拆分** —— 后端（字段/领域/接口）已随本批落地，
# 但"界面入口"（任务详情里点「升级为复习卡」、复习卡详情里填句柄/选形式）要等前端批次，
# 条目如实保持 partial。前端接上后删掉这两条豁免。
T-C5 = "后端已落地（review_items.task_id + POST /api/tasks/{id}/to-review + GET /api/tasks/{id}/review-cards + PATCH/GET /api/review/items/{id}）；**任务详情里的「升级为复习卡」按钮待前端批次**"
T-C7 = "后端已落地（ref_handle 可 PATCH 写入/清空，带校验）；**复习卡详情里填句柄的界面待前端批次**"
T-C3 = "后端已落地（focus_variation_minutes / longest_gap_days / rhythm_note）；**界面上显示这三个数字与那句话待前端批次**"


[entries."T-G58"]
id = "T-G58"
title = "门禁工具的两处诊断/防护缺陷（T-G51 落地时撞出来的）：`render --update --only` 会采到**错黄金**（视图之间不独立）→ 默认拒绝；全量门禁失败时把门自己的输出留下并当场印尾部"
group = "PROCESS"
status = "done"
evidence = [
  "file:tools/render_check.mjs",
  "file:scripts/run_gates.py",
  "text:tools/render_check.mjs::不能和 `--only` 合用",
  "text:scripts/run_gates.py::LOG_DIR",
  "test:test_render_check.py",
]
gaps = "**怎么撞出来的**：T-G51 修完「卡片里的按钮被压成两行」那处，我用当时以为最划算的一步重采黄金 —— `node tools/render_check.mjs --update --only offline`，**16.4 秒**（全量 110 秒）。下一次全量门禁立刻红，而且红在同一批 3 份上。**先猜错一次**（以为 `ui_flow` 并行污染）→ 起 `ui_flow` 并行复现，没复现。**真正的原因**：**视图之间不是独立的** —— 离线页那半页「上次联网时看到的样子」读的是**别的页面联网时**写下的缓存（`src/web/index.html` 的 `rememberForOffline` → IndexedDB 的 `STORE_CACHE`），而 `--only` 根本不访问那些页面 → 缓存为空 → 采到的是**退化版式**（`span.sub 还没有缓存到习惯`、少一行、卡片矮 15px）。全量跑按固定顺序访问全部视图，到 offline 时缓存已经有货。**所以这不是「慢了 110 秒」，是判据坏了**（假红会让人去修一个没坏的东西）。**① 默认拒绝** `--update --only`（退出码 2，说清根因 + 给 `--force` 口子 + 指向全量），并配一条 pytest。**② 顺带补上两个「看不见原因」的缺陷**：界面校验工具的差异原来只印**前 8 行** —— 整页往下挪一格时前 8 行全是坐标、真正的原因（多出来的是哪一行）在中间（我就在这上面误诊过），改成**优先印「文字列非空」的差异行**并如实说还剩多少行没印；全量门禁**失败时门自己的输出被直接丢掉**，想查原因只能把门单独再跑一遍（render 110s / ui_flow 176s，随机失败还未必复现）→ 现在每道门的全量输出落 `gates/logs/<门名>.log`（`gates/logs/` 进 `.gitignore`），失败时当场印尾部 12 行。**没做（工具判不了的事）**：`--only` 查出来的「通过」对这类与其它视图有状态耦合的视图仍然不可信 —— 工具无从知道哪个视图耦合了谁，所以**提交前一律全量**这条边界不变（地图 §3）。"

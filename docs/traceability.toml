  "file:复盘/卡/卡121-MCP任务面.md",
]
gaps = "**来路**：用户的硬要求 —— 『然后呢，我在**外包程序的某个地方**给一个板块的数个复数个任务他们。**注册一个任务**，然后任务需要这些板块下面的**多张卡都完成了**，并且**发送了那个成功申请**，然后**集齐所有的成送申请**再写』。栅栏本体已经进 git（卡 119：`tools/pool/task.py` + 壳 `tools/wb_task.py`），但**外包面（MCP）里一个任务工具都没有** —— 别的窗口 / 别的 AI 只能敲命令行，等于「**注册任务**」这件事还没接到外包程序上。**做法（全部复用 `pool.task`：进程内调用、捕获 stdout，★ 绝不 shell 出去 —— 卡 106 的规矩）**：① **只读三个**（**不要 env、永远列出**、零写入）：`task_list`（所有任务一行：任务号 / 状态 / 成送申请进度 / 一句话 why）· `task_status`（一个任务的详情：每张卡的**层**与**域**、交没交、history 尾部）· `task_pool`（还没定卡的待办登记，按层）；② **写两个**（★ 只在服务端 `POOL_MCP_WRITE=1` 时**列出来** —— 「存在性即授权」，卡 111 的规矩；每次调用还要 `arguments.confirm` **等于任务号**）：`task_register`（给整段预声明 TOML 文本或路径，`confirm` 必须等于 TOML 里的 `id`）与 `task_claim`（`task`/`member`/`claim`(success|failed)/`evidence`/`files`/`why`，`confirm` 必须等于 `task`）；③ 工具清单 **只读 6→9、写 2→4**（`instructions` 与 `--help` 同步）。**验收（工人自报，主控逐条核）**：① **15 条新钉子**（`tests/test_pool_mcp_task.py`）：只读三个带机器可读块且**零写入**（任务目录文件集不变 + 工作区未跟踪文件集不变）· 授权（**不设 env ⇒ 当「没有这个工具」**）· `confirm` 两道 · **域外拒并点名** · 未知任务说清（不崩不带假数据）· 真 stdio 端到端；② ★ **真 stdio 端到端原样报文**（子进程起真 `tools/pool_mcp.py`）：三个只读工具的回话都带 `--- tf-json ---` 机器块；**四段反例逐条原样** —— `confirm` 不符（回 `rejected:true` + `confirm`/`expected`）· 没 env（回「没有这个工具：'task_register'；有：…」并列出 9 个只读）· **域外**（回话点名「卡 卡B（审美层）碰了**自己域外**的文件：docs/别的.md」+「这张卡的域是：ui/*」）· 任务不存在（「我不假装有」）；③ ★ **两段 `tools/list` 原样对照**：**不设** env = 9 个（六个老只读 + 三个新只读，**没有**那两个写工具）· 设 `POOL_MCP_WRITE=1` = **13 个**（9 只读 + 4 写：`pool_dispatch`/`pool_cancel`/`task_register`/`task_claim`）；只读那些的 `annotations.readOnlyHint` 全 `true`。**★ 老实说（边界与运维口径）**：① **正在跑的那个 MCP 客户端里还是旧代码** —— DSH 起的 MCP 子进程在**启动时**就把代码载进去了，本笔落地后**不会**自动出现新工具，要**新开一个会话/重启 DSH** 才会看到 13 个工具（今晚已踩过一次同类：改 `cordis.patch.yml` 不会重挂）；② 本卡**没有**改 `tools/pool/task.py` 的行为（只调用），栅栏的 33 条钉子判据原样；③ **记忆层（project 字段 / 树前缀守卫）按用户要求押后** —— 所以现在这些任务工具**还不校验「这棵树属于哪个项目」**（卡 120 已写好规格，等排期）；④ `task_register` 认的是**主控写好的预声明**，不是「随手口述一个任务」 —— 这是有意的（预声明要能被复核）。**★ 本笔另含补账**：`docs/workbacklog.toml` —— 卡 119（`T-G217`）标 `done` 并登记卡 121，卡规格随本笔进 git（队列自洽）。"

[entries."T-G219"]
id = "T-G219"
title = "拆掉 task.py 的中文长行（撤文件级 E501 豁免）+ 架构审议 §九 更正"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool/task.py",
  "file:tests/test_pool_task.py",
  "file:复盘/架构审议-外包与门禁.md",
  "file:docs/workbacklog.toml",
  "file:复盘/卡/卡122-撤E501豁免与文档更正.md",
]
gaps = "**来路（两笔欠账，都记在案）**：① 卡 119（`T-G217`）把 scratch 原型整份搬进 `tools/pool/task.py` 之后，`ruff` **头一次报 17 个 `E501`**（scratch 从来没被 lint 过；`E501` 按**显示宽度**算，中文一字 = 2 列）——当时为了不把「搬家」这张卡搞成「重排」卡，主控加了**一条文件级显式豁免**（`# ruff: noqa: E501` + 四行理由），并**明确记下**「拆行的纯美化另开一张卡」。**本笔就是那张卡。** ② `复盘/架构审议-外包与门禁.md` **§九**还写着「**工具在 scratch 里（gitignore）⇒ 进不了提交**」—— 而卡 119 已经把它搬进 git 了 ⇒ **文档与事实不符**。**做法**：① `tools/pool/task.py`：删掉顶部那 5 行豁免块；把长行逐条拆到 ≤100 显示宽（`ruff --ignore-noqa` 实测 18 条 `E501`，其中 1 条落在**被删的豁免块**里 ⇒ 真正要拆 **17 条**：11 / 14 / 45 / 46 / 311 / 328 / 351 / 476 / 492 / 501 / 549 / 557 / 663 / 679 / 692 / 904 / 1031）。`f-string` 用**隐式拼接**（相邻字面量）且**不切进 `{}` 里面**；docstring / 注释直接换行；第 501 行是**纯表达式**（不是字符串），只在既有 `join(` 括号内换行 —— **没新增括号、没动判据**。② §九 改写成**事实**：权威副本 `tools/pool/task.py`（模块 `pool.task`）+ 壳 `tools/wb_task.py` +`tests/test_pool_task.py`（35 条钉子）；scratch 那份已换成**转发壳**（旧调用点不断）；收口入口**已认批**（`_integrate.py` 的 `--batch`），且卡 118（`T-G216`）给它加了 **`atexit` 还锁**。**验收（工人自报，主控逐条独立复核过）**：① `ruff check tools tests` = **All checks passed!**，且 `grep -n noqa tools/pool/task.py` **零命中**（rc=1）；② `python -X utf8 tools/wb_task.py --selftest`= **33/33 条钉子通过**；③ `pytest tests/test_pool_task.py --no-cov` = **35 passed**；④ ★ **拆行前后 `--selftest` 逐字对照**：两份输出归一化随机临时目录名后 **diff 为空**。**★ 老实说（边界与偏差）**：① 工人报**卡里那句话与实测不符** —— 卡 §2 说 §九 有句「收口入口还不认批」，而 `git log -S` 全历史 **0 命中**（该条一直是「批次支持已加」）⇒ 按卡的**指向**把该条更新成现状，并把这处「卡 vs 实测」的偏差**留痕**（工人可纠正主控口径，但必须写明卡里原话 vs 实测）。② 第 557 行 `render_draft` 那一行**超出「只动换行」的字面**：多了一对括号、把三引号 `f-string`拆成两段**相邻字面量**。原因是**实测**用 `> ` 续行会让生成的骨架**多 3 字节**（1535→1538），`--selftest` 的 diff **非空**；改成相邻字面量拼接后**输出逐字节不变** —— 这是「输出不变 + 行 ≤100 + diff 为空」三者同时成立的**唯一**写法（拆行不许改行为，所以只能用这种）。③ `T-G217` 的台账叙述里**引用了那句已被删除的豁免**（`tools/pin_check.py` 报「叙述 3 处」）——**历史记录不改**（那句在当时为真），本笔在自己这条里说明；★ 且 `pin_check` **不是门禁的一道门**（`scripts/run_gates.py` 里没有它）⇒ 不影响本笔判据。④ 收口工具 `_integrate.py` **不在卡树**（未跟踪 scratch）⇒ 工人**无法逐行核对** `--batch` / `atexit`，文档那两句只依据卡规格 + `05d0d01` 的提交信息（**如实写**）。**★ 本笔另含补账**：`docs/workbacklog.toml` —— 卡 121（`T-G218`）标 `done` 并登记卡 122，卡规格随本笔进 git（T-G213 起的规矩：队列要自洽）。"

[entries."T-G220"]
id = "T-G220"
title = "外包工具：需求与架构定稿 + 两级整体审查（Flash 指针索引 → GLM-5.3 审查）+ glm-5.3 一次性授权"
group = "OPS"
status = "done"
evidence = [
  "file:复盘/外包工具-需求与架构.md",
  "file:复盘/外包审查-索引.md",
  "file:复盘/外包工具-整体审查-GLM5.3.md",
  "file:tools/wb_dispatch.py",
  "file:tests/test_wb_dispatch.py",
]
gaps = "**来路（用户 2026-10-02 两条要求，原话意译）**：① *「明确我们的那个需求，就是对这个外挂工具的整体架构设计和需求，然后呢，把你先发出来给我」*；② *「把检查这个外包工具基础设施的任务…分为两个部分：一个就是**给 deepseek V4.1 Flash**让它读相关的文档、**你踩过坑的那些文档**，输出**不要重新写浪费 Token**，而是输出**类似于索引或者是更好的总结机制**；然后把这些东西**再喂给 GLM5.3**（★ 我这次要求的是 GLM5.3 **不是 Flash**）…专门做这次的整个外包工具的**框架设计、代码实现之类的整体审查**」*（并说 *「你可以把它列到白名单，但是**我希望是一次性的调用**」*）。**小收尾在前**：卡 122（`T-G219`）已**单独一笔**落地（`c3e760f`：撤 `task.py` 的文件级 `E501` 豁免 + 拆 17 条中文长行 +架构审议 §九 更正），本笔不含它。**做法（四级，全部可复算）**：① **主控**写需求与架构定稿 `复盘/外包工具-需求与架构.md`（需求五条原始诉求→落地物 / 五角色 / 八条铁律 / 三层架构 / 组件清单 / 五条数据流 / 栅栏状态机 / 三号池 /接口契约 / 判据归口 / 诚实边界 / 未决 / **按需取读的索引**）；② **只读卡 123**（工人 = `deepseek-v4.1-flash`）产出`复盘/外包审查-索引.md` —— ★ **只要指针、不要原文**：90 行 / **49 条指针**（A 需求 8 · B 坑与攻击面 11 ·C 代码要害 15 · D 判据与测试 8 · E 真源数字 7）+ **审查者路线 8 条**（每条写「要判什么」）+ 已知边界 10 条；工人**逐条 `grep -n` 现核**并**自己改掉 1 处错指针**（把函数名当成了文件名）；③ **卡 124**（★ **GLM-5.3**，一次性）按索引的路线做**对抗性审查** → `复盘/外包工具-整体审查-GLM5.3.md`（103 行 / **12 条发现** /**5 条判据漏洞** / 只做三件事的排序建议），它读了 22 份文件（含 `tools/pool/task.py` 1115 行全文）、工具调用 40 次、0 报错，并**用只读探针实测复现**了其中一条（`advance` 能复活 `landed` / 抹掉 `timeout`）；④ **主控补 §8 逐条处置表**（认 / 不认 + 开卡 A~H）。**★ 收批机制第一次真跑（这是本笔另一件大事）**：任务 `B-ARCH1` 预声明 4 张卡（文档层 3 + 门禁层 1，跨层），各卡交**成送申请** —— ★ **最后两张是工人自己交的**（Flash 与 GLM-5.3 各自**在原会话窗口**跑 `wb_task.py claim`），**集齐 4/4 当场**由最后一名投递者把状态推过栅栏（`collecting → awaiting-commit`，**无轮询、无守候进程**），机器按**层**生成三段文书骨架。**白名单**：`glm-5.3` 以**一次性授权**接入 —— 新增`ONE_OFF_MODELS` / `ALLOWED_MODELS` 供**闸门**查，而 `MODEL_WHITELIST` 与 `next_whitelist_model()` 的**429 轮换链一个字没动**（加名字 ≠ 改轮换口径），并补一条钉子`test_one_off_model_is_allowed_but_stays_out_of_the_rotation` 把两者**钉开**（含反证）。**验收（主控逐条复核过）**：`ruff check tools/wb_dispatch.py tests/test_wb_dispatch.py` = **All checks passed!** ·`pytest tests/test_wb_dispatch.py` = **129 passed** · 全量门禁 **1848 passed**（seal 后提交）·`audit_progress` **通过 · 豁免 0** · 任务 `B-ARCH1` 4/4（`landed`）。**★ 老实说（边界与偏差，别把处置表当修好）**：① ★★ **坑 41 第二次咬人**：我登记了卡 122 的队列条目却**没在门禁之前** `git add` 卡规格 ⇒ `tests/test_card_specs_tracked.py` 门禁**红**、白跑 9 分钟；★ **该修的不是我的手，是工具** —— `_integrate.py` 花 9 分钟跑门禁**之前**应当先跑那条钉子（**fail fast**，已记进开卡 H）。② **GLM 报告 §六 的自我怀疑：结论不认、事实认** —— 它看的是卡树（base `ca64283`，那里`MODEL_WHITELIST` 没有 `glm-5.3`），于是推断「本卡走了不经闸门的路」；**真相**是**派活器读主树那份**，本笔已在主树加了一次性授权，闸门**是过了的**。★ 但它顺带指出的事实**成立**：白名单是**派活器级**的，**绕过派活器直接起 CLI 就没有闸** ⇒ 已写进 §5 边界（「一切入口都过闸」这句话此前**说大了**）。③ **卡 123 / 124 规格里写的 `T-G221` / `T-G222` 是预排号**：本批走收批、**一笔提交只有一个台账号** ⇒本笔是 `T-G220`，那两个号**没有**独立台账条目（已在 §8 里写明，免得后人 grep 不到）。④ **处置表 ≠ 修好**：12 条 + 5 条漏洞里**只有 2.4 真修了**（而且修在 **scratch** 工具 `gates/diag/_integrate.py` 里、**不进 git** ——收口工具进 git 时必须**连这个修正一起搬**，验证边界=只 `py_compile` + 读回，没真跑 `--no-gate`）；其余各条一律**只承认 + 开卡 + 排序**。⑤ **收批的 4 张卡里有 2 张的申请是「收工后补交」的**：卡规格当初**没写**「交成送申请」这一步，我是用「**在原会话窗口发一条新消息**」的姿势让它们补的（§20.3 的姿势）——★ 这是**卡规格模板的漏项**（以后写卡必须带「交申请」那一步），已记进开卡 H。**★ 本笔另含**：`infra` 仓（`f69ed38`，仓库外、无门禁）在 `pool/README.md` 里加了一行**指针**指向本仓的唯一权威副本 `复盘/外包工具-需求与架构.md`（★ 只指路、不复述，免生第二份真源）。"


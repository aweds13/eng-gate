gaps = "**为什么单独建机制**：`T-G30 §5` 定了口径 —— 从步 2 起改动**看得见**了，所以判据不再是「超没超过某个数」，而是「你要哪一种」；而**人只该在有意的视觉改动时看一眼**。于是流程改成：**先给能看的（候选 + 渲染快照）→ 选定 → 再改代码**。做法上**不改三遍 `app.css`**（那样每次都要改真文件、跑门、回退，回退漏一处就是脏树），而是**往同一个真界面注入覆盖层**：一个后端、一份种子数据、一个浏览器，候选之间只差一个 `<style>` —— **比较的变量只有一个**。① `tools/candidate_shots.mjs`：起真后端 + 真浏览器，3 档宽度 × 14 视图截图 + 从计算样式现读的四个数（页高 / 卡片数 / 有边框 / 有阴影 / 非白底），数字表落 `gates/render/candidates/NUMBERS.md`；候选 CSS 与截图**都不入库**（`.gitignore` 加了 `gates/candidates/` 与 `gates/render/candidates/` —— 它们是「选定那一刻就过期」的东西，决策本身记在 `复盘/视觉线步2层次语言-T-G50.md` 与 app.css 注释里）。② `tools/candidate_contrast.py`：**import 门自己的算法与组合清单**（`contrast_audit` 的 `declared_pairs/badge_pairs/state_pairs/evaluate`）在候选令牌上预演 —— 它**不改文件、不写 last.json、不是提交闸**，只回答「这个候选里有没有新欠账」。**三个候选是嵌套的**（A 边框做层次 ⊂ B 尺度收敛 ⊂ C 静音层），所以用户选的是「走多远」：A = 卡片/面板补 1px 边框 + 阴影归位成浮层专用（包明文：`.wb-card` 有边框、阴影注释写着 `overlays only`）；B = A + 间距 11 档 → 包的 6 档、圆角 5 档 → 3 档（就近并档：4→4 6→8 8→8 10→12 12→12 14→16 16→16 18→16 20→24 24→24 30→32；圆角 6→6 8→6 10→10 12→10）；C = B + **读数卡**（环/条形/大数字/雷达）退到 `--panel-2` 静音面 + `--muted` 跟包（`#5b6472`，更深）。**★ 预演当场抓到一个真缺陷**：C 把读数卡涂成浅底之后，**完成度环的轨道与雷达的网格线直接消失** —— 它们本来就靠 `--panel-2`（同一档浅色）画形状；修法照包（`.wb-progress__track` = 浅底 **+ 1px 边框**），SVG 里等价物是把那一笔换成 `--border`，**补完重拍才拿到用户面前**。**对比度也是同一件事的两半**：A/B 会让 `--muted` 落在 `--panel-2` 上只有 **4.23（不过 AA）**，C 跟了包的值之后 **5.32** —— 所以「静音层」与「muted 跟包」不能只做一半。**实测数字**（desktop 档，「页高 / 有边框 / 有阴影」）：today 1065/0/6 → A 1077/6/0 → B/C 1178/6/0（C 卡底 2 种）；setting 6317/0/15 → A 6379/15/0 → B/C 6672/15/0；phone/setting 8777 → 8809 → 9207。**没做（本卡是机制，落地是下一步）**：把 C 并进 `app.css`（含 `.card.block` 与 `.card.panel-card` 两对同义类合并 + 29 处标记改名）、42 份黄金按理由重采、`squeeze_scan` 前后各跑一次。"

[entries."T-G49"]
id = "T-G49"
title = "界面不解释（第一轮，用户 2026-09-24 定）：空态不再解释怎么用（21 处）+ 引导卡删解释句 + 「界面文案」写进约定层 + 反向棘轮（界面中文片段 1846 条 / 13651 汉字，≥20 字 108 条）"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/界面不解释-T-G49.md",
  "text:复盘/界面不解释-T-G49.md::把复盘从产品里搬出去",
  "text:docs/specification/conventions.md::## 界面文案（2026-09-24 用户定，T-G49）",
  "text:tools/ui_text_scan.py::界面文本体检（T-G49）",
  "text:tools/ui_dom_probe.mjs::空态就是这几个字，没有别的",
  "text:src/web/index.html::emptyState('今天还没复习过卡')",
  "test:test_web_frontend.py",
]
gaps = "**用户原话**：「为什么有些没有必要写的解释，你也写进去啊……**这是给人用的**，我知道哪些要用什么。如果我不知道的话，你可以设计一个小小的用户文档，而不是把那些一大堆解释塞在那里。」补一句：「没有步骤的话空的，用户也知道没有步骤，那就没必要再弄了吧……**不跨人比这种没必要强调**。」**成因是我的**：每落地一个功能就顺手在界面上写一段「为什么这么算」（「不折算成投入时间（时间折算只在有真实时长时才算）」）—— 等于**把复盘写进了产品**；而包里早有明文，空态原语 `.wb-empty` 就是「一句暗淡的话 + 一个动作」，我写的是 40 个字。**规则**（写进 `conventions.md` 新增的「界面文案」一节）：空态 —— 旁边就有输入框/按钮的**一个字都不写**、纯列表区最多 **6 字的事实**、不写怎么用/为什么/**不写评价**；数字口径 **≤ 8 字**（用户 2026-09-24 在三选一里选的，另两个选项是「也全删」「留着」）；设计意图删；操作标签/字段名/单位/状态/报错原话照留。**本批**：**21 处空态 + 1 处引导句**（新手引导按用户选择**留卡、删解释句** —— 三步算操作标签）；最长的两处（40 字步骤空态、38 字团队空态）**直接不渲染**（旁边就是输入框/按钮）。★ **反转了一条既有做法**（诚实记）：`ui_dom_probe.mjs` 原来要求「空态要给一句带路的说明，不是干巴巴『暂无数据』」，断言是 `includes('今天还没复习过卡') && includes('还能改判')` —— 那条与用户口径相反，改成**「空态就是这 5 个字，没有别的」**（不是放宽，是换个方向钉住）。**棘轮**（`test_web_frontend.py::test_ui_does_not_explain_itself`）：钉**具体句子**（不是长度阈值 —— 阈值要等允许表稳定），含空态 14 句 + 设计意图 3 句 + 「引导卡标题与两个按钮留着、解释句删掉」的正反两面。**18 份黄金重采**（理由落 `LAST_UPDATE.md`），`squeeze_scan` 复扫仍 **0 处**。**没做的**（下一批，别当完成）：≥30 字那批里剩下的 12 条、20–29 字那 30 条、**数字口径还剩三条**（统计「手动投入不参与这张图」被行为流层 ⑥ 钉着、团队「分配出去的不计个人投入」被 `test_team_view_line.py` 钉着、习惯「只记次数，不折算成投入时间」）、**小用户文档**（用户提的那份「小小的用户文档」）、以及把 `ui_text_scan.py` 从诊断升级成**上限门**。"

[entries."T-G48"]
id = "T-G48"
title = "内循环落档（SR-NF13）：把 `--only` 的单视图/单流用法写进视觉线地图（两条命令实测过 + 三条已验证边界 + 一条「查过不能做」的压缩设想）"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/视觉线地图.md",
  "text:复盘/视觉线地图.md::最快的档其实不是门禁，是",
  "text:复盘/视觉线地图.md::node tools/render_check.mjs --only setting",
]
gaps = "**用户 2026-09-24 选的是「只写用法、不压全量」**（问的是「全量可以继续压缩吗」）—— 因为压缩全量的三条路都要么弱化自检、要么动一套有顺序耦合风险的流，而**改一处界面时根本不需要跑全层**。于是这一卡只做落档，但落档前**先把命令真跑了一遍**（写进文档的东西自己得先验证过，这是这个项目的规矩）：`node tools/render_check.mjs --only setting` 实测 **18.9s**（全量 116s）、`node tools/ui_flow_check.mjs --only 收起右栏` 实测 **17.5s**（全量 177s），两次跑完 `git status` 仍然干净（`--only` 不写文件、不动别人的黄金）。三条已验证的边界一起写进地图：① `--only` 是「名字里含这几个字」，可能匹配多条（它会列出跑了哪几条）；② 匹配不到时报错退 1（不报「0 条通过」）；③ 只有 `--update` 才写文件。**另外如实记一条我查过、结论是不能做的压缩**：`ui_flow` 的输入看起来可以把 `app.css` 摘掉（理由是「CSS 不影响行为」），但**有两条流直接断言样式**（`.sidebar` 的 `display`、`.card.hard` 的 `borderLeftWidth`）→ 摘掉就是造一个假的绿；剩下能压的只有「并行拆流」（顺序耦合风险）与「弱化 render 的两遍自检」（那条自检正是区分「界面变了」与「采集器不可靠」的根据），**两条都要单独开卡 + 用户点头**。**没做**：`ui_flow` 并行拆流、`render` 自检抽样、`check_layers_selftest` 加复用（都留着，等真要压时再开卡）。"

[entries."T-G47"]
id = "T-G47"
title = "工具链提速（SR-NF13 / 工程件）：门禁三层速度（--fast 7.4s / --quick / 全量）+ 两条泳道并行（412s → 184s）+ 输入没变就复用判定 + 视觉线地图"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/门禁提速-T-G47.md",
  "file:复盘/视觉线地图.md",
  "text:scripts/run_gates.py::--fast：开发内循环（ruff / 护栏 / 审计；**不是提交闸，不落盘**）",
  "text:scripts/run_gates.py::REUSE_INPUTS: dict[str, tuple[str, ...]] = {",
  "text:scripts/run_gates.py::def start_gate(name: str, cmd: list[str]) -> tuple[subprocess.Popen[str] | None, float, str]:",
  "text:scripts/run_gates.py::★ **pytest 永不复用**",
  "text:tools/web_live_check.py::def _free_port() -> int:",
  "text:gates/reuse.json::what",
  "test:test_web_frontend.py",
]
gaps = "**用户问「按你这种开发形态，后面还要开发多久？有没有更好的方法？」** —— 量出来的事实：一轮全量门禁 **412s**（render 107 + ui_flow 184 占 71%），而真正贵的是**颗粒度**：改 3 行 CSS 要配一轮 7 分钟门禁 + 一份复盘 + 三处文档。于是先改造工具链，**判定不变、只消掉重复**：① **三层速度** —— `--fast`（**实测 7.4 秒**：ruff + 对比度 + 一致性 + 命令表 + 两道审计）/ `--quick`（~90 秒，含 pytest）/ 全量（~3 分钟）；★ `--fast` **不写 `gates/last.json`**，因为它不是提交闸 —— 写了就会让审计第 ⑤ 条（门禁产物与提交一致）失效，那是拿半轮结果冒充一轮。② **两条泳道并行**（轻门 12~14 道 ∥ 真机浏览器 2 道）：安全性逐条查过 —— 端口互不相同（render 8531/8532、ui_flow 8541~8544）、各自 `serve.py --fresh` 临时库、各自浏览器 profile 目录；顺带把 `web_live` 局域网自检里**写死的 8531** 改成自动挑空闲端口（那正好和渲染层默认端口撞车：串行时看不出来，并行就是抢端口式的随机失败）。③ **输入没变就复用**（`gates/reuse.json` 带输入哈希）：只有 render / ui_flow / lf1_live / web_live / ui_dom_probe 可复用，输入清单写死 `REUSE_INPUTS`（改 `src/**`、门自己的脚本、或渲染黄金 → 哈希变 → 必真跑），`last.json` 单列 `reused` 一栏 + trailer 里写出来；★ **pytest 永不复用**（它是唯一从行为上证明功能还在的那层，省它 66 秒等于把安全网摘掉）。**实测：全量 412s → 184s**（受最长的 ui_flow 177s 决定，轻门 pytest 64s 与之并行）。④ 新增 `复盘/视觉线地图.md`（改一类东西动哪几处 / 哪道门判什么 / 12 条踩过的陷阱 / 事实在哪），把「每个新窗口都要重读 app.css 三段 + 两个审计工具 775 行」这笔税一次沉下来。**过程中撞到的两件事都留了痕**：① 我自己写的 `resolve_cmd` 先看 `name in cmds` → 空占位命令 `[]` 被当成真命令 → `Popen([])` 在 Windows 上抛 `WinError 87`（正好命中 4 道占位门）；顺手把「起不来的门」改成记一条 FAIL 而不是让整轮脚本崩掉（崩掉会把其余门的结论一起丢掉）。② 重构 `run_gates.py` 挪动了那两个**空占位命令**的字面量 → **审计当场抓到 T-G32/T-G34 的证据指针烂了**（「证据会烂」这条铁律在起作用），两条指针改成 `def render_cmd()` / `def ui_flow_cmd()`。**没做**：把「改版式前后的挤压体检」接进门（`tools/squeeze_scan.py` 仍是诊断工具 —— 判据是估算，硬门迟早被一次误报写进白名单）；`--quick`（~90s）里 pytest 66s 仍是大头，没动（那是安全网本身）。"

[entries."T-G46"]
id = "T-G46"
title = "视觉线：5 个输入框「没穿衣服」—— 补元素级输入框规则（`input:not([type=checkbox]):not([type=radio])`）并把模态那条同步排除勾选框"
group = "PROCESS"
status = "done"
evidence = [
  "text:src/web/app.css::input:not([type=\"checkbox\"]):not([type=\"radio\"]) {",
  "text:src/web/app.css::.modal-box input:not([type=\"checkbox\"]):not([type=\"radio\"]) {",
  "test:test_web_frontend.py",
]
gaps = "**现象**（渲染清单里一直在，只是没有一层判它）：`#exportDir` / `#vaultName` / `#vaultDir` / `#syncPath` / `#archiveDays` 这 5 个输入框是**浏览器默认外观** —— 21px 高、白底、`1px 2px` 内边距、无圆角；而全站其它输入框是 `--panel` 底 + 1px `--border` + `--r-md` 圆角。**根因**：输入框按**上下文**上样式（`.new input` / `.field input` / `.modal-box input`），而 `select` 有**元素级**基础规则 —— 落在三种容器之外的输入框就是裸的（这 5 个正好都在 `.row.tight` 里）。**已修（2026-09-25）**：① 补元素级规则（照 `select` 写：`--panel` 底 + 1px `--border` + `--r-md` + 8/12 内边距 + 13px 字号）；② `.modal-box input` 同步补 `:not(...)` —— 元素级规则权重 (0,2,1) **高于**它 (0,1,1)，不补就会被盖掉（背景与内边距都会变）。**渲染清单作证**：5 个输入框从 `0;1px 2px`（21px 高）变成 `10;8px 12px`（33px 高）；`#archiveDays` 从 73×21 变 **90×33**。**一处与计划不同、如实记**：原计划写「顺手给 `#archiveDays` 加 `.w-90`」，实测它本来就带 `maxw-90`，穿上衣服后内在宽度超过 90，被 `max-width` 钉在 **90px**（正是想要的结果），所以**没动标记** —— 以量到的数为准，不为了对齐计划而改。"

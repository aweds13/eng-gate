gaps = "**搬走的 9 条**（一条流一条人工项，`--list` 与 `tests/test_ui_flow_check.py` 逐条回查交接文档里那个编号还在不在）：⑦ 新手引导 / ⑧ 收起右栏 / ⑨ 白名单勿扰增删（含非法时段被后端拦下并原话透传）/ ⑩ 危险动作走站内二次确认 / ① 升级为复习卡（第二次不重复建）/ ③ 波动空档那行只描述事实 / ⑥ 学业 vs 自学口径 / ④ 硬考核区（角标 + 5px 左边条 + 逾期不候）/ ㉑ 字面星号。合计 **63 项断言**，一遍 ≈70s、两遍 148s。**做法上的三条硬规矩**：① 真点击 = 先 `scrollIntoView` → `elementFromPoint` **命中测试**（被浮层盖住/挤出视口的按钮，`el.click()` 会「成功」而用户点不到）→ 再发真鼠标事件；② 真按键 = `Input.dispatchKeyEvent` 逐字符 + 真回车（`data-enter` 那条键盘通路），重填输入框先 Ctrl+A 全选；③ **每轮跑两遍**（各自新库 + 新浏览器）比对**断言指纹**，不一致 = 工具自己不可信（退出码 4）。★ **建成当天抓到一族真缺陷并修掉**：设置页里**字面的星号**（`**重点**`）—— 后端 `describe()` 的说明文字有 6 处在界面里是用 `esc()` 画的（guard / behavior note+switch_note+current_note / vocab / ai.surface / 通知字段与路由 / 备份说明），于是源码里的重点标记被原样画出来；T-G11 那两层护栏看不见它们（第一层只扫 `index.html` 的字符串字面量、第二层的桩数据里没有这些 note —— 那条边界 T-G11 复盘 §五自己写着）。修法 = 那 **10 个渲染口**统一走 `noteHTML()`（**一个字没改**，只是让重点真的变粗体、不再画出星号），并把规矩写死在 `noteHTML` 定义处（后端说明文字 → `noteHTML`；**用户自己写的**备注/要求/产出 → 一律 `esc`；属性里只能 `esc`）。**改动范围由黄金层证明**：只动 3 份黄金（setting × 3 档宽度，每份 -7/+16 行，字重 400→700），其余 39 份逐字节不变。**底座抽共用**：`tools/tf_browser.mjs`（起临时库 / 起真浏览器 / 钉滚动条与设备号），抽完跑渲染层 **42/42 逐字节一致**证明没抽坏。**诚实边界**：① 判不了「好不好看」，也判不了「这句话说得对不对」；② 物理场景（两台设备 / 热点 / 校园网隔离 / 计划任务 / 桌面窗口 / 跨端镜像的双窗口版）仍留人工栏；③ 断言是我写的 —— 写错就给我一个**错的绿灯**（建层时四条坑里三条正是这类）；④ 扫文本那条流用更弱的等待（`settle()` 3 拍 ≈0.6s，更晚才到的东西会漏），真验行为的流一律强等待；⑤ 门禁从 15 道 → **16 道**、整轮 ≈190s → **≈340s**（这是明码标价的代价）。**还没搬的**：⑪ 备份恢复（不可逆，要单独设计临时库走法）/ ⑬ 导出 md / ⑭ 词表 / ⑮ Obsidian / ⑯ AI 边界 / ⑰ 同步自导自 / ㉒ 删除可选 / ㉓ 团队视角 / ㉔ 复习改判 / ㉕ 学校通知 / ㉗ 离线只读区。"



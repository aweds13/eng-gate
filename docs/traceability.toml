gaps = "**触发**：用户 2026-09-25 问「有要修复的吗」。T-G64 落地后我没有等下一张卡，而是**按「用户会怎么用错」把刚做的东西探了一遍**（先跑现成的诊断尺子：`route_ui_gap` / `squeeze_scan` / `ui_text_scan` / `style_audit`，再拿四类环境错撞 CLI），**探出 3 处真缺陷**。**① 库不存在时静默建库**（真缺陷）：`timeflow today --db <打错的路径>` 会建一个空库、回「0 分钟 / 0 项」、退 0 —— 一个只会读的命令留下文件副作用，还让「打错路径」看起来像「我这周什么都没干」。修法：调边界前先 `Path(db_path).is_file()`，不是文件就 `db_missing` 退 3（顺带把 `--db <目录>` 一起挡掉）。**② 库打不开把栈丢给用户**（真缺陷）：★ **第一版只兜了 `create_app()` 那一步，实测照样漏** —— 库是**懒连接**的（`storage/db.thread_local` 第一次用到才真打开），「file is not a database」这类错在**请求里**才炸出来，所以 try 必须把 `asyncio.run(_exchange(...))` 一起罩住。**③ 命令表语法坏也是栈**（真缺陷，这张表在本项目**写坏过 9 次**）：`table_broken` 退 3 + 带 `tomllib` 原文的行列号；`check_commands.py` 同步改成报一条硬冲突（跑门的人要的是那一行，不是 traceback）。**判「环境坏」还是「代码 bug」**：只把 `OSError` 与 `sqlite3.*` 当环境错，其余**原样抛出**（代码 bug 不该伪装成「你的库有问题」）；判定走 `type(exc).__module__` 而**不是 import sqlite3** —— CLI 这层不许碰数据库（有源码级 import 护栏）。**顺带**：`help <命令>` 认命令（`help today` == `today --help`）；自描述里补 `errors`（退出码只区分到「退 3」，而退 3 下面有五件不同的事，脚本/AI 要能分辨）。**诊断尺子那边没有新东西**：`squeeze_scan` 0 处、`route_ui_gap` 剩的 9 条路由全是按设计不给界面、`ui_text_scan` 是 T-G57 已知的长文案尾巴、`style_audit` 的「圆角 4 档」里那个 `0` 是手机底栏的有意复位（工具早写明 `0`/`50%` 仍按一档计）—— **看着像缺陷、查过是报告口径，特意没动**（把尺子改宽之后它就不再拦真漂移了）。**边界**：库坏了只翻译不修（指路到设置页「备份与恢复」）；库不存在是**有意**的硬门槛（宁可说「库还没有」，也不给一份空账）；「库在但迁移失败」目前仍是 500，没预先发明错误码。**证据**：`tests/test_cli_line.py` +5（含「退 3 且一个文件都没留下」与 `Traceback not in err`）、`tests/test_check_commands.py` +1。"


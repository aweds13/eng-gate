gaps = "**落地完成（2026-09-25）**：用户 2026-09-24 选的候选 C 已全部并进 `app.css` 与标记层。① 层次 —— `.card` / `.panel` 补 `1px solid var(--border)`、去掉 `box-shadow`；`--shadow` 归位成**浮层专用**（只剩 `.modal-box` 用；包的原话就是 `overlays only`）；`.card.selected` 只留 2px 环。② 尺度收敛 —— 间距 **11 档 → 6 档**（4/8/12/16/24/32）、圆角 **5 档 → 3 档**（8→6、12→10），**名字也一并并掉**（同值两个名字＝同一档的两种写法；档数报告按**令牌名**数，见 `tools/style_audit.py`）：`app.css` **92 处引用改名** + 测试 2 处，另加一条**棘轮断言**（只许 6 档间距 / 3 档圆角）。③ 两类同义卡片归一 —— `.card.panel-card` 删除、**29 处标记改名**成 `.card.block`，并把原来只给面板卡的两条间距（`.title` 下边距、`.form` 外边距）摊给所有块内容卡。④ 读数卡静音面 —— 候选里用 `:has()` 只是**预演**，落地换成显式类名 `.card.quiet`（环 / 本周柱状 / 主读数 / 学业雷达 / 两个 GPA 读数，共 **6 张**），渲染黄金从此钉得住它。⑤ `--muted` 跟包（亮 `#5b6472` / 暗 `#8a93a6`）并把这一对补进 `contrast_audit.py` 的 `TOKEN_PAIRS`（组合 34 → **36**，全达标）。**★ 预演抓到的那条缺陷的正式修法**：`--panel-2` 当形状的两笔（`.ring-track` / `.axis-line`）改画 `--border`。**尺子与代价**：42 份黄金**全动**（属有意改版，理由已落 `gates/render/LAST_UPDATE.md`）；`squeeze_scan` 0 → **8 处**（1px 边框每边吃掉 1px 内容宽，把 `phone__offline` 的「完成」顶成两行）→ 补 `.card > button { white-space: nowrap }` 修掉（只限**直接孩子**：`.card .row` 里的按钮靠容器换行，用户数据类的长标签不许被 nowrap 顶出容器），再回 **0 处**。**没做（如实记）**：① 包的中性色阶整体搬（`--bg` / `--panel-2` / `--border` / `--ink` 都取包的值）—— 候选 C 的注释就把它留给了下一张卡：进度条槽、热力图空格这类「靠浅底当形状」的地方要一并补 1px 边框，是另一份工单；② **字号档位没动**（候选 B 的注释把 `--fs-*` 留给步 3，而步 3 的实际范围只写 `--fw-*`/`--lh-*`；字号一动全表重排、且没有出过预演图，所以不夹带）；③ **暗色主题没有渲染基线**（渲染层只采亮色）—— 暗色的 `--muted` / `--shadow` 按令牌级对比度门核过，但整页暗色版式仍是老账。 ★ **2026-09-25（T-G70）把本条「预演抓到的那条缺陷」量了**：`.ring-track` / `.chart-grid` / `.chart-axis` 画的 `--border` 落在静音面上是 **1.10（亮）/ 1.20（暗）** —— 比原来 `--panel-2` 当形状（1.12 / 1.11）**只好了 0.01~0.09**。方向仍对（「形状靠一条线」是包的写法），但**不能说「看得见」**：按 WCAG 1.4.11 它们属**纯装饰 / 背景结构**（数据由 `--accent` 那几笔承担：亮 4.07 / 暗 6.04 达标），所以如实进 `AA_NONTEXT_EXEMPT` 纯装饰表、**不当判据**；真要按 3.0 画就得换 `--muted` 那一档的灰（雷达网格会变成明显的中灰）—— 这是一条**判断**，列在 `复盘/非文字对比度-T-G70.md` §4 的复议清单里。 **护栏**：`tests/test_web_frontend.py` 的 `test_cards_have_two_levels_and_the_quiet_one_keeps_its_shapes`（同义类不许回来、静音面上那两笔必须画 --border）与 `test_typography_and_bare_inputs_go_through_tokens`（行高只许令牌、输入框元素级规则）。"

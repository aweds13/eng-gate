`alias` / `user` / `provider` 三个可比值无对应物：magpie 比五个串，pool 只有 `card`/`model` 两个真值 ⇒ 等比缩到三个串。
`MAX_ONLY = 32` 是本卡新加的护栏，**没有 magpie 出处**（magpie 的 `only` 是人打的、无上限；pool 为防将来被脚本调用时 O(n·m) 扫描才加），注释里已如实标明。
只在合成读数上验过：真 `quota-state.json` 里 18 条记录只有「一只限流」与「一堆余额耗尽」两种、且 `kind`（账本字段）与 `state`（`status()` 产出的四个中文字面量）是**两套字面量**（`\"限流\"` ≠ `\"限流中\"`）⇒ 只能用合成夹具验。
""",
]

[entries."T-AG570"]

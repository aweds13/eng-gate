gaps = "**对比度门从棘轮变成硬门**：`tools/contrast_baseline.toml` 清空、`run_gates.py` 换成 `--strict` —— 组合 42 → 30 条（撤掉 3 对 × 两套主题：旧徽标那两种底 + 一个不再存在的搭配），**达标 30 / 欠账 0 / 新欠账 0**。**修法是「跟包」而不是「自己调色」**（与 T-G39 对强调色同一件事）：① `--danger`/`--ok` 换成 workbench 的值（亮 `#d1242f`/`#1a7f37`、暗 `#e5534b`/`#3fb960`）—— 原来那档是「当色块可以、当字和点不行」（2.18–3.76）；② 徽标抽成 **chip 原语**（卡片底 + 1px 边框 + `--muted` 11px 字）+ **8px 状态点**（workbench 的 StatusDot：点承担颜色、字用芯片色）—— 一次解决对比度 3 条 **和** 一致性门「`.badge` 同形状抄 4 份」那 1 条；③ 中性徽标的底从 `--surface-2`/`--accent-soft` 换成 `--card`（`--muted` 4.23/4.34 → **4.76**）。**点为什么是「真元素」`<i class=dot>` 而不是 `::before`**：伪元素采不进渲染清单（T-G32 那层只走真元素），「点还在不在、什么颜色」就会没有任何一层能验 —— 现在黄金里每个视图都有一行 `span.badge.done>i.dot 8×8 #1a7f37`。**顺手纠正两处语义误用**：计划步骤的序号、复习「今天记的是」的档位原来借了 `badge doing`/`badge done` 的状态色（语义色不做装饰），改回中性 chip。**撤掉的三行不是「改好了」而是搭配不存在了**：旧徽标底两种 + `.accent`（h1 的装饰点，4.37 过不了 4.5，而装饰文字本就不受 1.4.3 管 —— 连类带用法一起删）。**残留风险**（如实记）：以后谁再写一处「强调色小字落在页面底」，静态表看不见（那要知道谁坐在什么底上，得靠渲染层）。**这一步没做**（都排在后面）：`--accent-weak` 与底栏选中态（T-G30 已定）、`:hover`/`:focus-visible`（一致性门还剩 7 条欠账）、一次性裸值收口、令牌改名映射表、排版节奏（`--fw-*`/`--lh-*`）、图标系统、`SR-F1.5b` 热力图。"


gaps = "**为什么有这张卡**（T-G92）：`tools/wb_dispatch.py` 的 `--detach` 分支原来排在四道前置检查**之前** —— 父进程打印「已扔出去」并退 0，而检查其实在**子进程**里才做。后果三件：① 父进程退 0 **不表示**前置检查过了；② 没过时子进程退 2 但**不写判决**，过夜后 `--status` 只说「判决：还没有」——**分不清「没跑」和「跑挂了」**；③ `detached_argv()` 不给子进程补 `--no-preflight`，子进程还要再花十几秒重查一次登录（`auth_ok()` 是真发一条 CLI 请求）。**修法（只动 `detached_argv()` 与 `main()` 里 `--detach` 那几行）**：把 detach 分支挪到 `problems` 判断**之后**（没过 → 打印原因 + 写 `wb-<卡>.verdict.txt`『前置检查没过 → 没派活』+ 退 2，**绝不 detach**）；`detached_argv()` 去掉 `--detach` 与输入里已有的 `--no-preflight`，补**恰好一个** `--no-preflight`，仍以 `--detach-done` 收尾；过了之后打印改成「前置检查全过 → 扔出去单独跑（pid …）」，退出码仍 0。**反证（先红后绿）**：`tests/test_wb_dispatch.py` 适配 2 条 + 新增 3 条 —— 改实现前 **4 failed / 38 passed**（顺序洞）、补脚本路径用例后 **1 failed / 42 passed**，改后 **43 passed**；真机 (a) 缺规格的 `--detach` 退 2 且留下 verdict（旧写法退 0）。 ★ **真机证据 (b) 又逮到第二个洞（本卡一并修）**：`detached_argv()` 旧返回是 `[python, -X, utf8, *args, --detach-done]` —— **少了脚本自己**，子进程其实是 `python --card 900 …`，python 把 `--card` 当自己的选项 → `Unknown option: --card`，**T-G91 的 `--detach` 从来没真扔出去过**（T-G91 只验了 `spawn_detached()` 本身，没走这条 argv 拼装路）。修法 = 解释器后面放 `str(Path(__file__).resolve())`；新增用例 `test_detached_argv_keeps_the_script_so_the_child_actually_runs` 钉住。**边界（如实写）**：只改了 detach 这一条路；看门狗 / 心跳 / 回合上限 / 续跑判定（只对被打断续、不对空转续）/ 铁律进系统提示 / 模型默认值 / `--autocompact 1m` / 超时默认 7200 **一个字没动**；`--detach` 的语义（扔出去跑）不变；子进程仍会跑规格 / 工作区 / log 三道检查（只是不再查登录）。"


  "test:test_seam_check.py::test_true_code_shape_still_collected",
]
gaps = "**为什么有这张卡**：RC 复核卡 048 实测出假阳性 —— 一行注释写 monkeypatch.setattr(w, 「egg.spam」, x) 再加一行字符串 log(patch(「egg.spam」))，旧判据把 spam 收成符号 → 两张卡假交集 → exit 1 假串行；工具 docstring 自述与实现矛盾；假阳性会毁掉工具可信度。**做了什么**：判据改为 tokenize —— 先求该行注释/字符串字面量区间（f-string/三引号/转义由 tokenizer 天然处理），setattr(/patch(/def/class 只有落在代码位置才算符号，字符串实参此时才可取；跨行三引号带状态机；解析不了的整行跳过、不推进参数表状态（宁可少）。**真阳性没被收掉**：022=5f51806 × 126=803be3a → exit 1 交集含 _write_myday_rank；042=af5f81c × 044=f606037 → exit 0；043=288c3f0 × 046=9c2f863 → exit 0。**反证（三贴）**：改前钉子 5 failed, 6 passed → 改后 11 passed → 把跳过步骤短路改坏 → 同样 5 failed → 还原 11 passed，git status 只剩两个白名单文件。**边界**：docstring 只对齐「代码还是文本」一段；--card 解析/退出码/报告格式没动；三引号状态不跨 hunk（hunk 起点假定不在字符串里）——跨 hunk docstring 内容若自身是合法代码且带 def/setattr 形状仍可能被收（点名未修，另一张卡的活）；解析不了且无三引号开头的行整行跳过 → 理论上会漏报；没跑全量门禁（卡明令）、changelog 留给集成者收口。"


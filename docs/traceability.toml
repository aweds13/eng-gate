gaps = "**先量后改（盘点结论）**：6 个手写 SVG 全在 `index.html`，**颜色已经 100% 走令牌、图表里 0 处裸色**；真欠账是「各图自定尺寸」+ `stroke-width` / `r` / `rx` / `font-size` / `opacity` 这类**裸值住在标记里**。**关键结构事实**（这张卡存在的理由）：一致性门（`tools/style_audit.py`）**只读 `app.css`** —— 它**结构上看不见任何 SVG**，所以图表样式一直没有任何一层管。**做法**：把静态尺寸/颜色**下沉成类**（`.chart-grid` / `.chart-axis` / `.chart-label` / `.chart-line` / `.chart-area` / `.chart-mark` / `.chart-cell-off` / `.chart-cell-on` / `.chart-fill-soft` / `.chart-ring`），颜色只用已有令牌，标记里只留**几何**（`x/y/d/points/w/h/cx/cy` 是数据不是样式，T-G43 的口径）；顺带把**已 0 引用**的死类 `.cell-off` 收编成「空格」语义类。一处有意的 1px 变化：轴标签 10px → `var(--fs-xs)`（11px，10px 不在字号档位上）。**真缺口**：热力图前端按 **53 周 × 7 天**铺、文案写「近一年」，而后端 `feedback.list_habits` 只回 **90 天**（13 周）→ 左边 3/4 恒空（看着像「这个人三个月前才开始」）。修法：`HABIT_HEATMAP_DAYS = 371`（53×7，与前端格子逐个对齐），**只放窗口**、算法与接口形状一个不动，上界与 `insights.MAX_HEATMAP_DAYS = 400` 兼容；**机器证明** `tests/test_insights.py::test_list_habits_logs_window_matches_the_53_week_heatmap`（200 天前要在、370 天前也要在、400 天前不给）。★ **一处回落（诚实记）**：这张卡在「空态/口径统一」里顺手**删掉**了三句数字口径解释句，而用户 2026-09-24 在「也全删 / ≤8 字 / 留着」里选的是 **≤8 字** —— 落地时改成短句（`只算今天` / `手动投入不计入` / `任务可属多组`），并同步改了三处钉着长句的断言（`tools/ui_flow_check.mjs` 第 ⑥ 条流 + `tests/test_web_frontend.py` 的长句反向清单/短句正向清单 + 6 份黄金）。教训进地图 §6：**用户选过的那一档要写在卡的 gaps 里**，否则下一只手会替他做另一个决定。**没做**：① 不给折线图/热力图新增网格线与刻度（那是「看得见的变化」，要单独出预演图）；② 热力格的 `rx: 2.5` 没并进圆角档位（最小档 6px，11px 格子上会成药丸）—— 它现在至少住在 CSS 里、门看得见；③ 暗色渲染基线（老账）。"



]
gaps = "**轨二 · 机器替代清单的第 ①② 件**（用户 2026-09-28 拍板「**应该机器代替的让 AI 做了**」）—— 这两件原来**都是人（主控）在手工做**：① 派活前手敲 `gates/diag/_portcheck.py` 看 `BASE..BASE+16` 有没有被占（**为什么是 17 个端口**，铁律 37：行为流 ㉒ 要起「另一台设备」当对端用 `BASE+16`，实测 9197 被外来常驻服务 `vivoesService_x64.exe` 占着 → ㉒ 稳定报 `fetch failed`）；② 提交前手写一段 python 比对 `git diff --cached --name-only` 与允许列表（防「顺手改了别的东西还一起提交进去」）。**做法**：① 把现成能用的 `gates/diag/_portcheck.py`（51 行）**提升**成进版本库的真工具 `tools/tf_portcheck.py`（逐段体检 `BASE..BASE+span-1`、占用点名 `端口 ← pid 进程名`、`--base` 可重复 / `--span` 默认 17 / `--json` 给机器调；全空退 0、有占用退 1），再接进 `tools/wb_dispatch.py` 的**前置检查**（给了端口段且段内有占用 → **拒派**并打印占用者与铁律 37 / ㉒ 的出处；**没给端口段 → 打印「未给端口段，跳过端口体检」，不检查也不假装检查**；★ **不自动换段** —— 换段是主控的决定）；② 新增 `tools/tf_stage_guard.py`（`--allow a b c` / `--allow-file`；越界 → 退 2 且点名；全在白名单 → 退 0；★ **空暂存区 → 退 3** —— 空集永远满足「全在白名单」，那是假绿灯，不许当通过；路径按**仓库相对路径原样**比，用 `git -c core.quotepath=false`，**不许**拿八进制转义的路径去比）。**验收（工人自测，主控从派活日志逐条核对）**：① 真占一个口当外来常驻服务 → `--base 9291` 退 1 并点名 `9291 ← pid=17836 python.exe`、`--base 9491`（全空）退 0、`--json` 给出 `busy: true`；② 真 git 暂存区四态 —— 空 → 退 3、`a,b` 全在白名单 → 退 0、**中文路径原样匹配** → 退 0、混进 `c.py` → 退 2 且点名；③ 派活器段忙 → 拒派（退出码 2）且念出铁律 37 / ㉒ 的出处、没给段 → 「未给端口段，跳过端口体检」且不拒派；④ `pytest tests/test_tf_portcheck.py tests/test_tf_stage_guard.py tests/test_wb_dispatch.py` → **134 passed**，受影响超集 229 passed，`ruff` 六文件 All checks passed。**没动**：`wb_dispatch.py` 的派活主流程（心跳周期 / 看门狗阈值 / 429 处置 / 判决口径 / retry 一字未动 —— `git diff` 只落在前置检查那一段，+48/−1）；`gates/diag/**` 的老 `_portcheck.py` **没改**（它在 gitignore 里、不在本卡白名单内 —— 工人按「越界=作废」从严处理，**如实回报**并留给主控定夺）；`scripts/**` / `src/**` / `docs/**` 未碰。**★ 一条如实回报的缺口（不是本卡修）**：`psutil` **不在** `pyproject.toml` 的声明依赖里（`_portcheck.py` 与新的 `tf_portcheck.py` 都在裸 import，只是这台机器恰好装着 7.2.2）—— 工人按卡令**没有偷偷加依赖、也没有 try/except 吞掉**，只如实报出。**同族待收**：`wb_dispatch._outside_allow()` 与新的 `tf_stage_guard` 是同一套白名单逻辑的两份实现（一个吃 porcelain 行、一个吃 `--name-only`），将来可收敛。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/mech1`，base 5db2aa1，51 回合 / 75 次工具 / 0 次工具报错）；★ 工人未提交，提交与台账由主控做。"


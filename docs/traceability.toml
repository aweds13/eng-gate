gaps = "**为什么要有**（T-G88，目标轮 3；用户 2026-09-26 点名「有没有检测心跳的方式保证」）：工人在**别的进程**里干活，主控看得见的只有它落的 log —— 没有护栏时两种「等」都会发生而且**都不报警**：**卡死**（进程活着、日志一行不涨，主控只能干等到 `--timeout`）与**空转**（一直在动，只是原地重复同一件事，每一轮都在烧时间）。**三道**：① **回合上限** `--max-turns`（写卡 **150** / 只读卡 **60**）—— ★ 标定不是拍的：卡 002 真 log 里量到 **90 个回合**（`message.id` 去重；206 条 assistant 事件 / 111 次工具调用）才收工，照 60 定会把正常的卡腰斩；★ 撞上限时 CLI **自己停、退出码仍是 0**，只看退出码会把腰斩当成功 → 所以跑完还判一句「没做完」；② **看门狗**：日志静默 ≥ 480 秒（卡死）或最近 12 次工具调用里同一（工具+参数）出现 ≥ 5 次（空转）→ **按 PID 掐掉整棵进程树**（不按进程名，免得误伤同名的别的进程）+ 报现场（最后几步 / 碰过哪些文件）；空转按「窗口内计数」而不是「数末尾连续」，所以 A,B,A,B… 交替也算；③ **心跳**：每 120 秒一行（已跑多久 / 回合 / 工具 / 碰过文件 / 静默秒数）。顺带按用户决定把 `--autocompact 1m` 做成默认、`--effort` **不加**（保持默认 High）；`--max-turns` 与 `--autocompact` 两条都真对过 CLI 2.158.0 的 `--help`（`clamped to 100k-1M`）。**怎么验的**：三道里只有②③会动刀，所以用**桩命令真起进程**跑（假 runner 证明不了它真能停住）—— 装死 60 秒的桩在 **2.81 秒**被掐（阈值 2 秒）+ 现场里带着它最后那步 + 心跳真打了；吐 6 条一模一样调用的桩在 **0.70 秒**被判空转掐掉（日志**不静默**，专测静默判据抓不到的那一类）；健康那轮退 0 且 **不掐**。测试 12 → **23 条**。**自己踩的一个坑（留档）**：主循环第一版是 `while proc.poll() is None: time.sleep(poll_seconds)` —— 工人已经收工还要白等一个轮询周期（健康那轮实测 5.06 秒）；改成 `proc.wait(timeout=poll_seconds)` 后同一用例 **0.25 秒**。**边界（如实写）**：空转只抓**完全一样**的调用，参数每次差一点点的「原地打转」抓不到（靠静默超时兜底，两条互为补集）；判据每轮把已落 log **整段重解析**（卡 002 那种量级毫秒级，真到几万条事件再谈增量）；★ **「真掐」还没在真工人身上触发过** —— 真跑的是「能不能掐」，真机上「该不该掐」的阈值得靠头几轮派活校准。**没动的**：四道**前置检查**一条没改（本次只加「跑起来之后」的三道）；`tools/wb_status.py` 一行没改（判据复用它的 `parse_events`，不写第二份解析器）；工人的权限模式与模型默认值没改。**★ 2026-09-26 更正（T-G89）**：这条里的回合上限标定与「跑完了没有」的判据都改过 —— `--max-turns` 数的是**工具调用回合**（卡 002 实测 111 次工具调用 / 88 条带工具的 assistant 消息），**不是** `result` 里的 `num_turns`(=319，那是另一个计数器)；上限因此从 150/60 改成 **240/80**，并新增 `finish_verdict()` 读 `result.subtype` 判腰斩（撞上限 = `error_during_execution` + 空回话 + **退出码 0**）。详见 `T-G89` 与 `复盘/反空转三道-T-G88.md` §7。"

[entries."T-G87"]
id = "T-G87"
title = "修 T-G84 那条「中文路径」用例的**定时炸弹**：判据不许依赖真仓库 HEAD 这一笔 —— 改成自搭临时仓库，并先证明普通 git 确实会转义"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/测试定时炸弹-T-G87.md",
  "text:tests/test_wb_review.py::def plain(*args: str) -> str:",
  "text:tests/test_wb_review.py::★ 还先证明**普通 git 确实会转义**",
  "text:docs/traceability.toml::T-G87",
  "test:test_wb_review.py::test_chinese_paths_are_not_escaped",
  "test:test_wb_review.py::test_changed_paths_reads_porcelain_including_untracked",

gaps = "**为什么有这张卡**（T-G93，用户 2026-09-26：「可以并发多个 workbuddy 跑任务吗……同时开发一个插件，可以让我看到它们工作状态」，并选了「零依赖本地面板」这条路）：外包之后工人是在**别的进程**里干活，主控/用户能看见的只有 `gates/diag/wb-*` 那堆状态文件；并发跑两个工人时更不可能靠翻 log 知道谁在动。**口径照抄派活器的看门狗**（不另起一套）：`收工·结束`（有判决文件，**或**日志里已出现 `result` 事件）/ `在跑`（静默 < 60 秒）/ `安静`（60~480 秒）/ `静默 N 分钟（可能卡死）`（≥ 480 秒）。★ 顺序必须是**先看收工证据、再看静默多久** —— 反过来的话，一个早已 `result` 的老卡会被算成「可能卡死」（主控第一版就这么误报了卡 002）。**多卡多树**：主树 `gates/diag/` 与 `<仓库根>/.wt/*/gates/diag/` 都扫，跨树的行标成 `004@.wt/004`，免得两张卡同号看串。**反证（先红后绿，工人自己做的）**：故意把实现改坏两次各跑一次 —— 删掉收工判断里读 `result` 事件的那半截 → `test_result_event_means_finished_without_verdict` 当场 FAILED（断言把「收工·结束」算成了「静默 10.0 分钟（可能卡死）」）；把多树扫描改成不扫 `.wt/` → `test_multi_card_multi_tree_are_discovered` 当场 FAILED。**真机**：`--port 8899` 起面板 → `GET /api/state` 返回卡片 JSON（card=004 / state=在跑 / model=deepseek-v4.1-flash）→ **按 PID**（不是按进程名）停掉 → 8899 已释放；主控的常驻面板在 8787。**主控独立复验**：`ruff` 全过 + `pytest tests/test_wb_dash.py` **11 passed**，且 `git status` 证明工人**没有**碰任何被跟踪文件（共享文件由主控串行收口）。**边界（如实写）**：它只报「在不在动、动到哪了」，**不判断内容对不对**（那是主控复核的事）；只读 —— 绝不调用/杀工人、不落任何文件；续跑日志 `wb-<卡>.r2.jsonl` 一个文件一行（合并口径未定，故意没做）；只扫 `.wt/<一层>/gates/diag/`，不递归更深，且从某棵 worktree 内部起时看不到兄弟树（常规跑法是从主工作区起）。**没动的**：`tools/wb_status.py`（复用它的 `parse_events`，不写第二份解析器）、`tools/wb_dispatch.py`、`src/**`、真实库/备份目录。"



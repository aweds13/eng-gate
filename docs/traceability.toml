[entries."T-G38"]
id = "T-G38"
title = "最小验证法则（用户交代「别在验证上花那么多时间」）：行为流层默认一遍（--twice 按需）+ 复验既有界面抓到的一处勾选框缺陷与颜色归一缺口"
group = "PROCESS"
status = "done"
evidence = [
  "text:tools/ui_flow_check.mjs::★ 最小验证法则",
  "text:tools/ui_flow_check.mjs::只跑了一遍（最小验证法则）",
  "text:tests/test_ui_flow_check.py::这条流**默认只跑一遍**",
  "text:src/web/app.css::复选框在 `.field` 里还要躲**第二刀**",
  "text:tools/render_check.mjs::这里一并归一",
  "file:gates/render/LAST_UPDATE.md",
]
gaps = "**用户 2026-09-23 交代：「我不想你花那么多时间在这个验证的地方，能不能遵循最小验证法则？」** 于是这条线**刹车**，定下并落地三条：① **一条判据只放一处**（能在 pytest 断言的，不另开新门、不另写工具）；② **门禁只跑「改动可能伤到」的东西** —— 行为流层**默认只跑一遍**，两遍指纹自检改成 `--twice` 按需（流失败只是红一下、**不会污染持久数据**；黄金层那边两遍自检**继续常开**，因为一份抖出来的清单会被写进黄金，那是真污染 —— 两处取舍不同就按不同对待）；③ **不为「全覆盖」而全覆盖**：这条线**不再扩**，要加一条流得先说清它替掉哪条人工项；时间预算**一遍 ≲3 分钟**，超了就砍条数。**门禁因此从 ≈545s 回到 ≈370s**（行为流层 342s → ~175s）。**顺带复验既有界面**（用户问「已经有的代码还要复验吗？我不知道」→ 答：要，但只做便宜的那一种）：把 42 份黄金**当数据**读一遍（零额外耗时），扫出并在**同一次提交**里修掉一处真缺陷 —— **离线页「放进今天」的勾选框被画成 123×13**（`.field` 是 flex 列、默认 `align-items: stretch` 把勾选框横向拉满；T-G32 只改了文本框那套样式，**同一个毛病在离线页留了下来**），修法一行 `align-self: flex-start`；另修掉采集器自己的一个缺口：`color-mix()` 的底色 Chromium 回的是 `color(srgb r g b / a)`，原来只认 `rgb()` → **15 行原样存进黄金**（人读不懂、换浏览器版本字符串会变），现在归一成 hex。**扫出来的「干净」也算结论**：既有界面上字面的 `**` = 0、比 20px 还小的按钮 = 0。**没做的**（刻意）：全量不变量套件（那是往我自己感兴趣的方向加码，与这次交代相反）；焦点环（视觉改动，等用户）。"




gaps = "**规格与契约自己就把这一半划在范围外**：`functional.md` 写「合同待知识管理项目对齐**再定**」，契约 `OP-38` 的【边界】写「**不做打分器**；合同待对齐」。所以它不是「欠着的活」，是**等外部口径**。**为什么拆出来而不是继续挂在 SR-F8.4 上**（T-G75，用户 2026-09-25 定的处置）：一版的交付（手动粗颗粒产出入口）已经做完了，混在一条里会让台账永远显示一个假欠账 —— 拆开之后「done 的一版」与「等外部口径的评价器」各自如实。**要开工需要先定的口径**：评的是哪一类产出（学校 KPI / 知识资产 / 两者）、几档（粗/中/细）、结果进不进账本与统计、要不要与「完成收益」（`gain_count`）分开。**没做**：`src/` 一行没改（这一轮只动台账与文档口径）。2026-09-26 用户裁定：继续等外部（知识管理项目）对齐，维持 deferred。2026-09-26 用户定：继续等外部（评价器合同待知识管理项目对齐），本轮不动 → 状态仍 deferred。"


gaps = "**用户 2026-09-23**：「AI 原生的 CLI 这个可以加进来吗？会不会更加方便后面的维护，以及功能的扩展」+「4 个面集中到一个点……**排最后，先做命令表**」。命令表 T-G31 与 ⌘K 面板 T-G61 之后，这是 T-G30 §4.3 的**第 2 步（只读 CLI）**。**这一步的验收标准不是「有没有 CLI」，而是「CLI 里有没有一行自己算出来的东西」** —— 有一行就是第二个口径（那正是本项目一路在消的东西）。**落点**：`src/timeflow/cli/` 七个小文件 —— `table.py` 读命令表（与 `check_commands.py` **共用同一个读法**）、`registry.py` 14 条命令 = (名字, 契约 OP, 路由, 参数, 排版)、`call.py` 取数、`render.py` 排版（**只排版不取数不算数**）、`main.py` 参数/输出/退出码/自描述。**★ 取数走进程内同一个 HTTP 边界**：不是直接调 `core/`（那要把 `api/app.py` 的参数校验与字段形状再写一遍 = 把「四个面各写一遍」从业务逻辑搬到校验逻辑上），而是 `create_app()` + 同一套路由与中间件，**只把 socket 换成一次 ASGI 调用** —— 不起服务、不占端口（不会和正在跑的窗口抢 8520），库路径与桌面端同源。**命令**：`today`/`plan`/`overdue`/`due`/`done`/`week`/`trend`/`habits`/`check`/`tasks`/`upcoming`/`focus`/`board`/`sync` + `commands`（自描述）。**入口只加不改**：`timeflow` 不带参数**仍然开窗口**，只有第一个词是已知子命令或 `-h/--help` 才走命令行。**AI 原生六条**逐条落地：结构化 JSON（边界原样，不重排不改名）/ 自带参数 schema（`commands --json` 的 params，正是 MCP tool schema 的原料）/ 非交互 / 稳定退出码 `0` 成功·`1` 用法错·`2` 接口错·`3` 找不到命令表（`--json` 时 stderr 上 `{error:{code,detail}}`）/ 幂等可逆破坏性随表（`commands --table`）/ 自描述；**stdout 只放数据、错误一律进 stderr**。**「它不是第二套命令」是机器判的**：`check_commands.py` 新增「命令行投影」一节，五条判定 —— ① 只读（路由必须 GET，且挂的 OP 的 `kind` 必须是 read/derive；写操作 CLI 是另一张卡，要等 AI 边界口径）；② 路由必须**真是**那条 OP 的路由（`GET /api/nope` 当场红）；③ 命令 ↔ 表里的 `cli` 字段**双向互相指认**；④ 命令名不重复；⑤ 覆盖率报出来（**洞是进度不是错误**）。**只读全覆盖**（T-G30 §4.4 的口径）：13 条只读操作 → **覆盖 12 条**，唯一空着的 `OP-43`「配置加载」**压根没有路由**（入口是启动时的校验与注入）—— 这一条写进表里的 `note`、也钉在测试里（`rows_without_cli == [\"OP-43\"]`），免得下一个人以为是漏填。**验收**：`tests/test_cli_line.py` **19 条**（最值钱的三条：① `test_every_command_is_a_projection_of_the_same_route` 逐条命令断言 **CLI 的 `--json` == TestClient 直接打同一条路由的 JSON** —— 这是「不自己算口径」的机器形态；② `test_cli_does_not_touch_the_database_or_the_domain_layer` 用 `ast` 读 import 语句，`src/timeflow/cli/**` 不许出现 `sqlite3`/`timeflow.core`/`timeflow.storage`，而 `timeflow.api.app` 必须在；③ 不带参数仍开窗口 —— 断 `SystemExit` 与「`uvicorn.Server` 有没有被构造」，不靠感觉）+ `tests/test_check_commands.py` **+3**（真仓库覆盖率 / 合成假命令的路由不匹配与「表里没写」/ 拒绝 POST 与写操作）。**顺带**：T-G62 那条时钟缝是产品层的，所以 `TIMEFLOW_FAKE_TODAY` 对 CLI **免费生效**（`timeflow today` 第一行就是假日子）—— 当初做成「一处出口」的回报。**没做 / 边界**：写操作 CLI（第 4 步，卡在「哪些操作必须在 CLI 里可达」这句口径）与 MCP（第 3 步，原料已备齐：`commands --table --json` + params）；**不连正在跑的服务**（每次自己开一个进程内 app，行为确定；代价约 0.3–0.5s 启动）；stderr 上会有一行 `app_start` 的 JSON（真发生的事；要干净就 `TF_LOG_PATH=off`）；局域网配对门在这条路上不判定（来源写死回环、`allow_lan=False`，**CLI 不是对外服务**）；`pip install` 出的包不一定带 `docs/commands.toml`，所以自描述找不到表时退 3，数据命令不受影响（路由绑定写在 registry，由门禁逐条核对 —— 与 ⌘K 面板同一个做法）。 ★ **2026-09-25（T-G65）**：本条写的「写操作 CLI 是另一张卡，要等 AI 边界口径」**已经开了**（用户口径：只做界面上已有的那些 + 默认关 + 与界面同一条路）。本条的只读口径**一个字没改**：`COMMANDS` 仍然每条都是 GET、`cli` 字段双向核对照旧；写命令是另一批（`WRITE_COMMANDS`），门禁的「命令行」一节现在两边分别判。"

[entries."T-G69"]
id = "T-G69"
title = "每视图签名（T-G40 §六 那条残留）：判据自己也不许在错的时候被写下来 —— 防「三方一致地错」"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/每视图签名-T-G40残留-T-G69.md",
  "file:tools/render_signatures.json",
  "text:tools/render_signatures.json::防「三方一致地错」",
  "text:tools/render_check.mjs::class SignatureError extends Error {}",
  "text:tools/render_check.mjs::的**签名不成立**（采到的内容不像这一屏）",
  "text:tests/test_render_signatures.py::test_the_check_bites_on_a_wrong_screen",
  "text:docs/specification/nonfunctional.md::每视图签名：判据自己也不许在错的时候被写下来",
]
gaps = "**它补的是 T-G40 复盘里明确记下的没做**：「每个视图采到的内容必须与它自己有关」这道保险（防「三方一致地错」）。**为什么必须有**：黄金的判据是「与上次采的逐字节比」，盲区是**采集那一刻就采错了**（视图串了 / 竞态 / 页面没画完）—— 那样渲染层、假 DOM 探针、行为流层会**一致地**把错的当对；T-G40 真撞到过：`stats` 冷启动时采到 `focus` 的残留画面（两份黄金逐字节同大小、rows 都是 51）。**做法**：`tools/render_signatures.json` 给 15 屏各写一份**独立手写的**签名，四条判据 —— `must`（必须有：如今日页必须有 `circle.chart-ring-progress` 完成度进度环）、`forbid`（必须没有：今日页不许出现 `input#allTitle`，那是全部任务页的输入框）、`min_count`（次数下限：习惯页热力图格子 ≥300，实测 730）、`min_rows`（挡几乎空的采集）。**判据是数出来的不是我拍的**：先拿候选模式在已提交的 45 份黄金上跑矩阵（`gates/diag/sig_matrix.py`），只留真有辨识度的；「一个模式在超过半数的屏里都出现就等于没有辨识度」这条也钉成了测试。**两处生效**：① **采集的当场**（`render_check.mjs` 采完每屏立刻核对，不成立抛 `SignatureError` → 退 1 + 一句人话 + `notes`，**绝不让它落成黄金** —— 这是唯一能挡住「三方一致地错」的时点）；② `tests/test_render_signatures.py` 判这份表本身合不合格 + 判已提交的 45 份黄金逐份满足签名。**★ 为什么是 JSON 不是 TOML**：这份表要在采集那一刻被 Node 读，而 Node 没有内置 TOML、本项目零依赖。**证明它咬得住**（四条）：45 份黄金全满足 / 把 `desktop__tasks.txt` 当 today 喂进去时「找不到进度环」与「出现了全部任务页的输入框」两条都响（反证：喂自己的清单干净）/ `min_rows` 拦住骨架清单 / **端到端**：我故意加了一条不存在的模式 → `render_check --only today` 当场退 1 并给出「若确实是有意改版，改签名并写清理由」，随后撤销复跑绿。**边界**：它不替代黄金（一个管「这屏像不像它自己」，一个管「这次改了什么」）；签名**会过时且必须过时**（有意改版就改它，但要说理由）；挡不住「内容对但数据错」；手机档与桌面同一条判据。**黄金一份都没动** —— 这是加一层判据、不是改基线。"

[entries."T-G70"]
id = "T-G70"
title = "非文字对比度 3.0 表（T-G27 §6 / T-G45 §7 那条边界）：不看字也得看得见 —— 顺带抓到输入框边框只有 1.23"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/非文字对比度-T-G70.md",
  "text:tools/contrast_audit.py::AA_NONTEXT = 3.0  # WCAG 1.4.11",
  "text:tools/contrast_audit.py::AA_NONTEXT_PAIRS: tuple[tuple[str, str, str], ...] = (",
  "text:tools/contrast_audit.py::AA_NONTEXT_EXEMPT: tuple[tuple[str, str, tuple[str, ...], str], ...] = (",
  "text:tools/contrast_audit.py::def exempt_pairs() -> list[Pair]:",
  "text:src/web/app.css::--border-control: #7c8798;",
  "text:src/web/app.css::--border-control: #63738f;",
  "text:src/web/app.css::border: 1px solid var(--border-control);   /* T-G70：控件边界，不是分隔线 */",
  "text:tests/test_contrast_nontext.py::def test_it_bites_when_the_control_border_falls_back_to_the_decorative_value",
  "text:tests/test_contrast_nontext.py::def test_every_form_control_border_uses_the_control_token",
  "test:test_contrast_nontext.py::test_real_stylesheet_has_no_nontext_shortfall",
  "test:test_contrast_nontext.py::test_control_boundary_pairs_are_the_ones_whose_only_cue_is_the_border",
  "test:test_contrast_nontext.py::test_every_form_control_border_uses_the_control_token",
  "text:docs/specification/nonfunctional.md::不看字也得看得见的那一半（2026-09-25，T-G70）",
  "text:docs/user-guide.md::那张表 **2026-09-25（T-G70）已建**",
]
gaps = "**它补的是两条边界**：`T-G27 §6` 的「非文字图形（图标 vs 底、图表线条、边框是否看得见 —— WCAG 对非文字要 3.0）这一版没覆盖」与 `T-G45 §7` 的「状态点/描边仍只靠令牌级 4.5 地板兜着」。用户 2026-09-25 从工程债清单里挑的，而它同时是**另一条决定的技术兜底**：同一天用户定「**不做全量暗色渲染基线**」（判据：版式与主题无关），并把「暗色下看不见的东西」交给这张表 —— 所以它不是普通工程债，那张决定要成立，这张表就得真存在、真每轮跑。**做法：两张表，都从 `app.css` 真读、每道门都跑** —— ① **判据表** `AA_NONTEXT_PAIRS`（14 条 = 7 对 × 亮暗）：控制边界（输入框/下拉/文本域的边框）、勾选圈 `.check`、8px 状态点、图表数据笔、逾期/硬考核左红条、取样圈选中描边，逐对 **≥3.0**，**没有登记表**（控制边界看不见是**缺陷**不是欠账 —— 与 T-G27 对 toast 的同一句话）；② **纯装饰表** `AA_NONTEXT_EXEMPT`（11 条）：卡片/面板/芯片/`.kbd`/ghost 按钮的 1px 描边、左栏竖线与底栏上边、图表网格与轴基线/环轨道/空格描边、热力图空格与条形体底、暗色 toast 动作按钮边框、取样圈悬停描边 —— **实测值照打、不当判据**（WCAG 明文 `pure decoration`；把 365 个热力图空格画成 3.0 的灰会毁掉那张图），理由逐条写在表里。**同一天抓到的真缺陷**：`--border` 一个令牌干了两件事，而 1.4.11 只对其中**一件**要 3.0 —— 输入框的底与卡片底**同为 `--panel`**，边框是「这里能输入」的**唯一**线索，而它是 **1.23（亮）/ 1.33（暗）**，等于没有；这与 T-G46 是**同一类病的两个阶段**（那次修「没穿衣服」、这次量「穿上衣服了但衣服看不见」）。**修法是一条令牌拆分**：`--border-control`（亮 `#7c8798` **3.64** / 暗 `#63738f` **3.55**，值由门逐对算：对 `--bg`、`--panel-2` 也 ≥3.2），**7 条控件规则**改用（`.new input` / 元素级 `input:not(...)` / `select` / `.field input` / `.textarea` / `.modal-box input` / `.palette-box input`），`--border` 继续当分隔线。**为什么不是把 `--border` 整体调深**：那会把每一根**不受 1.4.11 管**的分隔线一起变深（换视觉、不换合规）。**为什么不是照包的值**：包**没有**这一档，它的 `--border` 同样是 1.2~1.3 —— 也就是说**包自己也不满足 1.4.11 的输入框那一条**，「跟包」在这里不适用（包把两个角色合成了一个令牌，我们把它拆开，正是那条规矩背后的意图）。**证明咬得住**（`tests/test_contrast_nontext.py` **9 条**）：真 `app.css` 0 条不达标 / 两套主题都在且阈值是 3.0 / 控制边界那 4 对必须在表里 / 表里每个令牌**真被当边界或图形用过**（防纸面表）/ **每一条控件边框必须走 `--border-control`**（从 CSS 真读，防有人复制 `.card` 那条顺手写回去）/ 把值改回 `#e2e8f0` 必须判 `NEW` / 豁免表**条数冻结**且**每条必须真的低于 3.0**（够了就该销账，不许留假豁免）/ 豁免行必须对自己声明的主题成立。**★ 踩到的新坑（僵尸行的第三种长相）**：豁免表第一版没写主题，「暗色 toast 动作按钮边框」被写成 `--border-strong on --panel-2` —— 可**亮色的 toast 底是 `--ink`**（9.37，本来就过），`--panel-2` 只在暗色是 toast 底：那一行是**对着一对在亮色里根本不存在的搭配**写豁免。修法：豁免表多一栏 `themes` 逐条声明 + 测试断言。**算不了什么（如实记）**：半透明填充（`.chart-area` 10% / `.chart-fill-soft` 18% —— 合成结果取决于底下是什么）、**悬停/选中态下的非文字**、浏览器自己画的 checkbox/radio（黄金里它们的 fg/bg 是空的 `#000000/#000000@0.00`）、`color-mix(…, transparent)` 的合成底。**没动的**：45 份黄金一份没动（渲染清单采 fg/bg、不采边框色）、`contrast_baseline.toml` 仍是空的、`run_gates.py` 一个字没改。**复议清单**：纯装饰那 6 行是**判断**不是测量 —— 若用户不认其中任何一条，改法与代价写在 `复盘/非文字对比度-T-G70.md` §4。"


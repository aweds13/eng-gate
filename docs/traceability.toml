gaps = "**它补的盲区**：服务端是 T-G65 手写的，`tests/test_mcp_line.py` 也真起子进程走过 stdio —— 但那两边的**作者、假设、读法是同一套**：服务端把「我们理解的消息」当「规范的消息」，测试再把服务端的回话当成对的（T-G74 就是这一族发作的现场：stdout 中文是 GBK，而当时的「真 stdio」测试带着 `-X utf8`，**正好把要验的那件事关掉了**，一路全绿）。所以这一张卡**另写一个实现**去读它，并且**只在规范允许的地方让步**：① ★ **不 import 本项目的任何东西**（连常量都不借 —— 借一个常量就等于借来一套假设；有源码级护栏钉着，连服务端路径都不许出现）；② `id` 用**字符串**并断言类型也要一样（「整数 id 才管用」这种假设自家测试里永远看不见）；③ 回话**先按 UTF-8 解字节**，解不开就判违规（T-G74 就是编码上的病，「换个编码再试试」会把病盖住）；④ `required` 里每一项都要**真的在 properties 里**（规范的一致性要求）；⑤ 结果严格按 `{content:[{type:text,text}], isError}` 判；⑥ 一条消息必须**以换行结束**（stdio 的 framing 就是一行一条）。**验收**：`tests/test_mcp_client_independent.py` **8 条**，全走真子进程真 stdio：独立护栏 / 握手（版本·能力·身份·**stderr 干净**）/ 工具清单（≥14、写工具一个不列、`readOnlyHint` 全 true、逐条过 schema 自检）/ 字符串 id 原样回来 + 不认的方法 `-32601` / ★ **反空转两条**（拿两个**故意坏掉的服务端**证明判据真的会咬：把字符串 id 改成整数 → 判「id 没有原样回来」；`required` 写一个 properties 里没有的参数 → 当场拦下 —— 没有这两条，「通过自检」可能只是「它什么都没查」）/ 写工具默认关（`-32602` + 消息里写着怎么开 + **被拒的写操作不许留下库文件**）/ ★ **中文一字不差**（T-G74 的独立复核：用这个客户端建一条中文标题的任务，再从另一个只读工具读回来）/ 工具失败如实报（库不存在 → `isError` → 客户端退出码 4，且只读命令不许建库）。**顺带交付**：它同时是给人用的小工具（`handshake` / `list` / `call` / `raw`，退出码 0/2/3/4/5/6），服务端命令三选一（`--server-json` > env `TIMEFLOW_MCP_SERVER` > 默认 `timeflow mcp`）—— D 组那条人工项现在可以先自己看一眼再决定要不要配 DSH。**顺带更正一句代码里的诚实边界**：`src/timeflow/mcp/server.py` 原写「验的是我们的客户端脚本 ↔ 我们的服务端」，T-G78 之后不准确了，改成「第三方 SDK 仍然没有，但协议这一层有一个独立实现的客户端在盯；真正没验的还是**某个具体第三方客户端里接一次**」。**没动的**：服务端一行逻辑没改（只改了那段注释）、CLI、命令表、界面、45 份黄金。**边界**：它不是第三方 MCP SDK，**不能替代**「在真客户端里接一次」那条人工项；只做 stdio（没有 resources / prompts / sampling / 进度通知）；超时靠后台读线程 + 队列（Windows 上管道没法 `select`）。"

[entries."T-G77"]
id = "T-G77"
title = "人工验收搬家·第六批：⑪ 备份与恢复搬给行为流层 —— 用「临时库 + 临时备份目录」把那条不可逆的路真走一遍（23 条流 / 312 项断言）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:复盘/人工验收搬家-第六批-T-G77.md",
  "text:tools/ui_flow_check.mjs::id: '⑪', name: '备份与恢复",
  "text:tools/ui_flow_check.mjs::真实备份目录不会被碰",
  "text:tools/ui_flow_check.mjs::function stampOf(d)",
  "text:tests/test_ui_flow_check.py::㉘\", \"⑪\"",
  "text:docs/人工验收-照着点.md::【已搬给机器：T-G77 流 ⑪，18 项断言】",
  "route:GET /api/settings/backups",
  "route:POST /api/settings/restore",
  "test:test_backup_restore_line.py::test_api_backups_list_and_restore_roundtrip",
  "test:test_backup_restore_line.py::test_api_restore_rejects_bad_name_and_cross_site",
  "test:test_backup_restore_line.py::test_serve_backs_up_has_window_flag_and_never_falls_back_silently",
]
gaps = "**为什么这一条一直没搬（T-G73 当时如实记的）**：恢复是**不可逆**动作，而备份就落在**库文件旁边**（`<库名>.bak-<时间戳>`，见 `storage/backup.py`）—— 在真实库上跑一遍就是拿用户的数据做实验。**走法（本卡设计的那个）**：这一层起服务用的是 `serve.py --fresh`，库在 `%TEMP%/timeflow_fresh_*` 里，**它的备份也在那儿** —— 于是「临时库 + 临时备份目录」天然是同一个临时目录，**真实库与真实备份目录一个字节都不会被碰**，而且这一条本身有断言（`dir` 必须含 `timeflow_fresh_` 且不在仓库路径下），不是口头保证。**一条流里没法重启服务**去触发「启动前自动备份」，所以那份「旧备份」由流自己按**产品的命名规则**放一个（时间戳取 1 分钟前）—— 于是这一条验的是**恢复那条不可逆的路**：① 列表认得它（按数据名点得到、界面把它当正常备份：时间戳解析得出来、没被标「名字被改过」）；② 二次确认里**写清恢复到哪个时间点**（原始时间戳）并写明「选错了还能回去」；③ ★ **取消之后一步都没走**（备份数不变 + 那条新任务还在）；④ 确认后**数据真的回到那一刻**（后来才加的任务不在了）；⑤ ★ 恢复前**自动又备份了一份现库**（多出一条 + 回话里念出它的名字）；⑥ ★ **可逆是真的**：点那份「恢复前的现库」→ 那条任务**又回来了**（「选错了还能回去」不是一句空话）；⑦ 收尾再恢复一次，世界回到这一遍开始的样子（不污染后面那些流）。**边界（不假装）**：`make_backup` 本身**不在这里重复验**（`tests/test_backup_restore_line.py` 14 条盯着它，含「比程序新」那条分支）；**流自己造的那份备份不是「启动前自动备份」那条路**，只是按同一命名规则放的文件 —— 「起服务时真的自动备份了一份」仍在人工那一眼里（那是**你的真实库目录**，机器不许碰）。**顺带更正清单里一处错的期望**：⑪ 的反证原来写着「不许把比程序新的备份硬恢复（应如实说不支持）」—— 而实现的口径（2026-09-21 用户定）是**照常恢复 + 如实报 `newer_than_app`**（界面回话写「但这个备份比当前程序新…可能有字段读不出来」），两处对不上，清单那句按实现改了。**成本如实记**：这条流 **41.4s**（四次恢复 + 文件操作，是这一层里最慢的一条），整层从 ~310s 涨到 ~350s —— **已经超出 T-G38 定的「一遍 ≲3 分钟」**（T-G73 那批就已经超了，不是本卡造成的），理由与取舍写在复盘里。"

[entries."T-G76"]
id = "T-G76"
title = "缺陷：过期的「连不上」替现在回答 —— 断网回在线那一两秒里（SR-NF17），提示会挡住一个明明能成的操作；改成「要拒绝先探一次」+ 迟到的失败不许改写更新的成功"
group = "PROCESS"
status = "done"
evidence = [

gaps = "**为什么有这张卡**：盘点 S-1 的 A17；T-G91.gaps「--detach 后看门狗是脱离进程自己带着的……还没做，是候选」+ 并发两卡复盘 §6「看门狗的寿命 = 那个进程的寿命」。**做了什么**：主控裁定架构 C（卡 §2.9）—— `--status` 新增心跳停滞醒目告警（`heartbeat_stall_alert`，tools/wb_dispatch.py:405；接线 :368/:381），阈值复用看门狗底线 STALL_SECONDS=480、不写第二份口径；顺带把 [心跳] 展示改为取最新一轮的心跳文件（续跑轮不再读第 1 轮那份停摆的）。**反证（先红后绿）**：突变拆掉 status_report 的告警接线 → test_status_alarms_when_nobody_is_watching / test_status_alarms_without_any_heartbeat 两条红；还原 86 passed 全绿（81 条既有一条没红）。**真机证据**：桩命令真起进程（驱动 %TEMP%/tg112_probe/probe.py；读状态阈值临时缩放 480→20、其余全真）—— ① --detach 真扔出去（pid 存活 + 心跳在写）；② 按 PID 杀整棵与只杀派活器两种杀法 → --status 都打出「没人盯」告警；③ 工人正常收工 → 判决落盘、派活进程自己退干净（tasklist 按 PID 核）、不告警。**探针修正**：初版「心跳停但日志还在动 = 孤儿」分支被探针 B 证伪 —— 工人 stdout 的读端（pump 线程）在派活进程里，派活进程一死 log 必冻结，该情形不可达，已收敛为一种告警。**边界（如实写）**：工人生死从文件判不出（残余风险 = 工人烧 token 没人看 → 候选卡 B 解，设计要点在复盘 §7）；系统重启连告警读者一起没 → 兜底是人/定时任务调 --status；两轮之间被杀的窗口不告警；--stall-seconds 自定义值不进告警口径；告警读 mtime、改系统时钟会误判。**没动的**：看门狗判据本体（watchdog_verdict / inflight_tool / tool_durations / stall_threshold_seconds）、心跳与判决落盘格式、--status 只读原则、wb_status.py、wb_dash.py（面板停滞告警 T-G97 已有）、src/**、docs/**、共享文件。"


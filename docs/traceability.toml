gaps = "行为流层（T-G34）建成后继续搬第二批：**⑬ 导出 Markdown / ⑯ AI 接口边界 / ㉔ 复习改判**（顺带把 **⑤** 提示条上那个「记一笔产出」一起验了）。合计 **12 条流 / 106 项断言**（两遍指纹一致，≈215s）。**新用到的两个手段**：① 从 Node 侧直接打接口（`t.api()`，不带 Origin）—— 验「界面上看不见的那一半」（AI 接口的 403/400 原话、以及「拒了之后状态有没有偷偷变」）；**能走界面的一律走界面**，这个口子只补界面做不到的地方；② 直接读磁盘（⑬ 不看界面看**文件系统**：文件真在不在、里面写着什么）。**顺手确认的一件事**：md 产物里的 `**加粗**` 是**对的**（那是给 Obsidian 看的 markdown），与「界面文字不许有字面 `**`」必须分开判 —— 同一条流里两种判据并存；另核对过后端错误原话里的 `**`（如「AI 接口默认是**关**的」）**不经过界面**（`index.html` 一处都没调 `/api/ai/*`），而**会**经过提示条的原话已在 ⑨ 里加了一条「不许画星号」的断言（**抽样**不是保证，见 T-G34 复盘 §6）。★ **整套跑出来的真问题：第一版 ㉔ 写死了进度条 `0/1`，单独跑绿、跟着整套跑红** —— 它前面的 **① 升级为复习卡**又建了一张卡，到期变 2 张。要紧的不是这个笔误，而是它暴露的判据边界：**「跑两遍都一样」抓不到「顺序耦合」**（两遍按同一个顺序跑，错得一模一样，指纹当然一致）。修法两条：① 断言从**绝对数字**改成**相对变化**（解析 done 数：`0 → 1 → 仍是 1` —— 这条流要证明的本来就是「改判不重复计」）；② 点谁就**钉在那张卡里点**（`inCard`），不靠「第几个」。**成本**：单跑这一层 ≈148s → **≈215s**（单遍 ≈95s），整轮门禁 ≈340s → **≈400s**；每加一条流两遍就是 +20~40s —— 下一批要么继续加，要么先压每条流的启动开销（≈3–4s/条）或做「只跑被改动波及的那几条」。"



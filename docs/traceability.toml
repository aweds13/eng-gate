gaps = "本笔落卡 182（外包面的留痕与配额）。★ 诚实缺口五条：1. ★★ **本笔是「第一张从码道号池交回来的卡」**（`huaweicloud-maas/GLM-5.2`，35 分钟 / 84,931 tokens / 正常收工）。⇒ 它同时是一次**跨号池的实战验证**；但见下面第 2、3 条那两处代价。2. ★ **走码道丢了四样**（CodeBuddy 派活器有、码道派活器没有）：① **开工切片**（现状现算 + 规矩 + 固定坑页 + `pin_check`，本卡只有规格原文）；② **回合上限**（只有超时 + 静默看门狗，静默底线还是 1800s）；③ **日志不在我们这边**（落 `infra/pool/logs/`，`job_list` / 哨兵 / 判决判据都看不见）；④ 没有项目守卫与域检查。★ 这四条正是**卡 166（一层统一 + 按池分流）**要治的。★★ **这一趟就当场撞上了**：门禁红在 `tests/test_no_window.py::test_no_unflagged_subprocess_calls` —— `tools/wb_retention.py:67` 的 `subprocess.run` **没带 `NO_WINDOW`**。那条规矩（卡 148 立的：子进程一律不弹窗，flag 的唯一真源在 `tools/pool/no_window.py`）写在**固定坑页**里，而码道那侧**不喂坑页** ⇒ 工人**不可能知道**。★ **主控做了收尾修正**（如实记）：补一行 `from pool.no_window import NO_WINDOW` + 调用处加 `**NO_WINDOW`，并**独立复跑**三条测试文件（39 通过）后才重跑门禁。★ 同时把这条缺口**写进卡 166**：按池分流时，**码道那侧也必须喂一份最小规矩集**（否则每张卡都要主控手工补一次）。3. ★ **一条口径差如实记**：卡里写的「**22 份无判决**」是 `job_list` 的**按文件**口径（把 `wb-<卡>.claim.jsonl` / `.r2` / `.old` 这些变体也算进去）；工人中途按**卡号聚合**算出 **2 份**（`002` / `178`）。★ **产物最终选了「按文件」口径**，并在模块头写明理由（每次跑活尝试都该各自留一份判决；按卡号聚合会把「claim 没判决但正跑有判决」误判成有判决）。⇒ **两个读数都真，本笔用卡里那个**，口径写在产物里。4. ★ **树数还在涨**：卡里写 176、`T-G180` 的读数是 89、工人开工时读到 **177** —— **我们在干活的同时还在长树**（每张卡一棵）。⇒ 「配额」这件事本身不会自愈。5. ★ **本笔不许真删任何工作树**（不可逆动作留主控）；本笔只交「读数 + 判据 + 归档 + D-12 修复」。"


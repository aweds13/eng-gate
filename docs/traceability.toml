gaps = "**怎么发现的**（T-G89）：T-G88 落盘后，我用真机探针**先验一遍**那道「回合上限」到底怎么数 —— 结果逮到两处错，都不是靠推理能发现的。① **口径错了一半**：`result` 事件里有 `num_turns`，卡 002 = **319**，而 T-G88 的标定按 `message.id` 去重数是 **90**（写上限时用的是这格）。谁对？探针说话：给一个「要依次跑 6 条 Bash 命令」的活 + `--max-turns 2` → 只跑了 **2 次**工具调用就停；`--max-turns 8` → 跑满 **6 次**、`subtype=success`。所以 `--max-turns` 数的是**工具调用回合**（卡 002 实测 **111 次工具调用 / 88 条带工具调用的 assistant 消息**），而 `num_turns`(=319) 是**另一个**计数器（多半把内部请求、自动压缩那些也算进去了）。★ 差一点照 319 把上限抬到 600 —— 探针第二次拦住我（第一次拦的是「照 60 定会把卡 002 腰斩」）。② **判据漏了最危险的那一面**：撞上限时 CLI 给的是 `result.subtype = error_during_execution` + **回话是空的**，而**进程退出码仍是 0** —— 只看退出码会把「腰斩」当成功。**修法**：① 上限改成 写卡 **240**（≈2.2 × 卡 002 的 111）/ 只读 **80**；② 新增 `finish_verdict()`：读 `result` 事件判「到底跑完没有」——没有 result 事件 / `subtype != success` / 回话是空的，三种都算**没做完**；它与「数回合」互为补集（数回合提前预警，读事件才是硬证据）；③ `turns_seen()` 的 docstring 把「别拿 num_turns 比上限」写成明面规矩。**证据**：`tests/test_wb_dispatch.py` **25 条**（新增两条：`finish_verdict` 的四种形状 + 「退出码 0 但 stream 说 error_during_execution → 必须报没跑完」）；真机探针的原始输出记在 `复盘/反空转三道-T-G88.md` §7。**边界（如实写）**：`--max-turns` 与 `num_turns` 的确切定义仍是从**行为**反推的（CLI 的 `--help` 只写 `Limit the number of agentic turns`），哪天真机行为对不上就以探针为准；上限给得宽是**故意**的（护栏的目的是掐跑飞，不是卡正常卡）。**没动的**：看门狗与心跳一个字没改；`--autocompact 1m` 与 `--effort` 默认没改。"

[entries."T-G88"]
id = "T-G88"
title = "反空转三道（用户点名要的「心跳」）：`--max-turns` 上限 + 看门狗（静默 8 分钟或窗口内重复 5 次 → 掐进程树 + 报现场）+ 心跳（每 2 分钟一行）；顺带把 `--autocompact 1m` 做成默认（★ 上限的具体标定经 `T-G89` 更正）"

mypy 单文件检查在本仓有既有的「同名双路径」坑（`Source file found twice under different module names`）：`limits_policy.py` 要 `pool_accounts.TZ`，直接 import 会连带把 `tools/pool/__init__.py` 拉进检查而报错。落地写法是 `if TYPE_CHECKING: ... TZ: tzinfo` / `else: from pool_accounts import TZ` —— 运行时仍是 `pool_accounts.TZ` 本体（`pin_01` 用 `is` 钉住同一性），没有新造时区。这个 shim 的存在理由只是让 `mypy 三源文件` 这条验收能绿。
`cost` 是**金额**，但本仓没有计价表（`_port_design_gates_keys.md` 已记），所以今天的 `cost` 只能由调用方算好传进来；`ledger_spend` 只负责存与求和。
""",
]


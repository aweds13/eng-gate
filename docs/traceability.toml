gaps = "**为什么这张卡一直搁着**：段2 的决策是「不做拖拽排序」（触屏/键鼠/可测性都不划算，`move_doing` 的注释里还留着那句话），2026-09-23 用户改成「放后面待定」，2026-09-25 说「一直干到拖拽 B 解决」—— 于是把 **B（真拖拽）** 做完（A 是只做 ↑↓）。**做法**：① 领域层加 `tasks.myday_rank`（schema v18 → **v19**，用 `_add_column_if_missing` 加列、**不猜历史数据**），顺序**只由用户动作产生**；② 一个语义两个入口共用同一份顺序 —— `place_myday(before_id)` 是拖拽那一下（`before_id=None` = 放到末尾），`move_myday(direction)` 是 ↑↓，两者都写 `myday_rank`；③ 一份 `_MYDAY_ORDER_BY` 把「拖过的按 rank（小的在前）、没拖过的垫后并按老口径」拼出来，`myday_tasks` 只引用它、不另写一遍 SQL；④ 一条路由 `POST /api/tasks/{task_id}/myday-move`（两个键**要么给一个要么不给**，都给/给空 → 400；任务不存在 → 404 先于「不在今天」那一步），包在 `db.unit_of_work` 里（多写处理函数清单同步加一条）；⑤ 界面：抓手是**非 button** 元素（`data-drag` 是手势区、不是动作 —— 所以读屏与键盘走 ↑↓ 那两个按钮），`pointerdown/move/up` 三件事、落点画 `drop-before / drop-after`、抓手带 `touch-action:none` 让触屏也拖得动；⑥ `myday_rank` 进了离线字段表（手机只读面跟着字段走）。**边界（不假装）**：只排「今天」这一栏（不做跨视图/跨栏拖拽）；`myday_rank` **不是 PATCH 可写字段**（只能走那条路由，有测试钉着）；`before_id` 给的是**哪一条**不是第几格（中间插队/有隐藏项都不会错位）；拖到自己前面、已在头/尾按 ↑↓ 都原地不动（幂等）—— ★ **2026-09-26（T-G86）更正**：这条原来在 `复盘/拖拽排序-T-G79.md` 里还写着「也都不写库」，**那句是错的**（当时 `_myday_sequence()` 会把今天清单每一行都写一次号，空转也整表重写、还把 `NULL` 冻成 `1..N`）；已修成「只读顺序 + 顺序真变时才写、且只写排过号的那一截」，见 `复盘/幂等写库-T-G86.md`；不做撤销。**验收**：`tests/test_myday_order_line.py` **13 条**（拖到目标前 + 落库刷新还在、`null` 落末尾、拖自己与越界幂等、落点不在今天 → 拒绝、请求形状 400、↑↓ 与拖拽共用同一份顺序、**离开今天清空 + 再进来排最后**、没拖过的保持老顺序、`myday_rank` 写不进 PATCH、其它视图仍共用老口径、v18 → v19 升级不猜、manager 也拦不可见目标）+ 行为流 **M「今天清单拖拽排序」13 项断言**（真按住、真移动、松手 → 顺序变了，刷新页面顺序还在，最后用 ↑↓ 再调一次）+ `test_web_frontend.py` 一条「抓手在且键盘可达」+ 对比度门给抓手补了一对**非文字**判据（`--muted` on `--panel`，判据是 3.0 那档）。**★ 踩到的坑（两条都是探针先抓到、不是我看出来的）**：① **`database is locked`** —— `_write_myday_rank` 当初漏了 `commit()`，而 400 与幂等那几条路会先写一遍归一化顺序再早退 → 那笔写挂在事务里，**下一个读当场炸**；`gates/diag/probes/myday_lock_probe.py`（监视 `sqlite3.connect` 并打出 `in_transaction` 与创建栈）指出「第 5 条连接 `_myday_sequence` 处于事务中」，修法是**在 `_write_myday_rank` 里提交**，并补两条「400 / 边界动作之后再读一次」的回归断言（没有这两条，这个 bug 只会在真实使用里偶发）。② **属性名读写对不上** —— 卡片写的是 `data-myday-id`，拖拽代码读 `dataset.id` → 落点恒为 `undefined`，**看着能拖、其实什么也没发生**；`gates/diag/probes/drag_probe.mjs`（接管 `fetch` + 打 `__drop`）把它照了出来。★ **顺带修掉工具自己的一处假红**：`T.drag()` 原来分两次读两个元素的 rect，而 `rectOf()` 内部会 `scrollIntoView` —— 第二次读把第一次的坐标**作废**，于是抓手按在了另一张卡上（命中测试说「那个点上其实是路径」）；改成**只滚一次、在同一次求值里读两个 rect**，并在按下前做命中测试（零点/出屏直接报明确原因）。**没动的**：`_ORDER_BY` 本身（老口径一个字没改）、`move_doing`（进行中那套序号照旧）、离线包格式与合并规则。"



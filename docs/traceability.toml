gaps = "**来路（2026-10-02 晚的现场：同一笔提交，三趟门禁，每趟 ≈ 11 分钟）**：同一笔（`T-G244`）连跑三次，**代码一次没错，全部死在「派生物/记账」这一层** ——1. **第 1 趟**：门禁 **2007 passed 全绿**，但 step ⑥ 的 `extra` 守卫停手（三张卡的规格 `git add` 了却**没写进 `--allow`**）；2. **第 2 趟**：step ② 的写后自检停手 —— ★ 上一趟**已经把 `T-G244` 合进 `docs/traceability.toml`**，重跑**重复条目**（`Cannot declare ('entries', 'T-G244') twice`）；3. **第 3 趟**：主控**手工** `git checkout HEAD -- docs/changelog.md docs/traceability.toml 复盘/交接-重构进度.md gates/last.json gates/reuse.json`+ 删片段 + 规格重新入索引，才跑通。★ 三条其实是**同一件事**：**重跑要先回到干净态** —— 而它**靠人记**（口径坑里写着「重跑前先回退派生物」，主控照样忘）。**做法（卡 150 在自己的树里干；主控按文件收口）**：- **收口链最前新增 ⓪ 步「回退派生物」**：落在 `--commit-only` 之外**每次开跑、拿门禁锁之前**（`tools/pool/landing.py` 的 `reset_derived()` + `RESET_FRAGMENTS` 名单），★ **既有 ①~⑦ 的判据一个没动**（fail-fast / extra 守卫 / 封存 / 审计一个都没松）；- **回退名单硬编码这 8 样**：`docs/traceability.toml` · `docs/changelog.md` · `复盘/交接-重构进度.md` ·`gates/last.json` · `gates/reuse.json` + 本台账号三片段（`docs/changelog.d/<T>.md` 等）；不在 HEAD（新文件残留）⇒ **删掉**（进了暂存区则 `git rm -f`）；**拿不到 HEAD** ⇒ **警告并跳过、绝不停手**；- ★ **只回退派生物、绝不碰源文件**：白名单源文件（`tools/wb_land.py` 等）**根本不在名单里**（硬编码），钉子 ⑨ 有实证；★ **逐样打印「是否真的变过」，不许静默**；- **`--no-reset` 留口子**（`--help` 里写明默认会回退派生物）；`tools/wb_land.py` 壳的 docstring 补 ⓪ 一行。**验收（工人自验 + 主控复核；全量门禁与审计见 trailer 与提交之后的 audit 段）**：★ **先红后绿**：实现前 `6 failed, 6 passed`（五条钉子 + help 旗子红，**红的原因正确**）；实现后 **`12 passed in 16.29s`**；`ruff check tools tests` ⇒ **All checks passed!**。五条钉子读数 —— ⑧ **脏台账 + 残留片段 ⇒ 回到 HEAD 字节级干净**，且**逐样打印**（实拍三态：「有改动 ⇒ 已回到 HEAD 干净态」/「本来就干净，不用回退」/「HEAD 里没有（新文件残留）⇒ 已删除」）；⑨ **不碰源文件**（把 `tools/wb_land.py` 改脏后开跑，**内容逐字节不变**、改动原样保留，回退清单里无源文件）；⑩ **幂等**：第 1 趟计划外暂存停手（残留下台账条目+片段），第 2 趟 `rc=0`、**无 `twice`**、提交里台账**恰一条**；★ 对照：**无回退**时第 2 趟报 `Cannot declare ('entries', 'T-G999') twice` **退 2**；⑪ **`--no-reset` 真关掉**（打印「⓪ 跳过」，脏台账原样保留、条目×2，重复条目**照样炸**）；⑫ **拿不到 HEAD 不停手**（空 git 仓 ⇒ 「拿不到 HEAD…警告并跳过」后**继续走出 `=== ①`**、无 Traceback）。★ **真读数**：主仓 `4b0ab34` clone 到临时目录、**只跑到「回退 + 打印」就停** ——弄脏后 `git status --porcelain` 为 `M docs/traceability.toml` + **3 个 `??` 片段** ⇒ `reset_derived` 打印三态各一行⇒ **回退后 `git status --porcelain` 为空**；**未跑门禁、未提交、主仓一字未动**，临时 clone 已删。工人：第 1 次尝试、退出码 0、**正常收工**、用时 **23.3 分钟**、回合 35、工具 39 次、碰过文件 8 个、**工具报错 0 次**；域内只动了 `tools/wb_land.py`、`tools/pool/landing.py`、`tests/test_wb_land.py` 三个文件。**★ 老实说**：① **边界**：rebase 冲突那条路（`resolve_derived_conflicts`）**未加回退** —— 它走幂等汇总器、**理论**无此问题，**未验证**，如实写；② **边界**：钉子 ⑧/⑨ 用**故意失败的 `stage_card` 桩**把现场冻在 **⓪ 之后**（比卡里括号说的「桩住门禁」**冻得更早**，观察点等价）；**幂等钉子走桩路径**（`sync_docs` 桩带真合并语义），**没跑真全量链**；③ **边界**：**`--commit-only` 不回退**是**本卡内**定的口径（它要提交的就是上一趟文书）；若主控希望它也回退，**需另立卡**；④ ★ **成送申请是主控在落地前补交的** —— 规格里写的任务名 `B-IDEMPOTENT` 当晚**没预声明**（batch 目录里确无此文件）⇒ 工人**交不成**，它**如实报了**「没交成」。这是**同类漏项第 9 次**，如实记，不美化。⑤ **该改但不属本卡**（工人自己提的根治方向）：**派活时校验预声明文件存在** —— 发卡前查 batch 文件，缺就拒发，可省掉整轮白干。- ★ **内存闸例外（留痕）**：跑这一趟集成时本机可用内存只有约 **2.7 GB**（`UltraRAG` 那套服务占着 2.7 GB+），低于默认阈值 4.0 ⇒ 主控显式 `TF_GATE_MIN_FREE_GB=2.5` **放行**，并同时用 `TF_PYTEST_WORKERS=1`（阈值 4.0 是按 4 worker 跑全套定的；**1 worker 的实际占用只几百 MB**）。★ 这不是跳过门禁：**全量门禁照跑、17 道门一道不少**，只是把闸门对齐到真实占用。"


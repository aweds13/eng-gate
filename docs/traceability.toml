gaps = "**2026-09-25（T-G79）拖拽落地，本条从 deferred 转 done。** 排序那一半本来就是 done：**截止时间 → 优先级 → 创建时间**，且 `list_tasks/myday_tasks/overdue_tasks` 三处同口径（T-B2）。拖拽那一半 2026-09-23 用户定为「放后面待定」（此前段2 是「不做」），2026-09-25 说「一直干到拖拽 B 解决」→ 当天做完。**口径**：顺序**只由用户动作产生**（拖一下 / ↑↓）—— `tasks.myday_rank`（schema v19），数值小的在前；**没拖过的 `myday_rank IS NULL` 排在后面**、内部仍按老口径（截止日→优先级→创建时间），两份口径拼在 `_MYDAY_ORDER_BY` 一处；**进今天 = NULL**（新来的排最后，不抢你手动摆好的位置）、**离开今天清空**；拖拽落点是「放到**那一条**前面」（`before` 给 id；`null` = 放到末尾），不传「第几格」—— 中间插进来一条或列表里有隐藏项都不会让落点错位。**边界**：不做跨视图/跨栏拖拽（只排「今天」这一栏）；`myday_rank` **不是 PATCH 可写字段**（只能走那条路由，有测试钉着）；拖到自己前面 = 原地不动、已在头/尾按 ↑↓ = 原地不动（都幂等）。详见 `复盘/拖拽排序-T-G79.md`。"


gaps = "**为什么现在才出**：用户 2026-09-25 当面定「**人工验收等工程债清完一起走**」—— 到 T-G71 为止工程债三条（`T-G40 §六` 签名 T-G69 / 非文字对比度 3.0 表 T-G70 / `T-G33` 跨函数事务残留 T-G71）**全清**，所以这一层现在可以走了。**这份清单是什么**：把散在 `docs/ACCEPTANCE.md`（标「手动」的那些）、`复盘/交接-重构进度.md` §二「待人工确认」（原 28 项、18 项已搬给机器、**剩 10 项**）与各处「待人工」注记里的东西，收敛成**一张可逐条打勾的表**，每条四栏 —— **怎么做 / 预期看到 / 反证（不该发生的事）/ 机器已经验到哪**（那一半不用重做）。分组：**A 物理场景**（桌面窗口=AC-11 / 手机离线记 / 同一 WiFi 直连 / 校园网与热点 / 手机直接上传 / 跨端专注镜像 / **暗色主题逐页看一眼**）、**B 要动真数据**（备份与恢复 / 删除可选）、**C 要外部程序或手工动作**（可配置词表 / Obsidian 真跳转 / 复习卡改形式句柄）、**D 新面：第三方 MCP 客户端接一次**（只读 14 工具 → 开写 20 工具，两条各带反证）、**E 口味与判断**（5 条，**不是验证是决策**：整体观感 / 卡片按钮密度 / 暗色观感 / CLI·MCP 措辞 / 那四条「不打算做」的二版条目）。**★ 清单里最要紧的一栏是「反证」**：机器测的是「用对了就对我」，人这一遍补的是「**用错了会怎样**」—— T-G33 那个 500 正是这么漏过去的（没有任何一道门会带一个坏分组去建任务）。**边界（如实记）**：① 这份清单**不进机器门**（人的判断不该被机器判），它进台账当「验收这件事本身」的证据；② **验收本身仍未做** —— 清单存在 ≠ 验过了，用户走完之后：过了的在这里销账，没过的**按现象立卡**（不猜原因）；③ 每条的「机器已验到哪」是**给人省事**用的，不是「已经验过」的意思；④ 准备里给了一条「先复制一份真库」的命令（⑪ 备份与恢复会动真数据，虽然恢复本身可逆：程序恢复前会自动再备份一次现库）。"


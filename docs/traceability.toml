gaps = "**用户说「开始问我吧」→ 我列问题之前先核事实，结果发现「下一步」清单里有三条幽灵**：① `OP-3b` 暂停/继续、② 执行侧自动填反馈、③ `flows.md` 自查表做成机器门 —— **前两条 2026-09-23 就定过、第三条同一天就做完了**（T-G39：规格/契约改成「结束（计入投入）/ 放弃 / 记中断」并**删掉** `OP-3b` 那条契约、命令表 54 → 53；明确**不自动填**执行侧（「反馈是给人写的」）；`tests/test_flows_selfcheck.py` 已进 pytest 且带「证明它咬得住」的合成用例）。**我差点拿两件已经定过的事去问用户重定**。★ 病根与 T-G67（AC-11 状态过期）**同一个**：**状态字段没人复查就会漂** —— 而这批是从一张卡往下一张卡**复制了十几轮**（T-G64/T-G66/T-G67 的「下一步」里都挂着），比 AC-11 那次更隐蔽：AC-11 是「把做完的说成没做」，这批是「把定过的又说成待定」。**处置**：两份交接里那几处「下一步」全部改成**真的开放项**（签名断言 / 非文字对比度 3.0 表 / MCP+写 / `T-G33` 残留 / 人工验收），并在幽灵那几行写明「已定/已做 + 指向 T-G39」——**不删历史块的原文**，因为「当时这么写」本身是事实，要让人看见漂是怎么发生的。**同一轮把用户当面定的四件事落档**：① **暗色不做全量渲染基线**（判据：版式与主题无关 —— 暗色只换令牌值不换布局；暗色的**可见性**风险交给**非文字对比度 3.0 表**，那张表近 0 成本且每轮都跑；已写进 `docs/user-guide.md` 的已知局限）；② **MCP 做**，且**顺带把写操作也开**；③ 写入口径 = **只读全覆盖 + 写入只做「和界面上一样的那些」+ 默认关**（T-G65 的 gaps 同步改成「口径已定，可开工」，并写明开工要带的三件事：命令表新增写命令的可用性栏 / MCP 工具清单必须由那张表生成 / 默认关要有机器判据）；④ **人工验收等工程债清完一起走**。**下一张卡**：`T-G40 §六` 每视图签名断言。"


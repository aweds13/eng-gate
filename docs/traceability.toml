gaps = "**用户 2026-09-23 交代「按你想的来」→ B 表（14 条待定）一次落地。** 逐条处置：**①`conventions.md` 第 34 行**按已选方案 3 的替换文本改了（AI 的进展以**事实**回报、不改不删用户数据）—— **T-G21 的唯一关卡解除**。**②`SR-F1.7`「关联笔记」判满足 → partial 转 done**（附件能挂链接/路径、备注能写笔记名、规格自己写着「Obsidian 深联动后置」；**没做**的如实留档：任务侧没有「引用句柄」字段，所以不能像复习卡那样一键跳）。**③FLOW-4 执行侧**：决定**不自动填**（反馈是给人写的）—— 契约那句本来就是「目标态」、`flows.md` 表外已有如实记录，故**未动正文**。**④`OP-3b`**：规格与契约改成「结束（计入投入）/ 放弃 / 记中断」，**删掉**契约里那条 `OP-3b 暂停 / 继续`（`[contract_ops]` 同步、`docs/commands.toml` 同步 → 命令表 54 → 53 条），`STATUS_PAUSED` 在 `timer.py` 写明**预留、无入口**。**⑤强调色换 `#2f6feb`**（workbench 包自己的值，白字 4.57 过 AA；原来 `#3b82f6` 只有 3.68）+ 立规矩「强调色不做小字」；`config.py` 的默认值与 `app.css` **必须一致**（黄金头部写着 accent=，不一致就是两个默认）。**⑥令牌改名**：**没做**（91 处机械替换、零用户可见收益、还会撞上 `--text` / `--text-on-dark` 这种前缀；留给视觉线第 1 步「建映射表」时一起做 —— 那一步正好要用这张表）。**⑦6 个预设各配 on 色**（`--accent-N-on`，紫色单独用纯黑因为 `#0b1220` 只有 4.42）→ **对比度门：达标 24 → 32、欠账 18 → 10、新欠账 0**，7 行销账记录留在 `contrast_baseline.toml`；门禁也跟着改成按 `--accent-N-on` 配对（以前量的是界面上**不会出现**的那一对）。**⑧AI 面**并进视觉线、排最后。**⑨动线自查表上机器闸**（用户点头）：新 pytest 查空框 / ✅ 无证据 / 证据指不着东西，并用合成数据证明它咬得住。★ **过程中两个真发现**：① `contrast_audit.py` 抽令牌时**不先剥注释**，而注释里出现「--某令牌: 某值」这种形状就会被当成声明吞掉（实测把 `--accent-on` 的值污染成一大段文字）→ 已修（先剥注释再抽）；② 渲染层采集遇到**一次** `stats` 视图两遍不一致（自检当场拦下、重跑即稳定，成因未定）—— 如实记在这里：**如果再出现，要把它当成真问题查**（当前不排除是采集时序）。"



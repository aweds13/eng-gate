gaps = "**为什么有这张卡**（T-G91，用户 2026-09-26：「有的任务，时间花很多，怎么保证长时间运行」）：前面三张卡（T-G88/89/90）做的是**单卡内部**的护栏，但看门狗跑在**主控的 DSH 后台任务**里 —— 我的窗口一关就没人盯了，而这正是「时间花很多」的真正风险。**答案分三层**：① **最硬的一层是「别做一次长跑」**：长任务先拆成一串卡（每张 30–60 分钟量级），一张卡 = 一次提交 = 一次验收，状态存在 git / 台账 / 复盘 / 交接文档里，**不依赖任何进程活着** —— 这条写进了 `复盘/外包-卡表与规矩.md` §15（第一原则），也是这个项目一直在做的「复盘即外部记忆」；② 单卡内已有的护栏（看门狗 / 心跳 / 回合上限 / 铁律进系统提示 / 断点续跑）；③ ★ **主控不在场**（本卡补的）：`--detach` 把派活扔成**脱离窗口**的进程（Windows `DETACHED_PROCESS` + 新进程组，输出落 `wb-<卡>.dispatch.log`），`--status` 一条命令**只读文件**报状态（心跳 / 判决 / 会话 / log 尾巴 + 工具与文件计数，不必翻 1 MB log），心跳写进 `wb-<卡>.heartbeat.txt`（带时间戳）、收工或被掐都写 `wb-<卡>.verdict.txt`（卡号·尝试次数·退出码·会话）。默认超时 3600 → **7200 秒**，并把「**超时不是失败**」写进帮助与文档：到点掐掉、由 `should_resume` 允许「超时」续跑 —— 机器睡眠 / 断网 / CLI 崩了都走这一条路（日志静默 → 判卡死 → 掐 → 续跑），**这是故意设计**。**证据**：`tests/test_wb_dispatch.py` **32 → 40 条**（`detached_argv` 去掉 `--detach` 并补内部标记免得无限生小进程 / `--detach` 只扔一次就返回 / `--status` 只读文件且**不需要 `--spec`** / 没派过的卡给一句人话 / 心跳文件带时间戳 / 判决文件写全 / `--spec` 漏了给人话退 2 / 默认超时 ≥ 2 小时）；真机探针两条：`spawn_detached()` 起的 python 子进程「立刻活着 + 5 秒后输出已落在文件里」、`--card 002 --status` 读**真卡 002 的 1.1 MB log** 报出「322 行 / 工具调用 111 次 / 碰过文件 21 个 / 工具报错 0 次」并如实说心跳与判决「还没有」（那一轮早于这两个功能，不假装有）。**边界（如实写）**：`--detach` 之后看门狗是**那个脱离进程自己带着的** —— 它被系统杀掉（重启 / 休眠断电）就没人盯了，只能靠 `--status` 看「心跳停在几点」；想让看门狗也独立于派活进程是**之后的候选**（还没做）。`--status` 只报「它在动、动到哪了」，不判断内容对不对。状态文件都在 `gates/diag/`（gitignored），**证据不进仓库**。**没动的**：看门狗 / 心跳 / 回合上限的判据与阈值一个字没改；续跑判定仍是「只对被打断续、不对空转续」；模型与 `--autocompact 1m` 默认没改。 ★ **2026-09-26 更正（T-G92）**：本条的 `--detach` 分支原来排在四道前置检查**之前** —— 父进程退 0 不表示检查过了、没过也不写判决（`--status` 只会说「判决：还没有」）。已改正为**父进程先查、全过才扔**（没过退 2 + 写 `wb-<卡>.verdict.txt`），子进程补 `--no-preflight`；另外子进程 argv 原来**少了脚本路径**（真机证据 (b) 逮到：`--detach` 其实从没真跑起来过），也已修。详见 `复盘/detach前置检查-T-G92.md`。"


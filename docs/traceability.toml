gaps = "**它收的是 T-G33 复盘里那句如实记下的残留**：「验完之后若再出数据库级错误，任务仍会留下 —— 两个 core 函数各自 `commit`，**没有跨函数事务**」。现象是：`POST /api/tasks` 先 `create_task`（自己提交）再 `set_task_groups`（又自己提交），**第二笔一崩**，客户端看到报错、库里却躺着一条没有分组的任务，重试就两条。**做法（缝开在代理层，不动 core）**：HTTP 那条路上的 `conn` 是 `_ThreadLocalConn` 代理（T-G18 并发修复留下的），于是让它的 `commit()` 在 `unit_of_work()` 里**只记账**，真提交发生在退出那一刻（成功一次 `commit`、抛异常一次 `rollback`）—— SQLite 的隐式事务从第一次写就开着，所以这几笔写天然是一件事；**core 里 60 多个 `commit()` 一个都没改**，也没引框架。**★ 先量再改**：写了个 AST 扫描（判据搬进了 `tests/test_unit_of_work.py`）数「一个处理函数里调了几个会自己 commit 的 core 函数」，实测**只有 6 个**：3 个包事务（`create_task` / `update_task` / `put_reminder_settings`）、3 个进**带理由的豁免清单**（`create_memo` / `delete_memo` / `ledger_output` —— 第二笔是 `vault.try_export` 导出一份 md，是**派生**产物且必须在提交之后）。**清单进了 pytest**：多一个少一个都红、豁免理由短于 10 字也红、还有一条「扫描器真的看得到东西」的反空转判据 —— 以后新写一个多写处理函数会被当场拦下。**★ 边界（不假装）**：`unit_of_work` 只认代理，真 `sqlite3.Connection` 的 `commit` 拦不住，拿它来调**直接 `TypeError`** 并说清原因（与 `db.raw_conn()` 同一条规矩：不猜、不静默降级）；事务盖的是**数据库行**、不盖系统副作用（`PUT /api/settings/reminder` 还会注册 Windows 计划任务 —— 包事务仍然更好：两笔设置行现在同生共死，但「计划任务 vs 设置行」仍有一个极小窗口，如实记着）；`executescript()` 会先隐式提交（无调用点）；段内某笔失败被上层吞掉再继续时不会单独撤（没有 savepoint）。**验收**：`tests/test_unit_of_work.py` **11 条** —— 机制层（段里**另一条连接看不到**、退出才看得见）/ 回滚层（整段撤 + 嵌套只提交一次）/ 接口层（让第二笔**真抛** `sqlite3.OperationalError` → 断言第一笔**确实跑过**且库里空的；改任务那条连标题一起撤；对照组正常路径两笔都在）/ 拒绝层（真 Connection → TypeError）/ 清单层 3 条 / 并发层 1 条。**踩到的坑**：★★ **延迟标记第一版挂在实例上**（`self._defer`），可这个代理是**全进程一个**、所有线程共用 —— 线程 A 进事务后 B 的 `commit()` 也被推迟，而 A 退出时提交的是 A 自己的连接，B 那笔写于是**永远没人提交**（并发下 `database is locked`）；**抓到它的是 `tests/test_concurrency.py`**（T-G18 留下的老守卫），修法是标记住进 `threading.local()` + 补一条确定性最小复现。★ 另一条：第一版扫描器只解析包的 `__init__.py`，而 `timeflow.core.tasks` 是**包**（`set_task_groups` 真身在 `groups.py`）→ 量出来的清单是**假的**（只有 1 条）；扫包必须扫整棵树，并配一条「扫描器真看得到」的测试盯着它（与 T-G40/T-G69 同一族教训：判据自己也会撒谎）。**没动的**：core、界面、路由（一条都没加）、45 份黄金。**工程债三条至此全清**（`T-G40 §六` 签名 T-G69 / 非文字对比度 3.0 表 T-G70 / `T-G33` 残留 T-G71）。"


[entries."T-AG568"]
id = "T-AG568"
title = "按请求算结局，不按轮"
group = "ENGINEERING"
status = "done"
owner = "controller"
evidence = [
  "file:复盘/卡/卡A355-按请求算结局.md",
  "file:tools/pool/outcomes.py",

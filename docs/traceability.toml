gaps = "**是棘轮不是硬门**：亮色现状有 **18 条**不达 AA（全表 42 条组合，暗色全过），一接硬门就永远红、而本项目铁律是「门禁不过不许提交」；所以如实登记进 `tools/contrast_baseline.toml`（三条根因、每条带 why/fix），门只拦**没登记过的新欠账**与**比登记值更差**。**没做的**：① 18 条一条没修（改令牌=改视觉，视觉线用户还没开）；② 没覆盖 hover/focus/disabled/选中态，也没覆盖**非文字图形**（图标 vs 底、图表线条、边框 —— WCAG 对非文字要 3.0）；③ 没有渲染基线（沙箱无浏览器）—— 但对比度是纯计算，不需要浏览器。**收紧三步**写在复盘 §7：视觉线修完 → 逐条删登记行 → 加 `--strict`（现在就能跑，只会告诉你还剩 18 条）。**顺手修的缺陷**：`.toast` 的 `--toast-bg` 全项目从没定义过 → 暗色下底与字同为 `#e6edf7`（**1.0:1，字完全看不见**，而 toast 被调用 161 处）；补上该令牌（亮色 = 原值逐字节相同、暗色用 `--surface-2`）并去掉回退写法。这是**缺陷不是欠账**，所以不进登记表。★ **2026-09-24（T-G42）**：这里写的「收紧三步」**走完了** —— 登记表清空、`run_gates.py` 换成 `--strict`，棘轮变成硬门（组合 42 → 30 条；撤掉的三行是「搭配不存在了」而不是「改好了」，理由留在 `contrast_baseline.toml`）。`--check` 那个字面已经不在命令里了，所以本条的断言指针改成不带旗标的那半句。"


gaps = "行为流层继续搬第三批：**⑰ 跨端同步（自导自）/ ㉓ 团队视角 / ㉕ 学校通知合作接口**。合计 **15 条流 / 149 项断言**（两遍指纹一致，实测 285s）。**⑰**：不看界面看**文件系统**（从 `TEMP/timeflow_fresh_*/sync-*.json` 里找出刚写出的包）+ 把路径**真打字**粘回去 → 后端 400 原话「自己导给自己没有意义；请在另一台机器导出」被界面透出来 → 预览是纯读（「上次导入：还没导入过」照旧）；顺带验了 ㉒ 的第一半（「同时应用对方的删除」默认不勾 + 旁边写着默认不删的理由）。**㉓**：默认管理者视角按执行者分组、**不给**「我是谁」输入框 → 切执行者视角后不填名字**什么都看不到**（工具不猜你是谁）→ 填对名字只看到分给这个人的 → 换个名字一件都没有（不制造假归因）→ 视角与名字活过刷新。**㉕**：默认关且原话叫「**没接入**」+ 点了「默认收严」这条口径 → 关着投递 403 → 打开后投递 200 → ★ **同一条再投 = 去重**（`duplicate=true`，收件箱仍 1 条）→ 收件箱看得见 → 点「转成任务」→ ★ 任务备注写着「来自学校通知：教务处」+ 原文链接（可回溯）→ 关回去后新投递又 403 而**已有那条照样能处理**。★ **这一批真正的教训（仪器自己会静默吃掉字符）**：⑰ 第一版红了、提示条看着是空的，兜了两圈才看清 —— ① **失败信息骗了我**：`waitToast` 失败时回的是「最后一次采样」，而提示条 2.2 秒后就自己消失，于是「它说了别的话」被伪装成「它什么都没说」（修：回最后一句非空的）；② **真因是我的打字实现**：给每个字符都填 `windowsVirtualKeyCode = charCode`，而 `.` 的 charCode **46 = VK_DELETE** —— Chromium 照虚拟键码当删除键处理，**路径里的点被静默吃掉**（`…205321.json` → `…205321json`）。字母数字的 VK 码与 ASCII 一致所以一直没暴露。修：**标点一律只发 `char` 事件**，只有字母数字补虚拟键码。**这类缺陷最坏 —— 它会把真的能用的功能判成坏的（这次就是）**。同类两条：`attr(sel,'value')` 拿到的是 attribute 不是用户打进去的值（打字改的是 property，新增 `t.value()`）；以及按记忆写「未接入」而原话是「**没**接入」（断言当场拦住）。**成本**：单跑这一层 ≈215s → **≈285s**，整轮门禁 ≈400s → **≈480s**；三条出路（继续加 / 压每条流的启动开销 / 只跑被改动波及的那几条）留在复盘 §3。"



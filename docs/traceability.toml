gaps = "**为什么有这张卡**：第二次同类接缝 —— 卡 022（5f51806）改 `_write_myday_rank` 签名（新增 keyword-only `bump_version`）vs T-G126（803be3a）在另一文件用 `monkeypatch.setattr` 桩替换同一函数（老四参），文件不重叠 → 白名单拦不住；集成时门禁才红（500 != 409）。**做了什么**：三类判据在 `tools/seam_check.py` 的 `extract_symbols()`（① 定义 = 改动行的 def/class；② 桩替换对象 = setattr/monkeypatch.setattr/patch 的目标名；③ 形参 = 打开的 def 参数表里的参数行，且把所在签名函数名记为「签名改动」—— def 行常是上下文行，不归属会漏报）；退出码：有交集=1 / 无交集=0 / 用法错=2；输出三段（每卡符号、交集、无交集）。**真历史读数**：`--card 022=5f51806 --card 126=803be3a` → `[交集] ★ _write_myday_rank ← 出现在 022、126 → 必须串行，或后一张基于前一张重做`，exit=1。**零误报读数**：042×044（两卡均「允许路径内没有新增/删除代码行」→ 无交集）与 043×046（两侧各有定义符号但无共有 → 无交集），均 exit=0。**反证（突变）**：去掉「被桩替换」判据 → 钉子①变 `[交集] 无交集`（exit=0，真接缝漏报）→ 还原（git diff 为空）→ exit=1 报出 + pytest 5 passed + ruff 全过。**边界**：形参只取参数行、函数体局部变量与字符串里的词不算；交集只按名字（不同模块同名函数会撞，假阳性方向）；跨 hunk 丢开签名状态、def 行内联参数不抽（假阴性方向）——两头都按「宁可少、不可滥」接受；下标/属性链形参取不出名即跳过；只读工具（只跑 git show，不写任何仓库文件）；没跑全量门禁（本卡轻门 = ruff + 本文件 pytest，全量由主控集成时跑）。"


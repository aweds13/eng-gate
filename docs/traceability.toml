[entries."T-G38"]
id = "T-G38"
title = "最小验证法则（用户交代「别在验证上花那么多时间」）：行为流层默认一遍（--twice 按需）+ 复验既有界面抓到的一处勾选框缺陷与颜色归一缺口"
group = "PROCESS"
status = "done"
evidence = [
  "text:tools/ui_flow_check.mjs::★ 最小验证法则",
  "text:tools/ui_flow_check.mjs::只跑了一遍（最小验证法则）",
  "text:tests/test_ui_flow_check.py::这条流**默认只跑一遍**",
  "text:src/web/app.css::复选框在 `.field` 里还要躲**第二刀**",
  "text:tools/render_check.mjs::这里一并归一",
  "file:gates/render/LAST_UPDATE.md",
]
gaps = "**用户 2026-09-23 交代：「我不想你花那么多时间在这个验证的地方，能不能遵循最小验证法则？」** 于是这条线**刹车**，定下并落地三条：① **一条判据只放一处**（能在 pytest 断言的，不另开新门、不另写工具）；② **门禁只跑「改动可能伤到」的东西** —— 行为流层**默认只跑一遍**，两遍指纹自检改成 `--twice` 按需（流失败只是红一下、**不会污染持久数据**；黄金层那边两遍自检**继续常开**，因为一份抖出来的清单会被写进黄金，那是真污染 —— 两处取舍不同就按不同对待）；③ **不为「全覆盖」而全覆盖**：这条线**不再扩**，要加一条流得先说清它替掉哪条人工项；时间预算**一遍 ≲3 分钟**，超了就砍条数。**门禁因此从 ≈545s 回到 ≈370s**（行为流层 342s → ~175s）。**顺带复验既有界面**（用户问「已经有的代码还要复验吗？我不知道」→ 答：要，但只做便宜的那一种）：把 42 份黄金**当数据**读一遍（零额外耗时），扫出并在**同一次提交**里修掉一处真缺陷 —— **离线页「放进今天」的勾选框被画成 123×13**（`.field` 是 flex 列、默认 `align-items: stretch` 把勾选框横向拉满；T-G32 只改了文本框那套样式，**同一个毛病在离线页留了下来**），修法一行 `align-self: flex-start`；另修掉采集器自己的一个缺口：`color-mix()` 的底色 Chromium 回的是 `color(srgb r g b / a)`，原来只认 `rgb()` → **15 行原样存进黄金**（人读不懂、换浏览器版本字符串会变），现在归一成 hex。**扫出来的「干净」也算结论**：既有界面上字面的 `**` = 0、比 20px 还小的按钮 = 0。**没做的**（刻意）：全量不变量套件（那是往我自己感兴趣的方向加码，与这次交代相反）；焦点环（视觉改动，等用户）。"



[entries."T-G37"]
id = "T-G37"
title = "人工验收搬家·第四批（SR-NF1 / N30）：㉗ 手机离线只读区（断网刷新真的落得进）/ ⑮ Obsidian 红线 搬给行为流层（17 条流 / 172 项断言）"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/人工验收搬家-第四批-T-G37.md",
  "text:复盘/人工验收搬家-第四批-T-G37.md::## §2 这一批的坑",
  "text:复盘/人工验收搬家-第四批-T-G37.md::把「我调了一个看起来对的 API」当成「事情发生了」",
  "text:复盘/人工验收搬家-第四批-T-G37.md::点得到」这件事在手机档是**真的挑入口**的",
  "text:tools/ui_flow_check.mjs::壳已经装进 Service Worker",
  "text:tools/ui_flow_check.mjs::只读区里一个按钮/动作都没有",
  "text:tools/ui_flow_check.mjs::导出目录不能放在 Obsidian 的 Vault 里",
  "text:tools/ui_flow_check.mjs::别拿 `type(sel, '')` 当清空",
  "text:tools/ui_flow_check.mjs::焦点确实在输入框里",
]
gaps = "行为流层继续搬第四批：**㉗ 手机离线只读区**（手机档宽度；联网先逛 今日/全部任务/复习 → 确认**壳已被 Service Worker 接管** → 断网 → ★ **刷新真的落进「离线记」**（壳从缓存里拿出来）→ 只读区四段都在（该提醒了/今天该复习/逾期/今日摘要）+ 如实写着「上次联网时看到的样子」「只标出来、不发系统通知」+ ★ **反证：只读区里一个 `data-action` 都没有**）；**⑮ Obsidian 红线**（存 Vault 需要**真的存在**的根目录 → ★ 把导出目录填成 Vault 子目录 → 400 原话「导出目录不能放在 Obsidian 的 Vault 里」被界面透出 → ★ **拦下之后后端设置没被偷偷改掉**）。合计 **17 条流 / 172 项断言**（两遍指纹一致，实测 342s）。★ **这一批的两个发现**：① **「点得到」在手机档是真的挑入口的** —— 手机上左栏 `display:none`、底栏只 7 个入口，复习/学业/备忘录要从**设置页那一节**进；第一版直接在手机档找 `[data-view=\"review\"]`，命中测试当场报「元素是 0×0，点不到」（渲染层看不出来：它拿 `offsetParent` 兜底，找不到可见的就退回隐藏元素再 `.click()` —— 那是「能渲染」不是「用户点得到」）。② **`type(sel,'')` 不是清空**：它一个字符都不打、原值原样留着，于是「关掉跳转」静默没生效 → 新增 `t.clear()`（真点 → Ctrl+A → 真按退格）。这与「`attr('value')` 不等于用户打进去的值」同族：**把「我调了一个看起来对的 API」当成「事情发生了」——凡是我做了什么与世界变成什么样之间隔着一层，就要用世界的样子去断言**。**故意不验的**：⑮ 里「点一下真的跳进 Obsidian」那一下会真的把 Obsidian 拉起来，只有人在装了它的机器上点一次才知道（如实写在复盘 §1）。**成本**：单跑这一层 ≈285s → **≈342s**，整轮门禁 ≈480s → **≈545s**；三条出路里我倾向「压每条流的启动开销」（每条起步 ≈3–4s，十几条就是 60~90s 纯等待），但那是**改共用底座**（渲染层同一份），得单独一张卡、单独验 —— **先记账，不在这张卡里顺手改**。"


[entries."T-G36"]
id = "T-G36"
title = "人工验收搬家·第三批（SR-NF1 / N30）：⑰ 跨端同步（自导自）/ ㉓ 团队视角 / ㉕ 学校通知合作接口 搬给行为流层（15 条流 / 149 项断言）"
group = "PROCESS"
status = "done"
evidence = [
  "file:复盘/人工验收搬家-第三批-T-G36.md",
  "text:复盘/人工验收搬家-第三批-T-G36.md::## §2 ★ 这一批真正的教训：仪器自己会**静默**吃掉字符",
  "text:复盘/人工验收搬家-第三批-T-G36.md::46，正好是 `VK_DELETE`",
  "text:复盘/人工验收搬家-第三批-T-G36.md::失败信息把「它说了别的话」伪装成了「它什么都没说」",
  "text:tools/tf_browser.mjs::标点**只发 `char` 事件**",
  "text:tools/ui_flow_check.mjs::失败时回的是**最后一句非空的**提示条",
  "text:tools/ui_flow_check.mjs::读的是 property，不是 attribute",
  "text:tools/ui_flow_check.mjs::磁盘上真的多了一个同步包",
  "text:tools/ui_flow_check.mjs::没填名字时明说",
  "text:tools/ui_flow_check.mjs::去重：同一来源同一条只留一行",
]
gaps = "行为流层继续搬第三批：**⑰ 跨端同步（自导自）/ ㉓ 团队视角 / ㉕ 学校通知合作接口**。合计 **15 条流 / 149 项断言**（两遍指纹一致，实测 285s）。**⑰**：不看界面看**文件系统**（从 `TEMP/timeflow_fresh_*/sync-*.json` 里找出刚写出的包）+ 把路径**真打字**粘回去 → 后端 400 原话「自己导给自己没有意义；请在另一台机器导出」被界面透出来 → 预览是纯读（「上次导入：还没导入过」照旧）；顺带验了 ㉒ 的第一半（「同时应用对方的删除」默认不勾 + 旁边写着默认不删的理由）。**㉓**：默认管理者视角按执行者分组、**不给**「我是谁」输入框 → 切执行者视角后不填名字**什么都看不到**（工具不猜你是谁）→ 填对名字只看到分给这个人的 → 换个名字一件都没有（不制造假归因）→ 视角与名字活过刷新。**㉕**：默认关且原话叫「**没接入**」+ 点了「默认收严」这条口径 → 关着投递 403 → 打开后投递 200 → ★ **同一条再投 = 去重**（`duplicate=true`，收件箱仍 1 条）→ 收件箱看得见 → 点「转成任务」→ ★ 任务备注写着「来自学校通知：教务处」+ 原文链接（可回溯）→ 关回去后新投递又 403 而**已有那条照样能处理**。★ **这一批真正的教训（仪器自己会静默吃掉字符）**：⑰ 第一版红了、提示条看着是空的，兜了两圈才看清 —— ① **失败信息骗了我**：`waitToast` 失败时回的是「最后一次采样」，而提示条 2.2 秒后就自己消失，于是「它说了别的话」被伪装成「它什么都没说」（修：回最后一句非空的）；② **真因是我的打字实现**：给每个字符都填 `windowsVirtualKeyCode = charCode`，而 `.` 的 charCode **46 = VK_DELETE** —— Chromium 照虚拟键码当删除键处理，**路径里的点被静默吃掉**（`…205321.json` → `…205321json`）。字母数字的 VK 码与 ASCII 一致所以一直没暴露。修：**标点一律只发 `char` 事件**，只有字母数字补虚拟键码。**这类缺陷最坏 —— 它会把真的能用的功能判成坏的（这次就是）**。同类两条：`attr(sel,'value')` 拿到的是 attribute 不是用户打进去的值（打字改的是 property，新增 `t.value()`）；以及按记忆写「未接入」而原话是「**没**接入」（断言当场拦住）。**成本**：单跑这一层 ≈215s → **≈285s**，整轮门禁 ≈400s → **≈480s**；三条出路（继续加 / 压每条流的启动开销 / 只跑被改动波及的那几条）留在复盘 §3。"



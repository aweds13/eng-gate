[entries."T-G122"]
id = "T-G122"
title = "派活器规矩收口：模型白名单改 ★★**有序白名单 + 默认拒绝**（用户下令锁死）+ 429 三拍（等 → 按序换 → 全挂即停）+ 三条硬伤（`--detach` 不真独立 / `subtype=success` ≠ 干完 / **原窗口发消息是通的 —— 伪证据纠正**）"
group = "OUTSOURCE"
status = "done"
evidence = [
  "text:复盘/外包-卡表与规矩.md::有序白名单 + **默认拒绝**",
  "text:复盘/外包-卡表与规矩.md::黑名单锁死吧，就是只有白名单里面的模型",
  "text:复盘/外包-卡表与规矩.md::先等一下，然后稍等一下再探别的",
  "text:复盘/外包-卡表与规矩.md::在 DSH 下**不是真独立**",
  "text:复盘/外包-卡表与规矩.md::在原窗口发一条新消息",
  "text:docs/traceability.toml::续跑核对「规格指纹」",
]
gaps = "**为什么有这一条**（T-G122，用户 2026-09-26 两次直接命令 + 本轮真撞）：① 用户把模型规矩**收紧成锁死** —— 原话「黑名单锁死吧，就是只有白名单里面的模型，名字，带模型的名字，你才能调用」（此前只是「未经我允许不准给 kimi，给 glm5.3 flash」）；② 配额烧干时用户给了**三拍口径**：「你先等一下，然后稍等一下再探别的。然后都有问题的话，就直接把任务停下来」；③ 同一天又撞到两次「程序判死判活与事实不符」，逐条留痕。**做了什么**：① `复盘/外包-卡表与规矩.md` §19.1 从「只准一个模型」改成 ★★**有序白名单 + 默认拒绝**（表外模型 → **拒单**：退出码 2、不起进程、不建 log、不改树；默认模型 = 白名单第 1 项；`--resume`/`--retry`/`--detach` **全过闸**且续跑不许换模型；只有用户能改名单）；② §19.2 从「不换模型、停下等」改成**三拍**（等 300 秒 → 按序换白名单里的下一个 → **全挂则退出码 7 停下**并报每个模型的重置时间；429 **不许**走 `--retry`；★ 429 **长得像成功**：`subtype=error_during_execution` + 空回话 + **退出码 0** → 必须读 `result.errors`）；③ 新增 **§20 三条硬伤**：**20.1** `--detach` 在 DSH 下**不是真独立**（卡 024 跑到第 14 分钟、心跳正常、27 次调用，17:01:30 **半句截断** —— 无判决、无会话文件、工作区零改动，时刻与 harness「Windows Job runner exited with exit code 1」吻合 → 子进程仍在同一个 Job object 里，异常死会**连坐**）；**20.2** `subtype=success` + 退出码 0 **≠ 卡干完了**（卡 022 连续两轮如此却**一行代码没动** —— 它按规格**正确地停下报主控**，判决却显示「正常收工」）；**20.3** ★★ **原窗口发消息是通的（伪证据纠正）**：`--resume <同一 id> -p 「<新话>」` 实测（`gates/diag/probe_resume.py`）回话就是新话（BETA）、会话 id 不变 → **在原窗口更新指令成立**；022 两轮白跑的真因是**它收到了却没照做**（只跑 git status/log/diff，没 Read 规格）；★ 我当时拿「日志里搜不到提示词」当「没收到」是**伪证据**（提示词从来不写进 stream-json 日志，新会话那轮也是 0 次命中）；正确处置：**在原窗口发消息 + 硬要求先 Read 规格路径 + 用日志核对它真读了**）。**同时落到卡上**：卡 029（T-G114）追加 §2.4（白名单硬闸门）/ §2.5（429 三拍）/ §2.6（token 落账 + 防烧预算）/ §2.7（**续跑核对「规格指纹」**，变了就拒、退出码 8）四节。**实测**：022 先用**新开会话**重派（日志证实它真 Read 了规格）；口径按探针更正为**优先在原窗口发消息**；024 被连带杀后**从零重派**。★ **连带动作（诚实记）**：§19 改写把 `T-G120` / `T-G121` 的 **3 条 `text:` 证据指针**指向的字句改没了 → `audit_progress` 先报 **3 项 FAIL**（★ **审计拦下我自己**）；已把 3 条指针**同步改到新句**（旧句可从 git 历史取回）。★ **同日追加（用户再令）**：白名单从「一项」变成**两项** —— ① `deepseek-v4.1-flash`（★ **默认，今后的任务都用它**）、② `glm-5.3-flash`（★ **只给已经在跑的 022 / 024 收尾，不再派新卡**）；口径：**换模型只影响新派的卡，已经在跑的卡不许中途换**（否则白扔它已烧掉的上下文）。**边界（如实写）**：① §19/§20 是**规矩文本**，代码里的硬闸门要等卡 029 集成后才真生效（在那之前仍靠主控自觉）；② §20.1 的「Job object 连坐」是**时间吻合 + 现象一致**的推断，**没有**直接读 Job 对象验证；③ 卡 029 的四节**尚未实现**。**没动的**：`src/**`、`tools/**`、`tests/**` 一个字节没碰；三个外来未跟踪文件。"


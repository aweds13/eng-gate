gaps = "**为什么有这张卡**（T-G99，= 外包卡 010）：并发现在是**手工**的 —— 规划者脑子里记着「哪张卡碰哪些文件、哪棵树空着」，靠记性避免冲突，卡数一多必出事。本卡把这套规则做成能跑的调度器。**架构（角色/时序/共享文件怎么不冲突）**：角色 = 规划者 P（主控）/ 作者 W（工人 ×N）/ 集成者 I（×1，串行收口）/ 复核者 R（只读，高风险卡）/ 盘点者 S（只读）；时序 = T0 写卡建树登记 → T1 并行干活 → T2 各提交 → T3 机械复核 → T4 串行集成 → T5 audit 收尾；共享文件（台账/changelog/两张交接文档/`gates/last.json`+`reuse.json` 六个，写死在 `PROTECTED_FILES`）**作者一律不碰**，台账由作者写片段、集成者串行合并；改 `src/**` 的卡跑不了全量门禁（`docs_sync_precheck` 读工作区改动要求同笔改台账）→ 作者只跑轻门。**怎么算批次**：`topo_layers()` 按 `depends` 拓扑分层（层号取**最长路径**，菱形成环都覆盖）→ 逐层 `greedy_pack()`（每批 ≤ `--concurrency`，同批两两 `files` 不相交、树不重复；冲突域是硬约束，上限是第二约束）→ `plan` 渲染成批次；`check` 只校验（六类拒单：files 相交 / 含受保护文件 / 同树 / depends 指向不存在的卡 / 成环 / files 为空）。**反证（先红后绿）**：`tests/test_wb_plan.py` 先于实现写好，缺席时 pytest 收集中断（ModuleNotFoundError）；实现后 **41 passed**。★ 跑绿时测试自己逮到用例 bug（三张卡误用同一主树 → 树唯一约束掩盖了并发上限），改成不同树才测准。★ 突变检验（反空转）：把 `files_intersect` 打瞎成恒空 → 3 条用例当场红；把 `greedy_pack` 的同树约束改成 `if False:` → 1 条当场红；恢复后回 41 passed。**边界（如实写）**：① CLI 侧速率/账号并发上界**未探测**（卡 §2.3 #9 明说本卡不解决，只把 `--concurrency` 显式摆出来以便观测）；② `worktrees --execute` / `dispatch --execute` **没真跑过**（卡 §8 坑 1 明令别真建树别真派活），只覆盖命令拼装的纯函数测试；③ `check` 口径偏严 —— 见 复盘 §六（`depends` 链上两卡复用同树/同文件会被拒，顺序复用其实安全；这是我定的保守取舍，口径不合请指出）；④ `plan` 是确定性贪心、不是最优装箱；⑤ 不校验 `[base].reviewed` 是否真已复核、`.wt/` 是否已存在；⑥ 种子 007/008/009 的 spec 路径按命名惯例填（只 010 真存在）。**没动的**：`src/**`、`tools/wb_dispatch.py`（只读）、`tools/wb_dash.py`、`tools/wb_status.py`、`gates/**`、`docs/` 其它文件（含台账/changelog）、两张交接文档、`复盘/外包-卡表与规矩.md`、真实库/备份目录。"



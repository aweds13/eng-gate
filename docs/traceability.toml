[entries."T-G52"]
id = "T-G52"
title = "流程优化（用户 2026-09-24 问「我们的流程可以继续优化吗」）：① 报错说清在哪一行（TOML 预检 + 约定层报行号 + 交接数字一键刷）② 教训只写一处 ③ 前端热表；另把「一次门禁覆盖多个提交」「边跑边写」定为习惯"
group = "PROCESS"
status = "done"
evidence = [
  "file:scripts/check_toml.py",
  "file:tools/sync_counts.py",
  "file:tools/ui_hotmap.py",
  "file:复盘/前端热表.md",
  "text:复盘/视觉线地图.md::## 6.5 教训只写一处",
  "text:scripts/run_gates.py::⓪ TOML 语法预检",
  "text:scripts/check_layers.py::未标注来源 N",
  "test:test_process_tools.py",
]
gaps = "**动机是量出来的**（本会话的时间账，逐项估）：改代码 ~35 分钟、机器跑门禁 ~25 分钟、文档仪式 ~30 分钟、**我自己闯的祸 ~60 分钟**、一致性返工 ~15 分钟。也就是说「活」与「税」各占一半，而税里最大的一块**根本不该发生**。**本轮做的**：① **报错说清在哪一行** —— `scripts/check_toml.py`（0.1 秒预检，说清第几行第几列 + 常见原因，`run_gates.py` 开跑前自动跑一次，失败就**不开门**）、`check_layers.py` 报约定层那几条的**行号+原文**（原来只说「有 1 条未标注」+ 前 40 字）、`tools/sync_counts.py` 一键刷交接文档里的台账分布（`--check` 可当门用，判据与 audit **同一正则**）。② **教训只写一处**（规矩进地图 §6.5）：教训进地图 §6 的陷阱表，卡的 `gaps` 只写这张卡特有的事实 + 给指针 —— 本条 gaps 就是第一个按新规矩写的。③ **前端热表** `tools/ui_hotmap.py` → `复盘/前端热表.md`（视图 → render 函数 → 行区间 → 说明文本/空态/动作处数；**生成的，不手写**，所以不会烂）。④ 两条**习惯**（0 成本、立即生效）：**一次门禁可以覆盖多个提交**（今天 T-G49/T-G50/台账收口三个提交就是搭同一轮绿 —— 归属感与摊薄可以同时要）、**门禁跑起来时我同时写文档**（别干等）。**顺带第 9 次踩老坑**：我用 `Get-Content | Set-Content` 想过一个词，把刚写的 `ui_hotmap.py` **压成了一行**（陷阱表第 2 条早有记载）—— 已重写，并把这条在表里写得更硬（连「只替换一个词」也不行）。**没做（用户本轮没批，各自要改门禁工具 ~1–2 小时）**：`render` 单遍 + **只对「与黄金不同」的视图**补第二遍自检（107s → ~55s，且不弱化：匹配已入库的黄金是更强的证据）；`ui_flow` 按流隔离并行（178s → ~60s，且从结构上消掉 T-G35 那类顺序耦合假结果）；**门禁瘦身用数据说话**（统计最近 30 张卡里每道门的真实捕获数，长期 0 捕获的降级）。**预期收益**：一张视觉卡从 ~90–120 分钟 → **~50 分钟**；按机制打包（L2：一次门禁覆盖 C + 步 3 + T-G46）后 **~20–25 分钟/机制**。"


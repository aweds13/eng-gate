gaps = "**来路**：`tools/wb_brief.py` 生成的**开工切片**有两处**误报**，2026-10-02 **三个工人各自独立**报了同一件事（卡 108 / 109 / 110），每张卡白花一轮解释：① 切片 §四 印着「卡里没找到白名单小节 → **停工报主控**」，而本套卡的规格本来就是「**逐文件点名范围 + 禁区**」 ⇒ 工人读完判定「不该停工」，还得**专门写一条解释**；② 切片的「现状」段给的是**主仓**的工作区状态（「被跟踪改动 1 个 + 外来未跟踪 4 个」），而工人 `cd` 进的是**卡树**（干净）⇒ 工人报「文档和实际不符」。**做法**：① `section_whitelist()` —— 先把「白名单」「禁区」两节都当**范围小节**；若都没有，再看规格里有没有**逐一点名的文件 / 路径**（正则）；**两个都没有**才印那句停工话（正例：卡 112 自己的规格印出「范围以规格里逐一点名的文件 / 路径为准」；反例：既无小节又无点名 ⇒ 仍印停工话）；② `section_state(cwd=「」)` —— 给了 `--cwd` 就**两棵树都印、各自标名**（`- 卡树 <路径>：HEAD… · 分支…` + `- 卡树 工作区：…` + `- 主仓 <路径>：…` + `- 主仓 工作区：…`，末尾「台账分布（主仓）」），`_git()` 加 `where=` 参数；**不给 `--cwd` ⇒ 逐字不变**（用 `git show HEAD:tools/wb_brief.py` 取旧版、同一输入各生成一份做 diff：**段函数 diff 为空**、整份切片（卡 008）**逐字一致**（3761 字节）、卡 112 那份的 diff **只落在 §四**）。**验收（工人自报，主控逐条核）**：① 四条判据都有**正例 + 反例**（停工话 出现/不出现；两棵树行 都有/都没有）；② 新增 `tests/test_wb_brief.py`（**5 用例**，桩 `_git` / `_first_line` / `_checkpoint_blocks`，**一个字节都不写进真 `gates/diag/`**）；③ 全量 `pytest -n 4` → **1780 passed**（= 基线 **1775** + 本卡 5），覆盖率 **93.71%**（门 70%）；`tests/test_wb_dispatch.py` **133 passed**；`ruff check src tests scripts tools examples harness` → `All checks passed!`；④ 覆盖的 5 张卡切片字节 **3490~3892 ≤ 6144**。**★ 主控补修（两处，都带钉子）**：① ★ 工人如实报的**既有缺陷**：切片有「**6144 字节硬上限**」，而 `_truncate()` 只从限额里扣 **12** 字节，后缀 `…(已截断)` 其实是 **14** 字节 ⇒ 截断后最多**超 2**；调用点截断完还补一个 `\\n`（再 +1）⇒ 全量 126 张卡里最长那份 = **6146**（超上限 2，改动前后同值）。**已修**：按**后缀真实字节数**扣 + 调用点用 `上限 - 1`（把那个 `\\n` 也算进预算），并补 **2 条钉子**（后缀字节数 = 14 且任何输入都不超；调用点预算含尾换行）—— 实测 `limit=6144` 时截断结果 **6143** ≤ 6144、`limit=40` 时 **38**；本卡切片测试 7 passed（工人 5 + 主控 2）。② ★ 主控**自己在补账时踩到并当场改掉**：本仓 `core.autocrlf=true` ⇒ `checkout` 会把 `复盘/门禁改进清单.md` 从 LF 变回 **CRLF**（卡 110 那个工人**警告过**这件事，这回被实测证实）⇒ 回填脚本改成「**行尾跟着文件当下走**」；真正的不变量是「**diff 只有那几行**」，不是某个绝对行尾。**★ 本笔另含两处补账（同一提交）**：① **回填 T-G205 / T-G206 / T-G208 的 9 个片段** —— B 方案「每笔落一个片段」对那三笔是**空的**（集成时 `--allow` 漏带，见口径坑 30；`sync_docs.py --check` **抓不到这种单向缺失**），内容早已在共享文档里 ⇒ 补进库**不改变汇总**（自验：汇总器空跑「无待汇总片段」、三个共享文档 sha256 **前 = 后**（`44284819099878b3` / `7cdf3a6efbb46ca2` / `9bbeb8243362b5cd`）、`--check` 从 `changelog.d=1` 变成 **`changelog.d=5, traceability.d=5, 交接.d=5`**）；② `复盘/口径坑.md` 追加 **29**（反引号里**裸的** `.md` 也算一条路径 —— 卡 110 第一次门禁就是被它弄红的）/ **30**（片段必须进提交）/ **31**（`taskkill` 输出是系统区域编码 —— 证据乱码），`复盘/门禁改进清单.md` 追加待做 **⑨ 门禁没有一条「封存树 vs 提交树」的对比**（今天这个片段缺陷就是从这道缝漏过去的）。 ③ ★ 主控在开并行集成前核对「内容有没有丢」时，**当场发现 B+A 的一个真实副作用**：两笔都往 `docs/changelog.md` 的**文件头**插节，`git` 的 ort 合并对「同一锚点新增的块」**不报冲突、直接拼接** ⇒ **后提交那笔的日期排到了上面**（实测：changelog 第 1 行是 `T-G207`（10-01）、第 16 行才是 `T-G208`（10-02）；台账尾部 `T-G206, T-G208, T-G207`）。**内容一条没丢**（339 条台账、四个台账号都在、`tomllib` 可读），坏的只是**次序**；而 `sync_docs.py --check` **不查次序** ⇒ 这条缝没人守。已记成 `复盘/口径坑.md` **第 32 条**（并给出两条出路：composer 按日期插入 / 门禁加一条日期非升序判据）。"

[entries."T-G210"]
id = "T-G210"
title = "pool_cancel 的证据别是乱码：taskkill 输出按系统区域编码解"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool_mcp.py",
  "file:tests/test_pool_mcp_write.py",
]
gaps = "**来路**：卡 111（T-G208）把 MCP 写面（`pool_dispatch` / `pool_cancel`）接上之后，**它只做了桩验**（卡里也禁止未提交即派活）—— 主控补做了它没做的那半：**真机 cancel 演练**（`gates/diag/_drill_cancel.py`，**零花费**：靶子是主控自己起的 `python -c sleep` 与 `ping`）。**演练结果**：功能**全对** —— 真靶子（`python.exe`，pid 19788）→ 登记租约 → 补 pid → `pool_cancel` 核对映像名 → 真杀 → 写 `wb-999.cancel.txt` → 放租约（`killed:true / released:true`、`tasklist` 复查「没有匹配任务」、活租约清空）；**反例**（靶子映像名 `PING.EXE`）**拒绝动手** + 印出人工命令、靶子**还活着**、租约**没动**。**但写出来的「证据」是乱码**：`结果：taskkill /F /T /PID 19788 | �ɹ�: ����ֹ PID 19788 (���� PID 22396 �ӽ���)�Ľ��̡�`。**根因**：`tools/pool_mcp.py::_kill`（与 `_image_name`）把 `taskkill` 的输出按 **UTF-8** 解，而它吐的是**系统区域编码**（这台 cp936）—— **T-G96 已经踩过、`tools/wb_dispatch.py::kill_tree` 已经修过**的同一条坑，新代码重犯。★ 教训一句话：**证据文件本身读不出来，等于没留证据**。**做法（只动「解码」这一处，别处一字不改）**：新增模块级 `_console_encoding()`（`locale.getencoding()` → 没有该属性退 `locale.getpreferredencoding(False)` → 再退 `「utf-8」`），`_image_name()` 与 `_kill()` 两处 `encoding=「utf-8」` 改用它，`errors=「replace」` **保持不变**；注释里点明**为什么不能用 `getpreferredencoding(False)`**（本仓一律 `python -X utf8` ⇒ 它会回 `utf-8`，等于没修 —— T-G96 的原话）与**出处**（`wb_dispatch.py::kill_tree`）。**验收（工人自报，主控逐条核）**：① 两条钉子 —— **结构性**（桩住 `pool_mcp.subprocess.run`，断言 `_image_name` / `_kill` 传下去的 `encoding` **动态等于** `locale.getencoding()` = cp936、`errors` 仍是 `「replace」`）+ **行为性**（桩按调用方给的 encoding 解 cp936 字节 ⇒ `_kill` 回话**无 `\\ufffd`** 且含「成功/已终止」；坏字节 `b「\\xff\\xfe\\xff」` ⇒ 只 `replace`、**不许抛**）；② `pytest tests/test_pool_mcp_write.py tests/test_pool_mcp.py --no-cov` → **34 passed**；`ruff check src tests scripts tools examples harness` → `All checks passed!`；③ **红/绿机理对照**：同一句 cp936 字节 `utf-8 解 → �ɹ�: …`（与卡里贴的乱码**逐字一致**）、`cp936 解 → 成功: 已终止 …`（人话）；④ ★ **真机演练复跑**（工人复跑主控那支脚本）：`.cancel.txt` 那句已是**人话** —— `结果：taskkill /F /T /PID 33080 | 成功: 已终止 PID 33080 (属于 PID 40380 子进程)的进程。`，反例仍**拒绝动手**、靶子还活着、租约还在。**★ 工人如实报的三条（主控裁定）**：① `gates/diag/_drill_cancel.py` **不在卡树里**（它在主仓 `gates/diag/`、未跟踪），且**硬编码主仓 ROOT + `sys.path.insert(0, 主仓/tools)`** ⇒ 在卡树里直跑，测的是**主仓那份未修的** `pool_mcp`；工人用「先把工作树的 `pool_mcp` / `pool.registry` 预 import 进 `sys.modules`、再 `exec` 该脚本（**脚本一个字没动**）」的办法让演练命中本卡修复，并在输出首行自证 wrapper 生效（`_console_encoding() = cp936`）⇒ **主控接受**，并**当场**修掉**我脚本的缺陷**：`_drill_cancel.py` 现在支持 `--tree`（不给 = 主仓；给了就从那棵树 import 代码、把证据也落在那棵树的 `gates/diag/`）；② 演练把 `wb-999.cancel.txt` 落在**主仓** `gates/diag/`（gitignore scratch）⇒ **接受**；③ §6：`_drill_cancel.py` 自己「tasklist 复查」那行也是 `encoding=「utf-8」` 直读 ⇒ **仍乱码**（**主控 scratch = 我的活**，已记待修）；`pool_mcp.py` 的 `_run` / `_spawn_worker` 同样 utf-8 直读，但它们消费的是 `wb_dispatch` / `gate_lock.py` 的 **UTF-8 stdout**（那两支都以 `-X utf8` 跑）⇒ 现状成立，**不属本卡**，将来真有工具吐区域编码再开卡。"

[entries."T-G211"]
id = "T-G211"
title = "main_tree_root 不许依赖当前目录（MCP 真机跑出来的 bug）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool/registry.py",
  "file:tests/test_pool_registry.py",
]
gaps = "**来路**：主控把 `mcp-pool` 注册进 `~/.dsh/profiles/desktop/cordis.patch.yml` 之后，**用注册时那条真命令**起了一次服务（miniconda python + `tools/pool_mcp.py`，`POOL_MCP_WRITE=1`）做端到端：`initialize` 正常、`tools/list` **8 个**、`lock_status` 真跑 —— 六个**只读**工具全对；但一调**写面**就现形：`pool_cancel：读登记失败：算不出主工作树：`git rev-parse --git-common-dir` 没回路径`。**根因**：`tools/pool/registry.py::main_tree_root()` 跑 git 时**没给 `cwd=`** ⇒ 用的是**进程当前目录**；而 DSH 起 MCP 子进程时 cwd **在仓库外** ⇒ 算不出主工作树（只读那六个的 `ROOT` 从**脚本路径**推导，所以**只有写面** `pool_dispatch` / `pool_cancel` 中招）。★ **为什么卡 108 / 111 的测试没抓到**：那些测试**全都在仓库里跑**（cwd 就是仓库），这条依赖一直没暴露 —— 又一次「**桩验过了 ≠ 真机能用**」。**做法**：给那次 `subprocess.run` 加 `cwd=str(tree_root) if tree_root.is_dir() else None`（`tree_root = Path(__file__).resolve().parents[2]`，即 `tools/pool/registry.py` 的上三级）+ 一句注释（「服务可能被别的程序从任意 cwd 拉起」）；**卡树语义不变**（卡树里 `parents[2]` = 卡树、它也是 git 工作树 ⇒ `--git-common-dir` 照回**主仓**的 `.git` ⇒ 父目录仍是主工作树，正是卡 108 设计的那条语义）。**顺带审计**：`tools/pool/**` 与 `tools/pool_mcp.py` 里**所有** `subprocess.run` 的 `cwd=` 逐个过了一遍 —— `registry.py:242 read_lock_body` 有；`jobs.py:281`（`render_timeline` 的 git）是**可选 cwd 的既定设计**（不传 = 继承进程 cwd，是 `wb_status` CLI 的默认口径，且 `pool_mcp` 的调用处都显式传了 `diag`）；`pool_mcp.py:361 _run`（lock_status）有；`pool_mcp.py:660 _spawn_worker` 有；`pool_mcp.py:700/715 _image_name` / `_kill`（`tasklist` / `taskkill`）**按 PID 查/杀本机进程表、与 cwd 无关** ⇒ **漏网的只有 `registry` 那一处**。**验收（工人自报，主控逐条核）**：① **单元钉子**（`monkeypatch.chdir(<临时目录>)` 之后 `registry.registry_path()` 仍等于 `<仓库根>/gates/diag/pool-registry.json`）—— **先红**：`E pool.registry.RegistryError: 算不出主工作树：\\`git rev-parse --git-common-dir\\` 没回路径`（test:83）；**后绿**：passed；② **端到端钉子**（用 `subprocess` 起 `tools/pool_mcp.py`，**子进程 cwd = 临时目录**、**不设** `TF_POOL_REGISTRY`、`POOL_MCP_WRITE=1`，喂 `tools/list` + `tools/call pool_cancel {「card」:「999」,「confirm」:「999」}`）—— **先红**：回话正是线上那句「算不出主工作树」（断言 FAILED）；**后绿**：回话 `pool_cancel：本机登记里没有卡 999 的**活租约** —— 不动手。` 且 `tools/list` **8 个**（含两个写工具）→ PASS；★ **先红后绿做了两遍**（修复前跑 = 红；修复后再「临时撤掉 `cwd=`」跑一次仍是那两条红，随后恢复）；③ 号池五个测试文件 **87 passed**（0 failed / 0 error）；④ 门禁同款 `ruff check src tests scripts tools examples harness` → `All checks passed!`（仓级 `ruff check .` 另报 5 条，全在未跟踪且门禁不扫的 `gates/diag/gate_lock.py`，动手前就在）；⑤ 测试**自收尾**（kill 自起的服务进程）、卡树 `git status` 只有这两个文件、**没往真 `gates/diag/` 写一个字节**。**★ 该改但不属本卡**：`tools/wb_dispatch.py:1391` 的 `taskkill` 同样没有 `cwd=` —— **按 PID、与 cwd 无关，不必改**（工人核过，主控认）。**★ 本笔另含一处补账（同一提交）**：`docs/workbacklog.toml` —— 把 108~114 七张卡的登记与状态（108/109/110/111/112/113 标 `done`、114 本笔）与 `[base] reviewed` 一次收干净；此前它一直是主树里**唯一**的未提交改动（也是每次派活前「主仓脏」提示的来源）。"

[entries."T-G212"]
id = "T-G212"
title = "「生成了却没进提交」要有机器判据（封存时的未跟踪清单）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:scripts/audit_progress.py",
  "file:tests/test_seal_untracked.py",
]
gaps = "**来路**：2026-10-02 三笔提交（`T-G205` / `T-G206` / `T-G208`）的**片段文件根本没进提交** —— `_stage_card.py` 在卡树里生成 `docs/changelog.d/<台账号>.md` 等三个片段（**未跟踪文件**），集成时 `--allow` 只给了代码文件 ⇒ `git add` 没带上 ⇒ 三笔的 `.d/` 文件数实测 **0 / 0 / 0**，靠人眼才翻出来。**为什么门禁没咬**：`run_gates.py --seal` 算的「封存树」是**工作树减 `gates/**`**（临时索引 `git add -A`）—— 它**包含**了那些未跟踪片段；可是**没人**拿它与「提交树」比；而 `sync_docs.py --check` **只查**「现有片段在不在汇总里」，**少文件照样 PASS** ⇒ 这个缺口此前**零判据**（「生成了却没进提交」＝账上写了、仓里没有）。**做法**（严格按卡的口径，不扩大）：① `scripts/run_gates.py` 新增 `untracked_files()`，把「此刻未跟踪（不含 `gates/**`）」写进封存读数的新字段 `gates/last.json.untracked`（**两处**：`main()` 落盘 + `seal()` 封存前重算）；② `scripts/audit_progress.py` 新增第 **⑪** 条判据 `check_seal_untracked()` —— 逐条 `git ls-files --error-unmatch` **点名**「封存时未跟踪、现在仍未被跟踪」的文件；③ `tests/test_seal_untracked.py` 新建，**四条钉子 + 一条反例**。**验收（工人自报，主控逐条核）**：① 钉子五条全绿（`pytest -v` = 5 passed，5.90s）：未跟踪片段被封存记下并**点名** · 事后 `git add` 同一份清单 ⇒ 绿 · **老 `last.json` 没有 `untracked` 字段 ⇒ 优雅降级不炸** · 封存记的就是「那几条」未跟踪文件 · 反例「已删除不算缺」；② **对今晚三笔形态的复现**（临时仓库：片段生成在工作区却没进提交）⇒ 逐条点名 `docs/changelog.d/T-G205.md` / `T-G206.md` / `T-G208.md` 并给出「集成时 `--allow` 漏了它」；`git add docs/changelog.d` 之后同一份清单再查 = `[]`（绿）—— **这条判据真的会咬今晚那种账**；③ 既有受影响的测试（gate_fingerprint / run_gates_timeout / gates_reuse_line / audit_tightening / docs_fragments）+ 新文件 = **48 passed**（exit 0）；④ `ruff check src/ tests/ scripts/ tools/ examples/ harness/` = `All checks passed!`。**★ 工人自己交代没做到的（主控认，不替它圆）**：① **没跑任何真门禁**（卡禁区）⇒ `main()` 那条 `untracked` 写入路径**没有端到端跑过 main()**，是借 `seal()`（同一条 `untracked_files()`）+ 真 `audit_progress.py --all` 的 ⑪ 段**间接**验的（`main()` 里只多一个键、只追加、不改既有字段）；② 「有缺 ⇒ 退非 0」靠汇聚进 `all_fails`（与既有各条同一条路），**没有造一次真红的 exit=1 端到端**；③ 判决口径取「未跟踪**且**文件还在」＝红 ⇒ **已删除/改名的片段不报红**（有一条钉子钉住这个选择，卡的口径允许）。**★ 卡外两条（工人判断、主控认，留待另开卡）**：① `_stage_card.py --allow` 的**默认口径**（今晚漏片段的**根因**）不在本卡白名单；真正的防呆是「提交后核对 `docs/changelog.d/` 片段数」；② `tools/sync_docs.py --check` 还有**窄版之外的洞**：「片段存在、但其内容没进汇总」仍零判据。**★ 内存闸真实读数（这趟被它拒过一次，如实记）**：本机可用内存常态就是 **2.3~3.0 GB**（16.33 GB 机器上，用户自己的 Edge 就占 **4.55 GB**、DSH 1.52 GB、`MemCompression` 0.95 GB —— 逐进程核过，**没有**门禁留下的无头 Edge 残留，所以这些内存**不是我能腾的**）。第一次跑集成时读数 **2.3 GB < 2.8 GB ⇒ 内存闸拒跑、门禁根本没跑、不提交**（这道闸按它自己说的做了事，不是噪音）；随后实测 **2.5 GB**，主控显式 `TF_GATE_MIN_FREE_GB=2.2` 放行重跑，理由：本笔只动 `scripts/` + `tests/` ⇒ 5 道真机门**输入未变、全复用**、**不起浏览器**，`TF_PYTEST_WORKERS=2`，且**串行**跑（不与另一笔并行）。这与清单 ⑦/⑧ 的「4.0 在本机常态误拦、阈值该按趟次定」是一致的。"

[entries."T-G213"]
id = "T-G213"
title = "卡规格搬进 git：让队列自洽（谁都能接手）"
group = "RULES"
status = "done"
evidence = [
  "file:docs/workbacklog.toml",
  "file:tests/test_card_specs_tracked.py",
  "file:tools/pool/plan.py",
  "file:复盘/卡/卡022-myday稀疏序号.md",
  "file:复盘/卡/卡024-看门狗独立化.md",
  "file:复盘/卡/卡029-派活器三合一.md",
  "file:复盘/卡/卡108-号池写面①作业登记与守卫.md",
  "file:复盘/卡/卡109-号池去重收口.md",
  "file:复盘/卡/卡110-文档落地七条坑与清单.md",
  "file:复盘/卡/卡111-号池写面②MCP写工具.md",
  "file:复盘/卡/卡112-切片两处误报.md",
  "file:复盘/卡/卡113-pool_cancel证据编码.md",
  "file:复盘/卡/卡114-main_tree_root不许依赖cwd.md",
  "file:复盘/卡/卡115-封存未跟踪清单判据.md",
  "file:复盘/卡/卡116-卡规格搬进git.md",
]
gaps = "**来路**：队列（`docs/workbacklog.toml`）里每张卡都指着 `spec = 「gates/diag/卡NNN-….md」`，而这些卡规格**全在 gitignore 的 scratch 里**（实测 `gates/diag/` 下 128 份规格文件**一份都没进 git**）⇒ **队列不自洽**：换一个窗口、换一台机器、或者过几天回头看，队列指着的文件**根本不在仓里**，谁也没法接手（「卡规格是工作单/冲突域声明/验收判据的来源」，丢了等于队列名存实亡）。**做法**：① 把**队列登记过的那 11 份 + 本卡 116 自己**逐字搬进 `复盘/卡/`（**只换目录、不改一个字**）；② `tools/pool/plan.py::find_spec` 改成**先查 `复盘/卡/`、再回落 `gates/diag/`**（老根保留，历史卡继续能查到）；③ 新建 `tests/test_card_specs_tracked.py` 三条钉子把「队列自洽」变成机器判据。**验收（工人自报，主控逐条核）**：① **源↔目标 sha256 12/12 全相等**（纯 LF，逐条贴在报告里）；② 钉子 **3 passed**，且钉子①做过**先红演示**（把卡 115 临时移出索引 ⇒ `AssertionError: 队列不自洽 … 卡 115：spec 未进 git（git ls-files 不认）` ⇒ 放回后 3 passed）；③ `pytest tests/ -n 4` = **1791 passed**（4 warnings），相关消费者套件 290 passed；④ `ruff check src tests scripts tools examples harness` = `All checks passed!`。**★ 工人自己交代的两点（主控认，不替它圆）**：① **卡树 base（`5fac774`）里根本没有 115/116 的队列登记** —— 那两段只存在于**主仓未提交**的 `docs/workbacklog.toml`（我加卡时只改了主树、没提交）⇒ 与卡里写的「116 登记主控已做好」**不符**；工人把主仓那份登记搬进卡树，并把两份 spec 一并改成 `复盘/卡/…`（否则队列不自洽、钉子①必红）—— 本笔因此**包含** `docs/workbacklog.toml` 的收拢（10 条 `spec` 行改路径 + 115/116 两段登记，53+/10−，纯 CRLF、未重排其它字段）；② 为满足钉子① 的 `git ls-files`，工人对新文件执行了 **`git add`（只暂存，未 commit/tag/动 refs）**。**★ 卡外两条（工人判断、主控认，留待另开卡）**：① **`.gitattributes` 没给 `复盘/卡/*.md` 钉 `text eol=lf`** ⇒ 本仓 `core.autocrlf=true`，checkout 会把工作区那份变 CRLF、与 LF 源不再逐字 ⇒ 钉子③将来可能**假红**（工人已在钉子③里加了「与**索引里的规范字节**再比一次」的兜底，但根治要给属性）；② `wb_brief.py` / `wb_dispatch.py` 的**文档串**里仍写 `gates/diag/`（那只是示例/输出路径、不是查找根，不影响功能）。**★ 内存闸留痕**：本趟与卡 115 **串行**跑（不并行），可用内存按同一读数（本机常态 2.3~3.0 GB）显式 `TF_GATE_MIN_FREE_GB=2.2` 放行：本笔只动 `复盘/卡/*` + `docs/workbacklog.toml` + `tools/pool/plan.py` + 一个测试 ⇒ 真机门输入未变、全复用、不起浏览器。"

[entries."T-G215"]
id = "T-G215"
title = "主树里算错主工作树（相对 --git-common-dir 用了进程 cwd）+ MCP 机器可读块被报告正文冒充"
group = "OPS"
status = "done"
evidence = [
  "file:docs/workbacklog.toml",
  "file:tests/test_pool_mcp.py",
  "file:tests/test_pool_registry.py",
  "file:tools/pool/registry.py",
  "file:tools/pool_mcp.py",
  "file:复盘/卡/卡117-registry相对路径与MCP机器块.md",
]
gaps = "**来路**：主控在**主树**（`--tree .`）收一个**纯文档任务**时，门禁红了 `2 failed, 1792 passed` —— 两条都**只在主树现形**（卡树里一直绿），又一次「桩验过了 ≠ 真机能用」。**① `tools/pool/registry.py::main_tree_root()` 的相对路径解析用错了 cwd**：主控实测两条命令就把病根摆出来了 —— 主树里 `git rev-parse --git-common-dir` 回的是**相对路径** `.git`，卡树里回的是**绝对路径** `D:/…/engineering/.git`。git 既然是在**仓库根**里跑的，它回的相对路径就是**相对那个 cwd**；可原代码拿 **`Path.cwd()`（进程 cwd）** 去解析 ⇒ 只要进程 cwd 不是仓库根（卡 114 那条钉子的场景、DSH 起 MCP 子进程也是这个场景），主工作树就算成 `<进程 cwd>/gates/diag/pool-registry.json`。★ 卡 114（T-G211）当时只修了「**跑不起来**」那一半（补 `cwd=`），**没修「解析用错 cwd」**这一半；因为卡树回的是绝对路径，这个洞在卡树里**永远绿**。**做法**：相对路径改按**给 git 的那个 cwd**（`git_cwd`）解析，取不到才退回 `Path.cwd()`，并把这条理由写进 docstring。**② `tools/pool_mcp.py` 的「机器可读块」被**报告正文**冒充**：`job_result` 会把**工人报告正文**原样带出来，而那篇报告里**正好引用了 tools/list 的报文样例** ⇒ 测试的 `_json_block()`（取正文里第一个 `{ … }`）抓到的是**报告里的样例**（`json.JSONDecodeError: Invalid control character`），不是工具自己的机器块 —— 主树（有真报告）必红、卡树（返回「没有」）必绿。**做法**：新增唯一标记 `--- tf-json ---`，机器可读块放在标记之后（**紧跟单行紧凑 JSON**），读端**只认标记之后那一行**；```json 围栏**保留**，只为兼容白名单**外**的既有读端（`tests/test_pool_mcp_write.py::_json_block` 仍按「第一个围栏块」取）。★ 读端**不能**按围栏截断：机器块的 JSON 里就含报告正文，正文里的 ``` 会落进字符串、按围栏截会把 JSON 截断。**验收（工人自报，主控逐条核）**：① **都在主树里先红后绿** —— 改前 `tests/test_pool_registry.py:83` 的 `AssertionError` 原文（进程 cwd 那个 temp 路径 vs `<仓库根>/gates/diag/pool-registry.json`）在报告里**逐字贴出**；注入修复版模块后 `test_pool_registry.py` **23 passed**、`test_pool_mcp.py` **15 passed**（真报告 `wb-105.report.md` 在场）；② 新增钉子：`main_tree_root()` 与进程 cwd 无关 · `TF_POOL_REGISTRY` 优先 · **真 `git init` 造一个只回相对 `.git` 的仓库来验解析** · 正文含围栏 json 样例时六个工具仍解析得出机器块；③ 卡树全量（门禁同款 `pytest -n 4`）= **1797 passed**（`Total coverage: 93.71%`，收集 1799 条）、受影响三文件 `--no-cov` **60 passed**；④ 门禁同款 `ruff check src/ tests/ scripts/ tools/ examples/ harness/` = `All checks passed!`；⑤ 卡树只动白名单那 4 个文件、**没提交**、**主树磁盘一个字节没动**（工人自己在主树里注入修复版做的复现，事后核过）。**★ 老实说（边界）**：① **口径还没一次收口** —— 两条读端现在并存（新的唯一标记 vs 白名单外那个「第一个围栏块」），将来若再分叉要一次收干净；② 本卡**没跑真门禁**（禁区），主树那两条红是用「注入修复版模块」的方式在主树里复现与验绿的，**不是**在主树里跑完整门禁；③ 主树里这类「只有主树才现形」的钉子这次是**第二次**咬人（前一次是卡 114 的 `cwd=`），所以本笔的钉子特意要求**在主树里**先红后绿。**★ 这一笔自己撞上的第二个坑（钉子是好的）**：头一趟门禁红在 `tests/test_card_specs_tracked.py`（卡 116 的钉子）—— 因为它查「队列里登记的每一份卡规格都要**已被 git 跟踪**」，而本卡的新规格虽然**拷进了卡树**、却要等收口的第 ⑥ 步才 `git add` ⇒ 门禁（第 ④ 步）比它早，于是当场红。★ 规矩：**新卡的规格必须在门禁之前就进索引**（先 `git add` 再跑门禁），否则那条钉子必咬 —— 钉子没错，是流程顺序错了。**★ 本笔另含补账（同一提交）**：`docs/workbacklog.toml` —— 卡 115（`T-G212`）与卡 116（`T-G213`）**已落地**却还挂着 `pending`，本笔一并标 `done` 并登记卡 117；卡规格 `复盘/卡/卡117-….md` 也随本笔进 git（T-G213 起的规矩：队列要自洽）。"


gaps = "**底座**：主树 6f7d4d0（十一张卡共同底座）。**十一张作者 sha（现读）**：rev1=99b114a（T-G150）/ acad1=63b0f8b（T-G151）/ copy1=6007290（T-G152）/ left1=71de85d（T-G154）/ cli1=be33d0e（T-G155）/ gates1=6d41e0e（T-G156）/ pypath1=71695f6（T-G157）/ review1=69868c5（T-G158）/ rules1=393fe84（T-G159）/ bg1=3deeb47（T-G160）/ lease1=3145051（T-G161）。**并集结论**：逐文件按 git show --name-only 取各卡自有改动清单（不用整树 diff，防把 062 的活算到工具树头上），单卡文件直接 checkout；src/web/index.html 被四张界面卡（057/058/059/060）碰过 → git merge-file 逐卡迭代三方合并，四趟 rc=0 无冲突，并逐卡核「新增行全在、删除行计数与作者一致」；scripts/run_gates.py 只取 .wt/pypath1 一份（062+063 并集，五棵工具树对 062 的祖先关系 rc 全 0）；gates/diag/gate_lock.py 只取 .wt/lease1 一份（065+067 并集）；tests/test_web_frontend.py 实为只有 058 改过。**共享三件手工并**：docs/traceability.toml / docs/changelog.md / 复盘/交接-重构进度.md 由集成者按各卡自有增量拼装（descendant 卡用 pairwise diff 隔离，避免把 062 的活重复计入）。**冲突怎么解**：无真正文本冲突（各卡改动区域不重叠）；共享文件的「同位置插入」按卡号升序排。**重采范围**：gates/render/** 不合并作者产物，按合并后源码全量重采（060 左栏少三行 → 桌面 15 + 窄屏 15；057/058/059 各改本视图）。**边界（如实写）**：卡 058（T-G151）对 复盘/交接-重构进度.md 只改了台账进度数字（numstat 1/1），**未写 CHECKPOINT 段** → 交接里只有十条卡 CHECKPOINT（057/059/060/061/062/063/064/065/066/067），缺 T-G151；按卡 §7.7「不许替它补」未代为编写，报主控。**门禁读数**：以提交后 audit_progress.py 与 gates/last.json 为准。"

[entries."T-G163"]
id = "T-G163"
title = "暗色适配四屏（习惯/每日反馈/计划/复盘）+ 补暗色门禁（此前暗色零覆盖）"
group = "F"
status = "done"
evidence = [
  "file:tools/dark_probe.mjs",
  "file:复盘/暗色适配与暗色门禁-T-G163.md",
  "file:tools/ui_flow_check.mjs",
  "text:src/web/app.css::color-scheme",
]
gaps = "**用户原话**（2026-09-27）：暗色模式下习惯这一个界面、每日反馈、下计划与复盘之类的东西，好像没有把它做成适配暗色模式的状态。**视图名对齐**（git grep 与 tf_browser.mjs 的 VIEWS，不猜）：habit = 习惯（每日反馈不是独立视图，是 habit 页的「每日反馈（计划 vs 执行）」区块 index.html:2744 的 #fbPlan/#fbGap）、planned = 有计划、review = 复习；没有 daily 视图。**令牌层自检**：颜色字面只在 app.css 令牌区，亮色区 25 / 暗色区 16 / 只在亮色区 9（--accent-1..6 与两个 --accent-N-ink 本该两主题同值 + --motion-ease 非颜色）→ 令牌层完整，病不在令牌；index.html 仍只有 meta theme-color 一处硬编码色（卡 §7.4 可不动）。**探针**：新建 tools/dark_probe.mjs（只读），复用 tf_browser.mjs 的 startServer --fresh + seedFixture + bootApp + 假时钟三处钉齐，每屏在 dataset.theme light/dark 下各渲染一遍（等 body 背景+变异计数连续 4 拍稳定），逐可见元素读 background-color/color/border-*-color/最近不透明祖先背景，出判据 A（暗值逐字节==亮值且不在白名单：transparent/rgba(0,0,0,0)/inherit/--accent-1..6）与判据 B（文字对比度正文 <4.5 / ≥18px 或 --muted 次要 <3.0），自带探针自检（切暗色 --bg 不变则退 2 作废）。**反证①（改前现场）**：A 60 处 / B 10 处；A 计数口径是逐元素逐属性（svg/path 与父 span 各命中一次同一规则），去重后问题类只有两类。**根因两类**（一次性 CDP 脚本对质：切暗色后 --bg/--ink 都变，但 nav button.active 背景仍是 rgb(47,111,235)）：① index.html view() 的 else 分支把配置默认强调色写成内联 --accent 并持久化 tf_accent —— 内联优先级高于 [data-theme=dark]，暗色 --accent:#60a5fa 永不生效，暗色墨 #0b1220 落在亮色强调底上 = 4.1 < 4.5（B 的全部 10 处）；② .textarea 是唯一没写底/字色的文本控件（select/input 元素级都有 var(--panel)/var(--ink)），暗色下吃 UA 白底黑字 —— 正是用户点名的每日反馈两块。**修法（只加暗色/删一条暗色才踩的分支）**：① 删 view() 的 else 分支（不再内联写默认强调色、不再持久化），默认值交令牌区（亮色 :root 同值 #2f6feb，亮色视觉零变化；渲染黄金的 bootApp 本就钉住 tf_accent 走 accentChoice 真值路径不受影响；用户真选过仍写内联 = 原行为）；② [data-theme=dark] 块加 color-scheme: dark（原生控件/弹层/滚动条跟随，亮色零影响）；③ 新增 [data-theme=dark] .textarea { background: var(--panel); color: var(--ink) }。改前按铁律 2 跑 pin_check 四条全钉子 0。**反证②（修完）**：探针复跑 A 0 处 / B 0 处（无白名单残留）；令牌自检改前改后 25/16/9 不变（本卡没补颜色令牌，病不在令牌）。**判据留下（选 A 断言、不选 B dark 黄金的理由）**：黄金要动 render_check 的采集/更新/命名三处、亮暗同目录易互相覆盖（反证③风险面大）；断言流不改任何既有判据、复用流底座真点击 + waitIdle。ui_flow_check.mjs 新增流 ㉚（26 条）：清掉工具钉的 tf_accent 重载走默认路径 → 先记亮色基线（防「body 背景==--bg 计算值」恒真断言）→ 真 UI 设置页外观切暗色 → 断言 html 无内联 --accent、habit/planned/review 三屏 body 底==--bg 暗色计算值、卡片底==--panel 暗色计算值、全页扫有自有文字的可见元素不存在文字色==背景色、habit 屏加断每日反馈 textarea 底==--panel 暗色值与强调色亮暗换档。实测 21 项断言全绿（16.2s）。已知边界：断「选中项底==accent」会撞悬停态的 color-mix（点完左栏鼠标停在那颗按钮上），故强调色只断换档+无内联两条，不是放松。**反证④（判据咬）**：故意把暗色 --accent:#60a5fa 改回 #2f6feb → 流 ㉚ 红（habit：强调色确实换成了暗色那一档 —— 亮 rgb(47,111,235) / 暗 rgb(47,111,235)），还原（只还原暗色块那一处）后复跑 21 项回绿。**反证③（亮色未动）**：git status --porcelain -- gates/render 为空（45 份黄金一份没动、无 dark 档 —— 判据走断言不走 2.3-B）；render 门 45 份逐字节比对全绿 = 机器判据；门禁读数：17 门全绿以 gates/last.json 为准（跑前 gate_lock.py acquire --card 069，提交后 audit）。**边界（旧会话残留，如实报）**：修复前 else 分支已把 tf_accent=#2f6feb 持久化过的本机存储，启动时顶层 applyAccent(localStorage.getItem(...)) 仍会内联写 → 这些旧会话的暗色强调色依旧不生效，要点一次设置页「默认」（setAccent(null)）才回令牌路径；区分「用户真选过」与「被持久化的默认」需别的判据，超本卡白名单口径没动。**没动**：src/timeflow/**、scripts/**、其余 tools/**、gates/diag/**、gates/render/**（一个字节没动）、.wt/**、主树外来未跟踪文件、data/。"


[entries."T-G164"]
id = "T-G164"
title = "习惯打卡直接算投入（可选分钟，留空与旧行为逐字相同）—— 去掉「去今日手动投入补记」那句"
group = "F"
status = "done"
evidence = [
  "file:复盘/习惯打卡算投入-T-G164.md",
  "text:src/web/index.html::投入分钟",
  "file:tests/test_habit_memo_line.py",
]
gaps = "**用户原话（2026-09-27）**：习惯里面习惯打卡只记次数，想要算投入去「今日手动投入」补记，这个是废话吧。**现状**：habits / habit_logs 只有「那天做没做」，没有时长；但 ledger_entries 的 kind 本来就有 habit 取值（focus / habit / task_done / kpi / asset / review）——「打卡算投入」设计上走得通，只是没接上，把设计缺口写成了使用说明。**改法**：打卡行加可选分钟输入（placeholder「投入分钟（可选）」，必要语义用输入框自己表达、不留解释句，口径同界面不解释 T-G142/T-G144）；留空 = 与老行为逐字相同（只写 habit_logs，ledger_entries 零新增）；填 N（>0）且打卡为 done 时，后端走现成的 memo.add_invest_entry 另写一条 ledger_entries(axis=invest, kind=habit)，秒口径（value=分钟×60）与「今日手动投入」同表同口径、同撤销路（invest.retracted 反向事实）；不新造第二套投入口径；habits / habit_logs 表结构一字未动（git diff 底座 -- src/timeflow/storage/db.py 为空）。**先红后绿**：tests/test_habit_memo_line.py 新增三钉（留空不写流水 / 填 30 写一条 1800 秒 / 走既有撤销合计回退）；突变反证：把后端投入写入临时砍成 False，两条钉红（blank 条不受影响，符合预期），还原后全绿。**真机读数**（serve.py --fresh 临时空库，端口 8965）：留空 habit_logs 0→1、ledger_entries 0→0；填 30 时 habit_logs +1 且 ledger_entries 0→1（axis=invest kind=habit value=1800.0），「今日手动投入」合计 30.0 分钟；DELETE 撤销后 retracted=True、合计回退 0。**口径记录**：卡 §2.2 点名删后半句，实测把整句说明删掉——前半句「只记次数」在本卡之后也不再为真，且界面不解释（T-G142/T-G144）不许留解释句；离线排队场景投入分钟记不上，toast 如实提示联网后在「今日手动投入」补记。**没动**：scripts/**、其余 tools/**（ui_flow_check 无需换向：习惯页断言只有导航）、src/timeflow/core/**（复用现成函数，零改动）、src/timeflow/storage/db.py、gates/diag/**、data/ 与真实库、.wt/**。"



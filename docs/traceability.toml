gaps = "**为什么有这张卡**（T-G97 = 并发卡 008）：`tools/wb_dash.py` 原来把「卡死」硬写成 480 秒，注释还写「与派活器看门狗同一口径」；而派活器在 T-G94 之后早已是「有工具在飞 → 底线上抬到 `BUSY_STALL_SECONDS`（1800 秒），再按 `max(底线, 2.5 × 历史最长一次已完成调用)` 自适应」。后果：面板会把一个正在跑长命令（全量门禁约 4 分钟、冷缓存 worktree 里 `ui_flow` 十几分钟）的工人**误标成「静默 N 分钟（可能卡死）」** —— 正是 T-G94 修掉的那个病，面板还没跟上。**怎么做**（不在面板里写第二份口径）：`import wb_dispatch`，`card_state()` 里调 `wb_dispatch.inflight_tool(lines, now=...)` 拿在飞的那一次、`wb_dispatch.tool_durations(lines)` 拿历史耗时、`wb_dispatch.stall_threshold_seconds(stall_seconds=STALL_BASE, inflight=..., durations=...)` 拿**本次阈值**（`STALL_BASE = wb_dispatch.STALL_SECONDS`，底线也取派活器那个数）。四档只在「安静/卡死」的边界上变化：收工·结束（判决文件 或 日志里有 `result` 事件）、在跑（静默 < 60 秒）**都不变**；安静 = 60 ≤ 静默 < **本次阈值**；静默 N 分钟（可能卡死）= 静默 ≥ **本次阈值**。行里**新增**两字段（既有字段名一个没改、`/api/state` 顶层结构 `{now, cards}` 没动）：`inflight` = 「在跑：<工具>（已跑 X 分钟）」、`threshold_min` = 本次阈值（分钟）；面板 HTML 加「在跑 / 阈值」一列。**反证（先红后绿）**：`tests/test_wb_dash.py` 由 11 条扩到 **16 条** —— 改实现前 **7 failed / 9 passed**，改后 **16 passed**；五条新用例 = ① 静默 600 秒 + 一个在飞的 `Bash` → 旧实现「静默 10.0 分钟（可能卡死）」、新实现「**安静**」且 `threshold_min == 30.0`（本卡要点）；② 无在飞但历史最长一次已完成 400 秒 → 阈值 `max(480,2.5×400)=1000` 秒 → 静默 600 仍「安静」；③ 调用没带 `__timestamp` → 退回底线 480（保守，仍判卡死，`threshold_min == 8.0`）；④ `monkeypatch` 把 `wb_dispatch.stall_threshold_seconds` 换成返回 9999 秒的桩 → 面板 `threshold_min` 当场跟着变（证明是**调**不是抄）；⑤ 源码级断言面板里**字面**出现那三个 `wb_dispatch.*` 调用。**真机证据**：真起面板 + 真发 `GET /api/state`（本树根下有 `gates/diag/wb-008.jsonl`）→ 顶层仍是 `{now, cards}`，008 那张卡新增 `inflight` = 「在跑：Bash(…)（已跑 0.0 分钟）」、`threshold_min` = 30.0；另把「静默 600 秒 + 在飞 Bash」喂给 `api_state()` → `state` = 「安静」、`threshold_min` = 30.0（旧实现在这一步会报「静默 10.0 分钟（可能卡死）」）。**轻门**：`ruff check tools/wb_dash.py tests/test_wb_dash.py` = All checks passed；`pytest tests/test_wb_dash.py` = 16 passed（按卡 §0.3 **只跑轻门**，全量 `run_gates.py` 由主控集成时跑）。**边界（如实写）**：① 面板仍只报「在不在动、动到哪了」，**不判断内容对不对**；仍是只读，绝不调用/杀工人、不落任何文件；② **静默的测法没动** —— 面板量「日志文件 mtime 离现在多久」、派活器量「最后一条事件到达的时刻」，不是同一根秒表，本卡只对齐**阈值**口径；③ 面板**没有** `--stall-seconds` 开关，底线直接读派活器的 `STALL_SECONDS`（480），派活器若改底线面板会自动跟；④ 「在飞」依赖日志里的 `__timestamp`，**缺时间戳 → 退回底线 480**，绝不放大阈值。**没动的**：`tools/wb_dispatch.py`、`tools/wb_status.py`（只 import 前者、复用后者 `parse_events`）、`card_state()` 既有字段名、`/api/state` 顶层结构、`--port`/`--host` 默认值、`src/**`、`docs/**`、`gates/**`、其它 `复盘/` 交接文档与三个外来未跟踪文件。"



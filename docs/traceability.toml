[entries."T-G203"]
id = "T-G203"
title = "共享文档改「每笔一个片段文件」：并发提交零冲突（B 方案）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/sync_docs.py",
  "file:scripts/run_gates.py",
  "file:tests/test_docs_fragments.py",
  "file:docs/changelog.d",
  "file:docs/traceability.d",
  "file:复盘/交接.d",
]
gaps = "**需求（用户 2026-10-01 拍板「B+A」）**：本仓**每一笔提交**都在**同样三个共享文档**的**同一个锚点**插入 —— `docs/changelog.md`（文件头插一节）· `docs/traceability.toml`（追加一个 `[entries.<台账号>]` 表）· `复盘/交接-重构进度.md`（锚点插一段 CHECKPOINT）。⇒ 两笔并发时，第二笔 rebase **必冲突**，于是「**门禁能并行、提交只能串行**」（主控今天实测过）。**做法（B）**：新增 **`tools/sync_docs.py`**（汇总器：把 `docs/changelog.d/<台账号>.md` / `docs/traceability.d/<台账号>.toml` / `复盘/交接.d/<台账号>.md` 三个**片段目录**汇进那三个共享文档；`--check` 只核对、`--root` 换根；**纯标准库**）+ 改 **`scripts/run_gates.py`**（`docs_sync_precheck` **认片段**（片段存在即视为已同步）+ 新增 `docs_fragments_problems()` 跑 `sync_docs.py --check`，**片段与汇总不一致判红**）+ 新增 `tests/test_docs_fragments.py`（**7 用例**）+ 三个目录占位 `.gitkeep`。**口径（主控确认，工人主动请裁）**：**增量式** —— 三个共享文档**保留全部既有历史**，片段只是**增量来源**，汇总**只插入、绝不改写既有字节**（所以「空片段 ⇒ 三个共享文档逐字不变」成立）。★ **不做**「全量迁移」（把历史条目全拆成片段、汇总=整份重建）—— 那是另一次大迁移，收益为零、风险不小。**验收（工人自测，主控逐条核对派活日志）**：① **汇总前后逐字等价**：`sha256` 前=后（changelog `7fad8d65…` / traceability `f5078b1b…` / 交接 `6173b1b9…`），`git status --porcelain -- <三个文件>` **空**；② **幂等**：连跑两次都 `[OK ] 无待汇总片段 —— 三个共享文档逐字不变`，sha256 不变（pytest 里另有「造 3 片段 → 汇总 → 再汇总零 diff」）；③ **`--check` 抓手改并点名**：`[FAIL] 片段 ↔ 汇总不一致：手改了汇总却没改片段，或反之 —— - docs/changelog.d/T-G204.md 的内容没在 docs/changelog.md 里（跑 …同步…）`、`exit=1`；**门禁侧同验**：造一个未汇总片段 → `docs_sync_precheck() -> False ['片段与汇总不一致：docs/changelog.d/T-G999-TEST.md …']`，删掉 → `(True, [])`；④ ★★ **并发零冲突演示（真 git，原样输出）**：`Rebasing (1/1)` / `Successfully rebased and updated refs/heads/second.`，**两份片段都在**；**对照用例**（两笔都改同一共享文档）→ rebase **CONFLICT** —— **这正是本卡的目的**，不是口述；⑤ **既有判据不变**：汇总前后 `audit_progress.py --all` 与 `check_layers.py` 输出 `diff` **IDENTICAL**（退出码均 0、`LAYER CHECKS: PASS`）；⑥ 全量 `pytest` → **1702 passed, 2 deselected**（覆盖率 **93.74%**）、`ruff`（含 `tools/`）`All checks passed!`。**★ 工人如实留白（四条，主控逐条裁定）**：① `--check` 只抓「片段文字不在汇总里」，**抓不到在非片段来源的归档区手改**（那部分本卡未纳管）—— **接受**，它管的是「片段↔汇总」这条缝，不是我手改归档；② `check_layers` **只在报告里手工跑**（本树 2.6s），**没写进 pytest**（怕它随引用数涨到 829s 拖慢套件；pytest 里覆盖的是 `audit`）—— **接受**（今日已把「这道自检 O(引用数) 次子进程会越来越慢」记进 `复盘/门禁改进清单.md` 的待做）；③ 本卡**没落自己的片段**（要落就得改那三个共享文档、违反「逐字等价」）⇒ **由主控在集成那一步用 `sync_docs.py` 汇总** —— 已做（主控同时把自己打点工具 `_stage_card.py` 改成**写片段 + 调汇总器**，并**自动判断**：`docs/changelog.d/` 在就走片段模式，旧树没有该目录 ⇒ 行为逐字不变）；④ `tools/wb_plan.py` 的 `PROTECTED_FILES`/冲突域与 `wb_dispatch` 的前置检查**尚未把 `<dir>.d/` 片段当一等公民**（不阻断：片段是各不相同的文件、天然零冲突）—— 属禁区未动，记进待做。**没动**：`tools/wb_*.py` · `tools/pool_mcp.py` · `src/**` · `infra/**`（另一个仓）。**★ 内存闸留痕**：这一笔跑门禁时**用户明确授权「可以暂时关掉内存阀」** ⇒ 用 `TF_GATE_MIN_FREE_GB=0` + `TF_PYTEST_WORKERS=2`。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/docsd`，base `d05efab`，74 回合 / 94 次工具 / **0 次工具报错**，用时 22.5 分钟）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G205"]
id = "T-G205"
title = "号池写面①：作业登记（谁占了哪棵树）+ 三条自家守卫"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool/registry.py",
  "file:tools/pool/guards.py",
  "file:tools/pool/locks.py",
  "file:tools/wb_registry.py",
  "file:tests/test_pool_registry.py",
  "file:tests/test_pool_guards.py",
]
gaps = "**来路**：写面（写面 = 另一窗口能「派活 / 取消」）的**第一块地基不是 MCP，而是「谁占了哪棵树」** —— 此前**没有任何地方记着这件事**：两个窗口各派一张卡进同一棵树，双方都不知道（真发生过：卡 100 / 102 的工人**跑进主树**改东西，见 `复盘/口径坑.md` 坑 20）。**做法**：① `tools/pool/registry.py`（新 311 行）—— 租约登记落在**主工作树**的 `gates/diag/pool-registry.json`（★ 用 `git rev-parse --git-common-dir` 定位、**不用 `--show-toplevel`**：那在卡树里回的是卡树；`TF_POOL_REGISTRY` 可覆盖），同目录 tmp + `os.replace` **原子写**，**死租约 = TTL 到期 或 该卡日志已判「断了/已判决」**（复用 `pool.jobs`，不另写），★ **不登记 pid** —— 因为 Windows 上 CPython 的 `os.kill(pid, 0)` 走 `TerminateProcess`，**那不是探活、是把进程杀掉**（口径坑 27），所以判活只走「租约 + 日志心跳」；② `tools/pool/guards.py`（新 175 行）—— **三条纯函数**守卫 `tree_guard`（一棵树一个写者）· `domain_guard`（冲突域相交就拒并**点名相交文件**，相交判据直接复用 `pool.plan.files_intersect`）· `lock_guard`（锁的 `card` = 本卡 **或** `cwd` 指向本树 ⇒ 拒）+ 最朴素的 `log_guard`（目标已存在 ⇒ 拒）；**纯函数**：不写文件、不 print、不起进程；③ `tools/wb_registry.py`（新 215 行）—— CLI `list` / `check`（只跑守卫、不登记 = 写面的干跑）/ `reserve` / `release`，`--files` 缺省从 `docs/workbacklog.toml` 查、★ **查不到就拒**（空域会绕过域守卫，不许猜）；④ `tools/pool/locks.py` 加 `parse_entries(body)`（照 `gate_lock.py status` 的**真实原文**解析，`is_empty()` 行为一字未改）；⑤ 两个测试文件 `tests/test_pool_registry.py`（22 例）+ `tests/test_pool_guards.py`（14 例）。**★ 六条不变量里只有三条是本卡判的** —— **内存闸**（`wb_dispatch` 的前置检查 `TF_GATE_MIN_FREE_GB`）· **日志换名**（`wb_dispatch` 自己挑 `wb-<卡>.r2.jsonl`，写面不给 `--force`）· **模型白名单**（`wb_dispatch.MODEL_WHITELIST` + `pool.models`）三条**明确委托**、本模块不重写（重写就是第三份真源），并各有测试钉住（`test_pool_guards.py` 里断言 `guards` 没有任何内存闸函数）。**验收（工人自报，主控逐条核）**：① `pytest tests/test_pool_guards.py tests/test_pool_registry.py` → **36 passed**；全量 `pytest` → **1756 passed, 2 deselected**（覆盖率 **93.74%**；去掉本卡两文件后 1720 passed 对得上）；② `ruff check` 本卡 6 个文件 → `All checks passed!`；③ **先红后绿**：把三个模块移开 → `ModuleNotFoundError: No module named 'wb_registry'`（2 errors during collection），复位 → 36 passed；④ 守卫被咬 **4/4 原样**（树被占 / 冲突域相交并点名文件 / 日志已存在 / 锁在跑两态：`card`= 本卡 与 `cwd` 指向本树）；⑤ **死租约两种腾位**都验了（把 `at` 推老 21601s > TTL 21600s ⇒ 别人占同一棵树成功；落下 `wb-110.jsonl` + `wb-110.verdict.txt` 判死后 ⇒ 登记表自动只剩活的）；⑥ **原子写**：落盘后 `json.loads` 成功、目录里没有半截 tmp 残留；**坏文件不静默清空**（`reserve` 对坏文件抛 `RegistryError`，原文件一个字没动）；⑦ 登记路径在卡树里的原样读数：`git rev-parse --git-common-dir` → `D:/repo/engineering/.git` ⇒ 登记文件 = **主树**的 `gates/diag/pool-registry.json`（对照 `--show-toplevel` 回的是卡树，正是不能用它的理由）。**★ 主控裁定（三条留白）**：① `check` 没有 `--log` ⇒ 日志守卫只在 `reserve` 生效 —— **接受**（写面本来就是先 `reserve` 再起进程）；② **同一张卡重复登记会被自己的活租约咬** —— **接受，且不加隐式续租**（「一棵树一个写者」要严；写面要重派就先 `release` 再 `reserve`，两步都留痕）；③ 「锁在跑」那条 bite 用的是按卡里给的原样格式**构造**的锁串（真锁当时空着，不便为演示真起一趟门禁）—— **接受**（解析器另有测试按原样格式钉住）。**★ 工人如实报的「没停工」**：切片 §4 有一条「卡里没找到白名单小节 → 停工报主控」，工人判定本卡已用「逐个点名文件 + 禁区」定死范围、故未停工 —— **主控追认**（本卡规格确实逐文件点名，停工反而空跑）。**★ 该改但不属于本卡**：`tools/pool/__init__.py` 的 docstring 仍写「本包**没有任何写操作 / 派活 / 抢锁**函数 —— 那是期 2」，而本包现在已有 `registry` / `guards` ⇒ 由**卡 111**（写面）一并更正（已写进那张卡的交付）。"


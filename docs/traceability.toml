gaps = "**为什么要有**（T-G84，目标轮 3）：外包之后主控每轮都要复核工人的提交，手工复核有五件事（audit 过不过 / 四个 trailer 全不全 / 门禁是不是**为这一笔**真跑过 / 改动越界没有 / 工作区干不干净），每次现查既慢又容易漏 —— 而**漏一条**的代价是「把没验过的东西当验过了」。**判据五条**：① `scripts/audit_progress.py` 真跑一遍、退 0、且**豁免 0**；② trailer：`Task:` **恰好一个**台账编号 + `Ledger:`/`Gates:` 必须在（`Refs:` 可选，与门禁⑧同一件事）；③ ★ **门禁是不是为这一笔跑的** —— 取**这一笔提交里的** `gates/last.json`，要求 `ok=true`、`docs_sync_ok=true`、`docs_sync_missing=[]`、每道门 `exit_code=0`，且它的 `rev` **等于这一笔的父提交**（一次门禁跑完提交两笔，第二笔就是没验过）；④ `--read-only`（只读卡一个被跟踪文件都不许改）或 `--allow <glob>` 白名单，**不给白名单就拒绝**（默认放行等于没查）；⑤ 工作区干净（`-uno`）。退出码 0/1/2，`--json` 给机器读。**验收**：`tests/test_wb_review.py` **12 条**（大半是「该失败的输入」：两个 Task 编号 / 缺 Gates / 门禁 rev 是旧的 / 有门没过 / docs 没同步 / 空的 gates 数组 / ok=false / 只读卡改了文件 / 白名单外的文件 / 不给白名单；数据层拿**真仓库 HEAD** 验「本项目的提交流程应当通过第 ③ 条」）。**★ 实测踩到的坑**：第一版直接 `git show --name-only`，**中文路径被 git 转义**成 `\\345\\244…` → 第 ④ 条把中文路径全判成越界（假红）；修法是所有 git 调用统一带 `-c core.quotepath=false`，并补一条 `test_chinese_paths_are_not_escaped`（HEAD 的改动清单里必须原样出现 `复盘/…`）—— 同 T-G76/T-G79 那族：**判据自己要能证明它看得到东西**。**真机实测**：对 HEAD（T-G83 那笔）跑一遍五条全过（退 0），再拿 `--read-only` 复核同一笔 → 当场 FAIL（证明判据真的会咬）。**边界（不假装）**：`gates/last.json` 的 `tree` 字段**故意不查**（自指悖论，`run_gates.py` 写明「审计不看它」）；它不判**内容质量**（工人写的代码对不对），只判流程走全没有；它依赖本项目的提交流程（真跑门禁 → `--seal` → 带着 `gates/last.json` 提交）。**没动的**：`src/` 一行没改。**★ 2026-09-26 更正（T-G87）**：这条里的 `test_chinese_paths_are_not_escaped` 原来是拿**真仓库 HEAD** 验的 —— 门禁在提交前跑（HEAD 还是父提交）所以当时是绿的，可只要某一笔的改动全是 ASCII 路径，它从此**永远红**（定时炸弹；卡 002 那轮实测撞上，唯一红灯）。已改成**自搭临时仓库**（`monkeypatch` 只换 `wb_review.ROOT`）并先证明普通 git 确实会转义；条数仍是 **12 条**，五条判据一条没变。**★ 2026-10-24 更正（T-AG440）**：同族的第二颗定时炸弹也拆了 —— `test_current_head_passes_the_gate_evidence_check` 原来断言**本仓 HEAD 这一笔**自带的 `gates/last.json` 的 `rev` 等于它的父提交，而门禁在**提交前**跑（HEAD 是父提交、带的是上一笔的封存），中间夹任何一笔文档提交就再也追不上；`seal()` 又不许在 `ok=false` 时写封存 ⇒ 红一次就死锁。现改成 `_derived_repo` 自建仓（`test_a_seal_commit_passes_the_gate_evidence_check`，同上一段的做法），判据照样拿真 git 验「封存笔的形态」，五条判据一条没变；本次全量门禁 19 道里 18 道绿、唯一红就是它。"


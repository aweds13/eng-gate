gaps = "**现象**（渲染清单里一直在，只是没有一层判它）：`#exportDir` / `#vaultName` / `#vaultDir` / `#syncPath` / `#archiveDays` 这 5 个输入框是**浏览器默认外观** —— 21px 高、白底、`1px 2px` 内边距、无圆角；而全站其它输入框是 `--panel` 底 + 1px `--border` + `--r-md` 圆角。**根因**：输入框按**上下文**上样式（`.new input` / `.field input` / `.modal-box input`），而 `select` 有**元素级**基础规则 —— 落在三种容器之外的输入框就是裸的（这 5 个正好都在 `.row.tight` 里）。**已修（2026-09-25）**：① 补元素级规则（照 `select` 写：`--panel` 底 + 1px `--border` + `--r-md` + 8/12 内边距 + 13px 字号）；② `.modal-box input` 同步补 `:not(...)` —— 元素级规则权重 (0,2,1) **高于**它 (0,1,1)，不补就会被盖掉（背景与内边距都会变）。**渲染清单作证**：5 个输入框从 `0;1px 2px`（21px 高）变成 `10;8px 12px`（33px 高）；`#archiveDays` 从 73×21 变 **90×33**。**一处与计划不同、如实记**：原计划写「顺手给 `#archiveDays` 加 `.w-90`」，实测它本来就带 `maxw-90`，穿上衣服后内在宽度超过 90，被 `max-width` 钉在 **90px**（正是想要的结果），所以**没动标记** —— 以量到的数为准，不为了对齐计划而改。 ★ **2026-09-25（T-G70）**：本条补的那几条元素级规则里写的是 `1px solid var(--border)`，**现在是 `var(--border-control)`** —— 同一套规则、只换令牌：量出来 `--border` 在 `--panel` 上是 **1.23（亮）/ 1.33（暗）**，而输入框的底与卡片底同为 `--panel`，边框是「这里能输入」的唯一线索，WCAG 1.4.11 要 3.0。★ 与本条是**同一类病的两个阶段**：本条修的是「没穿衣服」（完全没规则），T-G70 量的是「穿上衣服了但衣服看不见」。"
[entries."T-G45"]
id = "T-G45"
title = "视觉线·无需新决定的两件小活（SR-NF1 / N30）：互动态补齐（`:hover` 0→6、`:focus-visible` 0→1）+ 4 条一次性裸值收敛到档位 + 「中文被压碎」三处（挤压 11 处 → 0），一致性门登记表 7 → 1 条"
group = "PROCESS"
status = "done"
evidence = [

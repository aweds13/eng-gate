gaps = "**四子命令**（tools/relocate.py，**只读** docs/归置-机械码.toml 一个文件、不内置任何应搬清单）：check 打印待搬/锁定/幽灵三表 —— 本笔 [allow] 空 ⇒ 待搬 0 条、锁定 14 条契约、幽灵 0 条，退 0；index 按 [regroup] 现算一张索引打印、不落盘。**锁死优先级三条**（假树，贴原样）：① [allow] 空 → apply 搬 0 跳过 0（退 0）；② 同一条同时进 [lock] 与 [allow] → 搬 0 跳过 1（点名被 [lock] 命中、退出码 0）；③ [allow] 一条 → 搬 1；undo 后目录树复原（含空目录已收）且幂等（再 undo 搬 0）。**幽灵条目**：策略里写一个盘上没有的路径 → check 退 2 且点名（报告/幽灵.md）。**index 现算且未落盘**：真树打印归属计数 产品线 74 / 工程运维 61 / 外包卡 52 / 规矩与口径 12 / 交接与索引 10 = 209（恰为 复盘/*.md 全量）；跑 index 前后 git status 不多文件。**台账拆细**：拆前 PROCESS=200，拆后 OUTSOURCE=43 / ENGINEERING=31 / OPS=24 / RULES=8，留在 PROCESS=94；逐行 diff 核对**只动 group 一个字段**（106 行 PROCESS 各自换成新值，其余字段与条目零改动）。★★ **判不了 0 条**；留在 PROCESS 的 94 条**不是判不了**，而是**产品实现/缺陷/视觉设计**类卡（软件格，不属四桶），按卡「拿不准别硬塞」留 PROCESS，明细已列名回报主控。**本笔零搬动**（[allow] 保持空）。"

[entries."T-G189"]
id = "T-G189"
title = "门禁的 pytest 子进程漏了 -X utf8：中文名 TOML 让 check_toml 在 GBK 下崩（pytest 门自 3540f4c 起必红）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:scripts/check_toml.py",
  "file:scripts/run_gates.py",
  "file:tests/test_process_tools.py",
]
gaps = "**症状（两趟都红、非偶发）**：`python -X utf8 scripts/run_gates.py --no-reuse` 在 `3540f4c` 上 **pytest 门必红** —— `FAILED tests/test_process_tools.py::test_real_ledger_passes_the_preflight`，形态**不是断言失败**，而是 `AttributeError: 'NoneType' object has no attribute 'split'`（`scripts/check_toml.py:44`）。**根因（逐条实测）**：① `toml_files()` 用 `subprocess.run(..., text=True)` 却**不给 `encoding=`** ⇒ 子进程输出按**本机区域编码**（这台机器 cp936/GBK）解；② 它同时给 git 传了 `-c core.quotepath=false` ⇒ git 吐**原始 UTF-8 字节**（不是八进制转义）；③ 全仓 TOML 里**只有一个**文件名带中文 —— `docs/归置-机械码.toml`（**T-G182 / 卡 087 昨天刚加的**），它的字节在 GBK 下解不开 ⇒ 读线程抛 `UnicodeDecodeError`（`subprocess.py:1614 _readerthread`）⇒ `communicate()` 返回 `None` ⇒ `.stdout.split()` 炸；pytest 把这件事只打成 `PytestUnhandledThreadExceptionWarning` 警告，所以**只看短摘要看不出真因**。**字节级证据**（把 `git ls-files --cached --others --exclude-standard 「*.toml」` 的每条输出按 GBK 解）：`config.example.toml` · `docs/commands.toml` · `docs/traceability.toml` · `docs/workbacklog.toml` · `harness.toml` · `pyproject.toml` · `tools/contrast_baseline.toml` · `tools/style_baseline.toml` · `tools/ui_text_baseline.toml` **全 OK**，**只有 `docs/归置-机械码.toml` 炸**。④ ★ **为什么以前不红**：本仓铁律是「python 一律 `python -X utf8 …`」，而 `run_gates.py` 里**十几条命令都带了 `-X utf8`，偏偏漏了 `acceptance` 与 `pytest` 这两条**；带 `-X utf8` 时 `text=True` 走 UTF-8 模式（`io.text_encoding`）⇒ 绿，不带就按 GBK ⇒ 红。**这就是「单跑这条测试看着是绿的」的原因** —— 人单跑总会带 `-X utf8`（**假绿陷阱**：门禁的口径与人的口径不同，红绿相反）。**修法（三处，都最小）**：① `check_toml.toml_files()` 显式 `encoding=「utf-8」, errors=「replace」`，并把 `stdout` 为 None 时不静默（`or 「」`）—— 工具自己就该说清解码口径，不能指望调用者；② `run_gates.py` 给 `acceptance` 与 `pytest` 两条命令补上 `「-X」, 「utf8」`（对齐本文件既有风格与铁律）；③ 钉子 `tests/test_process_tools.py::test_toml_preflight_survives_cjk_paths` —— 那个中文名必须**原样**出现在 `toml_files()` 的清单里（编码解错时它根本到不了这一行）。**验收（同机、同内容、只差这一笔）**：`.wt/utf8`（base `3540f4c`）里 `python -m pytest tests/test_process_tools.py -q --no-cov`（**故意不带 `-X utf8`**，照门禁口径）→ **6 passed**；改前（主树与 `.wt/par2`，同一份 3540f4c 内容）同一条命令 → **FAILED**（`UnicodeDecodeError: 'gbk' codec can't decode byte 0xa2 in position 100`）。**没动**：门清单一字未改 · `input_hash()` / `REUSE_INPUTS` / 封存指纹未碰 · `check_toml.py` 的报错文案与判据未改 · `--serial` 与 worker 数口径未改 · `--quick`/复用语义未动。**边界（如实）**：这条只修了**已经爆出来的那一处**（`check_toml`）；**同类隐患仍在** —— 任何在门禁里跑的 python 子进程，只要 `text=True` 不给编码，遇到非 GBK 可解的字节就会以同样的方式「静默变 None」。本次把两条命令补上 `-X utf8` 已堵住主路，但**没有**做全仓扫描（诚实留档）。**来源**：主控 2026-10-01 落卡 092 时，外包工人跑全量门禁红了；主控复现并定位，**本笔由主控自己修**（阻塞提交的热修，不外包）。"

[entries."T-G194"]
id = "T-G194"
title = "自证⑤ 的快照别管门禁产物：git status 全文前后比 → 只比「已跟踪 ∧ 非 gates/」"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tests/test_dark_teeth.py",
]
gaps = "**病（满载实测，第三次假红）**：2026-10-01 落卡 092 时跑全量门禁，`pytest` 门挂 `tests/test_dark_teeth.py::test_5_self_proof_never_touches_the_repo`，而**报出来的差集是空的**：`AssertionError: 自证让工作区多出文件：[]`。**真因**：这条自证的本意只是「**变异实验没动仓库里的真文件**」（五种暗色变异全落在 `tmp_path`），但它用 `git status --porcelain` **全文**做前后快照 —— 那是个**全局可变视图**：两次快照之间，`gates/**`（**门禁自己的产物**：`gates/last.json` / `gates/reuse.json`，一轮门禁跑动中本来就在被改）与工作区里的**未跟踪残留**（`data/` 之类）会变来变去；于是断言以「**差集是空的**」（即「少了」而不是「多了」）这种**说不出道理**的方式假红。同族参照：T-G186 抓的两种签名（每次挂同一条 = 墙钟敏感；**每次挂不同条 = 竞态/时序**）—— 本笔是后者的又一例。**修法（只动判据，不放松意图）**：`_git_status()` 改成 `git status --porcelain --untracked-files=no` 再**排掉 `gates/` 前缀**的行（只看「已跟踪 ∧ 不在门禁产物目录下」的改动），并把断言消息改成**两侧都报**（`多了 …；少了 …` —— 原来的文案只报「多了」，正是它把真因藏住）。**钉子（反空转）**：新增 `test_6_the_status_snapshot_ignores_gate_artifacts_and_untracked` —— 直接检查快照里**不许**出现 `gates/` 字样、**不许**出现 `??` 行；口径一旦被改回「全文 `git status`」，这条当场红。**验收**：`.wt/utf8`（base 5db2aa1）里 `python -X utf8 -m pytest tests/test_dark_teeth.py -q --no-cov` → **9 passed**（原有 8 + 新钉子 1）；`ruff check tests/test_dark_teeth.py` → All checks passed；全量门禁见本笔的 `Gates:` trailer。**没动**：`src/**`（`app.css` 一个字节没碰）、`gates/render/*.txt` 黄金、`scripts/run_gates.py`、`tests/test_gates_reuse_line.py`（它的 `save_reuse` 本来就 `monkeypatch` 到 `tmp_path`，不是它写坏的）。**代价（如实）**：快照**看不到未跟踪文件**的新增 —— 但那种「新增」本来就不是这条自证要管的东西（变异落在 `tmp_path`，而门禁产物与临时残留本来就会变）。**来源**：主控自己修（挡提交的门禁假红，不外包）；★ 这一笔独立于 092（092 的改动与之无关）。**同族待办（未做，如实记）**：`run_gates.py` **给每道门没有超时** —— 同一天 `ui_flow` 那道门真卡死过 **56 分钟**（node + serve + 无头 Edge 全活着、一步不走），只能人工按 PID 掐；下一张卡应给每道门加硬超时。"

[entries."T-G188"]
id = "T-G188"
title = "ui_flow 等待原语根治：六处「一次性断言」改成「等就绪判据」（存在∧可见∧尺寸非零）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/ui_flow_check.mjs",
  "file:tests/test_ui_flow_check.py",
]
gaps = "**病（承 T-G186）**：091 只把浏览器层**串行**（结构性规避），满载下 `ui_flow` 仍会挂 1~2 条，且**每趟挂的不是同一条**（⑮ Obsidian 只读跳转 / ⑪ 备份与恢复 轮着来）= **竞态签名**；形态固定三类消息：「匹配到 0 个」「元素是 0×0」「可见 0 个」。**根**：这三类消息全部出自 `T` 类里**只查一次就断言**的原语 —— `view()`（`mark` 一次）· `press()`（`rectOf` 一次）·`pressAction()`（`mark` 一次）· `drag()`（`rectOf`+`eval` 一次）· `openSetting()`（`mark` 一次）；主控另补 flow ⑭ 里那个局部 `press`（同一症状类）。**改法**：六处全部改成 `this.waitFor(...)` 轮询就绪（默认 `readyMs = 8000`，步长沿用 `waitFor` 的 120ms），判据 = **存在 ∧ 可见**（`mark()` 自带 `getClientRects()` 过滤）∧ **尺寸非零**（`w>0 && h>0`）；超时后才断言，且文案带上「等了约 N ms + 等到什么状态」（原来只说「匹配到 0 个」，分不清「真没有」还是「还没渲染」）。**★ 主控补齐（同一症状类的其余爆发点：值/文本就绪）**：满载复跑时 `ui_flow` 又挂了两条，但形态**不是**「元素找不到」，而是「**值/文本还没到位就断言**」——㉕「能关回去 —— 实际 false，期望 true」（`waitToast('合作接口已关闭')` 默认只等 5000ms，满载下提示条还没出来）、㉒「导入报告里写了删了几行 —— 在这段里没找到「删除 1」」（`waitToast('已导入：')` 只等到了**前缀**，紧接着拿眼前那半句去断言后半句 ⇒ 必然落空）。⇒ 同一条根、同一套修法：① `waitToast` 默认预算 5s → **12s**（仍是轮询就绪，**不是**固定 sleep）；② 新增 **`waitToastWhere(pred)`**，把 4 处「先等前缀、再拿眼前文本断言」改成「**等整条判据成立**」（⑯ 空框提示 · ㉒ 预览 · ㉒ 导入报告 · ㉖ 断网提示）；③ 钉子第 3 条：**不许**再出现「同一行里既 `t.has(` 又 `waitToast(`」的写法，且 `waitToastWhere` 必须在。★ 这一处与上面六处不同：它**有对照**（复跑改前 2/26 红），不是机制推断。**没动**：`tools/tf_browser.mjs` · `src/**` · 26 条流的**流数与断言项数**（仍 26 流 / 362 项）· `scripts/run_gates.py`（091 的浏览器层串行、`input_hash()` 都没碰）。**钉子（先红后绿）**：`tests/test_ui_flow_check.py` 追加两条 —— ① 那五处原语 + flow ⑭ 的局部 press **必须有 `waitFor(` 且不许出现 `sleep(`**（卡里明令不许用「等更久」顶替「等就绪」）；② 行为流**不许变少**（`--list` 恰好 26 条，删流就是把覆盖丢掉）。★ 把**改前**源码喂给同一批判据 → **6/6 红**；改后 `pytest tests/test_ui_flow_check.py -q --no-cov` → **10 passed**。**验收如实（★ 一半没拿到）**：① 负载器（`gates/diag/flake091_under_load.py --daemon 28`，28 个 burn 子进程，脚本由工人补 `--daemon` 分支）下跑 `node tools/ui_flow_check.mjs --port 8541` **连跑两趟** → 两趟都退出 0、**26 流 / 362 项全过**（371.6s / 379.7s，原始输出 `.ui_run1.txt` / `.ui_run2.txt`）；② ★ **「改前会挂」的对照没复现** —— 同一负载下把改动 `git stash` 收起后再连跑两趟，**也全过**（379.9s / 379.8s，`.ui_before.txt` / `.ui_before2.txt`）⇒ 这台负载器（只烧 CPU）**没能复现那道竞态**（真机门的争用还牵涉磁盘 IO / 浏览器内部资源 / 17 门并行）。**所以本笔的收益建立在机制上**（把「只查一次就断言」换成「等就绪判据」，正是那三类失败消息的来源），**不是建立在「改前红、改后绿」的对照上**；这条对照**没拿到，如实留档**。**代价**：失败路径上这六处各自最坏多等 8 秒才报错（不改变结论）；**没有引入任何固定 sleep**。**来源**：华为码道 codearts 号池（infra/pool）**第四张真卡**（卡 092，GLM-5.2，树 `.wt/par2`，base `3540f4c`）；★ 工人在 16:06:56 写完验收后被**打断**（派活日志无 `result` 事件、`.meta.json` 没落盘），**未自报** —— 本笔的改动复核、两条钉子、门禁与提交都由主控从**它落盘的原始输出 + 树内 diff** 接管完成。"

[entries."T-G190"]
id = "T-G190"
title = "机器替代 ①+②：端口体检与白名单越界校验从人手工做改成机器做"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/tf_portcheck.py",
  "file:tools/tf_stage_guard.py",
  "file:tools/wb_dispatch.py",
  "file:tests/test_tf_portcheck.py",

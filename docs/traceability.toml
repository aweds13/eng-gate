gaps = "**来路**：GLM-5.3 的整体审查（`复盘/外包工具-整体审查-GLM5.3.md`）报了 12 条 + 5 条判据漏洞，主控在`复盘/外包工具-需求与架构.md` §8 逐条给了处置并排了 A~H 八张卡。**本笔是第一批**，治的是审查里「**接线与真源收敛**」那一类（它的排序建议第 1、2 条 + 两条轻的）。★ **只修，不喊口号** —— 每一条都配反例钉子。**做法（任务 `B-FIX1` 收批，3 张卡跨三层，各在自己的树里干，收口时主控按文件复制进主树）**：① **卡 125**（`.wt/dispguard`，运维层，治 **2.1** 与 **2.9**）：把 **2.1** 指出的缺口堵上 ——`wb_dispatch.py` 此前**全文 0 处** import guards/registry（外部审查用 `grep` 给出的硬证据），于是不变量 ①②③⑤ 在**唯一每天真的在跑的那条入口**上全部失效、且别的窗口看不见这个活。现在：前置检查接 `guards.tree_guard / domain_guard / lock_guard`（**域从队列真读、查不到就拒** ——不许猜空域）、`registry.read_lock_body()` 取锁原文、真派活前 `registry.reserve(...)`、**任何退出路径都还树**（`atexit` 兜底，照卡 118 给门禁锁那套）、**dry-run 不占树**、`--detach` 由**跑工人的那个脱离子进程**占/还；顺带把 `--max-turns` 的**帮助文本与常量同源**（原来写 150/60、常量是 240/80）。★ **这张卡当场咬出跨卡接缝**：(a) `pool_mcp` 先 `registry.reserve` 再调 `wb_dispatch --detach` ⇒ 父进程的 `tree_guard` 看见**MCP 自己那条租约**⇒ 拒派、MCP 回滚 ⇒ 新增 **`--already-reserved`**（**只**跳过守卫与占/还树，其余前置照走），`pool_mcp` 派活命令行带上它；(b) `tests/test_mem_guard.py` 的两条内存闸用例被新守卫**连坐**（沙箱没有队列）⇒ **修夹具喂输入**（写最小队列 +隔离登记 + 桩掉取锁），**判据一个字没松**。② **卡 126**（`.wt/docorder`，文档层，治 **2.8 / 老坑 32**）：`tools/sync_docs.py` 的 changelog 合并从「新片段一律**接在文件头**」改成**按日期插入** —— 新的在上、旧的在下；**同日插到已有同日节之下**（同日次序不被搅乱）；**只插入、绝不改写既有字节**。原因就是外部审查说的：并行落地时`resolve_derived_conflicts` 取基线版再 `sync_docs` 重汇总 ⇒ 老日期片段被插到新日期上面，**坑 32 从「人手工才撞」变成「每次并行都自动重演」**。另给 `--check` 加 changelog **次序判据**（倒置 ⇒ `[WARN]` 并**点名相邻两节**）。★ **不做成硬拒绝**：真仓 `docs/changelog.md` **本来就有一处历史倒置**（见下「老实说」），硬拒绝会打穿**白名单之外**的既有断言（`tests/test_docs_fragments.py::test_real_repo_is_in_sync_and_merge_is_noop`），属于「越权改别人的东西」。③ **卡 127**（`.wt/plancard`，门禁层，治 **2.2b / 2.11**）：队列检查器 `pool.plan.validate` 新增**禁通配**判据 ——`files` 里出现 `* ? [` 即拒并**点名卡号与条目**（理由：`files_intersect` 是**精确匹配**，写通配的卡与**任何**路径都不相交⇒ **静默绕过冲突域检查**）；`find_spec` 去掉 `*<号>*` 的乱兜、改成**边界精确**匹配 ⇒ 卡号 `12` **不再**命中`卡112-*.md` / `卡120-*.md`（外部审查标为「潜伏」的那条）。**验收（工人自验 + 主控逐条复核；本笔的收口门禁与审计读数见 trailer / 提交之后的 audit 段）**：- 卡 125：`pytest tests/test_wb_dispatch.py tests/test_mem_guard.py` = **152 passed** ·`pytest tests/test_pool_mcp.py tests/test_pool_mcp_write.py tests/test_pool_mcp_task.py` = **49 passed** ·`ruff check tools tests` = **All checks passed!** · ★ 新钉子的**两次真读数**（同一条「卡 999 占着主树」的活租约）：**不带**开关 ⇒ `树被占：（主树） 上已有活租约（卡 999…）` + `rc=2`；**带上** ⇒ `守卫已跳过（--already-reserved…）` + `rc=0` ·★ **突变检验**：把两处都改成无视 `--already-reserved` ⇒ 两条新钉子**当场红**，已还原（`md5` 一致）。- 卡 126：新钉子**先红后绿**（未改实现时 `5 failed, 5 passed`；改完 `10 passed`），其中钉子①正是坑 32 现场（`assert 36 < 0`：10-01 被插到 10-03 上面）· `sync_docs.py --check` 在**真仓** `exit=0` ·既有 `tests/test_docs_fragments.py` = **8 passed**（没被打穿）。- 卡 127：四条钉子（通配被拒并点名 / 全精确通过 / `12` 不命中 `112`·`120` / 存在的卡号仍精确找到）·真仓 `wb_plan.py validate` 与 `plan` **仍全绿**。**★ 老实说（偏差与没做的，别当全清了）**：① ★★ **M-1 的成送申请被栅栏拒过两次，两次都是主控的错**：第一次是**我把 M-1 的域写窄了**（没料到接线会连带 `pool_mcp` 与 `test_mem_guard`）⇒ 我**显式**改了预声明（`B-FIX1.toml` 里 M-1 的 `paths` 2→5 个文件）；第二次是我**改预声明时手滑**：在 TOML 的基本串里写了 ASCII 双引号 ⇒ `TOMLDecodeError`，claim 在**读预声明**那一步就崩。★ **那正是本仓 §8.1 早就记过的坑**（TOML 里写 ASCII 双引号 ⇒ 整份解析不了；中文正文一律用「」）—— **我明知故犯了一次**，已改。★ 两次都是**工人处置得对**：它**拒绝自己放宽自己的域**（说那正是审查 三.1 那条「自报清单」的洞），第二次它**只读定位**到坏在哪一行、**一行没动**。这两次偏差本身就证明域检查在咬。② **卡 126 报出一条真缺陷残留**：真仓 `docs/changelog.md` 第 13 节 `## 2026-10-01` 压在 `## 2026-10-02` 之上（**坑 32 的历史残留**）。本笔**只让它现形**（`--check` 打 `[WARN]` 并点名两节），**没修** —— 改共享文档正文属另一张卡（本批三张卡的域里都没有它）。③ **卡 127 的 `tools/wb_plan.py` 一行没改**（域里列了它，但 `find_spec` 的唯一调用点 `wb_brief.py:378` 是直接从`pool.plan` 导入 ⇒ 自动吃到新行为，**无谓改动不做**）。送申请里 `--files` 按**实际碰过的**报（两文件），如实记。④ **卡 125 的 `--detach` 占/还树**是**读代码得出的路径**，没在真机跑一次 `--detach --execute`（真跑要真工人）——`--already-reserved` 那条路径有 dry-run 读数与 unit 钉子，但**脱离进程真的还树**这一条**没验**。⑤ 本笔是**收批**：三张卡各在自己的树里干活，收口时由**主控按文件复制**进主树再一笔提交（本仓口径：**收口是按文件复制、不是分支合并**）。★ 因此提交里的 9 个文件**不是一棵树的 diff**，而是三棵树各自域内改动的并集 —— 这一点写在这里备查。**★ 本笔另含**：三张卡的规格（`复盘/卡/卡125…` 等）随本笔进 git。"

[entries."T-G226"]
id = "T-G226"
title = "修外部审查第二批：栅栏六处判据（锁租约/门禁出锁/状态机/gate_cmd 白名单/受保护文件/selftest）+ MCP 收申请改子进程与后台线程"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool/task.py",
  "file:tests/test_pool_task.py",
  "file:tools/pool_mcp.py",
  "file:tests/test_pool_mcp_task.py",
  "file:tools/_slow_gate_stub.py",
  "file:docs/workbacklog.toml",
  "file:复盘/卡/卡128-栅栏六处判据.md",
  "file:复盘/卡/卡130-MCP收申请改子进程.md",
  "file:复盘/卡/卡131-用实际改动判越界.md",
]
gaps = "**来路**：外部审查 GLM-5.3 的第二批（**2.3 / 2.5 / 2.6 / 2.12** + 2.3 的放大器）。它的原话是「`spin_lock` 用 `O_CREAT|O_EXCL`、10 秒超时、**没有任何陈旧判定/接管** —— 持有进程一死，锁永留，此后所有 `claim/waive/advance/expire/landed` 全部 rc=2，**直到人手工删锁文件**」，以及「`cmd_claim` 在**锁内**跑 `gate_cmd`（全量门禁 ≈5~6 分钟）」、「`pool_mcp.py` 的 `_capture` **进程内**调 `cmd_claim` ⇒ 最后一名 claimant 走 MCP 时，**MCP 服务进程**同步跑完整个门禁：**stdio 循环全程冻结**」、「`cmd_advance` 对非 `awaiting-commit` 状态一律重置成 `collecting` ⇒ 它**实测复现**了`landed` 被复活、`timeout` 被抹掉」、「`gate_cmd` 以 `shell=True` 执行」、「`selftest()` 把 `TF_BATCH_DIR` 指进临时目录、结尾不复原」。★ 它把这条叫 **2.3（重）**，并点出同族教训：**门禁锁**早就从按 pid 判活进化到**租约制**，**这把没吃到**。**做法（收批 `B-FIX2`，2 张卡两块地，各在自己的树里干）**：① **卡 128**（`.wt/tasklock`，后端层）把 `tools/pool/task.py` 的**六处判据一次治干净**：(a) **锁改租约制** —— 锁内写清谁拿的（卡号 / owner / pid）+ 拿到时间，**按时间判陈旧**（锁内 `at`，退化到 mtime）+ TTL（默认 3600 秒，`TF_BATCH_LOCK_TTL` 覆盖），**陈旧就接管并在 `history` 留一行**，★ **明确不用 pid 判活**（pid 会重用、跨机器不可信 —— 照 `gate_lock.py` 的现成口径）；(b) **门禁移出锁外** —— 拿锁 → 状态推 `gating` + history 写「开始跑门禁」→ **放锁** → 跑门禁 → 再拿锁写读数与骨架；(c) **重复投递不重复跑** —— 见 `gating`（门禁还没记账）就**回一句不重复跑**（工人选了这个而不是「等」，理由：守候/轮询会破坏「最后一名投递者当场关门」的设计，也容易引入新的判死）；(d) **状态机收紧** —— `advance` 对 **`landed` / `timeout`** 拒（不许重置成 `collecting`）；`expire` **校验 `now > deadline`**；另加 `_enforce_deadline`：**每个改状态的入口先查一次 deadline** ⇒「到 deadline ⇒ timeout」不再依赖有人记得手动跑 `expire`（`awaiting-commit`/`landed`/`timeout` 豁免，与既有 `cmd_expire` 口径一致；`extend` 是逃生口，先落新 deadline 再查）；(e) **`gate_cmd` 白名单化** —— `validate_gate_cmd()`：必须 `python -X utf8 scripts/…` 或 `python -X utf8 tools/…`、不许任何 shell 元字符（`; | & $ 反引号 > <` 与换行）、`register` 与 `claim` **两处都校验**（后者防手改预声明），执行用 `shlex.split` + `shell=False`；(f) **`check_domain` 补 `PROTECTED_FILES`** —— 受保护的共享文件**谁都不许**写进自己的域（`register` 就拒）；(g) `selftest` 用 `try/finally` **复原 `TF_BATCH_DIR`**。② **卡 130**（`.wt/mcpclaim`，门禁层）治 2.3 的**放大器**：`tool_task_claim` 改**子进程**跑（不再在 MCP 服务进程里同步跑门禁），回话形态与工具清单**一字不变**（两段 `tools/list` = 9 / 13 原样）。★ 它**自己发现了一件更深的事**并报给主控裁：**只换子进程还不够** —— 单线程 `serve` 里 `subprocess.run`**照样冻住主循环**（换的是「谁跑门禁」，不是「主循环等不等」）⇒ 它把**只有 `task_claim`** 交给一个**后台 FIFO 线程**，其它工具与协议方法仍在主循环当场答。主控**认这个取舍**（性质就是本卡的验收项）。**验收（主控**逐条**复核过；下面都是真读数）**：- 卡 128：`--selftest` **33/33**（★ 原 33 条**名字与判据一字未改** —— 只把 `_replay`/`selftest` 里 3 个门禁**桩**换成白名单内的合法命令，工人主动报了这个「卡内矛盾」）· 九条新钉子各自有读数（陈旧锁能接管并留痕 · 活锁照样拒 ·**门禁跑的时候锁是空的** · 门禁只跑一次 · `selftest` 复原环境变量 · `advance` 对 landed/timeout 都拒 ·`expire` 没到期拒+到期判死+过期 claim 自动判死不放行 · `gate_cmd` 带元字符/非白名单前缀被拒而正常命令通过 ·受保护文件不许进域）。- 卡 130：新钉子 **stdin 端到端**证实「慢门禁跑着的时候，只读工具仍在 5 秒内答」——★ 这条**用旧实现跑会红**（先红后绿）；另有「子进程失败如实带出退出码与原文」「超时**不算成功**」两条。- 主控在**当前主树**上跑的收口前体检：`pytest` 六个受影响文件（`test_pool_task` / `test_mem_guard` /`test_wb_dispatch` / `test_pool_mcp_write` / `test_wb_plan` / `test_sync_docs`）= **282 passed** ·`ruff check tools tests` = **All checks passed!**；全量门禁与审计的读数见 trailer 与提交之后的 audit 段。**★ 老实说（偏差、主控补的接缝、以及一个新坑）**：① ★★ **主控在收口时补了三处接缝**（都记在这里，别当它们属于哪一张卡）：(a) `tests/test_pool_mcp_task.py` 的预声明桩 `gate_cmd = 「exit 0」` 会被**卡 128 的新白名单**拒（工人 128 提前预警过：「该文件不在我的白名单，我没碰」）⇒ 改成 `python -X utf8 tools/wb_task.py list`；(b) 那条**慢门禁**夹具原来用 `python -c 「…sleep…」` ⇒ 新白名单下 **`register` 就失败**，⇒ 新建仓库内的**慢门禁桩 `tools/_slow_gate_stub.py`**（5 行，睡 N 秒）并改夹具 ——★ 不改的话，卡 130 那条**最值钱的钉子**（stdio 不被冻住）**测不出东西**（门禁太快，冻住也看不出来）；(c) **我自己的队列补账写错了字面**：`risk = 「medium」`，而合法值只有 `low/mid/high` ⇒`pool_plan` 当场红，被 `tests/test_pool_mcp.py::test_pool_plan_json_is_structured_not_faked` 咬住 ⇒ 改成 `mid`。★ 三处都是**两张卡交接处**的缝，**不是**哪张卡偷懒。② ★★ **本笔咬出一个新坑（值得进口径坑）：并行批次的「卡树基点」会过期。**`.wt/mcpclaim` 建在 `032a075`（**B-FIX1 落地之前**），而 B-FIX1 恰好改了 `tools/pool_mcp.py` 的`_dispatch_argv`（加 `--already-reserved`）⇒ 把卡 130 的 `pool_mcp.py` 拷进主树时**把 125 的改动覆盖掉了**，`tests/test_pool_mcp_write.py::test_dispatch_argv_is_pinned_and_reserves_first` 当场红（**4bc5a60 上是绿的**）。修法：把卡 130 的 diff 用 `git apply -3` 重新落到**当前**的 `pool_mcp.py` 上（两处改动并存并验：`already-reserved` ×2 + 线程 ×3）。★ **正解是「下一批的卡树要在上一批落地之后才建」**（或建树后先 rebase）；这一条**该做成机器判据**（例如集成时警告「这个文件的基线早于某笔已落地的提交」），本笔**没做**，如实记。③ 卡 130 **未处理**一个边界（它自己报的）：超时只掐 `subprocess.run` 的**直接子进程**，它再起的 grandchild 门禁进程（Windows）**不保证**被一并带走 ⇒ 「孤儿门禁」这一条**没治**。④ 卡 128 多加了两个**环境变量**（为可测性）：`TF_BATCH_LOCK_WAIT`（拿锁等待，默认 10s）、`TF_BATCH_LOCK_TTL`（卡里要求过）—— **如实记**（多出来的旋钮也是要维护的东西）。⑤ **收批的成送申请**：卡 128 与 130 **各自在自己的树里交**（本批 2/2 齐，`awaiting-commit`）。⑥ 本笔仍是**按文件复制**收口（不是分支合并）—— 见 §②，这个口径本身在这一笔上就**咬过一次**。**★ 本笔另含补账**：`docs/workbacklog.toml` 补登记卡 125/126/127（done）与 128/130/131（pending），卡 128/130/131 的规格随本笔进 git。"


  "file:tests/test_tf_cardgen.py",
]
gaps = "**轨二 · 机器替代清单的第 ③④ 件**（用户令「应该机器代替的让 AI 做了」）—— ③ **台账 `group` 归类**：`docs/traceability.toml` 每条带 `group`（`OUTSOURCE`/`ENGINEERING`/`OPS`/`RULES`/`PROCESS`），T-G182 那轮 `PROCESS` 一度堆到 200 条，是主控**一条条读标题手工分桶**拆成四类的；④ **卡/切片样板生成**：每次派活都要手抄一份「卡规格 + 开工切片」，模板固定、只有坐标与禁区在变（一张卡 5~13 KB 手写）。**做法**：③ 新增 `tools/tf_group.py` —— **只读**三子命令 `report`（现算分布 + 与文件里现有 group 的**不一致清单**）/ `propose [--only PROCESS]`（逐条给「建议 group + 命中哪条规则 + 那句理由 + 标题前 40 字」）/ `check`（不一致退 1、一致退 0）；规则写成工具内的 `RULES` 表（外包链路 / 工程门禁 / 运维 / 规矩口径 四组关键词），**都命不中就留 `PROCESS` 并标「判不了」**（T-G182 定的口径：**不许硬塞**）；★ 工具**不写任何文件**（归类由主控拍）。④ 新增 `tools/tf_cardgen.py` —— 从 `--id/--task/--title/--tree/--base/--pool/--files/--forbid/--out-dir` 生成**卡规格 + brief** 两份 markdown（骨架照本仓现用那套，含 `Task:` 行与「★ 不要 commit」段）；缺任一必填参数 → **明确报错退 2**；`--dry-run` 只打印**不落盘**；文件名口径 `gates/diag/卡<id>-<短标题>.md` / `gates/diag/brief-<id>.md`；**不读**台账。**验收（工人自测，主控从派活日志逐条核对）**：③ 在**真实台账**上 —— `report` 现算 318 条分布（OUTSOURCE 46 / ENGINEERING 40 / OPS 12 / RULES 21 / PROCESS 199）、列出 **44 条不一致**；`propose --only PROCESS` 列 94 条（每条带命中规则与理由，判不了的明写 `(无) / 判不了`）；`check` 两态（真台账 **退 1**、干净的假台账 **退 0**）；空台账 `report 0 条`、`propose` 空集打 `# 共 0 条`（**空集也有话**）。④ 缺 `--task` → 退 2（argparse 原话）；`--dry-run` → 只打印、**目录都没建**；正常 → 两份文件都生成。测试两个新文件 **14 passed**，`ruff` 两工具两测试 All checks passed。**★ 如实回报的边界（三条，都不是「假装做到」）**：① `check` 只对**五桶**判冲突，**非五桶**（规格号 `F1`/`NF`/`OP`… 共 105 条）**跳过不报**；建议分布按全部 318 条算，故 `PROCESS` 199 里含那些规格号条目 —— 这是工具作者的解释，主控若要改口径只改一处；② **真台账 `check` 现在是「红」的（44 条）**：T-G182 的人工归类用了关键词之外的判断，机器规则命不中或命中别的桶 ⇒ 这只是**建议**，**不接门禁**、台账一个字没动；③ `RULES` 关键词偏宽（标题正文里出现「测试/断言/回归」会误命中）—— 是否把规则挪进 `docs/归置-机械码.toml` 这类数据文件、由主控维护，属**下一张卡**。**没动**：`docs/traceability.toml`（一字节未改）、`docs/changelog.md`、`复盘/`、`scripts/**`、`src/**`、别卡正在改的 `tools/wb_dispatch.py` / `tf_portcheck` / `tf_stage_guard` / `tf_commit`。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/mech2`，base 5db2aa1，57 回合 / 64 次工具 / 0 次工具报错）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G192"]
id = "T-G192"
title = "机器替代 ⑤：提交流程七步收成一条命令（硬闸门 + dry-run + --step）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/tf_commit.py",
  "file:tests/test_tf_commit.py",
]
gaps = "**轨二 · 机器替代清单的第 ⑤ 件**（用户令「应该机器代替的让 AI 做了」）—— 每落一笔提交，主控要**手工按固定次序敲七步**（① 文档件就位 → ② `sync_counts` → ③ 拿门禁锁 → ④ 跑门禁 → ⑤ `--seal` → ⑥ 白名单核对 + `git add <显式列表>` + commit（四个 trailer）→ ⑦ `audit_progress` + 释放锁），今天一天敲了六七轮，**每一轮都可能漏一步**（漏 ② → `test_process_tools` 红；漏 ⑤ → 封存指纹与提交树对不上、audit 红；漏 ⑦ → 锁泄漏到「全局并发上限 2」的名额 —— **今天真泄漏过一把**）。**做法**：新增 `tools/tf_commit.py`（432 行）把七步收成一条命令，并且**每一步可单跑 / 可跳过 / 可只干到第 N 步**（`--step N`）＋ `--dry-run`（只打印将执行的确切命令，**一个字节都不改**）。**硬闸门（每条都有反例测试钉住）**：任一步退非 0 → **立刻停**、打印「第 N 步失败 ⇒ 不提交」、**并释放锁**（③ 之后失败才需要释放）—— ★ **绝不在门禁红的情况下走到 ⑥**；白名单（`--allow` / `--allow-file`）是**唯一**允许提交的文件集，出现白名单外路径 → 停 + 点名（退 2），**暂存区空 → 也停**（退 3，空集永远满足「全在白名单」= 假绿灯），★ **绝不 `git add .` / `git add -A`**（只 `git add -- <显式列表>`）；提交信息从 `--msg-file` 读（UTF-8）并**校验四个 trailer 都在且 `Task:` 恰好一个编号**（多了/少了退 4）；锁的端口段从 `TF_GATE_PORT_BASE` 读，**同一个段**传给 acquire 与 release（★ 这正是今天真踩的坑：`release` 不带同一段 → 它在默认段 8531 里找锁 → 打印「没有锁，无需释放」→ **锁泄漏**，占着全局并发名额）。**验收（工人自测，主控从派活日志逐条核对）**：`--dry-run` 在**真仓库**上跑，跑前跑后 `git status` **一字未变**（原样贴出七步命令）；门禁假脚本退 1 → **没有 commit**、打印「不提交」、release 被调用；白名单外文件被 stage → 退 2 且点名；空暂存区 → 退 3；trailer 缺一个 / `Task:` 两个 → 退 4；`--step 3` → 断言第 4 步之后**没有**被执行。测试 `tests/test_tf_commit.py` **15 个反例 / 398 行**，**15 passed**；`ruff` 两文件 All checks passed。**没动**：`scripts/run_gates.py` / `scripts/audit_progress.py` / `gates/diag/gate_lock.py` 只**调用**不修改；`tools/wb_dispatch.py`、`src/**`、`docs/**`、`复盘/**`、别卡正在改的 `tf_portcheck` / `tf_stage_guard` / `tf_group` / `tf_cardgen` 一个没碰。**★ 边界如实**：本卡**没在真仓库上真提交**（测试一律在 `tmp_path` 的假仓库里跑）；`--step` 与 `--dry-run` 是**给主控用的**分步/预演口子，不是给工人跳过闸门用的。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/mech3`，base 5db2aa1，51 回合 / 75 次工具 / 0 次工具报错）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G195"]
id = "T-G195"
title = "端口体检误读门禁自己的端口段：改用专用变量 TF_DISPATCH_PORT_BASE"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:tools/wb_dispatch.py",
  "file:tests/test_wb_dispatch.py",
]
gaps = "**病（真回归，被门禁当场抓到）**：卡 095（T-G190）把端口体检接进 `wb_dispatch.py` 时，端口段来源写成「`--port-base` 优先，否则读 **`TF_GATE_PORT_BASE`**」—— 而那是**门禁自己**的端口段，`run_gates.py` 会把它设进**每一道门**的子进程环境里（**包括 pytest 那道门**）。于是同一趟门禁里只要真有门起了服务（`render` / `ui_flow` / `lf1_live` / `web_live` 在 `BASE..BASE+16` 上监听），门内 `wd.preflight()` 就看见「段被占」→ **拒派** → `tests/test_wb_dispatch.py` **24 条用例全红**。**实测（2026-10-01 落卡 098）**：098 改了 `pyproject.toml` + `src/**` ⇒ 真机门的输入变了 ⇒ 它们**真跑**（9034..9050 上有服务在听）⇒ `pytest` 门 `24 failed, 1629 passed`，失败原话是 `判决：前置检查没过 → 没派活`。★ **为什么 095 自己那趟没抓到**：095 只动 `tools/**` + `tests/**`，`src/**` 没变 ⇒ 那 5 道真机门**全命中复用、一个服务都没起** ⇒ 段是空的 ⇒ 24 条用例「侥幸」全过（这正是「复用掩盖失败」的又一例：**同一份代码，在「真机门真跑」的那趟才暴露**）。**修法**：端口段改用**专用变量 `TF_DISPATCH_PORT_BASE`**（`--port-base` 仍优先），**绝不读 `TF_GATE_PORT_BASE`**；解析抽成 `_resolve_port_bases()`（返回 `None` = 给的值不是整数 → 当场报错退 2；返回 `[]` = 没给 → 如实跳过体检）。同时把 095 留下的两条用例改成专用变量，并把「**门禁那个变量必须被无视**」钉进 `main()` 那一层（`test_main_skips_port_check_without_segment` 里**故意**把 `TF_GATE_PORT_BASE` 设成「段内有占用」，仍要求 dry-run 退 0）。**先红后绿（同机同条件，段 9034 上真放一个监听者）**：① `TF_GATE_PORT_BASE=9034` + `pytest tests/test_wb_dispatch.py -q --no-cov` → 修后 **0 failed**（并打印「未给端口段，跳过端口体检」）；② `TF_DISPATCH_PORT_BASE=9034` 同一条命令 → **大量 failed**（证明体检**没被删掉**，只是换了对的变量）；③ 修前的红有第一手留档：`.wt/pc1/gates/logs/pytest.log` 里那 `24 failed` 与 `前置检查没过 → 没派活` 原话。**没动**：`tools/tf_portcheck.py`（体检本体一字未改）、`preflight()` 的其它判据、派活主流程（心跳 / 看门狗 / 429 / 判决 / retry）。**来源**：主控自己修（挡提交的真回归，不外包）；★ 这一笔是**卡 095 的补正**，独立成一笔便于日后追责与复盘。"

[entries."T-G193"]
id = "T-G193"
title = "轨外 089（A 档）：pywebview 挪进可选依赖 + 无窗口入口 timeflow-web"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:pyproject.toml",
  "file:src/timeflow/app/serve.py",
  "file:src/timeflow/app/main.py",
  "file:tests/test_pc_entry_line.py",
]
gaps = "**轨外 · 已批未排的产品件 089（A 档）**：`pyproject.toml` 把 **`pywebview` 写在硬依赖**里（`dependencies = [..., 「pywebview」]`）⇒ 只想在浏览器 / 手机上用的人也被迫装一个桌面壳。用户已拍板 A 档：把 `pywebview` 挪进 `optional-dependencies[pc]`、并新增**无窗口**入口 `timeflow-web`。**做法**：① `pyproject.toml` —— 从 `dependencies` **删掉** `pywebview`（现在是 `['fastapi','uvicorn[standard]','pydantic>=2']`）、在 `[project.optional-dependencies]` 下新增 `pc = [「pywebview」]`、在 `[project.scripts]` 下新增 `timeflow-web = 「timeflow.app.serve:main」`（★ `timeflow` 那条**一字未动**，仍是 `timeflow.app.main:main`）；② 新增 `src/timeflow/app/serve.py` —— 无窗口入口，口径**与 `app/main.py` 一致**：起服务前**先备份**（共用 `storage.backup.make_backup`）、认 `[net] allow_lan`（开了绑 `0.0.0.0` 并打印 `core.lan.banner(...)` 的地址与配对码，**默认关**）、打印人话的启动地址；★ 与 `main.py` 的**唯一区别**就是**不开窗口**（不 import `webview`、不建窗口、不调 `webbrowser`），并**没有复制** `tools/serve.py` 的代码；③ `src/timeflow/app/main.py` **只改回退文案一处**（+3/−0：说清没装时怎么装 —— `pip install -e 「.[pc]」`），备份 / LAN / CLI 分流 / 端口逻辑**一个字未动**；④ 新增 `tests/test_pc_entry_line.py`（6 例）：读 `pyproject.toml` 断言三处（`pywebview` 不在 `dependencies`、在 `optional-dependencies.pc`、`timeflow-web` 指向 `timeflow.app.serve:main`）、`serve` 能被 import **且不把 `webview` 拉进 `sys.modules`**、`serve` 源码里没有 `import webview`、**先备份再起服务**（桩验）、LAN 开 / 关两种横幅（桩验）、可选 `--port`。**验收（工人自测 + 主控复核）**：`pytest tests/test_pc_entry_line.py -q --no-cov` → **6 passed**；`pyproject` 三处现读现验 —— `deps=['fastapi','uvicorn[standard]','pydantic>=2']` · `extras=['pc','dev']` · `pc=['pywebview']` · `scripts={'timeflow': 'timeflow.app.main:main', 'timeflow-web': 'timeflow.app.serve:main'}`；`git status --porcelain` 只有这 4 个文件（2 改 2 新），**`tools/**` / `scripts/**` / `docs/**` / `复盘/**` / 别卡的新文件一个没碰**。**★ 边界如实（两条）**：① 这台机器上 **`pywebview` 其实是装着的**（旧的 `pip install -e .` 带进来的），所以「**没装也能跑**」不是靠卸载来证的 —— 测试用**干净子进程 + `sys.meta_path` 拦截器**（任何 `import webview` 都抛 ImportError）来**假装没装**，再 import `serve` 仍成功且 `webview` 不进 `sys.modules`；② 本卡**没装任何依赖、没联网**（尤其没 `pip install pywebview`）。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/pc1`，base 5db2aa1，56 次工具调用 / 0 次工具报错）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G187"]
id = "T-G187"
title = "派活器状态器的假警报：心跳判据改「三态 + 证据」+ 进程存活判据"
group = "OPS"
status = "done"
evidence = [
  "file:tools/wb_dispatch.py",
  "file:tests/test_wb_dispatch.py",
]
gaps = "**病（主控今天亲历，原样摘录）**：`python -X utf8 tools/wb_dispatch.py --card 087 --status` 打出 —— `[★告警] 没有心跳文件（--heartbeat-seconds 0，或派活器刚起就死了）、日志静默 0.0 分钟（阈值 8.0 分钟）且没有判决 —— 派活进程（含看门狗）多半已被杀（重启 / 休眠 / 被结束）：没人盯了。` —— 而事实是主控按命令行精确查进程，**worker 活得好好的**（pid 34168）、日志也在长。真正的原因只有一个：**心跳每 120s 才写一行，而那时它刚起不到一个周期**。⇒ 状态器把「正常」读成了「多半已死」；判据只有「心跳文件在不在」，**没看时间、没看进程、没看日志有没有在长**。★ 一个会喊狼来了的状态器比没有状态器更危险：会让人误判、甚至**误重派**（重派会撞上正在跑的活）。**做法**：① `heartbeat_stall_alert()` 的判据由「心跳文件在不在」改成**三态 + 证据** —— i) **刚起（正常）**：无心跳文件**且**日志 mtime 在一个心跳周期（120s）内 → 打「刚起 N 分钟…正常」，**不告警**；ii) **中态**：心跳缺失/陈旧**但日志仍在长**（<8min）→ 不告警；iii) **真断了**：心跳陈旧/缺失**且日志也不再长**（≥480s，与看门狗底线同一口径）→ 告警，并把**判据念出来**（心跳最后时间 / 日志最后写 / 阈值），删掉「多半已被杀」这种**无证据措辞**；② 新增**进程存活判据** `codebuddy_worker_pids()` —— `powershell Get-CimInstance Win32_Process` 取 `ProcessId,CommandLine`，**两条都要**：`node.exe` **且**命令行含 `codebuddy`（★ **绝不按进程名判断/杀**，铁律 23–28）；同卡关联用命令行里的 brief-<卡>.md（**ASCII** 标记；中文因 CPS 编码不可靠，实测活着 worker 的命令行带这个）；③ `status_report()`：**没有判决**时新增提示「`--detach` 没有回推通道…建议每 ~2 分钟轮询」（今天真发生过：worker 12:36 就收工了，主控是被用户问才发现）。**验收（工人自测，主控从派活日志逐条核对）**：① **先红后绿** —— 把 `git show HEAD:tools/wb_dispatch.py` 复制到临时根、用**旧代码**跑 4 条新用例 → **`4 failed`，旧输出当场现形**（`[★告警] 没有心跳文件…日志静默 0.0 分钟…多半已被杀`）；换**新代码** → **`4 passed`**；整个 `tests/test_wb_dispatch.py` **119 passed**；`ruff` All checks passed。② **A 项（真数据）**：087 的产物在**主树** `gates/diag/`（par1 树里没有 —— 工人**如实说明并跑过**字面命令、得到「一个都没有」），于是用**改后代码只读主树真产物** → 输出 `判决：正常收工（工人退出码 0）`，**没有「多半已被杀」那类假警报**。③ **C 项（桩证「真断了仍会告警」）**：心跳文件 + log 都拨回 540s、`codebuddy_worker_pids` 桩成空 → `[★告警] 心跳停滞 9.0 分钟（最后 19:43:19）、日志最后写 19:43:19（静默 9.0 分钟）（阈值 8.0 分钟，与看门狗底线同一口径）且没有判决 —— 命令行里查不到 codebuddy worker（node.exe 且含 codebuddy）：没人盯了。` ⇒ **告警没被删掉**，且判据全念出来了。**没动**：`--status` 之外的派活主流程（心跳周期 / 看门狗阈值 / 429 处置 / 判决口径 / retry 一字未动）；`tools/wb_status.py` **未动**（不需要）；树上已落的卡 095 端口体检与 T-G195 的 `TF_DISPATCH_PORT_BASE` 判据**一个字节没碰**；只**加**了 4 条新用例，**没改**任何旧用例。**★ 如实留白（四条）**：① 未跑全量门禁（卡未要求；只跑 `pytest tests/test_wb_dispatch.py` + `ruff`）；② A 项**不是字面命令**在 par1 的直接结果（087 产物不在那棵树 —— 这是「**派活产物落在派活器所在树**」的坐标问题）；③ **非 LEAN 派活**（命令行走中文卡路径）无法用 ASCII 关联到具体卡，只能报「有 N 个 codebuddy worker，无本卡的」；④ `--status` **跨树读不到**别的树派的活 —— 属坐标/根因问题，**不在本卡 `--status` 判据范围内**，留档待另开卡。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/par1`，base `e76947c`，47 回合 / 55 次工具 / 0 次工具报错，用时 11.3 分钟）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G196"]
id = "T-G196"
title = "给每一道门加硬超时：到点掐整棵进程树并判红（exit_code=124）"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:tests/test_run_gates_timeout.py",
]
gaps = "**病（主控今天亲历，原样留档）**：2026-10-01 落卡 092 时跑全量门禁 —— `run_gates.py --no-reuse`（pid 24684，起 17:33:08）在 `ui_flow` 那道门**真卡死 56 分钟**：`node ui_flow_check.mjs --port 9004`（pid 5824，起 17:35:08，正常 386 秒）+ `python -X utf8 tools/serve.py --fresh --port 9004`（pid 10880）+ 无头 `msedge`（pid 36776）**全活着、一个字节不写**，门禁日志停在 17:35。`scripts/run_gates.py` 只是 `subprocess.run(...)` 等子进程，**给每道门没有超时** —— 锁租约到期也不杀它，主控只能**人工逐个核命令行再按 PID 掐**。⇒ 一道门卡死 = **整趟门禁永久挂死**。**做法**：① 新增常量 `DEFAULT_DOOR_TIMEOUT = 1800.0` 与 `door_timeout()`（默认 1800 秒 / `TF_GATE_DOOR_TIMEOUT` 可覆盖 / **`0` = 关掉** / 坏值**告警并退回默认**，不静默）；② `finish_gate(name, proc, t0, timeout=…)` 改用 `communicate(timeout=…)`，`TimeoutExpired` → **掐掉整棵进程树** `kill_gate_tree()`（Windows `taskkill /PID <pid> /T /F`，另配 `_descendant_pids()` 报**掐了几个子进程** —— ★ 只杀父进程会留一堆孤儿继续占端口，今天那一串里 `node` 底下就挂着 `serve.py` 与无头 `msedge`）→ 这道门记 **`exit_code = 124`**、`timeout=True` / `timeout_seconds` / `killed_pid` / `killed_children`，`summary` 写「**超时 N 秒被掐：<门名> pid=… 掐了 N 个子进程**」→ **判红**；③ 新增 `gates_ok()` 作为整趟收口的**同一条判据**（`main` 改用它），**其余门的结论照常收完**（超时只掐那一棵，不吞别人的读数）；④ `main` 解析一次 timeout 并透传三条调用点（串行 / heavy / light 泳道）。**验收（工人自测，主控从派活日志逐条核对）**：① 假门 `sleep 60` + 超时 3 秒 → `[FAIL] slow exit=124 ★ 超时 3 秒被掐：slow pid=35068，掐了 0 个子进程（taskkill /PID 35068 /T /F rc=0）`，同一趟里 `[OK ] quick exit=0`（**其余门照常收完**），`gates_ok(...) = False`；② **反例**（不许误掐正常的门）：`sleep 0.2` + 超时 60 秒 → `[OK ] quick2 exit=0 0.28s`、`gates_ok = True`；③ `TF_GATE_DOOR_TIMEOUT=0` → `door_timeout() = None`，假门 `sleep 2` **真等它跑完**（2.09s）没被掐；④ **子进程真被收掉**：假门里再 spawn 一个子进程 → 超时前 `还活着 = True`，掐完整树后 `还活着 = False`。测试 `tests/test_run_gates_timeout.py`（**5 用例**）+ 受影响的既有测试（`test_gates_reuse_line.py` / `test_gate_fingerprint.py`）+ `ruff` 全过。**没动**：**门判据、门清单、泳道/串行结构、`input_hash()`、`REUSE_INPUTS`、封存指纹**一个字未改（这一层只加「到点就掐」）。**★ 如实留白（三条）**：① 本卡**没跑全量门禁**（改门禁自己时跑它会自相矛盾；卡里明确不要求），只跑了新测试 + 受影响既有测试 + `ruff`；② 超时是**每道门各自计时**，不是「整趟门禁总预算」—— 15 道轻门并行 + 2 道真机门串行，最坏情况整趟墙钟约 `1800 × 2 + 轻门`，**没有**再加一层总超时（要不要，留待主控定）；③ 主控今天那条 56 分钟的挂死是**人工**按 PID 收的，本笔是**事后补的机制**，不是当场被它救下。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树本应是 `.wt/timeout` —— ★ **工人实际在主仓里改的**（派活器不给 cwd，见 `复盘/口径坑.md` 第 20 条），由主控**原样搬进 `.wt/timeout` 后再集成**，没有丢劳动；45 回合 / 52 次工具 / 0 次工具报错，用时 8.1 分钟）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G197"]
id = "T-G197"
title = "门禁四要素（人话版）：17 道门逐门「防什么 / 怎么算过 / 花多少秒 / 红了怎么办」"
group = "RULES"
status = "done"
evidence = [
  "file:复盘/门禁四要素.md",
  "file:复盘/口径坑.md",
]
gaps = "**用户令（2026-09-28，轨二第 ②③ 件）**：门禁「值得学习」要复盘，但更要**把黑话改成说人话** —— 用户点名「**黄金**之类的无聊词」「**审美门**」；并要求**逐门给四要素**（防什么 / 判据 / 代价秒数 / 红了怎么办）。**诊断**：门禁里的术语（门/黄金/审美门/假红假绿/复用/封存指纹/泳道）**只在代码注释与 `复盘/` 的散段里**，没有一页「人话总说明」；读不懂它防什么，就会绕过它、或者红了乱改 —— 而今天这一天**恰好被三种假红咬了三回**（`check_toml` 在 GBK 下崩、`ui_flow` 的「值/文本就绪」、`self_proof` 拿 `git status` 全文前后比），每一次都要从头解释一遍「这道门在防什么、它为什么红」。**交付**：新增 `复盘/门禁四要素.md` —— ① **术语对照表**（黑话 → 人话：门禁/门=自动检查；黄金=基准；审美门=观感检查（对比度/风格/文案）；假红假绿=误报/漏报；复用=抄上次结论；封存指纹=落章；泳道=并行跑道；台账=唯一真源；trailer=提交信息末尾那几行）；② **17 道门逐门四要素表**（人话名 / 防的是**哪种真发生过的事故** / 怎么算过 / 这台机器**真跑**的代价秒数 / 红了怎么办），并注明「跑一趟全量门禁的墙钟约 6~10 分钟（轻门 15 道并行 ∥ 真机浏览器 2 道串行）」；③ **四条所有人都该知道的判据**（「复用通过」≠「这道门现在是绿的」/ 门禁红一律不提交且先分类**时间敏感 vs 竞态 vs 工具脆** / **别裸跑门禁**（此刻每道门还没有超时，实测 `ui_flow` 真卡死过 56 分钟，卡 100 正在补）/ 红的门怎么**单独重跑**）。**这一页是说明、不是判据** —— 文件里写死了「唯一真源是 `scripts/run_gates.py` 的门清单 + `gates/last.json` 的结论」，避免它自己变成第二份会漂的真源（本仓为此吃过亏：T-G40 的「黄金自己漂」）。**同笔附带的坑页更新**：把今天现踩的两条补进 `复盘/口径坑.md`（第 20、21 条）—— ① **派活器不给工人指定 cwd**：`wb_dispatch.py` 用 `cwd=ROOT`（主仓）拉起 CLI，工人默认落在**主仓**里，得靠切片那句「工作树」自己 cd（实测：卡 100 的工人直接在主仓改了 `scripts/run_gates.py`）；② **changelog 里别用反引号写不存在的 .md 路径**：`check_layers` 的引用完整性会扒 `docs/**/*.md` 里反引号包着的 .md，找不到就报「引用断裂」把两道门弄红（实测：卡 093 的 changelog 里写了反引号的 brief-&lt;卡&gt;.md 占位符）。**没动**：`scripts/run_gates.py`（门清单/判据一字未改）、任何门的行为、`docs/traceability.toml` 的既有条目、`gates/**` 的黄金。**边界如实**：① 秒数是**这台机器**的实测区间（取自 `gates/last.json` 若干趟；命中复用的那几趟是 0 秒，已在文件里说明）；② 「红了怎么办」给的是**第一步判据**（看哪份日志、先分哪三类），不是每道门每种红的完整处置手册；③ 逐门「留 / 改 / 删」（轨二第 ③ 件）**不在这笔**里 —— 那要主控与用户逐门拍板。"

[entries."T-G198"]
id = "T-G198"
title = "内存闸：跑门禁/派活前先看这台机器扛不扛得住"
group = "OPS"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:tools/wb_dispatch.py",
  "file:tests/test_mem_guard.py",
  "file:tests/test_wb_dispatch.py",
]
gaps = "**病（主控今天亲历，原样留档）**：2026-10-01 晚上，16.3 GB 的机器上，主控**并行跑了两趟门禁 + 4 个 CodeBuddy 工人 + 每趟门禁自己的无头 Edge 与 `tools/serve.py`**，同时用户**在玩游戏**（`LimbusCompany.exe` ≈ 2 GB）。结果：可用内存掉到 ~3 GB、`MemCompression`（Windows 内存压缩）起了 310 MB、**整机慢 6 倍**（`pytest` 884s vs 正常 146s），**用户的游戏被挤崩过一次**。⇒ 现在跑门禁/派活**只看「我该不该跑」，不看「这台机器扛不扛得住」**。**做法**：① `scripts/run_gates.py` 在 `main()` 最前面（`--seal` 之后、一切之前）插一道**内存闸** —— `available_memory_gb()` 读**可用**（不是 free）内存：Windows 走标准库 `ctypes` 的 `GlobalMemoryStatusEx.ullAvailPhys`，其它平台走 `os.sysconf`（★ **不依赖 psutil** —— 本仓声明依赖里没有它，卡 095 已如实报过这条缺口）；阈值 `TF_GATE_MIN_FREE_GB`（默认 **4.0**，`0` = 关掉这道闸且**打印一行说「已关、不静默」**）；低于阈值 → 打印「可用 X.X GB < 阈值 Y.Y GB」+ 后果人话（「可能压死你正在用的程序 —— 今天真把用户的游戏挤崩过」）+ 怎么放行，**退出码 3**（124 是门超时、2 是 TOML 预检、1 是门禁不过，3 不冲突）；**读不到内存 → 打印「读不到，闸跳过」**（不静默当通过、也不因此拒跑）。② `tools/wb_dispatch.py` 加**同名三个函数**（同一环境变量、同一套措辞、同样「读不到就跳过」），`preflight()` 在端口体检之后加**一条**：低内存 → `problems.append(...)` ⇒ **不派活**（`--execute` 退 2）；★ **只加这一条**，心跳/看门狗/429/判决/retry 与卡 093 刚落的三态判据、卡 095/T-G195 的端口体检那几段**一字未动**。**验收（工人自测，主控从派活日志逐条核对 + 自己重跑）**：① 可用 1.0 GB / 阈值 4.0 → `[FAIL] 内存闸拒跑：可用内存 1.0 GB < 阈值 4.0 GB → 内存不够：可能压死你正在用的程序…放行：TF_GATE_MIN_FREE_GB=0…`，`exit_code=3`，且**零门启动**（`start_gate` 桩计数为空）；② 可用 8.0 GB → `=== 内存闸：可用 8.0 GB ≥ 阈值 4.0 GB，放行 ===`（**反例：不误拦**）；③ `TF_GATE_MIN_FREE_GB=0` → `=== 内存闸：已关（…）—— 不静默 ===` 且放行；④ **读不到内存**（桩「抛 OSError」与「返 None」两条）→ `=== 内存闸：读不到可用内存（阈值 4.0 GB）→ 跳过这道闸（读不到不当通过、也不拒跑）===`；⑤ `wb_dispatch` 两态：低内存 `--execute` → `[FAIL] 不派活 —— 前置检查没过：· 可用内存 1.0 GB < 阈值 4.0 GB…`（退 2）、正常 8.0 GB dry-run → `[OK ] 前置检查全过…`（退 0）。⑥ `tests/test_mem_guard.py`（新，**12 用例**）+ `test_run_gates_timeout.py` + `test_wb_dispatch.py` → **136 passed**；主控自己重跑 `test_mem_guard.py test_run_gates_timeout.py` → **17 passed**；`ruff` 全过。**★ 一处需要留痕的改动（工人主动报出来请裁量，主控裁定保留）**：`tests/test_wb_dispatch.py` 的 `sandbox` fixture 里加了一行 `monkeypatch.setenv(「TF_GATE_MIN_FREE_GB」, 「0」)` —— 因为**这台机器此刻可用内存只有 2.68 GB < 4.0**，不摘掉的话**既有的前置检查用例会被「宿主机此刻有多少空闲内存」污染而假红**。这条改得对：**内存闸的判据不能把测试套件变成「看机器脸色」**（本仓对「墙钟敏感/宿主敏感」的判据一贯是零容忍，T-G186 就是为同类问题立的规矩）；而那道闸本身由 `test_mem_guard.py` **用桩专测**（不依赖真机内存）。**没动**：门判据 / 门清单 / 泳道与串行结构 / `input_hash()` / `REUSE_INPUTS` / 封存指纹 / `--status` 三态 / 端口体检 / `pyproject.toml`（**没把 psutil 加进依赖**）。**★ 如实留白（三条）**：① **POSIX 的 `os.sysconf` 分支没有在本机（Windows）真跑过**；② **派活坐标漂移**（工人主动报的）：卡与切片写「工作树 `.wt/memguard`」，但派活器是用 `cwd=ROOT`（主仓）把 CLI 拉起来的 ⇒ 工人的会话 cwd 实际在**主仓**；它**两个树各放了一份同内容改动**并请主控取用 —— 主控取卡树那份、复原主仓（**这正是改进项 ④：`wb_dispatch` 缺 `--cwd`**，连续咬了卡 100 / 卡 102 两口，已排进下一步）；③ 本笔**只跑了自己那几个测试文件 + ruff**，没跑全量门禁（门禁自己正在被改，跑了会自相矛盾）。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/memguard`，base `bf05d0c`，52 回合 / 62 次工具 / **0 次工具报错**，用时 15.6 分钟）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G200"]
id = "T-G200"
title = "轨二 ①③ 正文：门禁改进清单 + 逐门去留提案"
group = "RULES"
status = "done"
evidence = [
  "file:复盘/门禁改进清单.md",
  "file:复盘/门禁去留提案.md",
  "file:.gitignore",
]
gaps = "**来源**：用户 2026-09-28 把工程侧的活分成两轨，轨二是「**对整个工程管理系统的复盘以及处理**」，并点名四件：门禁复盘（设计理念/执行思路/逻辑结构 + 改进清单）、**黑话改说人话**、**逐门标 留/改/删**、边界画死。`T-G197`（上一笔）交了「人话版逐门四要素」；这一笔交**另两件的正文**。**① `复盘/门禁改进清单.md`**：把今天**被门禁自己咬的四处**逐条摊开（病 → 根 → 修在哪 → 钉子在哪）——（i）`pytest` 门报 `AttributeError: 'NoneType'…split`（**不是断言失败**）：`check_toml.toml_files()` 的 `text=True` 不给 `encoding=` ⇒ 按本机 **GBK** 解，而 `core.quotepath=false` 的 git 吐 **UTF-8**，全仓只有 `docs/归置-机械码.toml` 一个中文名 ⇒ 读线程 `UnicodeDecodeError` ⇒ `communicate()` 给 None（T-G189）；（ii）`ui_flow` 随机挂 1~2 条且**每趟挂的不是同一条**：六处原语「只查一次就断言」 ⇒ 改「等就绪判据」（T-G188）；（iii）`自证让工作区多出文件：[]` —— **差集是空的却说断言失败**：自证⑤ 拿 `git status` **全文**做前后快照，而 `gates/**` 与未跟踪残留会在两次快照之间变（T-G194）；（iv）`ui_flow` **真卡死 56 分钟**：门禁给每道门**没有超时**（T-G196）。★ 四处里**三处的第一现场都是「工具自己崩/自己脆」，不是被测内容坏** —— 这个比例本身就是一条判据。**再给 7 条待做**（每条：防什么 / 怎么做 / 判据 / 代价）：`check_layers` 的引用完整性是 **O(引用数) 次 `git check-ignore` 子进程**（同一道自检今天 75s → 829s，会随提交数越来越慢）· 把「**假红三分类**」（同一条反复挂=时间敏感 / 换了条目=竞态 / 工具抛异常=工具脆）写进门禁输出并附单独重跑命令 · 门禁**整趟总预算**（现在只有每道门 1800s）· 派活器加 `--cwd`（今天连栽两口）· `--status` 跨树 · `psutil` 不在声明依赖里 · 内存闸（`T-G198` 已落）。**② `复盘/门禁去留提案.md`**（用户点名要的「逐门标 留/改/删」）：对用户点名的六项逐条给「现状真跑代价 / 建议 / 理由」—— 渲染基线（110~123s）· 对比度 / 风格 / 文案三道审美门（0.2~12s）· 流㉚ 暗色（~15s）· 流㉒ 偶发假红（~25s，**已治**：根因是值/文本就绪）· **复用判定（唯一强烈建议「改」的一条）**；其余 15 道门逐个给代价与理由，**建议全留**，且**「删」这一列一条都没提**（成本最高的 `ui_flow`/`render`/`pytest` 各自抓的是「唯一能被它抓」的那类事故；要删请用户点名）。★ **那条「改」**：**改了门禁输入的门，不许靠复用混过去** —— 具体做法是 `--seal` 前多一步核对（把本笔改动与 `REUSE_INPUTS` 比一遍，命中某道门的输入而这道门又是「复用命中」 ⇒ **拒绝封存**并点名「去跑 `--no-reuse`」）；判据 = 造一个命中 `tools/ui_flow_check.mjs` 的改动 + 造一条 `ui_flow` 复用记录 ⇒ 拒绝封存；纯文档笔（不命中任何门输入）⇒ 照常通过。**今天两次真回归都栽在这上面**：卡 095 自己那趟 `src/**` 没变 ⇒ 5 道真机门**全复用、一个服务都没起** ⇒ 它的端口段回归没被抓到，直到落卡 098（真机门真跑）才 24 条用例全红。**附带的一处卫生修**：`.gitignore` 把 `data/*.db` / `data/*.db-*` / `data/*.db.bak-*` / `data/*.png` 四条**窄规则换成整目录 `data/`** —— 因为 `data/` 里**一个被跟踪的文件都没有**（全是本地库/备份/截图），而窄规则**总会漏下一种命名**：今天 `git status` 一直挂着的 `?? data/` 就来自 `data/timeflow.db.before-acceptance`（既不匹配 `data/*.db-*` 也不匹配别的任何一条）。改完 `?? data/` 消失。**没动**：`scripts/run_gates.py` 的门判据/门清单（这一笔纯文档；那条「复用守卫」是**提案**，等用户点头才做）· 任何门的行为 · `docs/traceability.toml` 的既有条目。**★ 如实留白**：① 改进清单里的秒数是**这台机器**的实测区间（换机器会变）；② 去留提案里**没有**「删」的建议 —— 那需要用户的取舍；③ 两页都写明「**不是判据**，唯一真源是门清单 + `gates/last.json`」，防它们变成第二份会漂的真源（本仓为此吃过亏：T-G40「黄金自己漂」）。"

[entries."T-G201"]
id = "T-G201"
title = "外包号池的 MCP 只读面：六个只读工具（pool_plan/job_list/job_status/job_result/lock_status/pool_models）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool_mcp.py",
  "file:tests/test_pool_mcp.py",
]
gaps = "**需求（用户原话）**：「外包调用能不能做成 **MCP**，更适合不同窗口 AI 调用」→「**我会在 DSH 里不同窗口用**」→「你可以把之前相关的脚本集成进里面吗」。**病**：派活那套逻辑散在 6 个脚本里（`wb_plan` / `wb_dispatch` / `wb_status` / `wb_brief` / `wb_review` + `infra/pool/*`），**靠约定**（「主树要干净」、「切片里写工作树」、「别并行两池」），换个窗口的 AI 得从头学一遍；而且**同一个判据有好几份实现**（白名单越界在 `wb_review.py` / `wb_dispatch._outside_allow` / `tools/tf_stage_guard.py` **三处**、状态判据两处）—— 正是本仓最忌的「两份真源」。**这一笔只交「只读面」**（期 1）：新增 **`tools/pool_mcp.py`** —— **手写、零依赖**的 MCP 服务端（**stdio + JSON-RPC 2.0**，握手与报文形状**照抄本仓先例** `src/timeflow/mcp/server.py` —— 那份是被真客户端用过的），暴露**六个只读工具**：`pool_plan`（队列/冲突域，调 `wb_plan.py plan`）· `job_list`（扫 `gates/diag/wb-*.jsonl` 按**证据**分类：在跑/已判决/断了）· `job_status(card)`（调 `wb_status.py --repo`）· `job_result(card)`（读 `wb-<卡>.report.md` / `.verdict.txt` 原文，截断明示总长）· `lock_status`（`gates/diag/gate_lock.py status`）· `pool_models`（读 `infra/pool` 的白名单+快照求交）；每个工具都带 `annotations.readOnlyHint: true`。**验收（工人自测 + 主控逐条核对派活日志）**：① `initialize` 原样报文 = `protocolVersion 2025-06-18` / `capabilities.tools.listChanged=false` / `serverInfo {pool, 1.0}` + 一段 `instructions`（明说「六个都只读、派活/取消/提交/抢锁是期 2」）；② `tools/list` 原样报文六个工具名与 `inputSchema` 形状齐全；③ **未知工具名** → `{「error」:{「code」:-32602,「message」:「没有这个工具：'format-disk'；有：…（本服务只有只读工具…）」}}` 且**同进程下一条 `tools/list` 照常回话**（服务不崩）；④ **缺产物** → `… 既没有 wb-105.report.md，也没有 wb-105.verdict.txt（含 r2…）—— 没跑完 / 没派过 / 不在这个树里`，`job_list` 空树输出 `共 0 个日志（一个都没有）` + `（一个 wb-*.jsonl 都没有 —— 我没有假装有）`；⑤ **「六个工具都不写文件」**：跑前后 `git status --porcelain -uall` **逐字相同（SAME? True）**，且有一条钉子用例专测；⑥ **先红后绿**：把 `_classify` 的「在跑」故意改坏 → `test_job_list_classifies_by_evidence` 当场 `FAILED（assert '已判决' == '在跑'）`；改回 → 绿、被改文件 `sha256 0ee7cd1c…` **复原一致**；⑦ `pytest tests/test_pool_mcp.py` → **15 passed**；门禁同一口径 `pytest -q -n 4` → 退出 0、覆盖率 **93.71%**；`ruff`（含 `tools/`）`All checks passed!`。**★ 注册（工人给的、主控已核过没写进用户配置）**：DSH 的 MCP 注册点在 `C:/Users/example\\.dsh\\profiles\\desktop\\cordis.patch.yml`（这台机器上 arxiv/dblp/deepxiv/metaso 四个都在那儿），要加的是 `- id: mcp-pool / name: 「@deepseek-ai/dsh-mcp-client」 / config: {serverName: pool, transport: stdio, command: <python.exe>, args: [-X, utf8, <**绝对路径**>/tools/pool_mcp.py], env: {PYTHONUTF8: 「1」, PYTHONIOENCODING: utf-8}, toolCallTimeoutMs: 60000}`。★ 两个坑写进回报里：**`args` 必须绝对路径**（ROOT 由 `__file__` 推得，与 cwd 无关）；**`dsh-mcp-client` 起子进程会剥掉名字含 `KEY/PASSWORD/SECRET/TOKEN` 的环境变量与全部 `DSH_*`**（那份文件自己写着的），要用什么必须在 `env:` 里显式给。★ 主控核对：该配置文件 **mtime = 10-01 19:40**，工人跑在 21:56–22:17 ⇒ **只读没写**。**没动**：`tools/wb_dispatch.py`（卡 103 正在另一棵树改它；本卡只读）· `scripts/**` · `src/**`（**只读先例**，未改）· `docs/**` · `复盘/**` · `infra/**`（另一个仓，只读）。**★ 如实留白（四条）**：① **`pool_models` 读的是快照**（`models.live.json`，`at=2026-10-01 16:39:01`）**不是现场拉取** —— 卡写「走 `pool_models.py`」，但该脚本 `--check/--json` **会联网且会写快照文件**，两样都被本卡的禁区挡着 ⇒ 工人只读静态输入求交，**并在输出里明说「来自快照」**（这个口径主控认可：只读面不该联网、更不该写文件）；② **`job_list`/`job_status` 只读「当前树」的 `gates/diag`**，别的 worktree 的日志看不到 —— **跨树聚合未做**（这正是卡 093 自己报过的那条缺口，主控记为期 1.5）；③ 号池目录**不在本仓**，工人按「从 ROOT 逐级向上找 `infra/pool/pool_models.py`」来定位（卡里没规定怎么定位，是它自己加的）；④ **DSH 里真接一次没做**（要人工点，本卡只到「另一个实现能读懂报文」这一层）。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/poolmcp`，base `7a01916`，78 回合 / 88 次工具 / **0 次工具报错**，用时 20.7 分钟）；★ 工人未提交，提交与台账由主控做。"

[entries."T-G199"]
id = "T-G199"
title = "派活器 --cwd：工人必须在卡树里干活（脏检查看对树 + 切片第一行硬话）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/wb_dispatch.py",
  "file:tools/wb_brief.py",
  "file:tests/test_wb_dispatch.py",
]
gaps = "**病（今天连着栽两口，而且是**上一个工人自己报出来**的）**：`tools/wb_dispatch.py` 是拿 **`cwd=ROOT`（主仓）** 把 CodeBuddy CLI 拉起来的 ⇒ **工人的会话 cwd 落在主仓**，唯一的护栏是切片里那句「工作树：`.wt/xxx`」—— 全靠工人自己 `cd`。今天：**卡 100**（每道门加硬超时）没 cd，**直接在主仓改了 `scripts/run_gates.py`** 并新建了测试文件，`.wt/timeout` 一个字节没写；**卡 102**（内存闸）同样落在主仓，它**自己发现**并**两个树各放一份**同内容改动请主控裁量，还留了建议「卡规格与 brief 的『工作树』字段与实际派活树不一致，属**派活环节的口径漂移**（建议修正模板，使 `wb_dispatch` 真正 `cd` 进卡片指定的 worktree）」。⇒ 靠「切片里写一句话」拦不住，这一卡把它变成**接口 + 判据**。**做法**：① `git_dirty(cwd=None)` 加**可选取树**参数（默认不变）；② 新增 `is_git_worktree(path)`（走 `git rev-parse --is-inside-work-tree`，**非工作树返回 False —— 不静默当干净**）；③ `run_worker(..., worker_cwd=None)`，`Popen(cwd=str(worker_cwd or ROOT))`；④ `preflight(..., worker_cwd=None)`：给了就**查「工人干活的那棵树」**（那才是「一写一读」要护的地方）、把**主仓状态当提示**打出来、非工作树 → problem；⑤ `ensure_lean_brief` 透传 `--cwd`；⑥ `main` 加 `--cwd`（解析成绝对路径、透传 preflight/run_worker，`--help` 写明**派活产物仍落主仓 `gates/diag/`** —— 因为那目录被 gitignore、卡树里没有）；⑦ `tools/wb_brief.py` 加 `--cwd`，给了就把切片**第一行**写成硬话（「★ 你必须 `cd <绝对路径>` 再干活；在别的树里改文件 = 这一轮作废」）。**验收（工人自测，主控逐条核对派活日志）**：① **不给 `--cwd` 行为逐字不变**：`pytest tests/test_wb_dispatch.py` → **124 passed**（119 既有 + 5 新增），且 `git diff --numstat` = `104 0`（**既有断言零改动**）；② **给了 `--cwd`，工人进程真落在该树**：子进程**自报 cwd** = `…\\cardtree`，与 `--cwd` 给的树 `norm` 后**相同 True**；③ **卡树脏 → 拒派且点名**：`工作区不干净（工人干活树 …\\cardtree，1 个被跟踪文件有改动）→ 一写一读：先提交或收起它们： M tools/x.py`；④ **卡树干净 + 主仓脏 → 放行 + 主仓状态提示**（`PROBLEMS: []`，stderr 打「工人干活树（--cwd）：…／主仓状态：脏（2 个被跟踪文件有改动）—— 只提示，不拦派活」）—— 这一条正是今天主控为了派活白 `stash` 过一次的那个坑；⑤ **`--cwd` 指到非 git 工作树 → 退 2**（`--cwd 不是 git 工作树：…\\nope（一写一读要护的那棵树不在 → 不静默当干净）`）；⑥ 全量 `pytest --no-cov` → **1680 passed, 2 deselected**（exit 0）；`ruff` 对三个被改文件 `All checks passed!`（全仓 `ruff check .` 剩 5 条**全在 `gates/diag/gate_lock.py`**，非本卡、未碰）。★ **主控当场验证了这条修好没有**：卡 103 **自己**（它是第一张带着硬话切片的卡）在回报第一句就写「坐标自查：`git -C . rev-parse --show-toplevel` = `.wt/cwd`（卡树，不是主仓）」—— 与卡 100/102 的对照，这是**第一次**没栽。**没动**：`--status` 三态判据（T-G187）· 端口体检 `_resolve_port_bases`/`port_preflight`/`TF_DISPATCH_PORT_BASE`（T-G190/T-G195）· **内存闸** `available_memory_gb`/`gate_min_free_gb`/`memory_gate_problem`（T-G198）· 心跳 / 看门狗 / 429 / retry / 判决口径 —— **一字未动**。**★ 如实留白（两条 + 一条外溢）**：① `ensure_lean_brief` **仅在切片缺失时**才现生成并透传 `--cwd`；**已存在的 `brief-<卡>.md` 不会被重生成** ⇒ 那一份的第一行可能仍是老表头（**主控裁定：本期就这样**，因为「给了 `--cwd` 就强制重生成」会**覆盖主控手写的切片**——手写切片正是最有价值的那份；改为「派活时若切片第一行没有那句硬话就**告警**」留到期 2）；② `is_git_worktree` 走**子进程判据**（未 mock 真 git），本机实测通过；③ **外溢**：那句软话「工作树：{tree}」的**产地**其实是 `tools/tf_cardgen.py:80`（卡规格骨架），**不在本卡白名单**故未动 —— 主控已记下，归入「卡样板也要说硬话」。**来源**：CodeBuddy 号池（deepseek-v4.1-flash，树 `.wt/cwd`，base `7a01916`，**55 回合 / 68 次工具 / 0 次工具报错**，用时 32.8 分钟）；★ 工人未提交，提交与台账由主控做。"


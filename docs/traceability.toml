gaps = "**分格器**：gates/diag/归置.py（gitignored，一次性）；默认 dry-run、--apply 才真搬、--undo 一键回退；判定规则写在文件头（只按实证契约留根层，绝不写死文件名；子目录与 gates*.lock 一律不碰）。**假工作台**（临时目录、48 个根层文件）dry-run → 待分格 23（15 py → 一次性脚本 / 8 md → 复核与盘点）+ 留根层 25；--apply 后根层 26（含 .归置-moves.json）· 两格 15/8；--undo 后目录树与搬前 diff 逐字节一致、根层回 48、两格空目录自动删。**真树只读 dry-run**（主树 gates/diag/，未 --apply）：待分格 117（67 py + 50 md）/ 留根层 560；契约族一条都没进待分格表 —— 卡*.md 100 全留、wb-* 227 全留、元卡R-只读复核.md / gate_lock.py / verify_i9.py / make_R.py / wb_dash.py 各留 1；gates*.lock 本树现无、规则上属禁区不碰。**§1.3 五条管线**（本树，TF_GATE_PORT_BASE=9211 / TF_PYTEST_WORKERS=2）：wb_brief --card 084 → 3436 字节 + 五节齐全、退 0；wb_dash --help 退 0；wb_verify --tree . --expect-parent d8ed19c 退 0（SUMMARY OK=6 / FAIL=0；卡里写的 --expect-parent 325541b = 本笔提交的父，要等本笔提交后才为真）；wt_prune dry-run 退 0、.wt 树数 before=89 = after=89；pytest tests/test_wb_dash.py + test_wb_dispatch.py + test_wt_prune.py + test_gate_lock_multi.py + test_gate_lock_lease.py → 177 点全绿、退 0。**地图**：docs/归置地图.md 4070 字节（≤6144）· 七节（六格 + PC/APP 两面 + 契约清单 + 别读这些）· 地图引用的 30 条已跟踪路径现跑全 OK · src 清单以 git ls-files src 为准（63 = timeflow 56 + web 7）。**§24.14**：追加 12 行、numstat +12 -0（既有 §24.x 一行未改）。**边界（如实）**：wb_brief.py:271 兜底分支 *<卡号>*.md 比 卡*.md 宽，本卡按契约表只保 卡*.md，该兜底未被触发（正常卡都有 卡<号>-*.md）；txt/log/jsonl/toml/ps1/mjs/diff/db 等非 .py/.md 的根层文件**未分类、留原地**（卡片只定了两格，不自己加格）。**真树未删**：.wt 89 棵一棵未删、未对真树跑 --apply、未碰 gates*.lock、未动 .wt/**、顶层 4 份外来 md 与 data/ 未搬未删未改。"

[entries."T-G181"]
id = "T-G181"
title = "复用口径与生成物无关：input_hash 排掉 __pycache__/*.egg-info/*.pyc + 跨树一致钉子"
group = "ENGINEERING"
status = "done"
evidence = [
  "file:scripts/run_gates.py",
  "file:tests/test_gates_reuse_line.py",
  "file:复盘/口径坑.md",
  "file:docs/归置地图.md",
]
gaps = "**§0 缺陷现算坐实**：`scripts/run_gates.py` 的 `input_hash()` 把 glob 命中的【未跟踪生成物】也算进哈希（glob 按**工作区**匹配）。主树现算 `render` 命中 171 个文件、本树 111 个 —— 主树多出的 60 个**全是生成物**：7 个 `src/timeflow.egg-info/*` 与 53 个 `src/**/__pycache__/*.pyc`。**修法**：`input_hash()` 按路径排掉四类（`__pycache__/` 目录下任何文件 · `*.pyc`/`*.pyo` · `*.egg-info/` 目录下任何文件 · `.pytest_cache/` 下任何文件），写成显式常量 `GENERATED_DIR_NAMES`/`GENERATED_SUFFIXES`（+ 谓词 `is_generated` + 一行为什么注释），docstring 补原因。**没动门清单**：`REUSE_INPUTS` 的门清单与 `src/**` 宽度一字未动、`skip_reused` 语义未动、`staged_tree`/封存指纹未碰（`git diff` 只落在 `input_hash` 区段与新增的 14 行常量/谓词）。**跨树一致两个 hash**（小自造树、同一份内容造 clean/dirty 两处，dirty 多出 `__pycache__/*.pyc` + `*.egg-info/*` + `.pytest_cache/*`）：修前 clean=`0c92d0cef304e558` vs dirty=`6303ca4e75e20137`（不同）→ 修后两者都是 `0c92d0cef304e558`（**相同**）；另一组用真 `render` 口径 clean=dirty=`709bbef6ba0c12d4`。**生成物不影响读数**：同一棵 clean 树再塞进 `x.pyc` + `other.egg-info/top_level.txt` + `.pytest_cache/v/cache/lastfailed` → hash 前后都是 `709bbef6ba0c12d4`（**不变**）。**防恒真两条**：改普通 `src/a/util.py` 一字节 → `709bbef6ba0c12d4`→`c10d151ea4700e0b`（变）；新增普通 `src/a/brand_new.py` → `c10d151ea4700e0b`→`1ca9ae0131b66387`（变）。**用例末行**：`pytest tests/test_gates_reuse_line.py` → **20 passed**（★与卡偏差：卡写「既有 12 条 + 新 4 = 16 条」，实测既有已是 **12 个函数**但 `test_every_reusable_gate_treats_src_as_an_input` 被 parametrize 成 5 个用例 → **既有 16 个用例**；16 + 新 4 = 20。既有 16 个用例一条未放宽，见 numstat）。**旧记录失效一次（自愈，不是 bug）**：哈希口径变了 → 本树 `render` 旧 `f1248a5636313570` ≠ 新 `e12a6f361b24a729`；`lf1_live`/`ui_flow`/`web_live` 旧记录同样对新哈希对不上，`ui_dom_probe` 恰巧一致（其输入 `src/web/**` 未变）。下一轮这几道门**真跑**一遍后按新口径重落盘。**另**：`复盘/口径坑.md` 末尾追加第 9/10 条（既有 1-8 条一字未改）；`docs/归置地图.md` 契约清单表后补「活件（也留根层）」一行 —— ★该行点名的 4 份活件（`自动推进表.md`/`归置.py`/`_portcheck.py`/`_refcheck.py`）是 **gitignored 的一次性件、只存在于主树**，本 worktree 里没有（`git ls-files` 查无、盘上也不存在）—— 地图描述的是整个工作台、对主树为真。**没动什么**：`src/**`、别的 `tools/**`、别的 `scripts/**`、别的 `tests/**`、`docs/**` 除归置地图/changelog/traceability、`复盘/` 除口径坑/交接进度、`gates/diag/**`、`.wt/**` 别的树、主树 4 份外来 md 与 data/ 全未碰。"


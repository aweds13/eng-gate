gaps = "**为什么有这一条**（T-G120，用户 2026-09-26 直接指示）：① **模型白名单** —— 用户明令「**任务未经我允许，不准给 kimi，给 glm5.3 flash**」。背景：那天 `deepseek-v4.1-flash` 与 `glm-5.3` 先后被限流，我**自己**把后续卡换成了 `kimi-k3-1`（判据只是「探到它还能用」），**那是主控替用户做的决定，事后被明确否决** → 规矩写死：派活命令显式写 `--model glm-5.3` 或 `--model deepseek-v4.1-flash`，**换任何别的模型之前必须先问用户**（哪怕这两个都被限流；未到重置时间就停下等）。★ **模型选择是用户的决定，不是主控的**。② **限流时的正确反应**：不换模型；并且记下两个真踩过的坑 —— 前置检查的「登录自检」用**默认模型**发请求，默认模型被限流时**所有派活都会被拒**（现象是「前置检查没过」，根因是登录不通），这时才用 `--no-preflight`；判决里 `error_during_execution` + 空回话 **不等于**撞回合上限，要看 `result.errors`（`429 … category: quota` 才是配额），该判据已立进卡 `029`（T-G114）。③ **拆 worktree 前必须证据留档**：把 `wb-<卡>.dispatch.log`（★ 含 `--model` 那行，是「这张卡用了哪个模型」的唯一凭证）、`.verdict.txt`、`.report.md` 拷回主树 `gates/diag/` —— ★ **真丢过一次**：跑在 worktree 里的那批卡（换 kimi 的那几轮）日志随树一起没了，事后**从仓库里查不出哪张卡用了哪个模型**，只能靠会话记忆；这一步同时写进集成者收尾步骤（卡 012b/012c §2.7）。**没动的**：`tools/wb_dispatch.py` 的默认模型（本来就是 flash，在白名单内）、用户的 `docs/workbuddy-cli-使用指南.md`（**那是用户的文件**，只在 §19 里写规矩、不去改它）、任何代码。 ★★ **2026-09-26 更正（用户当场指出）**：本条里那句「只准 `glm-5.3` 与 `deepseek-v4.1-flash`」是**主控误读** —— 用户原话「glm5.3 flash」指的是**模型名 `glm-5.3-flash`**（CLI 支持列表里 `glm-5.3` 与 `glm-5.3-flash` 同时存在），**不是「glm-5.3 + flash 两个模型」**。§19 已按更正后的口径改写（只准一个模型 `glm-5.3-flash`）；两条排队卡的规格顶部那行也一并更正（T-G121）。**原文保留不改**，以存其真"



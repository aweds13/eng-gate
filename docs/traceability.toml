  "test:test_web_frontend.py::test_r5_scale_tokens_are_the_only_way_to_write_sizes",
]
gaps = "**落地完成（2026-09-25）**：用户 2026-09-24 选的候选 C 已全部并进 `app.css` 与标记层。① 层次 —— `.card` / `.panel` 补 `1px solid var(--border)`、去掉 `box-shadow`；`--shadow` 归位成**浮层专用**（只剩 `.modal-box` 用；包的原话就是 `overlays only`）；`.card.selected` 只留 2px 环。② 尺度收敛 —— 间距 **11 档 → 6 档**（4/8/12/16/24/32）、圆角 **5 档 → 3 档**（8→6、12→10），**名字也一并并掉**（同值两个名字＝同一档的两种写法；档数报告按**令牌名**数，见 `tools/style_audit.py`）：`app.css` **92 处引用改名** + 测试 2 处，另加一条**棘轮断言**（只许 6 档间距 / 3 档圆角）。③ 两类同义卡片归一 —— `.card.panel-card` 删除、**29 处标记改名**成 `.card.block`，并把原来只给面板卡的两条间距（`.title` 下边距、`.form` 外边距）摊给所有块内容卡。④ 读数卡静音面 —— 候选里用 `:has()` 只是**预演**，落地换成显式类名 `.card.quiet`（环 / 本周柱状 / 主读数 / 学业雷达 / 两个 GPA 读数，共 **6 张**），渲染黄金从此钉得住它。⑤ `--muted` 跟包（亮 `#5b6472` / 暗 `#8a93a6`）并把这一对补进 `contrast_audit.py` 的 `TOKEN_PAIRS`（组合 34 → **36**，全达标）。**★ 预演抓到的那条缺陷的正式修法**：`--panel-2` 当形状的两笔（`.ring-track` / `.axis-line`）改画 `--border`。**尺子与代价**：42 份黄金**全动**（属有意改版，理由已落 `gates/render/LAST_UPDATE.md`）；`squeeze_scan` 0 → **8 处**（1px 边框每边吃掉 1px 内容宽，把 `phone__offline` 的「完成」顶成两行）→ 补 `.card > button { white-space: nowrap }` 修掉（只限**直接孩子**：`.card .row` 里的按钮靠容器换行，用户数据类的长标签不许被 nowrap 顶出容器），再回 **0 处**。**没做（如实记）**：① 包的中性色阶整体搬（`--bg` / `--panel-2` / `--border` / `--ink` 都取包的值）—— 候选 C 的注释就把它留给了下一张卡：进度条槽、热力图空格这类「靠浅底当形状」的地方要一并补 1px 边框，是另一份工单；② **字号档位没动**（候选 B 的注释把 `--fs-*` 留给步 3，而步 3 的实际范围只写 `--fw-*`/`--lh-*`；字号一动全表重排、且没有出过预演图，所以不夹带）；③ **暗色主题没有渲染基线**（渲染层只采亮色）—— 暗色的 `--muted` / `--shadow` 按令牌级对比度门核过，但整页暗色版式仍是老账。 ★ **2026-09-25（T-G70）把本条「预演抓到的那条缺陷」量了**：`.ring-track` / `.chart-grid` / `.chart-axis` 画的 `--border` 落在静音面上是 **1.10（亮）/ 1.20（暗）** —— 比原来 `--panel-2` 当形状（1.12 / 1.11）**只好了 0.01~0.09**。方向仍对（「形状靠一条线」是包的写法），但**不能说「看得见」**：按 WCAG 1.4.11 它们属**纯装饰 / 背景结构**（数据由 `--accent` 那几笔承担：亮 4.07 / 暗 6.04 达标），所以如实进 `AA_NONTEXT_EXEMPT` 纯装饰表、**不当判据**；真要按 3.0 画就得换 `--muted` 那一档的灰（雷达网格会变成明显的中灰）—— 这是一条**判断**，列在 `复盘/非文字对比度-T-G70.md` §4 的复议清单里。 **护栏**：`tests/test_web_frontend.py` 的 `test_cards_have_two_levels_and_the_quiet_one_keeps_its_shapes`（同义类不许回来、静音面上那两笔必须画 --border）与 `test_typography_and_bare_inputs_go_through_tokens`（行高只许令牌、输入框元素级规则）。"
[entries."T-G50"]
id = "T-G50"
title = "视觉线·步 2「层次语言」的候选预演机制（用户 2026-09-24 选 **C 静音层**）：往真界面注入候选 CSS → 截图 + 量数 + 用门自己的算法预演对比度；★ 预演当场抓到「浅底当形状」消失这个真缺陷"
group = "PROCESS"
status = "done"
evidence = [
  "file:tools/candidate_shots.mjs",
  "file:tools/candidate_contrast.py",
  "file:复盘/视觉线步2层次语言-T-G50.md",
]
gaps = "**为什么单独建机制**：`T-G30 §5` 定了口径 —— 从步 2 起改动**看得见**了，所以判据不再是「超没超过某个数」，而是「你要哪一种」；而**人只该在有意的视觉改动时看一眼**。于是流程改成：**先给能看的（候选 + 渲染快照）→ 选定 → 再改代码**。做法上**不改三遍 `app.css`**（那样每次都要改真文件、跑门、回退，回退漏一处就是脏树），而是**往同一个真界面注入覆盖层**：一个后端、一份种子数据、一个浏览器，候选之间只差一个 `<style>` —— **比较的变量只有一个**。① `tools/candidate_shots.mjs`：起真后端 + 真浏览器，3 档宽度 × 14 视图截图 + 从计算样式现读的四个数（页高 / 卡片数 / 有边框 / 有阴影 / 非白底），数字表落 `gates/render/candidates/NUMBERS.md`；候选 CSS 与截图**都不入库**（`.gitignore` 加了 `gates/candidates/` 与 `gates/render/candidates/` —— 它们是「选定那一刻就过期」的东西，决策本身记在 `复盘/视觉线步2层次语言-T-G50.md` 与 app.css 注释里）。② `tools/candidate_contrast.py`：**import 门自己的算法与组合清单**（`contrast_audit` 的 `declared_pairs/badge_pairs/state_pairs/evaluate`）在候选令牌上预演 —— 它**不改文件、不写 last.json、不是提交闸**，只回答「这个候选里有没有新欠账」。**三个候选是嵌套的**（A 边框做层次 ⊂ B 尺度收敛 ⊂ C 静音层），所以用户选的是「走多远」：A = 卡片/面板补 1px 边框 + 阴影归位成浮层专用（包明文：`.wb-card` 有边框、阴影注释写着 `overlays only`）；B = A + 间距 11 档 → 包的 6 档、圆角 5 档 → 3 档（就近并档：4→4 6→8 8→8 10→12 12→12 14→16 16→16 18→16 20→24 24→24 30→32；圆角 6→6 8→6 10→10 12→10）；C = B + **读数卡**（环/条形/大数字/雷达）退到 `--panel-2` 静音面 + `--muted` 跟包（`#5b6472`，更深）。**★ 预演当场抓到一个真缺陷**：C 把读数卡涂成浅底之后，**完成度环的轨道与雷达的网格线直接消失** —— 它们本来就靠 `--panel-2`（同一档浅色）画形状；修法照包（`.wb-progress__track` = 浅底 **+ 1px 边框**），SVG 里等价物是把那一笔换成 `--border`，**补完重拍才拿到用户面前**。**对比度也是同一件事的两半**：A/B 会让 `--muted` 落在 `--panel-2` 上只有 **4.23（不过 AA）**，C 跟了包的值之后 **5.32** —— 所以「静音层」与「muted 跟包」不能只做一半。**实测数字**（desktop 档，「页高 / 有边框 / 有阴影」）：today 1065/0/6 → A 1077/6/0 → B/C 1178/6/0（C 卡底 2 种）；setting 6317/0/15 → A 6379/15/0 → B/C 6672/15/0；phone/setting 8777 → 8809 → 9207。**没做（本卡是机制，落地是下一步）**：把 C 并进 `app.css`（含 `.card.block` 与 `.card.panel-card` 两对同义类合并 + 29 处标记改名）、42 份黄金按理由重采、`squeeze_scan` 前后各跑一次。"


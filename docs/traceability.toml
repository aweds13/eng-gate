gaps = "**定位**：与 复盘/集成十一张并行卡-T-G153.md 分工 —— 那份讲怎么并、有没有丢活；本份讲为什么这么慢、贵在哪、下次怎么不这么慢（波级过程代价 + 流程改进，同一处入库）。**六起事故与代价**：① PYTHONPATH 假绿三张 UI 卡各撞一次（057 约 20 分钟定位读数在案，058/060 部分读数未留存）→ 063 修根因；② 按进程名清端口跨树误杀（059 约 45 分钟纯等端口/锁，本波最大单笔白吃）→ 062 端口按树隔离；③ 062 第一版清理误杀 060 在跑的门禁（两门 exit 13 实读，重跑分钟读数未留存）→ 判据加 cwd 树判据 + 陪练进程反证；④ 066 漏写共享三件审计当场红（工人提交 918ca07 → amend 成 3deeb47）→ 规矩补限定语；⑤ 064 第一次尝试秒死（0 字节日志）判决差点误导清场、实为 r2 在干活（46.6 分钟/71 回合）→ 判据用变新不用存在；⑥ 集成笔 amend 破坏门禁 provenance（last.json rev 指向孤儿 f816b3e → 本仓自带测试红，返工约 49 分钟）→ 由只读复核 RI9 抓出并重做。**铁律索引**：23–31 九条逐条 text: 指针 + git grep 命中数（2/2/5/2/3/2/2/1/1）。**耗时分解**：工人墙钟合计 535.3 分钟、回合 1128（11 份 report 头部相加）；可归因浪费约 114 分钟（占约 21%）= 059 等待 45 + 057 定位 20 + 集成返工 49；两笔读数未留存（060 门禁重跑、058 撞单次调用上限的 token 占比）；工具层 vs 模型层占比读数未留存（耗时拆解.py 在本批日志上工具计时恒 0，已如实记为工具局限）。058 token 读数 37,319,077（verdict 原文，≥ 预算 25,000,000 止损）。**下一波改进五条**：端口段写进卡规格 / worktree 开工 30 秒自检 / 超 8 分钟命令一律 run_bg / 卡模板统一提交后再 audit / 波级收口固定只读复核卡 —— 全部有本波读数支撑。**没动什么**：代码区零改动（git diff --stat b90c4e4 -- src tests scripts tools 为空）、gates/diag 工作台只读、各树只读、data/ 与外来未跟踪文件没碰。"


[entries."T-G162"]
id = "T-G162"
title = "左栏整理：三项智能视图各自独立可选（默认全关+老偏好迁移）；「离线记」移出 PC 左栏（挪进设置→数据）"
group = "F"
status = "done"
evidence = [
  "file:复盘/左栏整理与离线记挪位-T-G162.md",
  "text:src/web/index.html::migrateRailPrefs",
]
gaps = "**为什么有这张卡**：用户 2026-09-27 原话「我没有说切换，把它们放在左栏固定」+「离线记偏 App 端，为什么放在 PC 上」，同日更正「我不是说并成一组固定在左栏，我是说能自由选择」。**原实现（T-G154）错在哪**：把三项做成一颗总开关（在左栏显示/从左栏收起），只有一个布尔、名字也不显式（用户说「我没看清楚」）。**本卡改法**：设置→外观「左栏智能视图」拆成三个独立按钮（名字显式+状态写在名字后面：`重要（在左栏）` 等，模板按 `SMART_RAIL_VIEWS.map` 逐项生成）；状态 `railViews` 按项存；新键 `tf_rail_views` 存 JSON 数组（哪几个开着），不再存布尔。**默认值与老偏好兼容**：默认沿用 T-G154（三项全关，用户只要求能自由选择没要求改默认）；迁移函数 `migrateRailPrefs(旧键, 新键)`——新键存在以新键为准（迁移只走一次），否则旧键 `on`→三项全开、`off`/未存→三项全关；启动时迁移并落进新键，旧键只读不写。**分组怎么做的**：没有分组/没有标题/没有固定——用户更正后只要逐项自由选；左栏还是原来的排法、按项 `hidden`。**离线记挪到哪**：PC 左栏 `data-view=offline` 按钮删除；PC 通路保在设置→数据的 `set-offline` 小节（「打开『离线记』这一页」按钮，原有，未动）；离线引擎（offline.js / IndexedDB 队列 / 包格式 / 导入）一字未改。**手机端入口未动**：顶部提示条 `offlineBar` 原样；`git grep -c smartViewNavHTML` 改前 4 = 改后 4。**黄金重采范围**：全量（桌面档左栏是公共区域少一颗按钮，设置页外观节三档都渲染，不存在零改子集）；份数以 `gates/render/LAST_UPDATE.md` 为准。**卡内矛盾（如实写）**：卡标题/§4 提交信息/§5 读数 1 写「默认显示并成一组」，与 §2.1（更正后口径：自由选择、默认全关）冲突——按 §2.1 执行，读数 1 因此不成立（实测：未存偏好 → 三项全 hidden）；提交信息按实际行为改写。**反证读数**：行为流 ㉙ 重写为 13 项断言全绿（默认全关/只开 planned 只出 planned/刷新保持/迁移 on→全开落新键/逐项收起）；静态新增 `test_left_rail_views_are_individually_chooseable`、`test_mobile_offline_capture_is_wired_and_honest` 左栏断言换方向；前端 109 passed；ruff 全绿。**坑**：树里直接跑 node 工具忘带 `PYTHONPATH=$PWD/src` 时 serve.py 会加载主树旧壳（两次假红），带上后同条件全绿。**没动的**：src/timeflow、scripts、docs/commands.toml、离线引擎、手机端入口、左栏三项 markup。"



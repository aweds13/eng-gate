  "file:tests/test_wb_review.py",
]
gaps = "**来路**：外部审查 GLM-5.3 的 **三.1** —— 它自己在报告里把这条标成**判据漏洞里最狠的一条**：「**栅栏域检查吃的是自报清单**。`cmd_claim` 的 `--files` 由**交申请的一方自己填**，`check_domain` 只对这份自报清单做 fnmatch。**没有任何一处**拿『卡树里实际改了什么（`git status` / `diff`）』与域比对 —— 真实越界**只要不自报就全绿**。」与它 **2.2** 合起来：**同一个「域」有 4 份声明、2 套匹配语义，没有任何判据要求一致**。★ **这一条不是纸上问题 —— 今天刚被人肉顶过一次**：本主控收 `B-FIX1` 时，是**手工**在每棵卡树里跑`git status --porcelain -uall` 再跟白名单对眼，才发现在**卡 125** 那棵树里它**多改了 3 个域外文件**。**本笔就是把那点人肉变成机器判据。****做法（卡 131，`.wt/realdomain`，门禁层）**：1. **实际改动** = 卡树里的 `git status --porcelain -uall --no-renames` 结果里的**路径集合** ——★ **含未跟踪文件**（工人新建的文件最容易漏，而那正是「越界」最常见的形态），改名/删除也算。2. **权威域** = 优先**任务栅栏的预声明**（`gates/diag/batch/<任务>.toml` 里该成员的 `paths`），否则**队列** `docs/workbacklog.toml` 里该卡的 `files`；★ **两个都查不到 ⇒ 拒**（**不猜空域** ——空域能骗过一切守卫，`guards.py` 的模块头专门写了这条）。3. **域外 ⇒ 非零退出 + 逐个点名**（文件 + 属于哪张卡/哪个成员 + 域是什么）。4. **手打的 `--allow` 降级**：只在**没有权威域**时才用，且**必须打印一行**「这一趟用的是手打白名单，不是权威域」—— 治的就是审查说的「最后只剩主控手打接力」。5. **显式豁免** `--waive <路径>`：放行但**留痕**（打印 + `--json` 有字段）——理由与栅栏的 `waive` 同源：**不能因为一条缝就把整条判据关掉**。6. 落点：只动**复核侧**（`tools/wb_review.py` + `tools/pool/review.py`），**没动** `tools/pool/task.py`（栅栏本体只被**读**预声明）—— 复核侧才是「最后一道人肉」的位置。**验收（工人自验，主控复核）**：★ **先红后绿**：实现前 `pytest tests/test_wb_review.py --no-cov`= **9 failed, 12 passed**（`--card` 还是未知参数、`changed_paths` 还不存在）；实现后同一命令 = **21 passed**；`ruff check tools tests` = **All checks passed!**。★ **它自己踩到并修掉的一个真坑（值得记）**：原 `git()` 会 `.strip()` 前导空白，而 porcelain 的` M src/a.py` **状态列本身就是空格** ⇒ 路径被读成 `rc/a.py`（**少一个字符**）⇒ 新增 `git_raw()`只 `rstrip(「\\r\\n」)`。★ 若没抓到这条，判据会把**所有已跟踪改动**都读成错路径 —— 看着绿，其实没查。**★ 老实说（边界）**：① **`--card` 模式不跑 ②③④⑤**（那是「提交未落」时不适用的那几条）；对**提交**的第 ④ 条原样保留、未改 ——⑥（工作区）与它是**互补**，不是替换；② porcelain 里需要 git 加引号的**罕见路径**（控制字符/引号本身）**不做反转义**（本仓中文路径走`core.quotepath=false`，不受影响）—— 如实写进注释；③ `--waive` 只对**确实豁免了域外项**的留痕（对域内路径的 `--waive` 不留痕，避免噪音）；④ 未跑全量门禁（按卡）、未提交。"

[entries."T-G229"]
id = "T-G229"
title = "收尾批：两份白名单对账判据 + Gates trailer 真伪判据 + 文档口径两件 + 真仓 changelog 历史倒置换位"
group = "OPS"
status = "done"
evidence = [

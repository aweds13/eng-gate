gaps = "**补的是「每个元素各过各的」最大的那一层**：整张样式表里 `:hover` 与 `:focus-visible` 各 0 条（一致性门登记表的头两条）。三条口径照 workbench 抄，不自创：① 悬停**只动 background / border-color / color**（包原话：Hover moves background/border/colour only），一个语速（`--dur-hover: .12s` + `--motion-ease`，并跟随系统 `prefers-reduced-motion` 归零）；② 实心强调底**往墨色挪一步**（`color-mix(in srgb, var(--accent) 88%, var(--ink))`）—— 亮色变深、暗色变浅，两边对比度都**上升**（5.22 / 8.13），而「自己发明第二个强调色」正是包明确拒绝的做法；幽灵/导航 hover 用 `--panel-2` 浅底 + `--ink` 字；③ **焦点环一条全局规则**（`outline: 2px solid var(--accent)` + `outline-offset: 2px`，只在 `:focus-visible` 生效）。**四处必须分开写而不能靠继承**（都写进代码注释）：`:not([disabled])` 会带进一个属性选择器的权重（`button:not([disabled]):hover` = 0,2,1 **高过** `.ghost:hover` = 0,2,0），所以 hover 一律一条条写全、放在全表最后；已勾选的圈不能被「未勾选才给浅底」那条洗掉；当前页的底部 Tab **不给底**（它的颜色就是「你在这一页」的信号，而强调色小字只允许落在 `--panel` 上）；toast 里的按钮**不能套 `--panel-2`**（亮色下那是浅灰、toast 的字却是白的）→ 改成往横幅里掺 14% 字色（**不透明**，所以对比度门算得了）。**副产品（比补 hover 更重要）**：对比度门从此**真读悬停态** —— `state_pairs` 从 CSS 现算「底 + 字」，底认 `var(--x)` 与两令牌 `color-mix` 两种写法，字优先取同一条规则、否则取基础选择器那条；组合数 30 → **34**，两对新组合全部达标。带 `transparent` 的合成底**算不了**（得知道它铺在什么上面）→ 如实跳过，不猜一个底出来（「猜出来的绿比红更坏」）。**同时销账 4 条一次性裸值**（收敛到最近的档，都会动 2px 版式，逐视图重生黄金并逐行点名）：`.swatch` 圆角 `50%` → `var(--r-pill)`（方形元素上两者同一个圆，而包只有三档圆角）、`.rail nav` gap `2px` → `var(--sp-1)`、`.card.panel-card .title` `margin-bottom: 2px` → `var(--sp-1)`、`.fact` `padding: 3px 0` → `var(--sp-1) 0`。**没做**：`literal:line-height:1.5` **故意留着**（它是步 3 排版节奏的工单：只把这一处换成令牌、而全表其余仍「行距靠默认」，那是把债洗白）；`.card.selected` 的 `box-shadow` 圈、`.card` 的 `--shadow` 仍待步 2 定（包的规矩是「层次=1px 边框」）；非文字（状态点/描边）仍只靠令牌级 4.5 地板兜着，没有单独的 3.0 组合表。 ★ **2026-09-25（T-G70）**：这句的后半 **已补上** —— `AA_NONTEXT_PAIRS` 14 条（控制边界 / 勾选圈 / 状态点 / 图表数据笔 / 逾期红条，逐对 ≥3.0，没有登记表）+ `AA_NONTEXT_EXEMPT` 11 条（纯装饰，只量不判）。但**仍然只剩一半**：**悬停/选中态下的非文字**没被量（悬停补的那三对是「字 / 底」，不是「线条 / 底」）—— 如实留在这里。顺带量到一条真缺陷：输入框边框 **1.23 / 1.33**（框底与卡片底同为 `--panel`），修法是拆出 `--border-control`（3.64 / 3.55）。**同一张卡的第二件（挤压）**：病根是「**不换行的 flex 容器 + 中文处处可断行**」—— flex 先压缩、压不动才换行，而中文的 min-content 低到**一个字宽**，于是文本被压成竖排、按钮被压成两行字，而右边其实还有地方（实测 390px：习惯卡标题列 128×32、『已打卡（点此取消）』86×73、『改名』43×56、摘要卡那行 68×80、分组名 19×42）。三处改法都是「**让它换行**」而不是「把它调宽」：`.habit-head` 补 `flex-wrap: wrap`（它是唯一漏掉 wrap 的动作行）、习惯页摘要卡 `<div class=\"card\">`→`<div class=\"card block\">`（卡里是两个块级孩子，却被渲染成 flex 行；三档宽度都受影响）、分组名 `<span class=\"grow\">`→`<span class=\"grow minw-160\">`（右边那个 select 按内容撑宽，把名字压到 19px → 给名字一个宽度下限，行就换行）。**凭证是量出来的**：先补了一把尺子 `tools/squeeze_scan.py`（从 42 份渲染清单里找「文字一行放不下 + 真的换行了 + 拿到的宽 < 容器 70%」——**诊断工具，不进门禁**，因为字宽是估算、硬门迟早被误报写进白名单），修复前 **11 处**（5 个视图）→ 修复后 **0 处**；黄金改 6 份（habit × 3 + setting × 3，其中 desktop/narrow 的 setting 只有选择器字符串多了 `.minw-160`、几何逐行相同）。**顺带量到、这次不动**：① 手机任务卡标题列被 10 个动作按钮压到 128px（改法涉及「手机要不要把动作收进…菜单」，属产品口径）；② **5 个输入框没穿衣服**（`#exportDir`/`#vaultName`/`#vaultDir`/`#syncPath`/`#archiveDays` 是浏览器默认外观）—— 根因是我们按上下文给 `input` 上样式而 `select` 有元素级规则，**已单独立卡 T-G46**，不塞进这一条。"


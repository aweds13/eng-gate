`LastServedAt` / `Last` 无对应物：magpie 的 `*` 咬的是「这个号上次**答过话**」（`served.go:24` 的 30 天窗口），pool 只有 `recorded_at`（上次**读到额度**的时刻）。两者不是一回事（一个号可以「昨天答过话、今天没读到额度」）⇒ 星号在 pool 里该读作「最新读到的」，不是「最近答话的」，**语义已经漂了**。想真对齐得先有「谁答过话」这本账。

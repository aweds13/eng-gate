# 五层台账（机器可读真源）—— 手写维护（本条注释由 2026-09-18 框架落地时更新）
#
# 状态词表：done=已做到（断言必须全过）/ partial=半成品 / todo=没做 / deferred=规格自标二版或后置
#           broken=声称 done 但证据对不上（审计必须 FAIL）
# 证据语法：file:路径 | text:路径::要包含的文字（或 text:路径::re:正则）| route:方法 路径 |
#           table:表 | column:表.列 | ui:data-action=x | ui:view=x | test:文件名
# 规则：status=done 必须至少 1 条证据；partial/todo/deferred 必须写 gaps（说明缺什么）
#
# ★ 编号规则 A（2026-09-20 用户定，全部条目按它校正过；见 `复盘/台账编号校正-方案A落地.md`）：
#   ① `SR-Fx.y` / `SR-NFnn` = **规格条目**，台账条目的含义必须与规格里同号的条目一致
#      （标题约定以规格原词开头，让"这张卡属于哪条规格"一眼可见）；
#   ② 一条规格被拆成多张卡 → 加小写后缀（`SR-F1.1a` / `SR-F1.1b`），后缀卡算同一个规格条目
#      （`scripts/audit_progress.py` 覆盖检查、`scripts/audit_titles.py` 对账都按**基号**判）；
#   ③ 不属于任何规格条目的**实现层自造卡** → 只用 `T-*` / `STEP-*` / `OP-*`，**不许**用 `SR-` 前缀
#      （`audit_progress` 会 FAIL，`audit_titles` 的 `--check` 会 FAIL）。
#
# [exceptions]：已知欠账（**逐条留痕、修一条删一条**），不许静默豁免。两种用法：
#   ① 声称 done 但某条断言暂时不成立（③ 声称=证据 会打印为"已豁免"）；
#   ② **有意拆分的任务**：Task 提交只覆盖了条目的一部分（如 T-B5 前半字段+界面、后半等用户选型），
#      条目如实保持 partial，但 ⑥ 进度对账不再报"台账漏更新"（同样打印理由）。
# [meta.acknowledged_routes]：确认过但暂不单独登记的运维/根路径。
#
# ★ 门禁收紧三条（T-G22，2026-09-23 用户点名加的，都在 scripts/audit_progress.py 里）：
#   ⑧ [meta.trailer_baseline]：从这条提交往后，**每条提交的 `Task:` 必须恰好一个台账编号**
#      （多余编号写 `Refs:`）。基线之前的历史没有 trailer（框架落地前），不追责。
#   ⑨ [contract_ops] + [acknowledged_ops]：`docs/contracts/**` 里每条 `OP-nn` 必须挂在**一张**台账卡上；
#      操作自己就是一张卡（`OP-1`…`OP-12`）时算自动覆盖；实在没法挂的写进 [acknowledged_ops] **带理由**。
#   ⑩ 母条/子卡一致性：规格条目仍 `todo`、但引用同一个 `N` 的实现卡**全都 done** → FAIL
#      （T-G18 抓到的 `SR-F1.7` 就是这种）。只查 `todo`：`partial` 可以合法地"卡片都完了、
#      还剩一句不靠卡片的缺口"。


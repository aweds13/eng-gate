gaps = "本笔落**第三步（问 MCP）的产物**：`复盘/外部做法-问MCP答案.md`（四族答案 + 本机凭据实测 + **新旧账对照表**）。★ 诚实缺口五条：1. ★★ **这是二手汇总**：四路子代理问回来的 arXiv 编号**我没有逐条打开原文**（新编号尤其）。文档里已按「核过 / 未复现」分级标注，并在文首写明 —— **要动手改代码之前先核原文**。2. **文档里的「落到本仓」全是建议**：本笔**一行代码都没改**，只是把「外部怎么做 + 我们能怎么接」写成可评审的东西。3. **对照表里约 22 条是新账，但没有立卡** —— 等用户排优先级。★ 其中两条我标了「最该先做」：① **三值判决**（把「不知道」从「通过」里分出来）② **每道门配反例夹具 + 常驻金丝雀**（证明门没死）。这两条不需要新工具、当天可开工。4. **子代理自己标的两处缺口，我只补上了一处**：CodeBuddy 凭据清单已在**本机实测**补上（`.codebuddy` 里没有凭据文件，登录态借住在 `~/.workbuddy/app/session/Network/Cookies`）；★ **OpenAI / Gemini 的配额端点原文没取到**（Cloudflare 403 拦截）—— 那一格仍是空的。5. **顺带落的队列修订**：153 / 159 / 168~172 转 `done`（都已落地，留着 `pending` 会让 `wb_plan check` 报一片假冲突，卡 174 就是这么被咬的）+ 卡 159 的**扩域**（`tools/wb_dispatch.py`、`tools/wb_invariants.py` 两项并进域，理由写在队列注释里）。"


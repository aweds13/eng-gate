gaps = "**来路**：卡 106（T-G202）把号池只读逻辑收成 `tools/pool/` 包，docstring 自己写着「白名单越界**三处**收敛成**一处**」，但实际**只改了 `wb_review.py`**，另两处副本原样留着 —— `tools/wb_dispatch.py:1543 _outside_allow()` · `tools/wb_dispatch.py:503 card_artifacts()` · `tools/tf_stage_guard.py:42 outside_allow()`；而 `tools/pool/jobs.py` 的注释还写着「口径照抄 `wb_dispatch.card_artifacts`」 ⇒ 典型的**两份真源**（判据一漂，白名单就漏、产物就串卡）。**做法**：三处副本**全删、改成 import 唯一实现**（`pool.review.outside_allow` / `pool.jobs.card_artifacts`），调用点逐处改 —— `wb_dispatch` 五处 `card_artifacts(...)`（530/544/549/558/728）**逐字不变**；原 `_outside_allow(dirty, allow)` 吃的是 **porcelain 行**，改成「新加 `_porcelain_path()` 把 porcelain 还原成纯路径再调 `outside_allow()`」，**打出来的仍是 porcelain 原文**（`outside_lines` 按序回映射）；`tf_stage_guard.main:90` 调用点不动，顺手删掉不再用的 `import fnmatch`。**★ 本卡的重点不是「删副本」，而是「不许再长回来」**：`tests/test_wb_dispatch.py` 末尾 **+2 条结构判据** —— ① `wd.outside_allow is pool.review.outside_allow` 且 `tf_stage_guard.outside_allow is pool.review.outside_allow` 且 `wd.card_artifacts is pool.jobs.card_artifacts`（**同一个对象**，不是「长得像」）；② 用 `ast` 扫 `wb_dispatch.py` / `tf_stage_guard.py` 的源码，断言**不再有**名为 `_outside_allow` / `card_artifacts` / `outside_allow` 的 `def`。**验收（工人自报，主控逐条核）**：① `tests/test_wb_dispatch.py` → **128 passed**（原 126 例**判据一个字没改**，+2 是新结构判据）；② 全量 `pytest` → **1722 passed / 0 failed**（= 基线 **1720** + 本卡 2 条；与卡 108 那笔的 **1756 = 1720 + 36** 对得上，覆盖率 **93.74%**）；③ `ruff check` 本卡四个文件 → `All checks passed!`（`ruff check .` 另报 5 条，**全在未改动的 `gates/diag/gate_lock.py`**，动手前就在）；④ ★ **「故意把 `def` 加回去 ⇒ 测试变红」的真证据**：`assert <function outside_allow at 0x…FCC0> is <function outside_allow at 0x…D2D0>` + `AssertionError: tf_stage_guard.py 里又长出了本地 def：['outside_allow']`（2 failed），随后**撤掉**那个故意改动；⑤ **无循环 import**：`tools/` 下 `python -X utf8 -c 「import wb_dispatch」` 干净起来、三个 `is` 全 `True`、`grep -rn wb_dispatch tools/pool/` 只有注释**无 import**；⑥ 脚本态 `python tools/tf_stage_guard.py --allow …` 行为与改前一致（暂存区空 → 退 3）。**★ 主控裁定（两条留白）**：① **`tests/test_pool_lib.py` 不在卡的域里** —— 但 `_outside_allow` 一删，它那条「三处入口给同一份越界清单」的用例必 `AttributeError`；工人只动 3 行（`_porcelain_paths` 的 docstring + 把 `wb_dispatch._outside_allow(dirty, allow)` 改成 `wb_dispatch.outside_allow(_porcelain_paths(dirty), allow)` + 一句 docstring），**判据一个字没改**、该文件 15 passed ⇒ **主控追认，并把该文件补进集成白名单** —— 这是**我写卡时漏了域**，不是工人越界；② 切片 §四有一条样板话「卡里没找到白名单小节 → 停工报主控」，**两张卡的工人都据此报「我没停工」** ⇒ **追认**（本卡规格已逐文件点名范围），并记一笔：`tools/wb_brief.py` 那条样板话**只该在「卡确实没有范围声明」时才出现**（今天两次都误报）。**★ 该改但不属本卡（工人给的五个问题，等用户拍板）**：`tools/wb_dispatch.py:111 MODEL_WHITELIST`（本地硬编码元组）与 `tools/pool/models.py::load_pool_models`（读 `infra/pool/models.whitelist.toml` 的批准集）是**两个白名单真源**，统一前必须先定五件事 —— **(a)** 号池目录 / 白名单缺失时是「拒派」还是退回本地硬编码（号池不在本仓、可能缺失，「拒派」会把派活链路卡死）；**(b)** 快照 `models.live.json` 过期算不算通过（要不要 TTL、超期是拒派还是只告警）；**(c)** 口径是「交」还是「并」（号池说可用、本地没批准的，能不能派）；**(d)** `MODEL_WHITELIST` 的**顺序**就是「① 默认 ② 替补轮换」，TOML 里怎么表达「默认档 / 替补档」；**(e)** ★ **改名单的权限**：现在注释写明「改名单必须先问用户」，一旦改成读文件 = 改名单的权限从「用户点头」挪到「谁能改那个文件」 —— **这步必须用户拍板**。"

[entries."T-G208"]
id = "T-G208"
title = "号池写面②：MCP 的 pool_dispatch / pool_cancel（六条不变量 + 存在性即授权）"
group = "OPS"
status = "done"
evidence = [
  "file:tools/pool_mcp.py",
  "file:tools/pool/__init__.py",
  "file:tests/test_pool_mcp.py",
  "file:tests/test_pool_mcp_write.py",
]
gaps = "**来路**：用户原话「外包调用能不能做成 MCP，更适合不同窗口 AI 调用」→「我会在 DSH 里不同窗口用」。**期 1**（卡 105 / T-G201）交了六个**只读**工具（查队列 / 看某张卡到哪 / 看判决原文 / 看锁 / 看模型白名单）；**写面地基**（卡 108 / T-G205，`e9224f7`）交了作业登记与三条守卫。**本卡把「写」接进 MCP**：新增两个写工具 `pool_dispatch` / `pool_cancel`，并把**六条不变量**逐条接上。**做法**：① `tools/pool_mcp.py`（+377/−18）—— `pool_dispatch(card, tree, spec?, model?, pool?, note?)` 顺序**写死**：**先干跑**（`pool.guards` 三条 + `pool.registry` 租约判据，**import 调用**）⇒ 被咬就**不派活**、逐条回原因（`isError=true`、`dispatched:false`）；**再占位**（`registry.reserve` —— 并发安全就靠这一步）⇒ 占不上就停；**再起工人**（`wb_dispatch.py --cwd <树绝对路径> --model <白名单内> --lean --detach --execute`，**必须 detach**：MCP 调用不能阻塞几十分钟）；**起不来就回滚**（`registry.release`）；参数**写死、不许透传危险项**（`--force` / `--allow` / `--resume` / `--no-preflight` 一律不给，`--model` 只许白名单内）。`pool_cancel(card, reason?)` —— ★★ **先核对 pid 身份**（`tasklist /FI 「PID eq N」 /FO CSV` 的映像名必须是 `node.exe` / `python.exe`，否则**拒绝动手**并把人工命令印出来），再 `taskkill /F /T`，成功后写 `gates/diag/wb-<卡>.cancel.txt`（谁 / 何时 / 为何）并放租约；★ **绝不用 `os.kill(pid, 0)` 探活**（Windows 上它会真杀进程 —— `复盘/口径坑.md` 27）。② **六条不变量在模块 docstring 里列成表**（哪条谁判）：①单写者/树 → `guards.tree_guard`；②冲突域 → `guards.domain_guard`（域从 backlog 读，**查不到就拒**）；③门禁锁 → `guards.lock_guard`；④**内存闸 → 委托** `wb_dispatch` 的前置检查（**不重写**）；⑤日志不许覆盖 → `guards.log_guard` + **不给** `--force`；⑥模型白名单 → `wb_dispatch.MODEL_WHITELIST` + `pool.models`。③ **授权「存在性即授权」**：两个写工具**只在服务端 env 有 `POOL_MCP_WRITE=1` 时才列进 `tools/list`**（没有就只列六个只读工具）；每次写调用还要 `arguments.confirm` **等于卡号**（防手滑）；`initialize` 的 `instructions` 里把这两条讲清。④ `tools/pool/__init__.py` **只改 docstring**（补 `pool.registry` / `pool.guards` 两行、删掉已过时的「本包没有任何写操作」）。⑤ 新增 `tests/test_pool_mcp_write.py`（**17 例**）。**验收（工人自报，主控逐条核）**：① `tools/list` 带 `POOL_MCP_WRITE=1` 时 **8 个**（前六个 `readOnlyHint:true` **一字未变**；`pool_dispatch` → `readOnlyHint:false / destructiveHint:false / idempotentHint:false`，`pool_cancel` → `readOnlyHint:false / destructiveHint:true / idempotentHint:true`），**不带 env 时仍是 6 个**（既有 `tests/test_pool_mcp.py` 的 15 例全过）；② **干跑被咬四种**原样（树被占 / 冲突域相交并点名文件 / 日志已存在 / 锁在跑），每种都 `isError=true`、`dispatched:false`、**起工人桩未被调用**，并附「怎么才能通过」；③ **桩验 argv 逐字**：`['…python.exe','-X','utf8','tools/wb_dispatch.py','--card','111','--spec',…,'--cwd','D:\\…\\.wt\\poolmcp2','--model','deepseek-v4.1-flash','--lean','--detach','--execute']` —— 有 `--detach --execute --cwd`、**无** `--force/--allow/--resume/--no-preflight`，且**起工人那一刻活租约 list = `['111']`**（先占后起）；④ **占位→起不来→回滚**：桩内看到 `['111']`、返回「已回滚租约：OSError」、回滚后 list = `[]`；⑤ **cancel 身份不对**：pid 4242 的映像是 `chrome.exe` ⇒ **拒绝动手** + 印出人工命令，桩记录 **taskkill 调用次数 = 0**、租约原封不动；身份对（`node.exe`）时才杀 + 写 `.cancel.txt` + 放租约；⑥ `ruff check tools/ tests/` → `All checks passed!`；号池相关 5 文件 **83 passed**；⑦ ★ **测试数的账（主控核对）**：工人实测 `pytest -q` = **1777 passed**（= 非验收 **1758** + 验收 **2** + 本卡新增 **17**）；**门禁里那道 `pytest` 门只跑非验收**（`acceptance` 单列一道门），所以门禁原地重跑应读到 **1775** —— 两个数都对，口径不同；既有判据**一条未动**。**★ 主控裁定（四条留白）**：① ★ **pid 住哪** —— 卡 108 明确「**不登记 pid**」（判活只用「租约 + 日志」），而 cancel 要按 pid 核对身份。工人的取法：`pool_dispatch` 起工人拿到 pid 后，**用既有 `registry.load/save` 往那条租约补一个 `pid` 键**（**没改 `tools/pool/**` 一个字符**），cancel 读它 ⇒ **裁定：接受** —— pid 只作**取消用的线索**、**绝不用于判活**（判活仍是租约 + 日志），取消前必须 `tasklist` 核对映像名；副作用也讲清：服务端若在「起工人」与「补 pid」之间死掉，pid 缺失 ⇒ cancel **拒绝动手**（安全的缺省）。② `idempotentHint` 取 dispatch=false / cancel=true ⇒ **接受**（判断项）。③ **未做真机端到端**（真起一次 node 工人 / 真杀一次）—— 卡也禁止未提交即派活；**主控随后自己补一次「零花费的真机 cancel 演练」**（拿主控自己起的 `python -c sleep` 当靶子：核对身份 → 杀 → 验租约已放）。④ `pool` 名只记进租约（`wb_dispatch` 没有 `--pool` 参数，未透传）⇒ 接受。**★ 该改但不属本卡**：① 主仓 `docs/workbacklog.toml` 里 108/109/110/111 四条是**未提交改动** ⇒ 已排进后续一张小卡；② DSH 注册那几行（`~/.dsh/profiles/desktop/cordis.patch.yml`，**在仓库外、非本卡域**）工人给了完整写法 —— ★ `args` 必须指向**主仓**那份（指向卡树会读不到 backlog），`POOL_MCP_WRITE: '1'` 走 `env:`（想只读就删这行、退化成六个工具）；③ 切片 §四「没找到白名单小节就停工」与 §一「现状」两处**误报**（今天三个工人报同一件事）⇒ 排进小卡。"

[entries."T-G207"]
id = "T-G207"
title = "文档落地（外包）：今天七条坑 + 门禁改进清单（判断留主控、搬运与自验交工人）"
group = "RULES"
status = "done"
evidence = [
  "file:复盘/口径坑.md",
  "file:复盘/门禁改进清单.md",
]
gaps = "**来路**：今天一天里我自己的工具与流程连咬九次（卡 105 / 103 / 106 / 107 的集成 + T-G199 / T-G204 补丁），每次都是当场修好，但**教训只留在主控 scratch**（`gates/diag/_todo_pending.md`）—— 而**工人切片天天引用的两页复盘没跟着更新**，于是第 26 条（内联 shell 里的反引号）**当天就重犯过一次**。**做法（纯文书笔；文字是主控的判断，落地按新规矩外包给卡 110 的工人）**：① `复盘/口径坑.md` 末尾追加 **22~28 七条** —— TOML 基本串里的 Windows 路径要把反斜杠加倍 · changelog 条目别插到标题之上 · 改了函数签名要全仓搜测试桩 · `--cwd` 与「仓库相对路径」不能同时成立（`gates/diag/` 是 gitignore 目录，卡树里根本没有它）· 内联 shell 里不许放反引号 · ★★ **Windows 上 `os.kill(pid, 0)` 会真的把那个进程杀掉**（CPython 走 `TerminateProcess`，不是探活）· 别拿 `git status` 全文当判据（门禁自己会改 `docs/**` 与 `gates/**`）；② `复盘/门禁改进清单.md`：已修表 **4 行 → 6 行**（补 `_integrate.py` 的 ff 静默容忍、`_stage_card.py` 的反斜杠转义），**④ 派活器 cwd** 与 **⑦ 内存闸** 两处**标已做**（T-G199 / T-G204 / T-G198），并新增待做 **⑧ 内存闸阈值该按「这一趟要跑什么」定** —— 4.0 GB 在本机**常态误拦**（今天实测被拒 5 次；这台机器常态可用就是 3.3~4.0 GB，用户自己的 Edge ≈2.6 GB + DSH ≈1.3 GB + Defender ≈0.5 GB 占大头）。**口径**：只追加自己的段落，外加**恰好一行替换** —— 那句统计从「四处里有三处…」改成「六处里有五处…」（表格长了两行，统计必须跟着改）；**既有字节一字不改**。**验收（工人自报，主控逐条核）**：① 两份文件 sha256 与主控给的参考全文**相等**；② 行尾各自保持原样（口径坑 **纯 CRLF**、改进清单 **纯 LF**）；③ `git diff --numstat` 只有两行、**删除数 0 / 1**（口径坑 0；改进清单 1 = 那一行统计替换）；④ 两份里反引号包着的 md 文件 路径**逐个 `ls` 存在**。**★ 这一笔的另一层意义**：主控第一次把**文档落地**也外包出去（此前一律自己做）—— **判断（写什么）留主控，搬运与自验交工人**。**★ 工人额外报的一条（主控采纳）**：本仓 `core.autocrlf=true` ⇒ 「纯 LF」是**工作树当下的状态**、不是文件属性 —— 任何 `checkout` 都会把工作树里那份变回 CRLF（要真钉住得加 `.gitattributes`，属另一张卡）。所以本笔只保证**入库前后工作树里的字节**与参考全文逐字相同（sha256 相等），不声称「这个文件永远是 LF」。"


gaps = "**它补的盲区**：服务端是 T-G65 手写的，`tests/test_mcp_line.py` 也真起子进程走过 stdio —— 但那两边的**作者、假设、读法是同一套**：服务端把「我们理解的消息」当「规范的消息」，测试再把服务端的回话当成对的（T-G74 就是这一族发作的现场：stdout 中文是 GBK，而当时的「真 stdio」测试带着 `-X utf8`，**正好把要验的那件事关掉了**，一路全绿）。所以这一张卡**另写一个实现**去读它，并且**只在规范允许的地方让步**：① ★ **不 import 本项目的任何东西**（连常量都不借 —— 借一个常量就等于借来一套假设；有源码级护栏钉着，连服务端路径都不许出现）；② `id` 用**字符串**并断言类型也要一样（「整数 id 才管用」这种假设自家测试里永远看不见）；③ 回话**先按 UTF-8 解字节**，解不开就判违规（T-G74 就是编码上的病，「换个编码再试试」会把病盖住）；④ `required` 里每一项都要**真的在 properties 里**（规范的一致性要求）；⑤ 结果严格按 `{content:[{type:text,text}], isError}` 判；⑥ 一条消息必须**以换行结束**（stdio 的 framing 就是一行一条）。**验收**：`tests/test_mcp_client_independent.py` **8 条**，全走真子进程真 stdio：独立护栏 / 握手（版本·能力·身份·**stderr 干净**）/ 工具清单（≥14、写工具一个不列、`readOnlyHint` 全 true、逐条过 schema 自检）/ 字符串 id 原样回来 + 不认的方法 `-32601` / ★ **反空转两条**（拿两个**故意坏掉的服务端**证明判据真的会咬：把字符串 id 改成整数 → 判「id 没有原样回来」；`required` 写一个 properties 里没有的参数 → 当场拦下 —— 没有这两条，「通过自检」可能只是「它什么都没查」）/ 写工具默认关（`-32602` + 消息里写着怎么开 + **被拒的写操作不许留下库文件**）/ ★ **中文一字不差**（T-G74 的独立复核：用这个客户端建一条中文标题的任务，再从另一个只读工具读回来）/ 工具失败如实报（库不存在 → `isError` → 客户端退出码 4，且只读命令不许建库）。**顺带交付**：它同时是给人用的小工具（`handshake` / `list` / `call` / `raw`，退出码 0/2/3/4/5/6），服务端命令三选一（`--server-json` > env `TIMEFLOW_MCP_SERVER` > 默认 `timeflow mcp`）—— D 组那条人工项现在可以先自己看一眼再决定要不要配 DSH。**顺带更正一句代码里的诚实边界**：`src/timeflow/mcp/server.py` 原写「验的是我们的客户端脚本 ↔ 我们的服务端」，T-G78 之后不准确了，改成「第三方 SDK 仍然没有，但协议这一层有一个独立实现的客户端在盯；真正没验的还是**某个具体第三方客户端里接一次**」。**没动的**：服务端一行逻辑没改（只改了那段注释）、CLI、命令表、界面、45 份黄金。**边界**：它不是第三方 MCP SDK，**不能替代**「在真客户端里接一次」那条人工项；只做 stdio（没有 resources / prompts / sampling / 进度通知）；超时靠后台读线程 + 队列（Windows 上管道没法 `select`）。"

[entries."T-G77"]

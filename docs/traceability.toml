gaps = "**这一批搬的是 §二 清单里标着「下一批可搬的（工具已就位）」那四条** —— ⑭ 可配置词表 / ㉒ 删除可选 / ㉖ 手机直接上传 / ㉘ 跨端专注镜像（双窗口版）。前四批（T-G34~T-G37）搬的是「一屏之内点几下」，这四条卡在同一件事上：**都要第二样东西**才验得了。这一批的活主要不是多写断言，而是**把那两样造出来**：**㉒ 真的再起一个库**（`serve.py --fresh`，独立 `device_id`）当「另一台设备」—— 那边建一条 → 导出包 → 本机从**界面**导入（同一行 id 带过来）→ 那边软删 + **彻底删除**（`purge` 那步才写墓碑）→ 再导一次：不勾时预览里连「删除」两个字都没有、导完那行还在，勾上时预览说「删除 1 行」、确认框写着不可撤销、**按 Esc 取消之后那行还在**、再点确认才真没；**㉘ 真的再起一个客户端**（第二个浏览器 + 独立 profile）；**㉖ 的断网是真的 `Offline`**（不是把请求打到坏地址），所以 `navigator.onLine`、`online/offline` 事件、界面那个离线判据全是真的。**⑭** 走完整条链：加一项 → 复习卡下拉里选得到 → 保存 → 接口读回来 `form` 就是它，另加两条反证（空框由界面自己拦 / 非法 id 透**后端原话**且表一个字节没变）。**㉖** 的两条反证也真跑了：**离线时点「直接传到电脑」给原话**（且没弹确认框、电脑库里没有那条）、**同一条再传一次不重复计数**（报告 `新增 0`、库里仍 1 条），外加拿队列不会把电脑上那条也清掉。**㉘** 的镜像：另一台**不用点任何东西**、10 秒轮询内自己出现「别处正在专注」，镜像上**一个 `button`、一个 `data-action` 都没有**，那台结束后 10 秒内变回「当前没有进行中的专注」，且**今日专注分钟只涨一次的量**（会话 N 秒、涨的也在这附近 —— 翻倍会明显超出去）。**合计 22 条流 / 292 项断言**（两遍指纹一致，实测 625.7s；四条新流各自 27.6/29.1/19.5/27.4s）。**边界（如实记）**：① 第二个库 / 第二个客户端都是**同一台机器上的两个真进程**，**不是两台物理设备** —— 真手机、真校园网、真窗口仍是环境差异，清单里每条【已搬给机器】的注都写清了在哪一步停；② **`src/` 一行没改**（这些能力本来就在，缺的只是「造出第二样东西」的手段），改的只是工具与流；③ 顺带补上 **T-G37 §4 里我猜错的那半**：那一层**不能**用「同一浏览器开两个 tab」当两台设备（`tf_client` 住 `localStorage` 会共用、后台 tab 的 `document.hidden` 让轮询直接 return），必须起两个真进程（探针 `gates/diag/probes/mirror_probe.mjs`）；④ 保留一条**诚实的观察**：断网期间在飞的请求失败得晚，会把界面的 `netDown` 又置回 true，于是回到在线后**一两秒**内它仍说「连不上」（真机上很难发生，主要是我在测试里秒切状态所致；自愈靠下一次成功请求或 `online` 事件）—— 不替它开脱、也没顺手改产品，人若真撞上就按现象立卡；⑤ **⑪ 备份与恢复仍没搬**（不可逆，要先设计「临时库 + 临时备份目录」的走法），是「下一批可搬的」里唯一的候选。**成本**：这一层单遍 ≈200s → **≈310s**，T-G38 定的「一遍 ≲3 分钟」**被这一批超了**（超的全在这四条「要第二样东西」上；㉘ 里约 20s 是等两个 10 秒轮询，那是判据本身要求的 —— 要压它只能改产品的轮询间隔，不做）；出路仍是 T-G37 §3 那三条，压启动开销要动共用底座，仍单独一张卡。**踩到的四个坑**（`await t.geom(sel).display` 取属性写在 await 左边 → `undefined` 假红 / 成功之后 `view(current)` 重渲染让刚填的路径与刚勾的框作废 / 断网回在线要**等界面自己的判据稳下来** / 两 tab 当两台设备不成立）都写进 `复盘/视觉线地图.md` §6。台账 **204 条 —— done 200 / partial 0 / todo 1 / deferred 3；豁免 0**。**顺带修一处文档失真**：`docs/README.md` 里这一层的说明还写着「每轮跑两遍比断言指纹」，而 T-G38 起默认就是**一遍**（`--twice` 按需）—— 同一句话漂在别处就会被当成现状读，所以改了它并把新能力（再起一个真进程）一并写明。"


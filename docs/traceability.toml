gaps = '**为什么有这张卡**：卡 033 在自己的 worktree 里跑 `check_layers.py` 被假红卡住、拒绝提交 —— 断点是 `docs/changelog.md` 引用的 `gates/diag/wb-review-T-G79.md`（`gates/diag/` 整目录 gitignored、只存在于主树）。两次原始输出：主树 `LAYER CHECKS: PASS ✅`（exit=0）；worktree `[FAIL] 引用断裂: docs\changelog.md 引用了不存在的 gates/diag/wb-review-T-G79.md`（exit=1，出现两处）。**做了什么**：选 **A（问 git）** —— 对引用的每个候选基准路径跑 `git check-ignore -q -- <相对路径>`（命令见复盘 §2），任一候选被忽略 → 跳过存在性检查、只打一行 `[skip]` 说明；**不硬编码目录名**（`gates/diag/` 将来改名也不失效）；`check-ignore` 出错按「未忽略」从严处理（宁可多报断链、不悄悄放过）。候选 B（只对同层级判存在性）会放过跨层级的真断链，弃。**真机证据（先红后绿）**：改前 worktree FAIL（上面原文）→ 改后同树同命令 PASS，输出两行 `[skip] 跳过 gitignored 产物引用: docs\changelog.md → gates/diag/wb-review-T-G79.md` + `LAYER CHECKS: PASS ✅`（exit=0）。**反证（不许放松）**：自检新增两条 —— 正样例2（引用 gitignored 的不存在产物 → 跳过、exit=0）、负样例5（引用不存在的受管文件 → 仍 `[FAIL] 引用断裂`、exit=1）；原 1 正 + 4 负 + 1 豁免一条没动。**突变检验**：把 `is_git_ignored` 改成恒真（连受管断链也豁免）→ 负样例2/5 双双变 exit=0、`SELF-TEST FAIL ❌`（原文见复盘 §5）；还原 → `SELF-TEST PASS ✅ （2 正样例 + 5 负样例 + 1 豁免用例）`。ruff 两文件 `All checks passed!`。**边界（如实写）**：被跳过的引用只打 `[skip]` 行、不进判定；一个**真实存在但被 gitignore 的文件**被引用时本判据**静默放过**（它管断链、不管「产物该不该被引用」，要管需另立口径）；引用在所有基准下既不存在又不受忽略 → 仍 FAIL（负样例5 钉着）。**没动的**：`docs/**`（changelog 那两处引用合法、原样保留）、`gates/**`、`tools/**`、`src/**`、`tests/**`、共享文件、三个外来未跟踪文件。R036 复核发现原 test: 指针按 ROOT/tests/ 求值必假（真身在 scripts/），主控裁定改 file:；规矩见卡表 §22。'


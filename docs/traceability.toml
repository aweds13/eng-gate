gaps = "**为什么有这张卡**（T-G94，= 外包卡 005）：看门狗原来按「日志静默 ≥ 480 秒 → 掐掉整棵进程树」判卡死，它假定「一次工具调用最多几分钟」。实测不是：主树全量 `run_gates.py` 一次约 **4 分钟**（其中 `pytest` 一项 110 秒）、冷缓存 worktree 里 `ui_flow`（要起浏览器）能到 **十几分钟**。也就是说**工人只要在卡里跑一次重门禁，就会被自己的看门狗掐掉**，理由还写着「卡死」、报告里**没有**它当时在跑什么 —— 主控拿到现场还得自己翻 log 去猜。现在只靠「工人不许跑全量门禁」这条**规矩**绕开（`复盘/外包-卡表与规矩.md` §16），规矩只对「卡里不跑门禁」的活有效，不是阈值对。**关键发现（主控已在真 log 上验过形状）**：agent 事件流里**每个事件都带 `__timestamp`**（两个下划线，ISO-8601 UTC），且 `assistant` 的 `tool_use` 块与 `user` 的 `tool_result` 块**一一配对**（`id` ↔ `tool_use_id`）→ 「某次调用跑了多久」是**可测的**。**做三件事**：① 新增 `inflight_tool()` —— 没配对的 `tool_use` 就是正在跑的，返回 `(工具签名, 已跑秒数)`（多个在飞取跑得最久的那次）；② 有工具在飞 → 静默是**预期**的 → 底线上抬到新常量 `BUSY_STALL_SECONDS`（1800 秒 = 30 分钟）；③ 新增 `tool_durations()` 按 `__timestamp` 算每一次已完成调用的耗时，阈值改为 `max(底线, 2.5 × 历史最长一次)`（取**最长**而非平均、乘 2.5 留余量：宁可晚掐、不要误杀）。★ **报告必须带现场**：判卡死时把「在跑什么 / 已跑多久 / 历史最长一次 / 这一次用的阈值」全写进原因；心跳末尾**追加**「在跑 <工具>」（现有字段一个不删）。**反证（先红后绿）**：`tests/test_wb_dispatch.py` 新增 7 条 —— 改实现前 **43 passed / 7 failed**（7 条新用例全红：`AttributeError: no attribute 'inflight_tool'` / `'BUSY_STALL_SECONDS'` / `heartbeat_line() got an unexpected keyword argument 'inflight'`），改后 **50 passed**；六类覆盖 = 在飞静默 600 秒**健康**（旧写法在那里判卡死）/ 没有在飞时静默 600 秒**仍卡死**（证明阈值没被一味放宽）/ 历史最长 300 秒 → 阈值抬到 750 秒（静默 700 健康、800 卡死）/ `inflight_tool()` 配对判据 / 缺 `__timestamp` **不许炸**（退回空表、不放大阈值）/ 报告文本里**必须出现工具名**。**真机证据（桩命令，压缩阈值如实写）**：桩吐一条 `tool_use` 后真睡 500 秒，`run_worker` 真跑 —— **带** `__timestamp` 时认得出在飞 → 20 秒（压缩后的 `--stall-seconds`）**不掐**、一路跑到 `--timeout 40` 才报「超时」（实测 40.6s）；**不带** `__timestamp` 时退回保守行为 → 同样静默 20.7 秒即判「卡死」。判卡死报告实测：`卡死：30.2 分钟没有新事件（这一次的阈值 30.0 分钟；在跑 Bash(command=python -X utf8 scripts/run_gates.py)（已跑 33.3 分钟）；历史最长一次调用：没有记录）`。**边界（如实写）**：① 只改「判卡死」这一件事 —— `repeat_signal()` 的空转判据、`kill_tree()`、`cap_verdict()`、`finish_verdict()`、`--max-turns` 口径、`detached_argv()` 与 `--detach` 整条路、模型默认值、`--autocompact 1m`、超时默认 7200 **一个字没动**；② **不给 `lines`** 调用 `watchdog_verdict()` 就是**老口径**（阈值 = `stall_seconds`），留作对照；③ 缺 `__timestamp`（半截 log / 对方改格式）→ 一律退回保守行为（不放大阈值、不抛异常），所以读不到时间戳时宁可早掐一次；④ `tools/wb_dash.py` 的状态四档仍写「≥480 秒 = 可能卡死」，与本卡的新口径**还没对齐**（卡的白名单不许动它）—— 面板的档位要跟上得另立一张卡；⑤ 真机证据里的「20 秒」是把可配阈值压缩后的演示，真机是这样：480 秒底线 + 在飞 1800 秒 + 自适应；⑥ 顺带观察到 `kill_tree()` 读 Windows `taskkill` 输出用 UTF-8 解 GBK → 中文乱码（**既有**行为，卡明令不许动 `kill_tree()`，未修）。**没动的**：`src/**`、`docs/` 里其它文件、`tools/wb_dash.py`、`tools/wb_status.py`、真实库/备份目录。"



gaps = "**为什么有这张卡**（T-G96，= 外包卡 007）：上一笔 `1969b46`（T-G94：看门狗不再误杀长工具调用）被**对抗性复核**（`gates/diag/复核-1969b46.md`）判「算数，但有保留」，挑出三个缺口（+ 一个小问题），这张卡逐条补。**缺口 1（最值钱）**：`run_worker` 里那两行**接线**（`lines=snapshot` 喂看门狗、`inflight=` 喂心跳）**单测覆盖 = 0** —— 复核把它们删掉，全套 **50 条仍全绿**（**假护栏**）；真机「修法生效」只靠一条进不了 CI 的人工桩证据。**缺口 2**：`message` 不是 dict 时 `_tool_use_blocks` / `_tool_result_blocks` 抛 `AttributeError` → 异常**逃出** `run_worker` 的轮询循环 → 看门狗不掐、阻塞到工人自退。**缺口 3**：`2.5 × 历史最长` **无绝对上界** —— 一次 60 分钟的调用 → **150 分钟**才判卡死（漏杀）。**小问题 4**：`kill_tree()` 读 `taskkill` 输出用 `encoding=utf-8`，而这台机器是 cp936 → **乱码**。**做六件事**：① 新增两条**经过 `run_worker` 的对偶用例**（带 `__timestamp` 的在飞调用静默超阈值 → **不许被掐** + 心跳要写「在跑 Bash」；已配对无在飞 + 静默超阈值 → **必须被掐**）；② 畸形 log **两层防御** = 两个 block 函数对 `message` 做类型判断 + `run_worker` 轮询循环给判据调用（含心跳、含现场渲染 `_scene`）加兜底（判据抛异常 → 退回保守口径继续盯并把异常如实记进心跳/判决，**不静默吞**）；③ 新增常量 `ADAPTIVE_MAX_SECONDS = 3600`，`stall_threshold_seconds()` 返回 `min(max(base, 2.5 × longest), 3600)`；④ `kill_tree()` 按**系统区域编码**（`locale.getencoding()` —— 本仓一律 `python -X utf8`，`getpreferredencoding(False)` 会返回 `utf-8` 等于没改）+ `errors=replace` 解码；⑤ 判决文件**按轮落**（`wb-<卡>.r2.verdict.txt`…）、**不互相覆写**，每轮记「退出码 / 有无 `result` 事件 / 末事件类型 / log 行数 / stderr 末 5 行」，`--status` 取**最新一轮**；⑥ Windows 上派活器自己发起的 `subprocess`（`auth_ok()` 等探测 + `git`/`taskkill`）加 `CREATE_NO_WINDOW`，`spawn_detached()` 用 `DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP | CREATE_NO_WINDOW`（用户 2026-09-26 被任务栏里一个**空控制台窗口**迷惑过）。**★ 封顶口径**：`ADAPTIVE_MAX_SECONDS = 3600`（60 分钟）是**主控定的**（可被质疑）—— 复核独立扫的三份真 log 里最长一次调用是 **389.3s / 81.2s / 69.1s**，60 分钟已是本项目最长门禁的约 5 倍；边界 = `BUSY_STALL_SECONDS`（1800）仍生效（封顶 3600 > 1800）、无历史长调用时老口径 **480 秒不变**。**反证（先红后绿）**：`tests/test_wb_dispatch.py` **57 → 79 条** —— 改实现前 **9 failed / 68 passed / 2 deselected**（另 2 条「畸形经 run_worker」用例在旧实现上**让看门狗失效、阻塞到子进程自退 60s**，正是缺口 2 本身），改后 **79 passed**；**接线有牙的两个突变**：删 `lines=snapshot` → 用例①红（`卡死：0.0 分钟…没有在飞的调用`）、删 `inflight=` → 用例①心跳断言红（`心跳没带「在跑」`）。**真机证据**：① 封顶直接调 `stall_threshold_seconds()` 打印 480/1800/600/3600（不是 9000）；② `kill_tree()` 真掐真子进程，改造前是乱码 → 改造后 `成功: 已终止 PID …的进程。`；③ `spawn_detached` 子进程**活过父进程退出**（父进程退后 4 秒才写 marker）且自报 `GetConsoleWindow() == 0`（无控制台 → 无窗口）。**边界（如实写）**：① `wb_status.parse_events()` / `turns_seen()` / `tool_signatures()` 在 `message` 不是 dict 时**仍会抛** —— 它们在别处（状态器 / 回合计数），**本卡白名单不许碰 `tools/wb_status.py`、`turns_seen`/`tool_signatures` 的判据也不许动**，本卡只在 `run_worker` 的调用点接住（三份真 log 里 0 例畸形）；② `main()` 收尾渲染时间线仍直接调 `parse_events`，畸形 log 会让 `--execute` 收尾崩（本卡只保证看门狗/心跳不失效）；③ `tool_durations` **跨轮串**（复核 §7-2）**没验**，本卡只用封顶把最坏值压到 3600；④ 完整 `wb_dispatch.py --detach` 命令**没真机重跑**（前置检查要求工作区干净，而提交前工作区本就是脏的）—— 真机证据走的是 `spawn_detached()` 本身；⑤ T-G94 的核心修法仍**没在真派活里触发过**；⑥ `复盘/外包-卡表与规矩.md` §12 的表仍写「静默 ≥ `--stall-seconds`，默认 480 秒」（白名单不许动那份文件）；⑦ 顺带逮到复核没提的一处：`_scene()` 调 `parse_events` 也会抛，第二层兜底一并接住。**没动的（§2.7）**：`repeat_signal()` / `cap_verdict()` / `finish_verdict()` / `detached_argv()` / `inflight_tool()` 的判据本身 / `tool_durations()` 口径 / `BUSY_STALL_SECONDS`（1800）/ `STALL_SECONDS`（480）/ `--max-turns` 口径 / 模型默认值 / `--autocompact 1m` / 超时默认 7200 / 心跳既有字段。**没碰的**：`src/**`、`docs/` 里其它文件、`tools/wb_dash.py`、`tools/wb_status.py`、真实库/备份目录。"



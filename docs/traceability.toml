gaps = "本笔落**卡 158 的决策单**（`复盘/合并白名单-决策单.md`，14,957 B）：把「卡 146 落地会带来什么产品后果」写成三条候选 + 各自代价，并把它停在 `awaiting-commit` 的**理由**钉死。★ 诚实缺口三条：1. **本卡只出单子、不做决定** —— 单子 §五 的「一句话结论位」**空着**（留给用户）。2026-10-03 用户已就**方向**拍板（「做成一个同一层，然后分流到不同层」，见卡 166），但**这张单子没有跟着改写**：它记的是**当时**的三条候选，不是最终方案。留作决策留痕，**不当成现行方案**。2. **卡 146（B-ONEMODEL）仍然停在 `awaiting-commit`** —— 本笔没有落它。理由：它一落，裸名全被拒且 `--model` 默认值变成 CodeBuddy 服务不了的名字 ⇒ **所有不带 `--model` 的派活全挂**。3. **顺带落一批一直只躺在工作区的东西**：队列登记（`docs/workbacklog.toml`，卡 166~173 的登记）+ 十张卡规格（`复盘/卡/`）+ 主控自己写的两份分层文档（`复盘/架构索引-分层图.md`、`复盘/问题清单-分层.md`）。它们在 2026-10-02 夜被 `git checkout HEAD --` 抹过一次 ⇒ 不落进 git 随时会再白干。4. ★ **本笔的成送申请是主控回填的**：工人干完了、产物在卡树里，但它**自己没交申请**（这是当晚第 10 次同族）。回填时把「谁回的」写进了 `--why`，不冒充工人自报。"


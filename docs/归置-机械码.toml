# 归置机械码（**唯一真源**，进版本管理）—— 卡 087 / 台账号 `T-G182`
#
# 用户令：「搬迁要**锁死，但允许的话就能搬**的那种机械码 —— 我输入，你确定资料。」
# 三段的唯一口径（`tools/relocate.py` 也只认**这一个文件**，别处不许再写第二份清单）：
#   [lock]    契约/禁区：**永远不许搬**；命中即锁死（★ `[lock]` 永远优先于 `[allow]`）。
#   [allow]   白名单：★ **现在为空** —— 没列进来的一律不许搬；以后用户加一行才放行。
#   [regroup] 逻辑归属：**只打标签、不动文件**；`index` **现算不落盘**。
#
# ★ 唯一一套优先级：**`[regroup.exact]` 先于 `[regroup.rules]`**（具体路径盖过 glob；
#   规则之间按文件里的先后，先命中者赢）。归属取值只许这六类，别自创：
#   产品线 / 外包卡 / 工程运维 / 规矩与口径 / 交接与索引 / 不确定。


# 代理指标登记表（卡 202 / 台账号 T-G304）—— Goodhart 定律的「防近视本」。
#
# 为什么有它：当一个度量被用作**目标**，它就不再是一个好度量（Goodhart 定律）。
#   本项目每天盯的数 —— 卡的 done 数 / 门禁绿数 / 文书行数 / 派活成功率 / 队列收敛四数 ——
#   **全是代理指标**：它们与「真实目标」只有相关、未必有因果，用久了会漂移。
#   防法不是换指标，是把每个代理**登记在案**并**定期对账**：
#   写下它代理的真实目标、有效性证据、上次验证日期、最可能的失效模式、已知钻空子；
#   太久没验证（默认 30 天）⇒ `tools/proxy_audit.py --check` 退非零，逼人重新验证一次。
#
# ★ 为什么放 `docs/` 不放 `gates/diag/`：`gates/diag/` 是 gitignored 的，
#   而「规矩住在被忽略的目录里迟早随它一起丢」（本仓为此吃过一次真事故，见 复盘/归置地图.md）。
#
# 字段口径（每条都要写全，`proxy_audit.py` 会逐条校验）：
#   id            短名，唯一。
#   metric        这个数**怎么算出来的**（指到具体工具/字段）。
#   real_goal     ★ 它代理的**真实目标**是哪句话。
#   evidence      有效性证据从哪来（哪个读数/哪份产物证明它们相关）。
#   last_verified ★ 上次**真验证过**的日期（ISO）。
#   failure_mode  极端 | 因果 | 对抗 —— 自评它最可能怎么失效。
#   note          已知的钻空子/反例（有就写，没有写「未发现」）。
#
# 失效三型（用户 2026-10-12 给的《优化理论与学习实践》）：
#   极端型 = 过拟合：相似问题好，换个形式就崩（药方：限制幅度 · 多样化+扰动 · 知道边界）；
#   因果型 = 只有相关、没有因果（药方：持续跟踪真实结果，验证代理是否还有效）；
#   对抗型 = 指标太简单就被钻空子（药方：不许单一维度 · 对钻空子留案）。

[[proxy]]
id = "done-count"
metric = "docs/workbacklog.toml 里 status = 「done」的卡数（tools/wb_plan.py stats 的「其它」段现读）"
real_goal = "用户真正想要的功能/病被交付了 —— 不是「台账上多了一条 done」"
evidence = "docs/traceability.toml 每条 done 卡必须带机器可求值的 evidence，scripts/audit_progress.py 逐条求值；证据对不上 ⇒ FAIL，不许提交"
last_verified = "2026-10-12"
failure_mode = "对抗"
note = "钻空子（对抗型）：把一张大卡拆成多张、或把「只读审计」卡也计进 done，done 数涨而交付没变。药方：done 数必须与 traceability 的 evidence 对账，不许只看计数（指标不许单一维度）。"

[[proxy]]
id = "gate-green"
metric = "python -X utf8 scripts/run_gates.py 一顿后 gates/last.json 里各门 exit_code 为 0 的数量 / 门总数"
real_goal = "代码真的没坏 —— 每条判据这轮真在守（不是「输出是绿的」）"
evidence = "gates/last.json（顶层 reused 字典 = 复用判定，见 复盘/口径坑.md 第 1 条）；自己动过的门必须 --no-reuse 真跑一遍，见 复盘/口径坑.md 第 11 条"
last_verified = "2026-10-12"
failure_mode = "因果"
note = "钻空子记录：口径坑 11 —— 「复用通过」≠「这道门现在是绿的」：reused 只说输入没变、采信上一轮，不说这轮跑过。药方：改过的那道门（或它的输入）必须 --no-reuse 真跑，否则等于没验。"

[[proxy]]
id = "doc-lines"
metric = "tools/card_doc_budget.py 的结构预算：CHECKPOINT ≤ 60 行 / gaps ≤ 6 条每条 ≤ 3 行 / changelog 每卡 ≤ 6 行 / 老实说 ≤ 4 条"
real_goal = "文书能让「下一个干活的人」快速接手 —— 少读、读得完、指针够得着"
evidence = "tools/card_doc_budget.py 的 check_budget() + check_pointers()（指针必须真存在）；判据由 tests/test_card_doc_budget.py 钉住"
last_verified = "2026-10-12"
failure_mode = "对抗"
note = "★ 真现场（我们自己干的）：卡 193 上线「文书行数 ≤ 6 行」这条判据的当天，主控就把三份文书「压到 6 行」以满足指标 —— 指标没坏，是**行为**被它带跑了。药方：对钻空子留案（本 note 即案），并让 check_pointers 逼「压掉的东西指得出来」（压缩安全全靠指针）。"

[[proxy]]
id = "dispatch-rate"
metric = "tools/wb_dispatch.py / 号池任务里派活是否真起出工人（.meta.json 落盘 + 工人出 result 事件才算成功）"
real_goal = "派活真的发生：工人被起出来并把活推进了 —— 不是「派活命令发出去了」"
evidence = "工人留在 gates/diag/ 的原始读数（口径坑 12：落盘产物才是唯一证据源，工人的判决不是）"
last_verified = "2026-10-12"
failure_mode = "因果"
note = "★ 真现场（卡 201 治的病）：记录里写着「额度重置时间 2026-10-12 16:52:45」，于是所有人都以为 16:52 之后就能派活；主控 23:28 真探了一次才确认 —— 「记录」只是代理，「服务端放不放行」才是真实目标。药方：持续跟踪真实结果（真探一次），验证代理是否还有效。"

[[proxy]]
id = "flow-four"
metric = "tools/wb_flow.py（--json）的四个数：到达 / 离开 / WIP / 流量分解"
real_goal = "队列最终会收空（活真被干完）—— 不是「永远有新卡进来」"
evidence = "tools/wb_flow.py 的判据：到达 < 离开 ⇒ 收敛中；≈ 平台；> 报警（单窗口看不出「连续 N 天」，工具自己就这么写）"
last_verified = "2026-10-12"
failure_mode = "因果"
note = "钻空子/反例：把一张卡拆成多张、或把 done 卡重开，能让「离开」虚高而真实交付没变；「到达 < 离开」只是相关、不是因果（到达会滞后、卡会被拆细）。药方：多跑几天看趋势，别拿一天下结论。"

# 墓碑表 —— 被证伪的结论不许再当事实（卡 A307 · T-AG421）
#
# 一条墓碑 = 一句**曾经被当真、后来被实测推翻**的话，连同推翻它的证据。
# 它不纪念谁，它**拦住复述**：`tests/test_tombstones.py` 扫全仓进 git 的 markdown，
# 哪一行还在原样讲这句话、且整行没有任何「推翻 / 证伪 / 更正」标记 ⇒ 报红，点名 文件:行。
#
# 字段：
#   id         墓碑号（`T-AG421-NN` 形式，全表唯一）
#   claim      被证伪的说法（当年真被当真过的那一句）
#   refuted_by 证据：仓内**真实存在**且已进 git 的文件，相对仓库根 ——
#              **写全路径**（`复盘/看门狗独立化-T-G112.md`），不要写裸文件名
#   refuted_at 推翻日期（`YYYY-MM-DD`）
#   where      仍在引用这句话的文档（每份必须真实存在、且**真的还提到它** ——
#              否则这张表在撒谎，测试会点名）
#   needles    扫地标的字面短语（挑**只属于这句说法**的词，别用「没跑过」这种泛词）
#
# 登记新墓碑前先自查：把 needles 拿去全仓 grep，**每一处命中都得自带推翻标记**；
# 不带的先给那些文档补注（本仓的「加注法」：历史原文留着 + 同行写清哪张卡推翻的），
# 然后再登记 —— 否则判据会红，而且红得有道理。
#
# 待登记（暂不满足上面的自查，故未登）：
#   `复盘/长任务执行协议.md` §二 能力边界表「联网 ❌ | 工具无互联网」
#   反证在 `复盘/外网工具链与技能包勘察-T-G27.md`（curl 真下 1.3 MB，坏的是 git/curl 的
#   TLS 凭证而不是网络），但那两行只有行内「2026-09-26 注：」、没有推翻标记 ⇒
#   现在登记会让判据红。给那两行补一句加注即可登记。

